app = "cosyworld-lonelyforest"
primary_region = "sjc"

# One Fly Machine owns the Lonely Forest volume. Nginx routes an allowlist of
# hostnames to isolated one-world CosyWorld processes bound to loopback ports;
# request hosts never select a registry or filesystem path inside a process.

[env]
  COSYWORLD_DEPLOY_PROFILE = "production"
  COSYWORLD_MULTITENANT_DATA_ROOT = "/data/worldpacks"
  # One volume can attach to only one Machine, so a five-second stale-owner
  # fence is sufficient and bounds write unavailability after process restart.
  COSYWORLD_CANONICAL_LEASE_TTL_MS = "5000"
  COSYWORLD_RUBY_HIGH_WALLET_CARDS_URL = "https://ruby-high.ai/api/apps/ruby-high/nft/internal/cosyworld/wallet-cards"
  COSYWORLD_HOSTED_PARTY_MAX_GUESTS = "4"
  COSYWORLD_HOSTED_PARTY_MAX_ACTIVE_PER_GUEST = "4"
  COSYWORLD_HOSTED_ACCESS_TTL_SECS = "7200"
  COSYWORLD_HOSTED_ACCESS_GRACE_SECS = "60"
  COSYWORLD_STORY_METRICS_RETENTION_DAYS = "400"
  COSYWORLD_GENERATION_DEFAULT_MODE = "off"
  COSYWORLD_GENERATION_FEATURE_MODES_JSON = "{\"pathway_content\":\"auto_bounded\"}"
  COSYWORLD_REPLICATE_AVATAR_MODEL = "black-forest-labs/flux-dev-lora"
  COSYWORLD_REPLICATE_AVATAR_LORA = "immanencer/mirquo"
  COSYWORLD_REPLICATE_AVATAR_LORA_INPUT = "lora_weights"
  COSYWORLD_REPLICATE_AVATAR_LORA_SCALE_INPUT = "lora_scale"
  COSYWORLD_REPLICATE_AVATAR_PROMPT_PREFIX = "MRQ, cozy storybook trading-card portrait"
  COSYWORLD_AI_PROVIDER = "openrouter"
  OPENROUTER_CHAT_MODEL = "openai/gpt-5.6-luna"
  COSYWORLD_AI_VISION_MODEL = "openai/gpt-5-image-mini"
  COSYWORLD_AI_VISION_REASONING_EFFORT = "low"
  OPENROUTER_REASONING_EFFORT = "none"
  COSYWORLD_AI_REGISTRY_JSON = '{"schema_version":1,"snapshot_version":"cosyworld-prod-2026-07-28b","declared":[{"requested_model_id":"openai/gpt-5.6-luna","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-5.6-luna"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["voice","intent_json","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}}],"discovered":[]}'
  RUST_LOG = "cosyworld_orchestrator=info,tower_http=warn"

# Required production secrets are provisioned independently for this app.
# See docs/deployment/lonelyforest-fly.md.

[processes]
  app = "/app/deploy/lonelyforest/run-multitenant.sh"

[[mounts]]
  source = "lonelyforest_data"
  destination = "/data"
  # The root journal stays at its established path. Worldpack journals use
  # /data/worldpacks/<tenant>/ and never open the same SQLite file.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory = "2gb"
  processes = ["app"]

# Deploy strategy stays `rolling`: a second Machine cannot mount this volume.
# Each world is still one process with one journal; the shared boundary is the
# Machine and physical volume, not a SQLite database.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
