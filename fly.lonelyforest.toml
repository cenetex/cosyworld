app = "cosyworld-lonelyforest"
primary_region = "sjc"

# One Fly Machine owns the Lonely Forest volume and runs one CosyWorld
# process. The former subdomain worlds (0, 7, 89, lantern, hoppycat) were
# retired; their data remains under /data/worldpacks.

[env]
  COSYWORLD_PRIMARY_GAME = "cards"
  COSYWORLD_CARD_POLICY_MODE = "shadow"
  COSYWORLD_CARD_POLICY_MODEL_PATH = "/app/models/card-policy/incumbent.cwrank"
  COSYWORLD_CARD_POLICY_TOP_K = "3"
  COSYWORLD_DEPLOY_PROFILE = "production"
  COSYWORLD_LOG_FORMAT = "json"
  COSYWORLD_LOG_TENANT = "root"
  COSYWORLD_LOG_WORLDPACK = "official"
  # Process and shard identity predate the single-process layout; the journal
  # and leases are keyed to them, so they keep their tenant-era values.
  COSYWORLD_PROCESS_ID = "lonelyforest-root"
  COSYWORLD_V2_SHARD_ID = "lonelyforest-root"
  COSYWORLD_V2_ADDR = "0.0.0.0:3000"
  COSYWORLD_V2_SNAPSHOT_PATH = "/data/cosyworld-v2-snapshot.json"
  COSYWORLD_V2_EVENT_DB_PATH = "/data/cosyworld-v2-events.sqlite"
  COSYWORLD_GENERATED_ASSET_DIR = "/data/generated"
  COSYWORLD_WEBAUTHN_RP_ID = "lonelyforest.com"
  COSYWORLD_WEBAUTHN_ORIGIN = "https://lonelyforest.com"
  COSYWORLD_WEBAUTHN_EXTRA_ORIGINS = "https://www.lonelyforest.com"
  # Finish HTTP drain before Fly escalates the initial deploy signal.
  COSYWORLD_SHUTDOWN_DRAIN_MS = "3000"
  # One volume can attach to only one Machine, so a five-second stale-owner
  # fence is sufficient and bounds write unavailability after process restart.
  COSYWORLD_CANONICAL_LEASE_TTL_MS = "5000"
  COSYWORLD_RENDEZVOUS_PARTY_MAX_GUESTS = "4"
  COSYWORLD_RENDEZVOUS_PARTY_MAX_ACTIVE_PER_GUEST = "4"
  COSYWORLD_RENDEZVOUS_PARTY_TTL_SECS = "7200"
  COSYWORLD_STORY_METRICS_RETENTION_DAYS = "400"
  COSYWORLD_GENERATION_DEFAULT_MODE = "off"
  COSYWORLD_GENERATION_FEATURE_MODES_JSON = "{\"pathway_content\":\"auto_bounded\"}"
  COSYWORLD_REPLICATE_AVATAR_MODEL = "black-forest-labs/flux-dev-lora"
  COSYWORLD_REPLICATE_AVATAR_LORA = "immanencer/mirquo"
  COSYWORLD_REPLICATE_AVATAR_LORA_INPUT = "lora_weights"
  COSYWORLD_REPLICATE_AVATAR_LORA_SCALE_INPUT = "lora_scale"
  COSYWORLD_REPLICATE_AVATAR_PROMPT_PREFIX = "MRQ, cozy storybook trading-card portrait"
  COSYWORLD_AI_PROVIDER = "openrouter"
  OPENROUTER_CHAT_MODEL = "openai/gpt-6-luna"
  COSYWORLD_AI_VISION_MODEL = "openai/gpt-5-image-mini"
  COSYWORLD_AI_VISION_REASONING_EFFORT = "low"
  OPENROUTER_REASONING_EFFORT = "none"
  # Directly controlled avatars use the GPT-6 Luna route. Elysium
  # residents keep their exact bindings. Four attempts share one 12-second
  # ceiling and give duplicate/shape feedback room to converge.
  COSYWORLD_AI_VOICE_MAX_ATTEMPTS = "4"
  # The most expensive raw binding is $150/M input and $600/M output. This
  # covers four 160-token responses, a 1,200-character input, and retry feedback.
  COSYWORLD_AI_VOICE_SPEND_CEILING_MICRODOLLARS = "650000"
  # The decision model answers typed yes/no questions with probabilities (the
  # OpenRouter Decisions API). Only worlds whose pack opts in use it, and every
  # call fails open to the previous behaviour.
  COSYWORLD_AI_DECISION_MODEL = "typesafe/jev-1.13"
  COSYWORLD_CARD_TEXT_MODEL = "openai/gpt-6-luna"
  COSYWORLD_CARD_TEXT_REASONING_EFFORT = "none"
  # Each authored card-world character keeps one exact OpenRouter model.
  COSYWORLD_CARD_CHARACTER_MODELS_JSON = '{"vale":"openai/gpt-6-luna","moth":"openai/gpt-6-luna","keeper":"anthropic/claude-haiku-5.5","badger":"mistralai/mistral-small-3.2-24b-instruct"}'
  COSYWORLD_AI_CAPABILITY_MODELS_JSON = '{"voice":"openai/gpt-6-luna","intent_json":"openai/gpt-5.6-sol","world_content":"openai/gpt-5.6-sol"}'
  COSYWORLD_AI_REGISTRY_JSON = '{"schema_version":1,"snapshot_version":"cosyworld-prod-2026-10-31-character-models-v2","declared":[{"requested_model_id":"openai/gpt-5.4-nano","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-5.4-nano"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":false,"reasoning":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["voice"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048},"rarity":"common"},{"requested_model_id":"openai/gpt-5.6-sol","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-5.6-sol"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["intent_json","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}},{"requested_model_id":"google/gemini-3.5-flash","provider":"openrouter","concrete_model":{"model_id":"google/gemini-3.5-flash"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["intent_json","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}},{"requested_model_id":"google/gemini-3.5-flash-lite","provider":"openrouter","concrete_model":{"model_id":"google/gemini-3.5-flash-lite"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"stop":true},"data_policy":{"retention":"provider_default","training":"unknown"},"capabilities":["voice"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048},"rarity":"common"},{"requested_model_id":"x-ai/grok-4.3","provider":"openrouter","concrete_model":{"model_id":"x-ai/grok-4.3"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"stop":true},"data_policy":{"retention":"provider_default","training":"unknown"},"capabilities":["voice"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048},"rarity":"common"},{"requested_model_id":"anthropic/claude-haiku-4.5","provider":"openrouter","concrete_model":{"model_id":"anthropic/claude-haiku-4.5"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"stop":true,"structured_output":true,"json_mode":true},"data_policy":{"retention":"provider_default","training":"unknown"},"capabilities":["voice","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048},"rarity":"uncommon"},{"requested_model_id":"anthropic/claude-sonnet-4.6","provider":"openrouter","concrete_model":{"model_id":"anthropic/claude-sonnet-4.6"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"stop":true},"data_policy":{"retention":"provider_default","training":"unknown"},"capabilities":["voice"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048},"rarity":"legendary"},{"requested_model_id":"openai/gpt-6-luna","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-6-luna"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":false,"reasoning":true,"temperature":false},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["voice","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}},{"requested_model_id":"anthropic/claude-haiku-5.5","provider":"openrouter","concrete_model":{"model_id":"anthropic/claude-haiku-5.5"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"stop":true,"reasoning":true,"temperature":false},"data_policy":{"retention":"unknown","training":"unknown"},"capabilities":["world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":1200}},{"requested_model_id":"mistralai/mistral-small-3.2-24b-instruct","provider":"openrouter","concrete_model":{"model_id":"mistralai/mistral-small-3.2-24b-instruct"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"stop":true,"reasoning":false},"data_policy":{"retention":"unknown","training":"unknown"},"capabilities":["world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":1200}}],"discovered":[]}'
  RUST_LOG = "cosyworld_orchestrator=info,tower_http=warn"

# Required production secrets are provisioned independently for this app.
# See docs/deployment/lonelyforest-fly.md.

[processes]
  app = "/app/cosyworld-orchestrator"

[[mounts]]
  source = "lonelyforest_data"
  destination = "/data"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory = "2gb"
  processes = ["app"]

# Deploy strategy stays `rolling`: a second Machine cannot mount this volume.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
