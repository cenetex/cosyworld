app = "cosyworld-log-shipper"
primary_region = "sjc"

[build]
  dockerfile = "deploy/observability/Dockerfile"

[env]
  AWS_REGION = "us-east-1"
  CLOUDWATCH_LOG_GROUP_NAME = "/cosyworld/production"
  FLY_ORG = "personal"
  VECTOR_LOG = "info"


[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  policy = "always"

[checks.vector]
  type = "http"
  port = 8686
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
