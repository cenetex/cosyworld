[package]
name = "cosyworld-rules-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cosyworld-rules = { path = ".." }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmi = { version = "0.46", default-features = false, features = ["std"] }

[dev-dependencies]
wat = "1"
