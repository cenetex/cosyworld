  { path = "rand::random", allow-invalid = true, reason = "Supply an explicit seed in the request." },
  { path = "rand::thread_rng", allow-invalid = true, reason = "Supply an explicit seed in the request." },
  { path = "rand::rng", allow-invalid = true, reason = "Supply an explicit seed in the request." },
  { path = "getrandom::getrandom", allow-invalid = true, reason = "Keep entropy outside the reducer." },
  { path = "getrandom::fill", allow-invalid = true, reason = "Keep entropy outside the reducer." },
]
