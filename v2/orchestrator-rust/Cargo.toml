[package]
name = "cosyworld-orchestrator"
version = "1.2.77"
edition = "2021"
publish = false

[features]
embedded-llama = ["dep:llama-cpp-2"]

[build-dependencies]
cc = "1"

[dependencies]
axum = "0.8"
base64 = "0.22"
bs58 = "0.5"
cosyworld-ai-model = { path = "../ai-model-rust" }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
qrcode = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["compression-full", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
zstd = "0.14"
rquickjs = { version = "0.14.0", default-features = false }
llama-cpp-2 = { version = "=0.1.160", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.160", optional = true, default-features = false, features = ["metal"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

# Debug and test builds otherwise compile the QuickJS C interpreter at -O0,
# which makes released-rule replay run several times slower than production
# and pushes busy test hosts past the per-request interpreter deadline.
# Optimizing only this C dependency keeps the deadline and the rules unchanged.
[profile.dev.package.rquickjs-sys]
opt-level = 3
