    function connectStream() {
      if (stream) stream.close();
      stream = new EventSource(streamPath());
      stream.addEventListener("open", () => clearTransientStatus("stream"));
      stream.addEventListener("world", (message) => {
        let event = null;
        try {
          event = JSON.parse(message.data);
        } catch {
          return;
        }
        if (event.type === "world.reset") {
          seenSeq.clear();
          pendingModelInteractionRehydrationRequired = true;
          rebuildLog([event]);
          renderTimelines();
          queueRefresh();
          return;
        }
        if (eventMatchesCurrentLocation(event)) {
          const changed = pushEvents([event]);
          if (changed) renderTimelines();
        }
        if (String(event.type || "").startsWith("world.") && event.type !== "world.bootstrapped") {
          worldView = null;
          worldViewAccessKey = "";
          if (libraryPanelPinned) ensureWorldView(true).then(render).catch(() => render());
        }
        if (eventShouldRefreshState(event)) queueRefresh();
      });
      stream.addEventListener("gap", (message) => {
        let gap = null;
        try {
          gap = JSON.parse(message.data);
        } catch {
          return;
        }
        streamReplayFloorSeq = Math.max(
          streamReplayFloorSeq,
          Number(gap?.through_seq || message.lastEventId || 0),
        );
        prepareForStreamGapRehydration();
        renderTimelines();
        recoveryRefreshAttemptId = Math.max(
          recoveryRefreshAttemptId,
          refreshAttemptId + 1,
        );
        setTransientStatus(
          "refresh",
          "The room changed while you were away. Catching up from the latest state.",
        );
        queueRefresh();
      });
      stream.onerror = () => setTransientStatus("stream", "The live room is reconnecting.");
      startPresenceHeartbeat();
    }

    function prepareForStreamGapRehydration() {
      pendingChats = [];
      pendingModelInteractions = [];
      logEvents = [];
      roomHistoryHydrated = false;
      seenSeq.clear();
      pendingModelInteractionRehydrationRequired = true;
    }

    function spatialPoint(tile, compact = false) {
      const x = Number(tile?.[0] || 0);
      const y = Number(tile?.[1] || 0);
      const z = Number(tile?.[2] || 0);
      if (compact) {
        return {
          x: 175 + ((x - y) * 29),
          y: 35 + ((x + y) * 31) - (z * 28),
        };
      }
      return {
        x: 405 + ((x - y) * 80),
        y: 42 + ((x + y) * 27) - (z * 32),
      };
    }

    function spatialFocusClass(offerIds, handOfferIds) {
      const offered = new Set(Array.isArray(offerIds) ? offerIds.map(String) : []);
      if (handOfferIds[0] && offered.has(handOfferIds[0])) return " spatial-focus-1";
      if (handOfferIds[1] && offered.has(handOfferIds[1])) return " spatial-focus-2";
      return "";
    }

    function renderSpatialScene(scene) {
      const stage = $("spatial-stage");
      const svg = $("spatial-scene");
      const usable = scene?.schema_version === 1
        && scene?.projection === "isometric"
        && Array.isArray(scene?.sites)
        && scene.sites.length > 0;
      stage.hidden = !usable;
      if (!usable) {
        svg.innerHTML = "";
        stage.removeAttribute("aria-label");
        return false;
      }

      const compact = window.matchMedia("(max-width: 700px)").matches;
      svg.setAttribute("viewBox", compact ? "0 0 390 270" : "0 0 1000 230");
      const tileHalfWidth = compact ? 30 : 52;
      const tileHalfHeight = compact ? 14 : 20;
      const handOfferIds = (state?.action_hand?.entries || [])
        .map((entry) => String(entry?.offer_id || ""));
      const sites = new Map(scene.sites.map((site) => [String(site.id), site]));
      const centerForSite = (siteId) => {
        const tiles = sites.get(String(siteId))?.tiles || [[0, 0, 0]];
        const points = tiles.map((tile) => spatialPoint(tile, compact));
        return {
          x: points.reduce((sum, point) => sum + point.x, 0) / points.length,
          y: points.reduce((sum, point) => sum + point.y, 0) / points.length,
        };
      };
      const tileRows = scene.sites
        .flatMap((site) => (site.tiles || []).map((tile) => ({ site, tile, point: spatialPoint(tile, compact) })))
        .sort((left, right) => (
          (Number(left.tile[0]) + Number(left.tile[1]) + Number(left.tile[2]))
          - (Number(right.tile[0]) + Number(right.tile[1]) + Number(right.tile[2]))
        ));
      const linkRows = (scene.links || []).map((link) => {
        const from = centerForSite(link.from_site_id);
        const to = centerForSite(link.to_site_id);
        return `<line class="spatial-link" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" />`;
      });
      const tileHtml = tileRows.map(({ site, point }) => (
        `<polygon class="spatial-tile ${escapeAttr(site.kind || "ground")}" points="${point.x},${point.y - tileHalfHeight} ${point.x + tileHalfWidth},${point.y} ${point.x},${point.y + tileHalfHeight} ${point.x - tileHalfWidth},${point.y}" />`
      ));
      const siteLabels = scene.sites.filter((site) => (
        !compact || ["crossing", "ground"].includes(String(site.kind || ""))
      )).map((site) => {
        const point = centerForSite(site.id);
        return `<text class="spatial-site-label" x="${point.x}" y="${point.y + 43}">${escapeHtml(site.label || site.id)}</text>`;
      });

      const portalPoints = new Map();
      const portals = (scene.portals || []).map((portal) => {
        const sitePoint = centerForSite(portal.site_id);
        const direction = String(portal.direction || "").toLowerCase();
        const point = direction === "west"
          ? { x: sitePoint.x - (compact ? 48 : 92), y: sitePoint.y - 18 }
          : direction === "north"
            ? { x: sitePoint.x + (compact ? 8 : 75), y: sitePoint.y - (compact ? 74 : 46) }
            : { x: sitePoint.x, y: sitePoint.y - 42 };
        portalPoints.set(String(portal.ref_id), point);
        const classes = `spatial-portal${portal.blocked ? " blocked" : ""}${spatialFocusClass(portal.offer_ids, handOfferIds)}`;
        const directionLabel = portal.direction ? ` · ${portal.direction}` : "";
        const compactPortalLabel = direction === "west"
          ? `${String(portal.label || "West").replace(/'s Ruin$/i, "")} ←`
          : direction === "north"
            ? `${String(portal.label || "North").replace(/^Road to /i, "")} ↑`
            : (portal.label || portal.direction || "Exit");
        const portalLabel = compact ? compactPortalLabel : `${portal.label}${directionLabel}`;
        return `<g class="${escapeAttr(classes)}" transform="translate(${point.x} ${point.y})"><title>${escapeHtml(`${portal.label}${directionLabel}`)}</title><rect class="portal-gate" x="-25" y="-24" width="50" height="31" rx="6" /><path d="M-9 -8 H9 M4 -13 L10 -8 L4 -3" fill="none" stroke="currentColor" stroke-width="2" /><text class="portal-label" y="25">${escapeHtml(portalLabel)}</text></g>`;
      });

      const tokenPoints = new Map();
      const siteTokenCounts = new Map();
      const viewerRef = scene.viewer?.actor_id ? `actor:${scene.viewer.actor_id}` : "";
      const tokens = (scene.tokens || []).map((token) => {
        const sitePoint = centerForSite(token.site_id);
        const offset = siteTokenCounts.get(token.site_id) || 0;
        siteTokenCounts.set(token.site_id, offset + 1);
        const isViewer = String(token.ref_id) === viewerRef;
        const point = {
          x: sitePoint.x + (compact ? 5 : 12) + (offset * (compact ? 28 : 35)),
          y: sitePoint.y - 35 - (offset % 2) * 12 - (compact && isViewer ? 27 : 0),
        };
        tokenPoints.set(String(token.ref_id), point);
        const classes = [
          "spatial-token",
          token.kind || "actor",
          isViewer ? "viewer" : "",
          token.hostile ? "hostile" : "",
        ].filter(Boolean).join(" ") + spatialFocusClass(token.offer_ids, handOfferIds);
        const mark = token.kind === "feature"
          ? "✦"
          : String(token.label || "?").trim().slice(0, 1).toUpperCase();
        const label = isViewer
          ? (compact ? "You" : `${token.label} · you`)
          : compact && token.kind === "feature"
            ? String(token.label || "Feature").replace(/^Golden /i, "")
            : compact && token.hostile
              ? String(token.label || "Hostile").replace(/^Moth-Eaten /i, "")
              : token.label;
        return `<g class="${escapeAttr(classes)}" transform="translate(${point.x} ${point.y})"><title>${escapeHtml(token.label || "Unknown")}</title><circle class="token-disc" r="16" /><text class="token-mark" y="1">${escapeHtml(mark)}</text><text class="token-label" y="34">${escapeHtml(label || "Unknown")}</text></g>`;
      });
      const constraints = (scene.constraints || [])
        .filter((constraint) => constraint.active)
        .map((constraint) => {
          const subject = tokenPoints.get(String(constraint.subject_ref));
          const object = portalPoints.get(String(constraint.object_ref));
          if (!subject || !object) return "";
          return `<line class="spatial-constraint" x1="${subject.x}" y1="${subject.y + 19}" x2="${object.x}" y2="${object.y - 4}"><title>${escapeHtml(constraint.label)}</title></line>`;
        });
      const activeConstraints = (scene.constraints || []).filter((constraint) => constraint.active);
      const viewerSite = sites.get(String(scene.viewer?.site_id || ""));
      const summaryParts = [
        `Spatial view of ${state?.location?.name || "the current location"}.`,
        viewerSite ? `You are at ${viewerSite.label}.` : "",
        ...activeConstraints.map((constraint) => constraint.label),
      ].filter(Boolean);
      stage.setAttribute("aria-label", summaryParts.join(" "));
      $("spatial-title").textContent = activeConstraints.length
        ? activeConstraints[0].label
        : (state?.location?.name || "Spatial scene");
      svg.innerHTML = [
        compact
          ? '<path d="M0 176 C72 132 139 207 214 160 C288 115 332 198 390 151 V270 H0 Z" fill="rgba(17, 42, 38, .62)" />'
          : '<path d="M0 163 C145 112 276 191 428 148 C606 97 746 181 1000 112 V230 H0 Z" fill="rgba(17, 42, 38, .62)" />',
        ...linkRows,
        ...tileHtml,
        ...siteLabels,
        ...portals,
        ...constraints,
        ...tokens,
      ].join("");
      return true;
    }

    function activePathwayJourney(view = state) {
      const journey = view?.journey || null;
      if (!journey) return null;
      const currentStep = Math.max(0, Number(journey.current_step || 0));
      const totalSteps = Math.max(0, Number(journey.total_steps || 0));
      const onPathway = journey.on_pathway === true
        || (journey.on_pathway !== false && currentStep > 0 && currentStep < totalSteps);
      return onPathway ? journey : null;
    }

    function pathwayDirectionForExit(exit, journey = activePathwayJourney()) {
      if (!journey || !exit) return null;
      const exitId = Number(exit.destination_location_id || 0);
      if (exitId === Number(journey.previous_location_id || 0)) {
        return {
          side: "back",
          endpointId: Number(journey.origin_location_id || 0),
          endpointName: String(journey.origin_name || "the way back"),
        };
      }
      if (exitId === Number(journey.next_location_id || 0)) {
        return {
          side: "forward",
          endpointId: Number(journey.destination_location_id || 0),
          endpointName: String(journey.destination_name || "the destination"),
        };
      }
      return null;
    }

    function pathwayStageHtml(view = state) {
      const journey = activePathwayJourney(view);
      if (!journey) return "";
      const currentStep = Math.max(1, Number(journey.current_step || 1));
      const totalSteps = Math.max(currentStep + 1, Number(journey.total_steps || 1));
      const position = Math.max(0, Math.min(100, (currentStep / totalSteps) * 100));
      const originName = String(journey.origin_name || "the way back");
      const destinationName = String(journey.destination_name || "the destination");
      const wayName = String(journey.way_name || `Way to ${destinationName}`);
      const partyCount = journeyPartyActors(view).length || 1;
      const travellerWord = partyCount === 1 ? "traveller" : "travellers";
      const meta = [
        wayName,
        `${partyCount} ${travellerWord}`,
        journeyNextStepLabel(journey),
      ].filter(Boolean).join(" · ");
      const avatar = actorForId(actorId);
      const avatarCard = cardForActor(actorId);
      const avatarName = avatar ? actorLabel(avatar) : "Your avatar";
      const avatarImage = cardImage(avatarCard);
      const avatarStyle = avatarImage
        ? `background-image:url(&quot;${escapeAttr(avatarImage)}&quot;);`
        : "";
      const pointCount = Math.min(totalSteps, 10);
      const points = Array.from({ length: pointCount + 1 }, (_, index) => {
        const point = (index / pointCount) * 100;
        const passed = point <= position ? " passed" : "";
        return `<span class="pathway-track-point${passed}" style="--pathway-point:${point.toFixed(2)}%" aria-hidden="true"></span>`;
      }).join("");
      return `<div class="pathway-stage-head"><div class="pathway-stage-title"><strong>${escapeHtml(originName)} — ${escapeHtml(destinationName)}</strong><span class="pathway-stage-meta" id="pathway-stage-meta">${escapeHtml(meta)}</span></div><span class="pathway-stage-progress">stretch ${currentStep} of ${totalSteps}</span></div><div class="pathway-track-wrap" style="--pathway-position:${position.toFixed(2)}%"><span class="pathway-track" aria-hidden="true"></span><span class="pathway-track-progress" aria-hidden="true"></span>${points}<span class="pathway-avatar-position" style="${avatarStyle}" aria-hidden="true">${avatarImage ? "" : escapeHtml(initials(avatarName))}</span></div><div class="pathway-directions"><span>to ${escapeHtml(originName)}</span><span>to ${escapeHtml(destinationName)}</span></div>`;
    }

    function renderPathwayStage(view = state) {
      const stage = $("pathway-stage");
      const journey = activePathwayJourney(view);
      stage.hidden = !journey;
      stage.innerHTML = journey ? pathwayStageHtml(view) : "";
      if (journey) {
        const partyCount = journeyPartyActors(view).length || 1;
        const wayName = String(journey.way_name || `Way to ${journey.destination_name || "the destination"}`);
        stage.setAttribute(
          "aria-label",
          `On ${wayName}, from ${journey.origin_name || "the way back"} to ${journey.destination_name || "the destination"}. Stretch ${journey.current_step} of ${journey.total_steps}. ${partyCount} ${partyCount === 1 ? "traveller" : "travellers"}. ${journeyNextStepLabel(journey)}.`,
        );
      } else {
        stage.removeAttribute("aria-label");
      }
      return Boolean(journey);
    }

    function render() {
      const location = state.location || {};
      const locationCard = cardForLocation(location.id);
      const locationArt = cardImage(locationCard) || fallbackCardImage(locationCard || { display_name: location.name || "Location", aspect: "wide", role: "location" });
      const locationImage = $("location-image");
      locationImage.src = locationArt;
      locationImage.alt = locationCard?.display_name || location.name || "";
      const roomHeroCard = $("room-hero-card");
      const roomHeroImage = $("room-hero-image");
      roomHeroImage.src = locationArt;
      roomHeroImage.alt = locationCard?.display_name || location.name || "";
      roomHeroCard.setAttribute("aria-label", `Open ${locationCard?.display_name || location.name || "current location"} card`);
      setCardTarget(roomHeroCard, locationCard);
      renderRoomAvatarRail();
      const pathwayJourney = activePathwayJourney(state);
      const roomHero = $("room-hero");
      roomHero.classList.toggle("pathway", renderPathwayStage(state));
      const hasSpatialScene = pathwayJourney
        ? (renderSpatialScene(null), false)
        : renderSpatialScene(state?.spatial_scene);
      roomHero.classList.toggle("spatial", hasSpatialScene);
      $("location-name").textContent = pathwayJourney
        ? `on the way to ${pathwayJourney.destination_name || "the destination"}`
        : (location.name || "Unknown");
      const brand = $("brand");
      const menuOpen = libraryPanelPinned || accountPanelPinned;
      brand.innerHTML = `${iconSvg(menuOpen ? "close" : "menu")}<span>${menuOpen ? "close menu" : "menu"}</span>`;
      brand.setAttribute("aria-label", menuOpen ? "Close Menu" : "Open Menu");
      brand.setAttribute("aria-expanded", menuOpen ? "true" : "false");
      $("room-log-toggle").querySelector(".room-log-icon").innerHTML = iconSvg("journal");
      $("card-modal").querySelector(".card-close").innerHTML = iconSvg("close");
      $("wallet-modal").querySelector(".wallet-close").innerHTML = iconSvg("close");
      renderEconomy();
      $("journal-location").textContent = pathwayJourney
        ? `${pathwayJourney.origin_name || "the way back"} — ${pathwayJourney.destination_name || "the destination"}`
        : (location.name || "Unknown");
      const journalActor = actorForId(actorId);
      $("journal-owner").textContent = journalActor
        ? `${actorLabel(journalActor)}'s Journal`
        : "My Journal";
      document.querySelector(".room")?.classList.toggle("collapsed", !roomCopyExpanded);
      if (lastRoomCopyLocationId !== location.id) {
        roomCopyExpanded = false;
        journalOpen = false;
        lastRoomCopyLocationId = location.id || null;
        document.querySelector(".room")?.classList.add("collapsed");
      }
      renderRoomCopy(location.id);
      renderSharedQuestions();
      renderTimelines();
      renderCommands();
    }

    function journeyPartyActors(view = state) {
      return [...(view?.actors || [])]
        .filter((actor) => !actorIsDownedForRail(actor))
        .sort((left, right) => {
          if (Number(left.id) === Number(actorId)) return -1;
          if (Number(right.id) === Number(actorId)) return 1;
          return String(left.name || "").localeCompare(String(right.name || ""));
        });
    }

    function journeyNextStepLabel(journey) {
      const nextName = String(journey?.next_location_name || "").trim();
      if (!nextName) return "make camp";
      if (/^unexplored stretch\b/i.test(nextName)) return "next scout ahead";
      if (Number(journey?.steps_remaining || 0) <= 1) return `next ${journey.destination_name}`;
      return `next ${nextName}`;
    }

    function orbSlotPresentation(value) {
      const total = Math.max(0, Math.floor(Number(value || 0)));
      const tier = total >= 1000 ? 1000 : total >= 100 ? 100 : total >= 10 ? 10 : 1;
      const filled = Math.min(5, tier === 1 ? total : Math.floor(total / tier));
      const slots = Array.from({ length: 5 }, (_, index) => (
        `<i class="${index < filled ? "filled" : ""}" aria-hidden="true"></i>`
      )).join("");
      return { total, tier, filled, slots };
    }

    function renderEconomy() {
      const economy = state?.economy || {};
      const orbs = Number.isFinite(Number(economy.orbs)) ? Number(economy.orbs) : 0;
      const orbPresentation = orbSlotPresentation(orbs);
      const tierLabel = orbPresentation.tier > 1 ? `<strong>×${orbPresentation.tier}</strong>` : "";
      const parts = [
        `<span class="economy-stat orbs" aria-label="${orbs} Orbs">${iconSvg("orb")}<span class="minimal-orb-rack compact tier-${orbPresentation.tier}">${orbPresentation.slots}</span>${tierLabel}</span>`,
      ];
      const compact = window.matchMedia("(max-width: 900px)").matches;
      if (economyFlash) {
        parts.push(`<span class="economy-flash ${escapeAttr(economyFlash.kind)}">${escapeHtml(economyFlash.text)}</span>`);
      }
      if (!compact && state?.deck?.actor_id) {
        const carried = Number(state.deck.carried_weight_tenths || 0) / 10;
        const capacity = Number(state.deck.carrying_capacity_tenths || 0) / 10;
        parts.push(`<span class="economy-stat carry">${iconSvg("bag")}<strong>${carried.toFixed(1)}</strong> <span>/ ${capacity.toFixed(1)} lb</span></span>`);
      }
      const economyNode = $("economy");
      economyNode.innerHTML = parts.join("");
      economyNode.setAttribute("aria-label", `${orbs} Orbs and pack status`);
    }

    function exitUnavailable(exit, view = state) {
      if (!exit) return true;
      if (truthyFlag(exit.locked) || falseyFlag(exit.accessible)) return true;
      const destinationCard = cardForLocationInView(view, exit.destination_location_id);
      if (falseyFlag(destinationCard?.accessible)) return true;
      return false;
    }

    function truthyFlag(value) {
      if (value === true || value === 1) return true;
      const text = String(value || "").trim().toLowerCase();
      return text === "true" || text === "1" || text === "yes" || text === "locked";
    }

    function falseyFlag(value) {
      if (value === false || value === 0) return true;
      const text = String(value || "").trim().toLowerCase();
      return text === "false" || text === "0" || text === "no" || text === "locked";
    }

    function cardForLocationInView(view, id) {
      return view?.cards?.locations?.[String(id)] || null;
    }

    function committedStateRevision(view = state) {
      return Math.max(
        0,
        Number(view?.state_revision || 0),
        Number(view?.world_seq || 0),
      );
    }

    function expeditionRingPresentation(actor, stateRevision) {
      const projected = actor?.expedition_ring;
      if (!projected || typeof projected !== "object") {
        return { html: "", needsRest: false };
      }
      const pipTotal = Math.max(1, Math.min(4, Math.trunc(Number(projected.pip_total) || 1)));
      const filledCount = Math.max(
        0,
        Math.min(pipTotal, Math.trunc(Number(projected.filled_count) || 0)),
      );
      const needsRest = projected.needs_rest === true;
      const actorKey = String(actor?.id || "");
      const prior = expeditionRingRenderState.get(actorKey);
      const committedChange = Boolean(
        prior
        && stateRevision > prior.stateRevision
        && (filledCount !== prior.filledCount || needsRest !== prior.needsRest),
      );
      if (!prior || stateRevision >= prior.stateRevision) {
        expeditionRingRenderState.set(actorKey, {
          filledCount,
          needsRest,
          stateRevision,
        });
      }
      const gapDegrees = pipTotal === 1 ? 18 : 10;
      const sweepDegrees = (360 / pipTotal) - gapDegrees;
      const segments = Array.from({ length: pipTotal }, (_, index) => {
        const startDegrees = (index * 360 / pipTotal) + (gapDegrees / 2);
        return `<span class="expedition-ring-segment${index < filledCount ? " filled" : ""}" style="--ring-start:${startDegrees}deg;--ring-sweep:${sweepDegrees}deg"></span>`;
      }).join("");
      const classes = `expedition-ring${committedChange ? " committed-change" : ""}`;
      return {
        needsRest,
        html: `<span class="${classes}" aria-hidden="true" data-filled-count="${filledCount}" data-pip-total="${pipTotal}" data-state-revision="${stateRevision}">${segments}</span>`,
      };
    }

    function combatTargetPresentation(view) {
      const currentAction = actionConfirmAction || visibleFocusedAction();
      const attackAction = Boolean(
        currentAction
        && (
          String(currentAction.label || "").toLowerCase() === "attack"
          || (currentAction.offerKinds || []).includes("attack")
        )
      );
      const legalTargetIds = new Set();
      let selectedTargetId = 0;
      if (!attackAction) return { legalTargetIds, selectedTargetId };

      const offerIds = new Set((currentAction.offerIds || []).map(String));
      for (const offer of (view.action_offers || [])) {
        if (offerIds.size && !offerIds.has(String(offer?.offer_id || ""))) continue;
        if (String(offer?.kind || "") !== "attack") continue;
        const targetId = Number(offer?.target?.id || 0);
        if (targetId > 0) legalTargetIds.add(targetId);
      }
      for (const choice of (currentAction.choices || [])) {
        const targetId = Number(choice?.value || 0);
        if (targetId > 0) legalTargetIds.add(targetId);
      }
      try {
        selectedTargetId = Number(currentAction.selectedPayload?.()?.target_actor_id || 0);
      } catch {
        selectedTargetId = 0;
      }
      if (selectedTargetId > 0) legalTargetIds.add(selectedTargetId);
      return { legalTargetIds, selectedTargetId };
    }

    function combatParticipantConditions(participant) {
      const conditions = [];
      if (participant.unconscious) conditions.push("Unconscious");
      if (participant.dodging) conditions.push("Dodging");
      if (participant.escaped) conditions.push("Escaped");
      return conditions;
    }

    function urgentCombatCondition(participant) {
      if (participant.unconscious) return "KO";
      if (participant.escaped) return "Away";
      if (participant.dodging) return "Dodge";
      if (participant.status && participant.status !== "active") return "Out";
      return "";
    }

    function actorIsDownedForRail(actor, participant = null) {
      return Boolean(
        participant?.unconscious
        || participant?.status === "knocked_out"
        || actor?.status === "knocked_out"
      );
    }

    function combatParticipantLabel(participant, actor, combat, targetPresentation) {
      const name = participant.actor_name || (actor ? actorLabel(actor) : `Avatar ${participant.actor_id}`);
      const hp = Math.max(0, Number(participant.current_hp ?? 0));
      const maxHp = Math.max(1, Number(participant.max_hp ?? 1));
      const conditions = combatParticipantConditions(participant);
      const parts = [name, `${hp} of ${maxHp} HP`];
      if (combat) {
        if (Number(participant.actor_id) === Number(combat.current_actor_id)) parts.push("acting now");
        else parts.push("waiting for their turn");
      }
      if (participant.status && participant.status !== "active") parts.push(`status ${participant.status.replaceAll("_", " ")}`);
      parts.push(conditions.length ? `conditions ${conditions.join(", ")}` : "no conditions");
      if (combat) {
        const targetId = Number(participant.actor_id);
        if (targetPresentation.selectedTargetId === targetId) parts.push("selected legal target");
        else if (targetPresentation.legalTargetIds.has(targetId)) parts.push("legal target");
        else parts.push("not a legal target for the selected action");
      }
      return `${parts.join(". ")}.`;
    }

    function combatParticipantHtml(participant, view, targetPresentation) {
      const combat = view.combat;
      const actor = (view.actors || []).find((candidate) => Number(candidate.id) === Number(participant.actor_id));
      const name = participant.actor_name || (actor ? actorLabel(actor) : `Avatar ${participant.actor_id}`);
      const card = cardForActor(participant.actor_id);
      const fallback = card || { display_name: name, role: "avatar", aspect: "portrait" };
      const image = cardImage(card) || fallbackCardImage(fallback);
      const hp = Math.max(0, Number(participant.current_hp ?? 0));
      const maxHp = Math.max(1, Number(participant.max_hp ?? 1));
      const hpPercent = Math.max(0, Math.min(100, Math.round((hp / maxHp) * 100)));
      const current = Number(participant.actor_id) === Number(combat.current_actor_id);
      const legalTarget = targetPresentation.legalTargetIds.has(Number(participant.actor_id));
      const selectedTarget = targetPresentation.selectedTargetId === Number(participant.actor_id);
      const label = combatParticipantLabel(participant, actor, combat, targetPresentation);
      const healthClass = hpPercent <= 25 ? " combat-critical" : hpPercent < 100 ? " combat-hurt" : "";
      const marker = urgentCombatCondition(participant);
      return `<span class="room-avatar-frame combat-participant${healthClass}${current ? " combat-current" : ""}${legalTarget ? " combat-legal-target" : ""}${selectedTarget ? " combat-selected-target" : ""}" data-combat-participant-id="${Number(participant.actor_id)}" data-combat-health-percent="${hpPercent}" data-combat-target="${selectedTarget ? "selected" : legalTarget ? "legal" : "none"}"><button class="room-avatar-pfp" type="button"${cardDataAttr(card)} title="${escapeAttr(label)}" aria-label="${escapeAttr(`Open combatant details. ${label}`)}" data-player-concept="card" data-analytics-event="card.open"${backgroundImageStyle(image)}></button><span class="combat-health-ring" style="--combat-hp-angle:${hpPercent * 3.6}deg" role="meter" aria-label="${escapeAttr(`${name} health: ${hp} of ${maxHp} HP`)}" aria-valuemin="0" aria-valuemax="${maxHp}" aria-valuenow="${hp}"></span>${marker ? `<span class="combat-condition-marker" aria-hidden="true">${escapeHtml(marker)}</span>` : ""}</span>`;
    }

    function rescueIndicatorHtml(participant, view, targetPresentation) {
      const actor = (view.actors || []).find((candidate) => Number(candidate.id) === Number(participant.actor_id));
      const name = participant.actor_name || (actor ? actorLabel(actor) : `Avatar ${participant.actor_id}`);
      const card = cardForActor(participant.actor_id);
      const combat = view.combat || null;
      const label = combatParticipantLabel(participant, actor, combat, targetPresentation);
      return `<button class="combat-rescue-indicator" type="button" data-rescue-actor-id="${Number(participant.actor_id)}" data-combat-rescue="true"${cardDataAttr(card)} title="${escapeAttr(label)}" aria-label="${escapeAttr(`Open ${name}'s keepsake and rescue details. ${label}`)}" data-player-concept="card" data-analytics-event="card.open"><span class="combat-rescue-mark" aria-hidden="true">KO</span><span class="combat-rescue-name">${escapeHtml(name)}</span></button>`;
    }

    function rescueRowEntries(view) {
      if (view.combat) {
        return (view.combat.participants || [])
          .filter((participant) => {
            const actor = (view.actors || []).find((candidate) => Number(candidate.id) === Number(participant.actor_id));
            return actorIsDownedForRail(actor, participant);
          });
      }
      return (view.actors || [])
        .filter((actor) => actorIsDownedForRail(actor))
        .map((actor) => ({
          actor_id: actor.id,
          actor_name: actorLabel(actor),
          status: actor.status,
          current_hp: Number(actor.hp ?? 0),
          max_hp: Math.max(1, Number(actor.stats?.hp_base ?? 1)),
          unconscious: true,
        }));
    }

    function rescueRowHtml(view, targetPresentation) {
      const entries = rescueRowEntries(view);
      if (!entries.length) return "";
      const visibleLimit = 3;
      const visible = entries.slice(0, visibleLimit);
      const overflow = entries.slice(visibleLimit);
      const count = entries.length;
      const summary = `<span class="room-rescue-summary">${count} knocked out</span>`;
      const visibleHtml = visible
        .map((participant) => rescueIndicatorHtml(participant, view, targetPresentation))
        .join("");
      const overflowHtml = overflow.length
        ? `<details class="combat-rescue-overflow"><summary aria-label="Show ${overflow.length} more knocked-out avatars">+${overflow.length}</summary><span class="combat-rescue-overflow-list">${overflow.map((participant) => rescueIndicatorHtml(participant, view, targetPresentation)).join("")}</span></details>`
        : "";
      return `${summary}${visibleHtml}${overflowHtml}`;
    }

    function roomAvatarRailHtml(view) {
      if (view.combat) {
        const targetPresentation = combatTargetPresentation(view);
        return [...(view.combat.participants || [])]
          .filter((participant) => {
            const actor = (view.actors || []).find((candidate) => Number(candidate.id) === Number(participant.actor_id));
            return !actorIsDownedForRail(actor, participant);
          })
          .sort((left, right) => (
            Number(right.initiative || 0) - Number(left.initiative || 0)
              || Number(left.actor_id || 0) - Number(right.actor_id || 0)
          ))
          .map((participant) => combatParticipantHtml(participant, view, targetPresentation))
          .join("");
      }
      const actors = [...(view.actors || [])].filter((actor) => !actorIsDownedForRail(actor)).sort((a, b) => {
        if (a.id === actorId) return -1;
        if (b.id === actorId) return 1;
        return String(a.name || "").localeCompare(String(b.name || ""));
      });
      const stateRevision = committedStateRevision(view);
      return actors.map((actor) => {
        const card = cardForActor(actor.id);
        const fallback = card || {
          display_name: actor.name || "Avatar",
          role: "avatar",
          aspect: "tall",
        };
        const image = cardImage(card) || fallbackCardImage(fallback);
        const you = actor.id === actorId;
        const evolved = Number(actor.stats?.level || 1) > 1;
        const label = you ? `${actorLabel(actor)} (you)` : actorLabel(actor);
        const incomingGiftCount = (view.safety?.incoming_offers || []).filter((offer) => (
          offer.kind === "gift" && Number(offer.offered_by_actor_id) === Number(actor.id)
        )).length;
        const outgoingGiftCount = (view.safety?.outgoing_offers || []).filter((offer) => (
          offer.kind === "gift" && Number(offer.offered_to_actor_id) === Number(actor.id)
        )).length;
        const pendingGiftCount = incomingGiftCount + outgoingGiftCount;
        const pendingGiftLabel = incomingGiftCount
          ? `${incomingGiftCount} gift${incomingGiftCount === 1 ? "" : "s"} from ${actorLabel(actor)} waiting for your answer`
          : outgoingGiftCount
            ? `${outgoingGiftCount} gift${outgoingGiftCount === 1 ? "" : "s"} offered to ${actorLabel(actor)}`
            : "";
        const ring = expeditionRingPresentation(actor, stateRevision);
        const giftMarker = pendingGiftCount
          ? `<span class="room-avatar-transfer-marker" aria-hidden="true">${iconSvg("gift")}</span>`
          : "";
        const accessibleLabel = [label, pendingGiftLabel].filter(Boolean).join(". ");
        return `<span class="room-avatar-frame${ring.needsRest ? " needs-rest" : ""}${pendingGiftCount ? " pending-transfer" : ""}"><button class="room-avatar-pfp${you ? " you" : ""}${evolved ? " evolved" : ""}" type="button"${cardDataAttr(card)} title="${escapeAttr(accessibleLabel)}" aria-label="Open ${escapeAttr(accessibleLabel)} card" data-player-concept="card" data-analytics-event="card.open"${backgroundImageStyle(image)}></button>${ring.html}${giftMarker}</span>`;
      }).join("");
    }

    function renderRoomAvatarRail(view = state) {
      const rail = $("room-avatar-rail");
      const rescueRow = $("room-rescue-row");
      if (!rail || !rescueRow) return;
      const targetPresentation = view?.combat
        ? combatTargetPresentation(view)
        : { legalTargetIds: new Set(), selectedTargetId: 0 };
      const rescueHtml = rescueRowHtml(view, targetPresentation);
      rail.classList.toggle("combat", Boolean(view?.combat));
      rail.setAttribute("aria-label", view?.combat ? "Combatants in this encounter" : "Avatars in this location");
      rail.innerHTML = roomAvatarRailHtml(view);
      rescueRow.innerHTML = rescueHtml;
      rescueRow.hidden = !rescueHtml;
      $("room-hero")?.classList.toggle("has-rescue-row", Boolean(rescueHtml));
    }

    function combatBeatPresentation(event) {
      const type = String(event?.type || "");
      const actor = event?.actor_name || "Someone";
      const target = event?.target_actor_name || event?.combat_outcome?.target_actor_name || "their opponent";
      const base = {
        icon: "⚔",
        summary: "The clash continues",
        detail: "",
        result: "",
        resultKind: "wait",
      };
      if (type === "combat.attack.attempt") {
        const outcome = event.combat_outcome || null;
        const knockout = event.combat_knockout || null;
        const method = event.combat_method || event.item_name || "Unarmed strike";
        const mechanics = combatAttackMechanics(event).replace(/\s*·\s*$/g, "");
        const damageValue = outcome?.damage ?? knockout?.damage;
        const damage = Number.isFinite(Number(damageValue)) ? Math.max(0, Number(damageValue)) : null;
        const missed = outcome?.type === "combat.attack.miss" || (!outcome && event.success === false);
        return {
          icon: missed ? "◇" : knockout ? "!" : "✦",
          summary: actor + " → " + target,
          detail: [method, mechanics].filter(Boolean).join(" · "),
          result: missed ? "miss" : knockout ? "knockout" : damage > 0 ? damage + " harm" : "hit",
          resultKind: missed ? "miss" : knockout ? "critical" : "hit",
        };
      }
      if (type === "combat.encounter.started") {
        return { ...base, icon: "⚔", summary: actor + " faces " + target, detail: "The encounter begins", result: "start" };
      }
      if (type === "combat.attack.hit") {
        const damage = Math.max(0, Number(event.damage || 0));
        return { ...base, icon: "✦", summary: actor + " hits " + target, detail: event.combat_method || event.item_name || "Attack", result: damage ? damage + " harm" : "hit", resultKind: "hit" };
      }
      if (type === "combat.attack.miss") {
        return { ...base, icon: "◇", summary: target + " evades " + actor, detail: event.combat_method || event.item_name || "Attack", result: "miss", resultKind: "miss" };
      }
      if (type === "combat.knockout") {
        return { ...base, icon: "!", summary: target + " is knocked out", detail: event.combat_method || event.item_name || actor + "'s attack", result: "knockout", resultKind: "critical" };
      }
      if (type === "combat.dodge") {
        return { ...base, icon: "↝", summary: actor + " prepares to dodge", detail: "Attacks have Disadvantage", result: "dodge" };
      }
      if (type === "combat.defend") {
        return { ...base, icon: "◇", summary: actor + " holds their guard", detail: "Waiting for an opening", result: "guard" };
      }
      if (type === "combat.pass") {
        return { ...base, icon: "→", summary: actor + " passes", detail: "The combat floor moves on", result: "pass" };
      }
      if (type === "combat.need_time") {
        return { ...base, icon: "…", summary: actor + " needs more time", detail: "The turn stays with them", result: "pause" };
      }
      if (type === "combat.flee.success") {
        return { ...base, icon: "↗", summary: actor + " escapes", detail: "To " + (event.destination_location_name || "safety"), result: "away" };
      }
      if (type === "combat.encounter.resolved") {
        return { ...base, icon: "✦", summary: "The clash is over", detail: "The room settles again", result: "resolved", resultKind: "hit" };
      }
      if (type === "item.used") {
        const recovery = Number(event.damage || 0) < 0 ? Math.abs(Number(event.damage || 0)) : 0;
        return { ...base, icon: "+", summary: actor + " uses " + (event.item_name || "an item"), detail: event.target_actor_name ? "On " + event.target_actor_name : "In the clash", result: recovery ? "+" + recovery + " HP" : "used", resultKind: recovery ? "hit" : "wait" };
      }
      if (type === "magic.spell_cast") {
        return { ...base, icon: "✧", summary: actor + " casts " + (event.item_name || "a spell"), detail: event.target_actor_name ? "Toward " + event.target_actor_name : "Its effect takes hold", result: "cast", resultKind: "hit" };
      }
      return {
        ...base,
        summary: cleanStatusText(sceneCardEventText(event) || eventText(event)) || base.summary,
      };
    }

    function combatBeatHtml(event, className) {

        : "";
      const aria = [beat.summary, beat.detail, beat.result].filter(Boolean).join(". ");
      return '<div class="' + escapeAttr(className) + '" data-combat-history-seq="' + Number(event?.transcript_tail_seq || event?.seq || 0) + '" aria-label="' + escapeAttr(aria) + '"><span class="combat-beat-icon" aria-hidden="true">' + escapeHtml(beat.icon) + '</span><span class="combat-beat-copy"><span class="combat-beat-summary">' + escapeHtml(beat.summary) + "</span>" + detail + "</span>" + result + "</div>";

    function journalSentence(value) {
      const text = cleanStatusText(value);
      if (!text) return "";
      let sentence = text;
      if (journalSentenceSegmenter) {
        const segment = journalSentenceSegmenter.segment(text)[Symbol.iterator]().next().value;
        sentence = String(segment?.segment || text).trim();
      } else {
        sentence = String(text.match(/^.*?[.!?](?=\s|$)/)?.[0] || text).trim();
      }
      if (sentence.length > 240) {
        sentence = `${sentence.slice(0, 237).trimEnd()}…`;
      }
      return /[.!?…]["')\]]*$/.test(sentence) ? sentence : `${sentence}.`;
    }

    function journalProseRowHtml({
      category = "story",
      prose = "",
      kind = "",
      attrs = "",
    } = {}) {
      const text = cleanJournalProseText(prose);
      if (!text) return "";
      return `<details class="journal-row journal-prose-row ${escapeAttr(kind)}" data-journal-category="${escapeAttr(category)}"${attrs} aria-label="${escapeAttr(text)}"><summary tabindex="-1" aria-disabled="true"><span class="journal-row-label">${escapeHtml(category)}</span><span class="journal-row-summary">${escapeHtml(text)}</span><span class="journal-row-marker" aria-hidden="true"></span></summary></details>`;
    }

    function cleanJournalProseText(value) {
      return String(value || "")
        .trim()
        .replace(/:{1,2}(resident_feature_use|resident_autonomy_intent)\b/g, "")
        .replace(/\b[a-z][a-z0-9]*(?:_[a-z0-9]+)+\b[.!?]*/gi, "")
        .replace(/^you:\s*/i, "")
        .replace(/\s+([,.;!?])/g, "$1")
        .replace(/\.{2,}/g, ".")
        .replace(/\s+/g, " ")
        .trim();
    }

    function journalFirstPersonProse(value) {
      let prose = cleanJournalProseText(value);
      const self = actorForId(actorId);
      const name = cleanStatusText(self ? actorLabel(self) : "");
      if (!prose || !name) return prose;
      const quotedName = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      prose = prose
        .replace(new RegExp(`^${quotedName}(?=\\s)`, "i"), "I")
        .replace(new RegExp(`\\b${quotedName}(?:'s|')\\b`, "gi"), "my")
        .replace(/^You\b/i, "I")
        .replace(/^Your\b/i, "My");
      prose = prose.replace(/^I\s+([A-Za-z'-]+)/, (match, verb) => {
        const lower = verb.toLowerCase();
        const irregular = { is: "am", has: "have", does: "do", goes: "go" };
        let firstPerson = irregular[lower] || verb;
        if (!irregular[lower] && /ies$/i.test(verb)) {
          firstPerson = `${verb.slice(0, -3)}y`;
        } else if (!irregular[lower] && /(?:ches|shes|sses|xes|zes|oes)$/i.test(verb)) {
          firstPerson = verb.slice(0, -2);
        } else if (!irregular[lower] && /s$/i.test(verb) && !/(?:ss|us|is|was)$/i.test(verb)) {
          firstPerson = verb.slice(0, -1);
        }
        return `I ${firstPerson}`;
      });
      return prose;
    }

    function syncJournalMode() {

      latestControl.setAttribute("aria-label", open ? "Close Journal" : "Open Journal");
      latestControl.dataset.analyticsEvent = open ? "journal.close" : "journal.open";

      document.querySelector(".prompt").hidden = Boolean(panelMode || open);

    function setJournalOpen(open) {
      const closing = journalOpen && !open;

          dismissedJournalActivityKeys.add(activity.key);
        }
        journalNotifications = [];
        dismissFirstTalePayoff();
      }
      if (opening) journalPageIndex = -1;
      journalOpen = Boolean(open);

      if (closing) renderStatusUpdates();
