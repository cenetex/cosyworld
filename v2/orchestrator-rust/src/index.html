        ? "You can observe the room or summon one new traveler to attempt the rescue. This identity, its bonds, belongings, and journal remain attached."
        : "You can observe the room while another traveler brings help. This identity, its bonds, belongings, and journal remain attached.";
      const aria = `awaiting rescue. ${text} ${cue}`;
      return `<div class="room-scene defeat-scene" role="status" aria-label="${escapeAttr(aria)}"><span class="room-scene-kicker">awaiting rescue</span><span class="room-scene-text">${escapeHtml(text)}</span><span class="room-scene-cue">${escapeHtml(cue)}</span></div>`;
    }

    function quietRoomSceneHtml() {
      const hasAvatar = Boolean(actorId && state?.primary_action?.kind !== "create_avatar");
      const cue = state?.combat
        ? "The clash has the floor. Choose from your combat hand."
        : state?.journey
        ? "The road is quiet for a moment. Chat with the travelling party or choose how to press on."
        : hasAvatar
          ? "Chat with someone here or explore the room."
        : "Begin a tale, then discover the room through play.";
      return `<p class="chat-empty" role="note">${escapeHtml(cue)}</p>`;
    }

    function eventIsChatTranscriptEvent(event) {
      return ["message.created", "image.created", "model_interaction.output", "avatar.thought", "avatar.dream"].includes(event?.type);
    }

    function transcriptEventHtml(event) {
      if (event?.type === "message.created") return messageHtml(event);
      if (event?.type === "image.created") return residentImageHtml(event);
      if (event?.type === "model_interaction.output") return modelInteractionOutputHtml(event);
      if (["avatar.thought", "avatar.dream"].includes(event?.type)) return avatarReflectionHtml(event);
      if (event?.type === "combat.attack.attempt") return combatAttackTranscriptBeatHtml(event);
      return sceneCardEventHtml(event);
    }

    function combatAttackTranscriptBeatHtml(event) {
      const outcome = event.combat_outcome || null;
      const knockout = event.combat_knockout || null;
      const target = event.target_actor_name || outcome?.target_actor_name || "their opponent";
      const pieces = [rollMeta(event).story];
      if (outcome?.type === "combat.attack.hit") {
        const damage = Math.max(0, Number(outcome.damage || 0));
        if (damage > 0) pieces.push(`${target} takes ${damage} harm.`);
        else pieces.push(`${target}'s guard gives way.`);
        if (!knockout && outcome.current_hp !== undefined && outcome.current_hp !== null) {
          pieces.push(`${target} has ${Math.max(0, Number(outcome.current_hp || 0))} HP remaining.`);
        }
      }
      if (knockout) pieces.push(`${target} is knocked out.`);
      const text = pieces.filter(Boolean).join(" ");
      return `<div class="line event scene-card combat" data-event-row data-combat-beat aria-label="${escapeAttr(`Combat beat. ${text}`)}"><span class="event-label" aria-hidden="true">⚔</span><span class="text">${escapeHtml(text)}</span></div>`;
    }

    function minimalMenuOrbHtml() {
      const total = Math.max(0, Math.floor(Number(state?.economy?.orbs || 0)));
      const presentation = orbSlotPresentation(total);
      const tierLabel = presentation.tier > 1 ? `<strong>×${presentation.tier}</strong>` : "";
      return `<div class="minimal-menu-orbs" aria-label="${total} Orbs"><span>Orbs</span><div class="minimal-orb-rack tier-${presentation.tier}">${presentation.slots}</div>${tierLabel}</div>`;
    }

    function minimalMenuSlotHtml(label, item) {
      const card = item ? cardForItem(item.id) : null;
      const image = cardImage(card);
      const title = String(card?.display_name || item?.name || label).trim();
      const content = image
        ? `<img src="${escapeAttr(image)}" alt="" /><span>${escapeHtml(label)}</span>`
        : `<span>${escapeHtml(label)}</span><b aria-hidden="true">—</b>`;
      return `<button class="minimal-menu-slot${image ? " filled" : ""}" type="button"${cardDataAttr(card)} aria-label="${escapeAttr(image ? `Open ${title}` : `${label} slot empty`)}"${image ? "" : " disabled"}>${content}</button>`;
    }

    function minimalMenuPanelHtml() {
      const deck = state?.deck || {};
      const avatar = actorForId(actorId);
      const avatarCard = cardForActor(actorId);
      const avatarName = String(avatar?.name || avatarCard?.display_name || "Traveler").trim();
      const avatarTitle = String(avatar?.title || avatarCard?.title || "").trim();
      const avatarImage = cardImage(avatarCard);
      const avatarMark = avatarImage
        ? `<button class="minimal-menu-avatar" type="button"${cardDataAttr(avatarCard)} aria-label="Open ${escapeAttr(avatarName)}"><img src="${escapeAttr(avatarImage)}" alt="" /></button>`
        : `<span class="minimal-menu-avatar fallback" aria-hidden="true">${escapeHtml(avatarName.charAt(0) || "C")}</span>`;
      const equippedContainers = Array.isArray(deck.equipped_containers) ? deck.equipped_containers : [];
      const equippedCharms = Array.isArray(deck.equipped_charms) ? deck.equipped_charms : [];
      const preparedSpells = Array.isArray(deck.prepared_spell_cards) ? deck.prepared_spell_cards : [];
      const slots = [
        minimalMenuSlotHtml("Weapon", deck.equipped_weapon),
        minimalMenuSlotHtml("Pack", equippedContainers[0]),
        minimalMenuSlotHtml("Charm", equippedCharms[0]),
        minimalMenuSlotHtml("Spell", preparedSpells[0]),
      ].join("");
      const worldName = String(worldView?.name || contentPacks?.world_name || "CosyWorld Core").trim();
      const identityAction = identity?.authenticated
        ? `<span class="minimal-menu-value">Passkey</span>`
        : `<button class="minimal-menu-inline-action" type="button" data-passkey-continue>Sign in</button>`;
      const largeText = localStorage.getItem("cosyworld.ui.largeText") === "true";
      const reduceMotion = localStorage.getItem("cosyworld.ui.reduceMotion") === "true";
      const level = Number(state?.character_identity?.level ?? avatar?.stats?.level ?? 1);
      return `<section class="account-panel minimal-menu" aria-labelledby="account-panel-title"><header class="minimal-menu-heading"><span id="account-panel-title">Player</span><button type="button" data-menu-close>Return to chat</button></header><div class="minimal-menu-player">${avatarMark}<div><strong>${escapeHtml(avatarName)}</strong>${avatarTitle ? `<small>${escapeHtml(avatarTitle)}</small>` : ""}</div><span class="minimal-menu-level" aria-label="Level ${level}">${level}</span></div>${minimalMenuOrbHtml()}<div class="minimal-menu-slots" aria-label="Equipped cards">${slots}</div><div class="minimal-menu-rows"><div class="minimal-menu-row"><span>World</span><strong>${escapeHtml(worldName)}</strong></div><div class="minimal-menu-row"><span>Identity</span>${identityAction}</div></div><div class="minimal-menu-settings"><label><span>Larger text</span><input type="checkbox" data-ui-setting="largeText"${largeText ? " checked" : ""} /></label><label><span>Reduce motion</span><input type="checkbox" data-ui-setting="reduceMotion"${reduceMotion ? " checked" : ""} /></label></div></section>`;
    }

    function accountPanelHtml() {
      if (!accountPanelPinned) return "";
      return minimalMenuPanelHtml();
    }

    function identitySectionHtml() {
      if (!identity?.authenticated) {
        if (passkeyRecoveryAvailable) {
          return `<section class="account-section" aria-label="Passkey recovery"><div class="account-section-title">Passkey recovery</div><div class="item-note"><strong>This device has a passkey that CosyWorld no longer recognizes.</strong><br>Try another passkey if you have one. Creating a replacement starts a new CosyWorld account and does not restore data held only by the missing account.</div><div class="account-actions"><button class="account-button" type="button" data-passkey-recover>create replacement passkey</button><button class="account-button secondary" type="button" data-passkey-continue>try another passkey</button></div></section>`;
        }
        return `<section class="account-section" aria-label="CosyWorld sign in"><div class="account-actions"><button class="account-button" type="button" data-passkey-continue>continue with passkey</button></div></section>`;
      }
      const passkeys = Array.isArray(identity.passkeys) ? identity.passkeys : [];
      const wallets = Array.isArray(identity.wallets) ? identity.wallets : [];
      const walletRows = wallets.length
        ? wallets.map((entry) => {
            const wallet = String(entry.wallet_address || "");
            const active = wallet === identity.active_wallet;
            return `<div class="account-wallet-entry${active ? " active" : ""}"><code>${escapeHtml(compactAssetId(wallet))}</code><div class="account-wallet-controls">${active ? `<span class="account-auth-copy">linked-avatar discovery active</span>` : `<button class="account-button secondary" type="button" data-wallet-select="${escapeAttr(wallet)}">use</button>`}<button class="account-button secondary" type="button" data-wallet-unlink="${escapeAttr(wallet)}">release</button></div></div>`;
          }).join("")
        : `<div class="account-empty">No avatar wallet linked. Public play still works.</div>`;
      const passkeyCopy = passkeys.length === 1
        ? "1 passkey — add a second for recovery"
        : `${passkeys.length} passkeys`;
      const openRouterConnected = Boolean(openRouterApiKey());
      const openRouterLabel = openRouterConnection?.label || "OpenRouter";
      const remainingValue = openRouterConnection?.limit_remaining_usd;
      const remaining = remainingValue == null ? Number.NaN : Number(remainingValue);
      const remainingCopy = Number.isFinite(remaining)
        ? ` · $${remaining.toFixed(2)} key limit remaining`
        : "";
      const openRouterControls = openRouterConnected
        ? `<div class="item-note"><strong>${escapeHtml(openRouterLabel)} connected</strong>${escapeHtml(remainingCopy)}<br>Eligible immediate public model interactions use this key. Delayed batch echoes and autonomous room voices stay on CosyWorld's protected daily budget.</div><div class="account-actions"><button class="account-button secondary" type="button" data-openrouter-disconnect>disconnect OpenRouter</button></div>`
        : `<div class="item-note">Connect OpenRouter to pay for model interactions you start. Their approved output is shared with the room, so your account contributes to the public world.</div><div class="account-actions"><button class="account-button" type="button" data-openrouter-connect>connect OpenRouter</button></div>`;
      return `<section class="account-section" aria-label="CosyWorld account"><div class="account-section-title">CosyWorld account</div>${accountRow("passkeys", passkeyCopy)}<div class="account-actions"><button class="account-button secondary" type="button" data-passkey-add>add passkey</button><button class="account-button secondary" type="button" data-wallet-link data-player-concept="linked-avatar" data-analytics-event="linked_avatar.link">link avatar wallet</button><button class="account-button secondary" type="button" data-account-logout>sign out</button></div><div class="account-wallet-list">${walletRows}</div></section><section class="account-section" aria-label="OpenRouter connection"><div class="account-section-title">OpenRouter contribution</div>${openRouterControls}</section>`;
    }

    function characterSheetHtml() {
      const ledger = state?.ledger || {};
      const avatar = actorForId(actorId);
      const avatarCard = cardForActor(actorId);
      const avatarName = String(avatar?.name || avatarCard?.display_name || "your avatar").trim();
      const avatarTitle = String(avatar?.title || avatarCard?.title || "").trim();
      const avatarBlurb = String(avatarCard?.blurb || avatar?.description || "").trim();
      const avatarImage = cardImage(avatarCard);
      const portrait = avatarImage
        ? `<button class="account-portrait" type="button"${cardDataAttr(avatarCard)} aria-label="Open ${escapeAttr(avatarName)} card" data-player-concept="card" data-analytics-event="card.open"><img src="${escapeAttr(avatarImage)}" alt="" /></button>`
        : "";
      const identity = `<div class="account-identity${portrait ? "" : " no-portrait"}">${portrait}<div class="account-identity-copy"><span class="account-identity-name">${escapeHtml(avatarName)}</span>${avatarTitle ? `<span class="account-identity-title">${escapeHtml(avatarTitle)}</span>` : ""}${avatarBlurb ? `<span class="account-identity-blurb">${escapeHtml(avatarBlurb)}</span>` : ""}</div></div>`;
      const purpose = String(state?.calling?.statement || "").trim() || "still choosing what trouble to get into";
      const memoriesReady = Number(ledger.unbanked_count || 0);
      const growthReady = Number(ledger.advancement_points || 0);
      const growthSummary = [
        memoriesReady ? "something you noticed is ready to keep" : "",
        growthReady ? "you can strengthen a friendship or open bracelet space" : "",
      ].filter(Boolean).join(" · ") || "your first little moment is waiting";
      const composedIdentity = state?.character_identity || null;
      const identityCards = composedIdentity
        ? [
            composedIdentity.species_label,
            composedIdentity.origin_label,
            composedIdentity.class_label
              || (composedIdentity.class_selection_ready ? "Class ready to choose" : "Class veiled"),
          ].filter(Boolean).join(" · ")
        : "";
      const practice = avatar?.practice || null;
      const practiceSummary = practice?.primary
        ? [practice.epithet, practice.known_for].filter(Boolean).join(" — ")
        : "still emerging from shared deeds";
      const level = Number(composedIdentity?.level ?? avatar?.stats?.level ?? 1);
      const rows = [
        accountRow("level", composedIdentity && !composedIdentity.class_id
          ? `${level} · classless`
          : String(level)),
        ...(identityCards ? [accountRow("campaign identity", identityCards)] : []),
        accountRow("purpose", purpose),
        accountRow("known for", practiceSummary),
        accountRow("journal", growthSummary),
      ];
      const equippedCharms = Array.isArray(state?.deck?.equipped_charms) ? state.deck.equipped_charms : [];
      rows.push(accountRow("worn skill charms", equippedCharms.length ? equippedCharms.map((charm) => {
        const skill = abilityLabel(charm.skill_id, charm.skill_id || "skill");
        const bonus = Math.max(0, Number(charm.skill_bonus || 0));
        return `${charm.name} — ${skill}${bonus ? ` +${bonus}` : ""}`;
      }).join(", ") : "find a skill charm, then wear it from Pack"));
      const bonds = Array.isArray(state?.bonds) ? state.bonds : [];
      rows.push(accountRow("relationships", bonds.length ? bonds.map((bond) => {
        const name = String(bond.target_actor_name || "someone").trim();
        const statement = String(bond.statement || "").trim();
        const closeness = bond.status === "forming"
          ? "forming acquaintance"
          : (Number(bond.strength || 0) >= 3 ? "close friend" : (Number(bond.strength || 0) >= 2 ? "getting closer" : "new friend"));
        return `${name} — ${statement || closeness}${statement ? ` (${closeness})` : ""}`;
      }).join(" · ") : "someone new is waiting to meet you"));
      const marks = Array.isArray(ledger.unbanked_marks) ? ledger.unbanked_marks : [];
      const markList = marks.length
        ? `<div class="account-list">${marks.slice(0, 4).map((mark) => `<div class="account-list-item">${escapeHtml(mark.label || mark.category || "A remembered moment")}</div>`).join("")}</div>`
        : "";
      return `${identity}<div class="account-section">${rows.join("")}${markList}</div>`;
    }

    function accountRow(key, value) {
      const empty = [
        "your first little moment is waiting",
        "found skill charms will appear here",
        "someone new is waiting to meet you",
      ].includes(value);
      return `<div class="account-row"><span class="account-key">${escapeHtml(key)}</span><span class="account-value${empty ? " account-empty" : ""}">${escapeHtml(value)}</span></div>`;
    }

    const DEWBRIGHT_BUTTON_ITEM_ID = 2002;
    const RAIN_SOFT_GARDEN_LOCATION_ID = 2;

    function looseItemAtLocation(view, itemId, locationId) {
      return (view?.items || []).some((item) => (
        Number(item?.id || 0) === Number(itemId || 0)
        && Number(item?.location_id || 0) === Number(locationId || 0)
        && Number(item?.holder_actor_id || 0) === 0
      ));
    }

    function gardenHasDewbright(view = state) {
      return looseItemAtLocation(view, DEWBRIGHT_BUTTON_ITEM_ID, RAIN_SOFT_GARDEN_LOCATION_ID);
    }

    function gardenOpeningBeat(view = state) {
      if (gardenHasDewbright(view)) {
        return "Rain beads on the garden leaves. A small pearled button catches the light.";
      }
      return "Rain beads on the garden leaves. The grass shows where something pearled was lifted away.";
    }

    function gardenCopy(view = state) {
      if (gardenHasDewbright(view)) {
        return "Rain beads on broad leaves. Something small and pearled waits in the grass.";
      }
      return "Rain beads on broad leaves. A round patch in the grass shows where the pearled button was found.";
    }

    function localWorldConditionBeat(view) {
      const simulation = view?.location?.simulation;
      if (!simulation || Number(simulation.last_pulse_tick || 0) <= 0) return "";
      const pieces = [];
      const weather = String(simulation.weather || "").trim();
      if (weather && weather !== "settled") {
        pieces.push(`Beyond the nearest shelter, ${weather} holds.`);
      }
      const conflict = Number(simulation.conflict_pressure || 0);
      const tradePressure = Number(simulation.trade_pressure || 0);
      if (conflict >= 3) pieces.push("Old arguments here are close to becoming open trouble.");
      else if (conflict > 0) pieces.push("A little unease travels between the usual voices.");
      if (tradePressure >= 4) pieces.push("Shelves and supply baskets are running thin.");
      else if (tradePressure >= 2) pieces.push("The routes that supply this place feel strained.");
      else {
        const imports = Object.entries(simulation.imports || {})
          .filter(([, amount]) => Number(amount || 0) > 0)
          .sort((left, right) => Number(right[1] || 0) - Number(left[1] || 0));
        if (imports.length) pieces.push(`${imports[0][0]} from elsewhere has begun to appear here.`);
      }
      const faction = (simulation.faction_influence || [])
        .filter((entry) => Number(entry.influence || 0) > 0)
        .sort((left, right) => Number(right.influence || 0) - Number(left.influence || 0))[0];
      if (faction) pieces.push(`Signs of ${faction.faction_name || faction.faction_id} have appeared nearby.`);
      return pieces.slice(0, 2).join(" ");
    }

    function openingBeat(view) {
      const locationId = view?.location?.id;
      let beat = "";
      if (locationId === 1) {
        const names = new Set((view.actors || []).map((actor) => actor.name));
        const pieces = ["Firelight warms The Cosy Cottage; rain taps the windows and the low doorway waits."];
        if (names.has("Rati")) pieces.push("Rati knits a blue scarf near the hearth.");
        else pieces.push("Rati's blue scarf basket marks the chair where she often sits.");
        if (names.has("Gust")) pieces.push("Gust heckles the weather in bright little symbols.");
        if (names.has("Skull")) pieces.push("Skull watches the door like it owes him money.");
        beat = pieces.join(" ");
      } else if (locationId === 2) beat = gardenOpeningBeat(view);
      else if (locationId === 3) beat = "Moonlight silvers the trail. The air here is sharper, and choices carry farther.";
      else if (locationId === 10) beat = "Science Class hums with shared observations, bright benches, and questions waiting to be tested.";
      else if (locationId === 11) beat = "Homeroom waits with front-door morning light and the sense that every question gets a seat.";
      else if (locationId === 12) beat = "Library quiet gathers around the shelves; if it matters, someone wrote it down.";
      else if (locationId === 13) beat = "Cafeteria tables hold the soft thunder of commons diplomacy.";
      else if (locationId === 14) beat = "Greenhouse glass glows with patient leaves and experiments that grow slowly.";
      else if (locationId === 15) beat = "Courtyard paths cross under open sky; every hallway seems to lead back here.";
      else beat = copyForLocation(locationId, view);
      return [beat, localWorldConditionBeat(view)].filter(Boolean).join(" ");
    }

    function timelineEventHtml(event) {
      if (event.type === "message.created") return messageHtml(event);
      if (event.type === "image.created") return residentImageHtml(event);
      if (event.type === "model_interaction.output") return modelInteractionOutputHtml(event);
      if (["avatar.thought", "avatar.dream"].includes(event.type)) return avatarReflectionHtml(event);
      if (isRollEvent(event)) return rollHtml(event);
      return sceneCardEventHtml(event);
    }

    function sceneCardEventHtml(event) {
      const meta = statusUpdateMeta(event);
      const text = sceneCardEventText(event);
      if (!text) return "";
      const exposureId = worldBeatExposureId(event);
      const exposureAttrs = exposureId
        ? ` data-world-beat-exposure="${escapeAttr(exposureId)}" data-world-beat-seq="${Number(event.seq)}"`
        : "";
      return `<div class="line event scene-card ${escapeAttr(meta.kind)}" data-event-row${exposureAttrs} aria-label="${escapeAttr(`Story beat. ${text}`)}"><span class="event-label" aria-hidden="true">✦</span><span class="text">${escapeHtml(text)}</span></div>`;
    }

    function worldBeatAuthoredProse(event) {
      const raw = String(event?.content || "").trim();
      if (!raw) return "";
      let candidate = raw;
      if (raw.startsWith("{")) {
        try {
          const parsed = JSON.parse(raw);
          candidate = typeof parsed?.summary === "string" ? parsed.summary : "";
        } catch (_error) {
          candidate = "";
        }
      }
      candidate = cleanStatusText(candidate);
      const normalized = candidate.replace(/[.!?…]+$/g, "");
      const internalIdentifier = /^world(?:\s*\.\s*[a-z0-9_]+)+$/i.test(normalized);
      if (!candidate || internalIdentifier || normalized.toLowerCase() === String(event?.type || "").toLowerCase()) {
        return "";
      }
      return finishSentence(candidate);
    }

    function factionInfluenceBeatText(event) {
      const authored = worldBeatAuthoredProse(event);
      if (authored) return authored;
      const from = event?.location_name || "this place";
      const destination = event?.destination_location_name || "a nearby place";
      return `Influence shifted from ${from} toward ${destination}.`;
    }

    function sceneCardEventText(event) {
      const actor = String(event?.actor_name || "Someone").trim() || "Someone";
      const type = String(event?.type || "");
      const storyReceipt = semanticStoryReceipt(event);
      if (storyReceipt) return cleanStatusText(storyReceipt.text);
      if (type === "actor.created") {
        const title = actorTitleForEvent(event);
        return `${event.location_name || "The room"} makes room for ${actor}${title ? `, ${title}` : ""}.`;
      }
      if (type === "actor.moved") {
        return `The way opens, and ${actor} steps into ${event.destination_location_name || "somewhere new"}.`;
      }
      if (type === "chat.failed") {
        return "The conversation slipped away before it could begin. Try talking again.";
      }
      if (type === "model_interaction.failed") {
        return modelInteractionPresentation(event.clientModelInteractionProfile).failure;
      }
      if (type === "dialogue.unavailable") {
        return "Reply unavailable: the resident's promised reply could not run. The authored relationship beat still stands, and no substitute reply was created.";
      }
      if (type === "relationship.beat" || type === "relationship.advanced") {
        return finishSentence(cleanStatusText(event.content || "The relationship changes through a visible deed"));
      }
      if (type === "first_tale.public_trace") {
        const trace = cleanStatusText(event.content || "left the next visitor a clearer way");
        return finishSentence(`${actor} ${lowerInitial(trace)}`);
      }
      if (type === "world.weather.shifted") {
        return worldBeatAuthoredProse(event) || "The weather changes its mind.";
      }
      if (type === "world.weather.held") {
        return worldBeatAuthoredProse(event) || "The weather settles in and stays.";
      }
      if (type === "world.trade.flowed") {
        return "Supplies at the far end of the road have changed.";
      }
      if (type === "world.trade.disrupted") {
        return "A distant place is running short, and someone could answer the need.";
      }
      if (type === "world.delivery.needed") {
        return worldBeatAuthoredProse(event) || "A distant place needs a physical delivery.";
      }
      if (type === "world.logistics.completed") {
        const clock = logEvents.find((candidate) => (
          candidate.type === "clock.updated"
          && Number(candidate.caused_by_event_seq || 0) === Number(event.caused_by_event_seq || 0)
        ));
        const progress = Number(clock?.clock_segments || 0) > 0
          ? ` The need is answered (${Number(clock.clock_filled || 0)}/${Number(clock.clock_segments || 0)}), and the contribution is remembered here.`
          : "";
        const prose = worldBeatAuthoredProse(event)
          || "A traveler completes a physical delivery.";
        return `${prose}${progress}`;
      }
      if (type === "world.faction.influence_shifted") {
        return factionInfluenceBeatText(event);
      }
      if (type === "world.conflict.pressure_grew") {
        return worldBeatAuthoredProse(event) || "An unanswered strain draws the air taut.";
      }
      if (type === "world.conflict.pressure_eased") {
        return worldBeatAuthoredProse(event) || "Whatever pressed here loosens, for now.";
      }
      if (type === "world.conflict.escalated") {
        return worldBeatAuthoredProse(event) || "Old strains meet, and the air hardens.";
      }
      if (type.startsWith("journey.") || type === "pathway.discovered" || type === "pathway.familiarized") {
        return finishSentence(cleanStatusText(event.content || "The path changes beneath careful feet"));
      }
      if (type === "feature.searched" || type === "location.searched") {
        return searchStoryBeat(event, event.narrative_outcome);
      }
      if (type === "exit.discovered") {
        return `A path to ${event.destination_location_name || "somewhere new"} reveals itself beneath ${possessive(actor)} careful look.`;
      }
      if (type === "avatar.discovered") {
        return `${event.target_actor_name || "Someone new"} steps into view, just as ${actor} looks up.`;
      }
      if (type === "item.found") {
        return `${event.item_name || "Something small"} turns up where ${event.location_name || "the room"} had been keeping it.`;
      }
      if (type === "item.picked_up") {
        return `${actor} tucks ${event.item_name || "the little find"} safely away.`;
      }
      if (type === "item.dropped") {
        return `${actor} leaves ${event.item_name || "the item"} where the room can find it again.`;
      }
      if (type === "item.used") {
        const target = event.target_actor_name || "";
        const steadier = Number(event.damage || 0) < 0 && target ? ` ${target} looks steadier for it.` : "";
        return `${event.item_name || "The item"} finds its moment in ${possessive(actor)} hands.${steadier}`;
      }
      if (type === "item.given") {
        const returned = event.target_item_name
          ? ` ${event.target_actor_name || "Their friend"} sends ${event.target_item_name} back in return.`
          : "";
        return `${event.item_name || "An item"} passes from ${actor} to ${event.target_actor_name || "a friend"}.${returned}`;
      }
      if (type === "item.traded") {
        return `${actor} and ${event.target_actor_name || "a friend"} swap ${event.item_name || "one item"} for ${event.target_item_name || "another"}; both leave with something meant for them.`;
      }
      if (type === "skill.stepped") {
        const skill = abilityLabel(String(event.content || "").split(":")[0], "an ability");
        return `${actor} practices ${skill}. Its checks now come a little more easily.`;
      }
      if (type === "job.contribution.resolved") {
        const trace = jobContributionTrace(event);
        if (!trace) return `${actor} finds a way to move the shared work forward.`;
        const steps = Number(trace.total_progress || 0);
        const headway = `${steps} ${steps === 1 ? "step" : "steps"} of headway`;
        const outcome = trace.outcome === "failure"
          ? " The attempt falls short, but its groundwork still counts."
          : "";
        return `${actor} tries to ${lowerInitial(trace.strategy_label || "help")} at ${trace.target?.label || "the shared task"}, making ${headway}.${outcome}`;
      }
      if (type === "clock.updated") {
        return `The shared work shifts beneath ${possessive(actor)} hands; ${withoutFinalPeriod(eventText(event))}.`;
      }
      if (type === "clock.threshold") {
        return finishSentence(cleanStatusText(event.content || "The shared work reaches a turning point"));
      }
      if (type === "job.updated") {
        return `Under ${possessive(actor)} hands, ${withoutFinalPeriod(jobEventLabel(event))}.`;
      }
      if (type === "ledger.banked") {
        return `${actor} carries this visit forward; the next choice feels a little different.`;
      }
      if (type === "calling.revised") {
        return `${actor} finds a truer answer to what draws them in: ${withoutFinalPeriod(callingEventLabel(event))}.`;
      }
      if (type === "bond.created") {
        if (String(event.content || "").includes(":forming:")) {
          return `A cautious connection begins forming between ${actor} and ${event.target_actor_name || "someone new"}; friendship has not been claimed.`;
        }
        return `Somewhere between ${actor} and ${event.target_actor_name || "someone new"}, a friendship begins.`;
      }
      if (type === "bond.revised") {
        return `What ${event.target_actor_name || "their friend"} means to ${actor} shifts, quietly but for good.`;
      }
      if (type === "bond.resolved") {
        return `What mattered between ${actor} and ${event.target_actor_name || "their friend"} stays with them.`;
      }
      if (type === "combat.encounter.started") {
        const target = event.target_actor_name || "the danger";
        return `The room draws close as ${actor} faces ${target}.`;
      }
      if (type === "combat.attack.hit") {
        const target = event.target_actor_name || "their opponent";
        const method = event.combat_method || event.item_name || "The strike";
        const damage = Math.max(0, Number(event.damage || 0));
        const harm = damage > 0 ? ` for ${damage} harm` : "";
        return `${method} breaks through ${possessive(target)} guard${harm}.`;
      }
      if (type === "combat.attack.miss") {
        const target = event.target_actor_name || "their opponent";
        const method = event.combat_method || event.item_name || "the strike";
        return `${target} turns aside ${possessive(actor)} ${method}.`;
      }
      if (type === "combat.defend") {
        return `${actor} plants their feet and waits for the opening.`;
      }
      if (type === "combat.dodge") {
        return `${actor} shifts their weight, ready to slip clear of the next attack.`;
      }
      if (type === "combat.pass") {
        return `${actor} passes the ordered combat floor without taking another action.`;
      }
      if (type === "combat.need_time") {
        return `${actor} asks for more time; the turn stays with them and nothing is skipped.`;
      }
      if (type === "combat.knockout") {
        return `The clash goes quiet around ${event.target_actor_name || "their opponent"}; their light can rest for now.`;
      }
      if (type === "combat.flee.success") {
        return `${actor} finds the path to ${event.destination_location_name || "safety"} and takes it, carrying the trail's silver hush.`;
      }
      if (type === "combat.encounter.resolved") {
        return "The clash is over; the shared room settles around everyone again.";
      }
      if (type === "magic.spell_cast") {
        const method = event.item_name || "A spell";
        const target = event.target_actor_name ? ` toward ${event.target_actor_name}` : "";
        return `${actor} sends ${method}${target}; its authored effect takes hold.`;
      }
      if (type === "tag.applied" && event.tag_label === "prepared") {
        return `${actor} takes one quiet moment to get ready.`;
      }
      if (type === "tag.cleared" && event.tag_label === "tired") {
        return `A little rest returns the light to ${possessive(actor)} step.`;
      }
      const text = cleanStatusText(eventText(event));
      if (!text) return "";
      if (text.toLowerCase().startsWith(actor.toLowerCase())) return finishSentence(text);
      return finishSentence(`${actor} ${text}`);
    }

    function searchStoryBeat(event, outcome) {
      const actor = String(event?.actor_name || "Someone").trim() || "Someone";
      let opening = "";
      if (event.type === "location.searched") {
        opening = `${actor} lets their attention wander through ${event.location_name || "the room"}.`;
      } else {
        const parts = String(event.content || "").split(":");
        const feature = String(parts.shift() || "one quiet corner").trim();
        if (parts.length > 1) parts.pop();
        const observation = cleanStatusText(parts.join(":").trim());
        opening = `${actor} lingers over ${feature}.${observation ? ` ${finishSentence(observation)}` : ""}`;
      }
      const discovery = discoveryStoryBeat(outcome);
      return `${opening}${discovery ? ` ${discovery}` : ""}`.trim();
    }

    function discoveryStoryBeat(event) {
      if (!event) return "";
      if (event.type === "item.found") {
        return `There it is: ${event.item_name || "something small"}, tucked where the room had kept it.`;
      }
      if (event.type === "exit.discovered") {
        return `A path to ${event.destination_location_name || "somewhere new"} reveals itself.`;
      }
      if (event.type === "avatar.discovered") {
        return `${event.target_actor_name || "Someone new"} steps into view.`;
      }
      return "";
    }

    function messageHtml(event) {
      const speaker = event.actor_name || "CosyWorld";
      const body = eventText(event);
      const kind = event.actor_id === actorId ? "you" : event.actor_id ? "avatar" : "world";
      const repeat = Math.max(1, Number(event.repeat_count || 1));
      const baseAriaLabel = eventAriaLabel(event, speaker, body);
      const label = repeat > 1
        ? `${baseAriaLabel || `${speaker}: ${body}`} Repeated ${repeat} times.`
        : baseAriaLabel;
      const attrs = label ? ` aria-label="${escapeAttr(label)}"` : "";
      const repeatHtml = repeat > 1
        ? `<span class="chat-repeat" aria-label="Repeated ${repeat} times">×${repeat}</span>`
        : "";
      return `<div class="line chat ${kind}"${attrs}>${chatPfpHtml(event, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><div class="text chat-markdown">${markdownHtml(body)}${repeatHtml}</div></div>`;
    }

    function avatarReflectionHtml(event) {
      const speaker = event.actor_name || "Someone";
      const body = event.content || "";
      const reflectionKind = event.type === "avatar.dream" ? "dream" : "thought";
      const actorKind = Number(event.actor_id || 0) === Number(actorId || 0) ? "you" : "avatar";
      const label = `${speaker} ${reflectionKind === "dream" ? "dreams" : "thinks"}: ${body}`;
      return `<div class="line chat reflection ${reflectionKind} ${actorKind}" aria-label="${escapeAttr(label)}">${chatPfpHtml(event, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><span class="text">${escapeHtml(body)}</span></div>`;
    }

    function residentImageMetadata(event) {
      if (event?.type !== "image.created") return null;
      let value;
      try {
        value = JSON.parse(String(event.content || ""));
      } catch {
        return null;
      }
      return residentImageValueMetadata(value, event);
    }

    function residentImageValueMetadata(value, event = {}) {
      if (!value || Number(value.schema_version) !== 1) return null;
      const assetId = String(value.asset_id || "");
      const url = String(value.url || "");
      const mimeType = String(value.mime_type || "");
      const expectedUrl = `/assets/generated/resident-images/${assetId}.image`;
      if (!/^[a-f0-9]{64}$/.test(assetId) || url !== expectedUrl) return null;
      if (!["image/png", "image/jpeg", "image/webp", "image/gif"].includes(mimeType)) return null;
      const width = Number(value.width || 0);
      const height = Number(value.height || 0);
      if (!Number.isInteger(width) || !Number.isInteger(height)
        || width < 1 || height < 1 || width > 4096 || height > 4096
        || width * height > 16777216) return null;
      const alt = cleanStatusText(value.alt)
        || `${event.actor_name || "A resident"} shares a visual reply.`;
      return { assetId, url, mimeType, width, height, alt };
    }

    function residentImageHtml(event) {
      const speaker = event.actor_name || "CosyWorld";
      const meta = residentImageMetadata(event);
      if (!meta) {
        return `<div class="line event scene-card warning" data-event-row><span class="event-label" aria-hidden="true">✦</span><span class="text">A visual reply could not be displayed.</span></div>`;
      }
      const kind = event.actor_id === actorId ? "you" : event.actor_id ? "avatar" : "world";
      const aria = `${speaker}: ${meta.alt}`;
      return `<div class="line chat image-reply ${kind}" aria-label="${escapeAttr(aria)}">${chatPfpHtml(event, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><span class="text"><img class="resident-reply-image" src="${escapeAttr(meta.url)}" alt="${escapeAttr(meta.alt)}" width="${meta.width}" height="${meta.height}" loading="lazy" decoding="async"><span class="resident-image-alt" aria-hidden="true">${escapeHtml(meta.alt)}</span></span></div>`;
    }

    function modelInteractionContainsForbiddenPayload(value) {
      if (!value || typeof value !== "object") return false;
      if (Array.isArray(value)) return value.some(modelInteractionContainsForbiddenPayload);
      return Object.entries(value).some(([key, child]) => (
        ["prompt", "vector", "embedding", "embeddings"].includes(String(key).toLowerCase())
        || modelInteractionContainsForbiddenPayload(child)
      ));
    }

    function modelInteractionMediaMetadata(part, mediaKind) {
      const assetId = String(part?.asset_id || "");
      const digest = String(part?.digest || "");
      const url = String(part?.url || "");
      const mimeType = String(part?.mime_type || "");
      if (!/^[a-f0-9]{64}$/.test(assetId) || !/^[a-f0-9]{64}$/.test(digest)) return null;
      const description = typeof part?.description === "string"
        ? cleanStatusText(part.description)
        : "";
      if (!description || description.length > 280) return null;
      if (mediaKind === "audio") {
        const expectedUrl = `/assets/generated/model-audio/${digest}.mp3`;
        if (assetId !== digest || mimeType !== "audio/mpeg" || url !== expectedUrl) return null;
        const hasDuration = part.duration_ms !== undefined && part.duration_ms !== null;
        const durationMs = hasDuration ? part.duration_ms : null;
        if (hasDuration && (typeof durationMs !== "number"
            || !Number.isInteger(durationMs) || durationMs < 1 || durationMs > 600000)) return null;
        const transcript = typeof part.transcript === "string"
          ? cleanStatusText(part.transcript)
          : "";
        if (transcript.length > 280) return null;
        return { modality: "audio", assetId, digest, url, mimeType, durationMs, description, transcript };
      }
      if (!url.startsWith("/assets/generated/") || url.includes("..")) return null;
      if (!["video/mp4", "video/webm"].includes(mimeType)) return null;
      const durationMs = Number(part.duration_ms || 0);
      if (!Number.isInteger(durationMs) || durationMs < 1 || durationMs > 600000) return null;
      const width = Number(part.width || 0);
      const height = Number(part.height || 0);
      if (!Number.isInteger(width) || !Number.isInteger(height)
          || width < 1 || height < 1 || width > 4096 || height > 4096) return null;
      return { modality: "video", assetId, digest, url, mimeType, durationMs, description, width, height };
    }

    function modelInteractionPartMetadata(part, event) {
      const modality = String(part?.modality || "");
      if (modality === "text") {
        const text = cleanStatusText(part.text);
        return text && text.length <= 8000 ? { modality, text } : null;
      }
      if (modality === "image") {
        const image = residentImageValueMetadata(part.image, event);
        return image ? { modality, image } : null;
      }
      if (modality === "audio" || modality === "video") {
        return modelInteractionMediaMetadata(part, modality);
      }
      if (modality === "semantic_match") {
        const source = String(part.source || "");
        const scoreBand = String(part.score_band || "");
        const label = cleanStatusText(part.label);
        const relation = cleanStatusText(part.relation);
        if (!["embeddings", "rerank"].includes(source)
            || !["low", "moderate", "high"].includes(scoreBand)
            || !label || !relation) return null;
        return {
          modality,
          source,
          scoreBand,
          entityKind: String(part.entity_kind || ""),
          entityId: String(part.entity_id || ""),
          label,
          relation,
        };
      }
      return null;
    }

    function modelInteractionPartsMatchProfile(profile, parts) {
      if (profile === "image") {
        return parts.length === 1 && parts[0].modality === "image";
      }
      if (profile === "speech") {
        return parts.length === 1
          && parts[0].modality === "audio"
          && Boolean(parts[0].transcript);
      }
      if (profile === "embeddings" || profile === "rerank") {
        return parts.length >= 1 && parts.length <= 3 && parts.every((part) => (
          part.modality === "semantic_match" && part.source === profile
        ));
      }
      return false;
    }

    function modelInteractionMetadata(event) {
      if (event?.type !== "model_interaction.output") return null;
      let value;
      try {
        value = JSON.parse(String(event.content || ""));
      } catch {
        return null;
      }
      if (!value || Number(value.schema_version) !== 1
          || modelInteractionContainsForbiddenPayload(value)) return null;
      const interactionId = String(value.interaction_id || "");
      const contextHash = String(value.context_hash || "");
      const profile = String(value.profile || "");
      const summary = cleanStatusText(value.summary);
      const promptVersion = String(value.prompt_version || "");
      const parts = Array.isArray(value.output_parts)
        ? value.output_parts.map((part) => modelInteractionPartMetadata(part, event))
        : [];
      if (!/^[a-f0-9]{64}$/.test(interactionId)
          || !/^[a-f0-9]{64}$/.test(contextHash)
          || !["image", "embeddings", "rerank", "speech"].includes(profile)
          || !summary || summary.length > 280 || !promptVersion
          || !parts.length || parts.length > 8 || parts.some((part) => !part)
          || !modelInteractionPartsMatchProfile(profile, parts)) return null;
      return { interactionId, contextHash, profile, summary, parts };
    }

    function modelInteractionPartHtml(part) {
      if (part.modality === "text") {
        return `<span class="model-output-text">${escapeHtml(part.text)}</span>`;
      }
      if (part.modality === "image") {
        const image = part.image;
        return `<span class="model-output-image"><img class="resident-reply-image" src="${escapeAttr(image.url)}" alt="${escapeAttr(image.alt)}" width="${image.width}" height="${image.height}" loading="lazy" decoding="async"><span class="resident-image-alt" aria-hidden="true">${escapeHtml(image.alt)}</span></span>`;
      }
      if (part.modality === "audio") {
        const transcript = part.transcript
          ? `<span class="model-output-transcript">${escapeHtml(part.transcript)}</span>`
          : "";
        return `<span class="model-output-media"><audio controls preload="metadata" aria-label="${escapeAttr(part.description)}"><source src="${escapeAttr(part.url)}" type="${escapeAttr(part.mimeType)}"></audio><span class="resident-image-alt">${escapeHtml(part.description)}</span>${transcript}</span>`;
      }
      if (part.modality === "video") {
        return `<span class="model-output-media"><video controls preload="metadata" width="${part.width}" height="${part.height}" aria-label="${escapeAttr(part.description)}"><source src="${escapeAttr(part.url)}" type="${escapeAttr(part.mimeType)}"></video><span class="resident-image-alt">${escapeHtml(part.description)}</span></span>`;
      }
      const sourceLabel = part.source === "rerank" ? "ranked echo" : "resonance";
      return `<span class="model-output-semantic"><strong>${escapeHtml(part.label)}</strong><span>${escapeHtml(part.relation)}</span><small>${escapeHtml(sourceLabel)} · ${escapeHtml(part.scoreBand)} match</small></span>`;
    }

    function modelInteractionOutputHtml(event) {
      const speaker = event.actor_name || "A resident";
      const meta = modelInteractionMetadata(event);
      if (!meta) {
        return `<div class="line event scene-card warning" data-event-row><span class="event-label" aria-hidden="true">✦</span><span class="text">A model result could not be displayed safely.</span></div>`;
      }
      const kind = event.actor_id === actorId ? "you" : event.actor_id ? "avatar" : "world";
      const presentation = modelInteractionPresentation(meta.profile);
      const resultSummary = meta.profile === "image"
        ? ""
        : `<span class="model-output-summary"><strong>${escapeHtml(presentation.resultLabel)}</strong><span>${escapeHtml(meta.summary)}</span></span>`;
      const aria = `${speaker}, ${presentation.resultLabel}: ${meta.summary}`;
      return `<div class="line model-output ${kind}" data-interaction-profile="${escapeAttr(meta.profile)}" aria-label="${escapeAttr(aria)}">${chatPfpHtml(event, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><span class="text">${resultSummary}${meta.parts.map(modelInteractionPartHtml).join("")}</span></div>`;
    }

    function chatPfpHtml(event, speaker) {
      const card = event.actor_id ? cardForActor(event.actor_id) : null;
      const fallback = card || {
        display_name: speaker || "CosyWorld avatar",
        role: "avatar",
        aspect: "tall",
      };
      const image = event.actor_id ? (cardImage(card) || fallbackCardImage(fallback)) : "";
      const label = initials(speaker || card?.display_name || "CosyWorld");
      const dataAttr = card ? cardDataAttr(card) : "";
      const style = backgroundImageStyle(image);
      return `<span class="chat-pfp"${dataAttr}${style} aria-hidden="true">${image ? "" : escapeHtml(label)}</span>`;
    }

    function statusEventHtml(event) {
      const meta = statusUpdateMeta(event);
      if (!meta.text) return "";
      const label = String(meta.label || "event").trim() || "event";
      const text = cleanStatusText(meta.text);
      const aria = `${label}: ${text}`;
      return `<div class="line event ${escapeAttr(meta.kind)}" data-event-row aria-label="${escapeAttr(aria)}"><span class="event-label">${escapeHtml(label)}</span><span class="text">${escapeHtml(text)}</span></div>`;
    }

    function isRollEvent(event) {
      return event.type === "ability_check.rolled" || event.type === "combat.attack.attempt";
    }

    function rollHtml(event) {
      const meta = rollMeta(event);
      const outcome = event.success ? "success" : "failure";
      const detail = meta.detail ? `<span class="roll-detail">${escapeHtml(meta.detail)}</span>` : "";
      const aria = `${meta.title}. ${meta.detail} ${meta.result}.`;
      return `<div class="roll-line" aria-label="${escapeAttr(aria)}"><span class="roll-label" aria-hidden="true">✦</span><div class="roll-card ${outcome}"><span class="roll-symbol" aria-hidden="true">${escapeHtml(meta.symbol)}</span><span class="roll-copy"><span class="roll-title">${escapeHtml(meta.title)}</span>${detail}</span><span class="roll-result">${escapeHtml(meta.result)}</span></div></div>`;
    }

    function rollMeta(event) {
      const success = event.success === true;
      if (event.type === "combat.attack.attempt") {
        const actor = event.actor_name || "Someone";
        const target = event.target_actor_name || "their opponent";
        const method = event.combat_method || event.item_name || "Unarmed strike";
        const mechanics = combatAttackMechanics(event);
        return success
          ? {
              label: "clash",
              symbol: "✦",
              title: `${actor} finds an opening`,
              detail: `${method} · ${mechanics}. ${target} is caught off guard.`,
              result: "it lands",
              story: `${actor} finds an opening against ${target} with ${method}. ${mechanics}.`,
            }
          : {
              label: "clash",
              symbol: "·",
              title: `${target} slips clear`,
              detail: `${method} · ${mechanics}. ${actor}'s swing meets empty air.`,
              result: "not this time",
              story: `${target} slips clear of ${actor}'s ${method}. ${mechanics}.`,
            };
      }
      if (event.content === "notice") {
        const actor = event.actor_name || "Someone";
        const target = event.target_actor_name || "the other avatar";
        const mechanics = abilityCheckMechanics(event);
        return success
          ? {
              label: "notice",
              symbol: "✦",
              title: `${actor} reads ${target}`,
              detail: `What they carry and seek is now known. ${mechanics}.`,
              result: "noticed",
              story: `${actor} notices what ${target} carries and seeks. ${mechanics}.`,
            }
          : {
              label: "notice",
              symbol: "~",
              title: `${target} stays hard to read`,
              detail: `${actor} learns nothing certain yet. ${mechanics}.`,
              result: "unclear",
              story: `${target} remains hard to read. ${mechanics}.`,
            };
      }
      const hint = listenHintForLocation(event.location_id, success);
      const actor = event.actor_name || "Someone";
      const mechanics = abilityCheckMechanics(event);
      return success
        ? {
            label: "check",
            symbol: "✦",
            title: `${actor} checks carefully; the room answers`,
            detail: `${mechanics}. ${hint}`,
            result: "a clue appears",
            story: `The room answers a careful check. ${mechanics}. ${hint}`,
          }
        : {
            label: "check",
            symbol: "~",
            title: `${actor} checks carefully; the room stays shy`,
            detail: `${mechanics}. ${hint}`,
            result: "try another way",
            story: `A careful check leaves the room's secret tucked away. ${mechanics}.`,
          };
    }

    // One formatter for every d20 the kernel resolves, so an attack and an
    // ordinary check cannot disagree about how chance reads. Attacks say
    // "attack ... vs AC" and let the card's result line carry the outcome;
    // checks say "check ... vs DC" and spell the outcome out. See issue #464.
    function abilityCheckMechanics(event, options = {}) {
      const {
        kind = "check",
        threshold = "DC",
        includeOutcome = true,
        includeClassSource = true,
      } = options;
      const ability = abilityLabel(event?.ability, "Ability");
      const raw = Number(event?.raw_roll);
      const modifier = Number(event?.modifier);
      const total = Number(event?.total);
      const dc = Number(event?.dc);
      const signed = Number.isFinite(modifier) ? `${modifier >= 0 ? "+" : "−"}${Math.abs(modifier)}` : "";
      const roll = [Number.isFinite(raw) ? `d20 ${raw}` : "", signed].filter(Boolean).join(" ");
      const equation = [
        roll,
        Number.isFinite(total) ? `= ${total}` : "",
        Number.isFinite(dc) ? `vs ${threshold} ${dc}` : "",
      ].filter(Boolean).join(" ");
      if (!includeOutcome) {
        return `${ability} ${kind} · ${equation}`;
      }
      const outcome = event?.success === true ? "success" : "failure";
      const choice = includeClassSource ? authoredAbilityChoice(event?.ability) : null;
      const ownedCheck = Number(event?.actor_id || 0) === Number(actorId || 0);
      const skill = choice && ownedCheck
        ? (state?.skills || []).find((candidate) => candidate.skill_id === choice.id)
        : null;
      const identity = state?.character_identity || null;
      const profile = (state?.character_creation || [])
        .find((candidate) => candidate.id === identity?.profile_id);
      const classChoice = (profile?.choices || [])
        .find((candidate) => candidate.id === identity?.class_id);
      const classSource = skill
        && classChoice?.starting_skill_id === skill.skill_id
        ? ` · Class skill: ${skill.label} +${Math.max(0, Number(skill.bonus || 0))} from ${classChoice.label}`
        : "";
      return `${ability} ${kind} · ${equation} · ${outcome}${classSource}`;
    }

    function combatAttackMechanics(event) {
      return abilityCheckMechanics(event, {
        kind: "attack",
        threshold: "AC",
        includeOutcome: false,
        includeClassSource: false,
      });
    }

    function eventAriaLabel(event, speaker, body) {
      if (event.type === "message.created" && event.actor_id === 1002) {
        return `${speaker} speaks in emoji-only weather symbols: ${emojiWords(body)}`;
      }
      return "";
    }

    function emojiWords(value) {
      const names = {
        "🌧️": "rain cloud",
        "🌧": "rain cloud",
        "🫖": "teapot",
        "✨": "sparkles",
        "🧶": "yarn",
        "☁️": "cloud",
        "☁": "cloud",
        "🫧": "bubbles",
        "🌙": "moon",
        "🪡": "needle",
        "🧵": "thread",
        "🚪": "door",
        "👋": "wave",
        "👂": "listening ear",
        "🔎": "magnifying glass",
        "👉": "pointing",
        "🎁": "gift",
        "🏡": "home",
        "🌱": "sprout",
        "💛": "yellow heart",
        "🔁": "try again",
        "💪": "strong arm",
        "🤝": "handshake",
        "🧰": "toolbox",
        "🌤️": "sun behind cloud",
        "🌤": "sun behind cloud",
        "😴": "sleeping face",
        "🛡️": "shield",
        "🛡": "shield",
        "⚡": "lightning",
        "👀": "watching eyes",
        "👍": "thumbs up",
        "💥": "burst",
        "❄️": "snowflake",
        "❄": "snowflake",
        "🌿": "leaf",
      };
      const parts = [];
      const seen = new Set();
      for (const [emoji, label] of Object.entries(names)) {
        if (value.includes(emoji) && !seen.has(label)) {
          seen.add(label);
          parts.push(label);
        }
      }
      return parts.length ? parts.join(", ") : "symbols";
    }

    function eventText(event) {
      const storyReceipt = semanticStoryReceipt(event);
      if (storyReceipt) return storyReceipt.text;
      if (event.type === "command.output") return event.content || "";
      if (event.type === "message.created") return event.content || "";
      if (event.type === "image.created") return residentImageMetadata(event)?.alt || "shares a visual reply.";
      if (event.type === "avatar.thought") return event.content || "thinks for a moment.";
      if (event.type === "avatar.dream") return event.content || "dreams during the long rest.";
      if (worldTranscriptEventTypes.has(String(event.type || ""))) return sceneCardEventText(event);
      if (event.type === "feature.searched" || event.type === "location.searched") return searchEventText(event);
      if (event.type === "exit.discovered") {
        return event.content || `discovers a way to ${event.destination_location_name || "somewhere new"}.`;
      }
      if (event.type === "world.reset") return "the world returns to its first page.";
      if (event.type === "actor.created") return `${event.actor_name || "Someone"} enters ${event.location_name}.`;
      if (event.type === "actor.entered_location") return `arrives in ${event.location_name}.`;
      if (event.type === "actor.moved") {
        const reason = String(event.content || "").trim();
        const base = `moves from ${event.location_name} to ${event.destination_location_name}.`;
        return reason ? `${base} ${reason}` : base;
      }
      if (event.type === "move.blocked") return `cannot reach ${event.destination_location_name}.`;
      if (event.type === "item.picked_up") {
        const reason = String(event.content || "").trim();
        const base = `takes ${event.item_name}.`;
        return reason ? `${base} ${reason}` : base;
      }
      if (event.type === "item.found") {
        return `${event.actor_name || "Someone"} finds ${event.item_name || "something small"}.`;
      }
      if (event.type === "item.dropped") {
        const reason = String(event.content || "").trim();
        const base = `drops ${event.item_name}.`;
        return reason ? `${base} ${reason}` : base;
      }
      if (event.type === "item.used") {
        const target = event.target_actor_name ? ` on ${event.target_actor_name}` : "";
        const recovery = event.damage < 0
          ? ` ${event.target_actor_name || "Someone"} looks steadier.`
          : "";
        const reason = String(event.content || "").trim();
        const base = `uses ${event.item_name}${target}.${recovery}`;
        return reason ? `${base} ${reason}` : base;
      }
      if (event.type === "item.given") {
        const returned = event.target_item_name
          ? ` ${event.target_actor_name} hands ${event.target_item_name} back to make room.`
          : "";
        return `gives ${event.item_name} to ${event.target_actor_name}.${returned}`;
      }
      if (event.type === "item.traded") {
        const reason = String(event.content || "").trim();
        const base = `trades ${event.item_name} with ${event.target_actor_name} for ${event.target_item_name}.`;
        return reason ? `${base} ${reason}` : base;
      }
      if (event.type === "avatar.evolved") return `${event.target_actor_name || "Someone"} finds a new shape.`;
      if (event.type === "branch.opened") return `opens a choice with ${event.target_actor_name}.`;
      if (event.type === "branch.resolved") return `finishes a choice with ${event.target_actor_name}.`;
      if (event.type === "branch.expired") return `lets a choice with ${event.target_actor_name} fade.`;
      if (event.type === "hand.shuffled") return "changes their Story Hand.";
      if (event.type === "hand.thought") return "discards and replaces one Story Hand card.";
      if (event.type === "ability_check.rolled") return abilityCheckEventText(event);
      if (event.type === "study.resolved") {
        return event.content?.includes("yielded")
          ? "studies the signs and understands their meaning."
          : "studies the signs, but their meaning stays unclear.";
      }
      if (event.type === "job.contribution.resolved") return jobContributionEventText(event);
      if (event.type === "clock.updated") {
        const label = event.clock_label || "something in the room";
        const filled = Number.isFinite(Number(event.clock_filled)) ? Number(event.clock_filled) : 0;
        const segments = Number.isFinite(Number(event.clock_segments)) ? Number(event.clock_segments) : 0;
        const delta = Number(event.clock_delta || 0);
        if (segments > 0 && filled >= segments) return `${label} comes due.`;
        if (delta < 0) return `${label} eases back.`;
        return `${label} draws closer.`;
      }
      if (event.type === "clock.threshold") {
        return finishSentence(cleanStatusText(event.content || "the shared work reaches a turning point"));
      }
      if (event.type === "tag.applied") return `is now ${event.tag_label || "changed"}.`;
      if (event.type === "tag.cleared") return `shakes off ${event.tag_label || "what was lingering"}.`;
      if (event.type === "calling.set") return `chooses what draws them in: ${withoutFinalPeriod(callingEventLabel(event))}.`;
      if (event.type === "calling.revised") return `finds a new purpose: ${withoutFinalPeriod(callingEventLabel(event))}.`;
      if (event.type === "ledger.marked") return `keeps a memory: ${ledgerEventLabel(event)}.`;
      if (event.type === "ledger.banked") return `${ledgerBankedEventLabel(event)}.`;
      if (event.type === "advancement.spent") {
        return String(event.content || "").startsWith("charm_slot:")
          ? "uses what they learned to open bracelet space."
          : "puts what they learned into practice.";
      }
      if (event.type === "charm_slot.unlocked") return "opens room for another found skill charm.";
      if (event.type === "skill_charm.equipped") return `wears ${event.item_name || "a skill charm"}.`;
      if (event.type === "skill_charm.unequipped") return `removes ${event.item_name || "a skill charm"}.`;
      if (event.type === "skill.stepped") return `${skillEventLabel(event)}.`;
      if (event.type === "bond.deepened") return `grows closer to ${event.target_actor_name || "someone"}.`;
      if (event.type === "relationship.beat" || event.type === "relationship.advanced") return finishSentence(cleanStatusText(event.content || "the relationship changes"));
      if (event.type === "dialogue.unavailable") return "Resident reply unavailable; no substitute reply was created.";
      if (event.type === "bond.created") {
        return String(event.content || "").includes(":forming:")
          ? `began a forming relationship with ${event.target_actor_name || "someone"}.`
          : `became friends with ${event.target_actor_name || "someone"}.`;
      }
      if (event.type === "bond.revised") return `sees ${event.target_actor_name || "someone"} a little differently.`;
      if (event.type === "bond.resolved") return `keeps what mattered with ${event.target_actor_name || "someone"}.`;
      if (event.type === "job.updated") return `${jobEventLabel(event)}.`;
      if (event.type === "combat.defend") return `raises a careful guard.`;
      if (event.type === "combat.pass") return `passes the ordered combat floor.`;
      if (event.type === "combat.need_time") return `takes more time without losing the turn.`;
      if (event.type === "combat.attack.attempt") return rollMeta(event).story;
      if (event.type === "combat.attack.hit") return `${event.combat_method || event.item_name || "Unarmed strike"} breaks through ${event.target_actor_name}'s guard.`;
      if (event.type === "combat.attack.miss") return `${event.target_actor_name} turns aside ${event.combat_method || event.item_name || "the strike"}.`;
      if (event.type === "combat.knockout") return `${event.combat_method || event.item_name || "The strike"} leaves ${event.target_actor_name}'s light quiet for now.`;
      if (event.type === "combat.flee.success") return `flees to ${event.destination_location_name}, carrying the trail's silver hush.`;
      if (event.type === "encounter.reset") return `${event.target_actor_name || "The frontier"} stirs again in ${event.location_name || "the frontier"}.`;
      if (event.type === "rule.rejected") {
        return String(event.content || "").trim()
          || "That action could not be completed. Refresh the room and try again.";
      }
      return event.type;
    }

    function searchEventText(event) {
      if (event.type === "location.searched") {
        const actor = event.actor_name || "Someone";
        return `${actor} looks closely around ${event.location_name || "the room"}.`;
      }
      const parts = String(event.content || "").split(":");
      const feature = parts.shift() || "a room feature";
      const reason = parts.length > 1 ? parts.pop() : "";
      const observation = parts.join(":").trim();
      const actor = event.actor_name || "Someone";
      if (observation) return `${actor} searches ${feature}: ${observation}`;
      return `${actor} searches ${feature}${reason ? `: ${reason}` : ""}`;
    }

    function callingEventLabel(event) {
      const content = String(event.content || "").trim();
      const reasonIndex = content.lastIndexOf(":");
      return reasonIndex > 0 ? content.slice(0, reasonIndex) : content || "a small truth";
    }

    // The server embeds why a calling was recorded. An arriving avatar is handed
    // a starting statement it never picked, so that case must not be reported as
    // a chosen purpose (#360).
    function callingEventReason(event) {
      const content = String(event.content || "").trim();
      const reasonIndex = content.lastIndexOf(":");
      return reasonIndex > 0 ? content.slice(reasonIndex + 1).trim() : "";
    }

    function ledgerEventLabel(event) {
      const parts = String(event.content || "").split(":");
      return parts[1] || parts[0] || "a moment from this visit";
    }

    function ledgerBankedEventLabel(event) {
      return "lets what happened shape what comes next";
    }

    function advancementEventLabel(event) {
      return "what you learned finds a place";
    }

    function skillEventLabel(event) {
      const parts = String(event.content || "").split(":");
      const skill = parts[0] || "a skill";
      const rank = Math.max(0, Number(parts[1]) || 0);
      if (rank >= 3) return `${skill} feels second nature`;
      if (rank === 2) return `${skill} grows stronger`;
      return `${skill} grows a little stronger`;
    }

    function jobEventLabel(event) {
      const parts = String(event.content || "").split(":");
      const status = parts[1] || "changed";
      if (status === "complete" || status === "completed") return "the work is done";
      if (status === "active") return "the work begins";
      if (status === "failed") return "the work falls quiet for now";
      return "the work changes";
    }

    function lowerInitial(value) {
      const text = String(value || "").trim();
      return text ? `${text.charAt(0).toLowerCase()}${text.slice(1)}` : "";
    }

    function jobContributionTrace(event) {
      try {
        const trace = JSON.parse(String(event?.content || "{}"));
        return trace && typeof trace === "object" && trace.schema_version === 1 ? trace : null;
      } catch (_error) {
        return null;
      }
    }

    function causalJobContributionEvent(event) {
      let cause = Number(event?.caused_by_event_seq || 0);
      const visited = new Set();
      while (cause > 0 && !visited.has(cause)) {
        visited.add(cause);
        const parent = logEvents.find((candidate) => Number(candidate?.seq || 0) === cause);
        if (!parent) return null;
        if (parent.type === "job.contribution.resolved") return parent;
        cause = Number(parent.caused_by_event_seq || 0);
      }
      return null;
    }

    function physicalDeliveryEventFor(event) {
      const cause = Number(event?.caused_by_event_seq || 0);
      if (!cause) return null;
      return logEvents.find((candidate) => (
        candidate.type === "world.logistics.completed"
        && Number(candidate.caused_by_event_seq || 0) === cause
      )) || null;
    }

    function jobContributionDescendants(event) {
      return logEvents.filter((candidate) => {
        const root = causalJobContributionEvent(candidate);
        return root && Number(root.seq || 0) === Number(event?.seq || 0);
      });
    }

    function jobContributionEventText(event) {
      const trace = jobContributionTrace(event);
      if (!trace) return "finds a way to move the shared work forward.";
      const steps = Number(trace.total_progress || 0);
      const headway = `${steps} ${steps === 1 ? "step" : "steps"}`;
      const outcome = trace.outcome === "failure"
        ? " The attempt falls short, but its groundwork still counts."
        : "";
      const descendants = jobContributionDescendants(event);
      const clock = descendants.find((candidate) => (
        candidate.type === "clock.updated"
        && String(candidate.clock_id || "") === String(trace.clock_id || "")
      ));
      const threshold = descendants
        .filter((candidate) => candidate.type === "clock.threshold")
        .sort((left, right) => Number(right.seq || 0) - Number(left.seq || 0))[0];
      const settled = descendants.some((candidate) => candidate.type === "job.updated");
      const question = (state?.shared_questions || []).find((candidate) => (
        String(candidate.progress_clock_id || "") === String(trace.clock_id || "")
      ));
      const filled = Number(clock?.clock_filled ?? question?.filled);
      const segments = Number(clock?.clock_segments ?? question?.segments);
      const progress = Number.isFinite(filled) && Number.isFinite(segments) && segments > 0
        ? ` Progress is ${filled}/${segments}.`
        : "";
      const credit = clock ? " The contribution is remembered here." : "";
      const revelation = cleanStatusText(threshold?.content || "");
      const now = revelation || cleanStatusText(question?.situation || "");
      const changed = now ? ` Now: ${finishSentence(now)}` : "";
      const completion = settled || question?.presentation_state === "completed_memory"
        ? " The shared question is settled."
        : "";
      return `tries to ${lowerInitial(trace.strategy_label || "help")} at ${trace.target?.label || "the shared task"}; the work gains ${headway}.${progress}${credit}${outcome}${changed}${completion}`;
    }

    function naturalFeatureEventText(event) {
      try {
        const evidence = JSON.parse(String(event?.content || "{}"));
        const resource = String(evidence?.feature?.resource_kind || "natural feature")
          .replaceAll("_", " ");
        const buildings = Array.isArray(evidence?.feature?.building_archetypes)
          ? evidence.feature.building_archetypes
              .map((building) => String(building || "").replaceAll("_", " "))
              .filter(Boolean)
          : [];
        const support = buildings.length
          ? ` It can support ${buildings.join(", ")}.`
          : "";
        return cleanStatusText(`reveals ${resource}.${support}`);
      } catch (_error) {
        return "reveals a natural feature and the building forms it can support.";
      }
    }

    function abilityCheckEventText(event) {
      const mechanics = abilityCheckMechanics(event);
      if (event.content === "notice") {
        const target = event.target_actor_name || "the other avatar";
        return event.success
          ? `notices what ${target} carries and seeks. ${mechanics}.`
          : `${target} remains hard to read. ${mechanics}.`;
      }
      if (event.content === "study") {
        return event.success
          ? `studies the signs and understands their meaning. ${mechanics}.`
          : `studies the signs, but their meaning stays unclear. ${mechanics}.`;
      }
      if (event.content === "think") {
        return event.success
          ? `turns inward and catches a thought worth following. ${mechanics}.`
          : `turns inward, but no clear thought settles this time. ${mechanics}.`;
      }
      if (event.content === "dream") {
        return event.success
          ? `rests deeply enough for a dream to take shape. ${mechanics}.`
          : `rests without bringing a dream back. ${mechanics}.`;
      }
      const hint = listenHintForLocation(event.location_id, event.success);
      return `checks carefully: ${hint} ${mechanics}.`;
    }

    function listenHintForLocation(id, success) {
      if (!success) {
        if (id === 3) return "the trail goes quiet, but something out there heard you first.";
        return "the room keeps its secret for now.";
      }
      if (id === 1) {
        return "A round hollow beneath Rati's blue scarf is waiting for its wooden button.";
      }
      if (id === 2) {
        if (gardenHasDewbright(state)) {
          return "A pearled button gleams beneath one rain-heavy leaf.";
        }
        if (looseItemAtLocation(state, 2007, 2)) {
          return "A mute little bell rests where two broad leaves touch.";
        }
        return "Two broad leaves tap a path back toward the cottage.";
      }
      if (id === 3) {
        if (looseItemAtLocation(state, 2003, 3)) {
          return "A small iron pawprint glints at the edge of the practice circle.";
        }
        if (looseItemAtLocation(state, 2006, 3)) {
          return "A warm stone tag rests beside the silver milepost.";
        }
        return "Fresh pawprints leave the practice circle toward the garden.";
      }
      if (id === 10) {
        if (looseItemAtLocation(state, 2004, 10)) {
          return "A strand of Moonwool Thread is snagged beneath the lab bench.";
        }
        return "A folded note beneath the lab bench asks for one careful second look.";
      }
      if (id === 11) return "One empty desk has a folded note tucked beneath its corner.";
      if (id === 12) return "One returned book has left a sentence on the checkout desk.";
      if (id === 13) return "One untouched tray has a tiny trade note tucked beneath it.";
      if (id === 14) return "One curled leaf is waiting to be turned over.";
      if (id === 15) return "One chalk arrow points toward the quietest path.";
      if (freeLocationCopy(id)) return `${freeLocationCopy(id)} A route back to the cottage stays warm.`;
      return "One soft hum points toward the nearest open path.";
    }

    function cardForActor(id) {
      return state?.cards?.actors?.[String(id)] || null;
    }

    function cardForItem(id) {
      return state?.cards?.items?.[String(id)] || null;
    }

    function cardForLocation(id) {
      return state?.cards?.locations?.[String(id)] || null;
    }

    function itemForId(id) {
      return (state?.items || []).find((item) => Number(item.id || 0) === Number(id || 0)) || null;
    }

    function itemNameForId(id) {
      const knownItems = {
        2001: "Hearth Tonic",
        2002: "Dewbright Button",
        2003: "Wolfprint Charm",
        2004: "Moonwool Thread",
        2005: "Story Button",
        2006: "Hearthstone Tag",
        2007: "Watch Bell",
        2008: "Threadbare Map Scrap",
        2009: "Abbey Bookmark",
        2010: "Mossglass Bead",
      };
      return itemForId(id)?.name || knownItems[Number(id)] || "an unknown item";
    }

    function actorForId(id) {
      return (state?.actors || []).find((actor) => Number(actor.id || 0) === Number(id || 0)) || null;
    }

    function actorNameForId(id) {
      const actor = actorForId(id);
      return actor ? actorLabel(actor) : `Avatar ${id}`;
    }

    function cardImage(card) {
      return card?.image_url || "";
    }

    function cardKey(card) {
      const id = card?.card_id || card?.display_name || card?.title || "";
      if (!id) return "";
      return `${card?.role || "card"}:${id}`;
    }

    function cardDataAttr(card) {
      const key = cardKey(card);
      return key ? ` data-card-key="${escapeAttr(key)}"` : "";
    }

    function setCardTarget(node, card) {
      const key = cardKey(card);
      if (!key) {
        node.removeAttribute("data-card-key");
        return;
      }
      node.setAttribute("data-card-key", key);
    }

    function cardByKey(key) {
      for (const group of [state?.cards?.actors, state?.cards?.items, state?.cards?.locations]) {
        if (!group) continue;
        for (const card of Array.isArray(group) ? group : Object.values(group)) {
          if (cardKey(card) === key) return card;
        }
      }
      return null;
    }

    function actorForCard(card) {
      const key = cardKey(card);
      if (!key) return null;
      const actorCards = state?.cards?.actors || {};
      for (const [id, actorCard] of Object.entries(actorCards)) {
        if (cardKey(actorCard) !== key) continue;
        return (state?.actors || []).find((actor) => Number(actor.id || 0) === Number(id || 0)) || null;
      }
      return null;
    }

    function communityArtSubject(card) {
      for (const [kind, group] of [
        ["actor", state?.cards?.actors],
        ["item", state?.cards?.items],
        ["location", state?.cards?.locations],
      ]) {
        if (!group) continue;
        for (const [id, candidate] of Object.entries(group)) {
          if (candidate === card || cardKey(candidate) === cardKey(card)) {
            return { kind, id: Number(id) };
          }
        }
      }
      return null;
    }

    function communityArtSubjectKey(subject) {
      return subject ? `${subject.kind}:${subject.id}` : "";
    }

    function communityArtStateSignature(art) {
      if (!art) return "";
      return JSON.stringify([
        String(art.status || "available"),
        Math.max(0, Number(art.funded_orbs || 0)),
        Math.max(0, Number(art.remaining_orbs || 0)),
        Math.max(0, Number(art.provider_attempts || 0)),
        Boolean(art.retryable_without_orbs),
        String(art.image_url || ""),
      ]);
    }

    function clearCommunityArtClientState(key) {
      const clientState = communityArtClientStates.get(key);
      if (clientState?.timeout) window.clearTimeout(clientState.timeout);
      communityArtClientStates.delete(key);
    }

    function communityArtPanelHtml(card) {
      const art = card?.community_art;
      const subject = communityArtSubject(card);
      if (!art || !subject) return "";
      const subjectKey = communityArtSubjectKey(subject);
      const authoritativeSignature = communityArtStateSignature(art);
      let clientState = communityArtClientStates.get(subjectKey) || null;
      if (clientState && clientState.authoritativeSignature !== authoritativeSignature) {
        clearCommunityArtClientState(subjectKey);
        clientState = null;
      }
      const level = Math.max(1, Number(art.level || card.level || 1));
      const required = Math.max(1, Number(art.required_orbs || level));
      const funded = Math.max(0, Number(art.funded_orbs || 0));
      const remaining = Math.max(0, Number(art.remaining_orbs ?? (required - funded)));
      const status = String(art.status || "available");
      const providerAttempts = Math.max(0, Number(art.provider_attempts || 0));
      const maxProviderAttempts = Math.max(1, Number(art.max_provider_attempts || 3));
      const retryableWithoutOrbs = Boolean(art.retryable_without_orbs);
      const viewerContributed = Boolean(art.viewer_contributed);
      if (clientState?.status === "starting") {
        return `<div class="card-art-status"><span>level ${level} portrait</span> <strong>Image workshop starting…</strong></div>`;
      }
      if (status === "ready") {
