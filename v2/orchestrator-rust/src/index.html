    function renderStatusUpdates() {
      const updates = $("updates");
      const currentActorId = Number(actorId || 0);
      if (currentActorId !== firstTaleActorIdSeen) {
        firstTaleActorIdSeen = currentActorId;
        firstTaleStageSeen = 0;
        firstTaleCelebration = false;
        firstTaleCompletionSeen = firstTaleCompletionWasSeen();
        firstTaleRenderSignature = "";
      }
      const firstThread = firstThreadModel();
      if (firstThread) {
        firstTaleStageSeen = Math.max(firstTaleStageSeen, Number(firstThread.stage || 0));
      }
      const taleComplete = Boolean(currentActorId && state?.first_tale?.phase === "complete");
      if (!taleComplete) {
        firstTaleCelebration = false;
        firstTaleCompletionSeen = false;
      } else if (!firstTaleCompletionSeen) {
        firstTaleCelebration = true;
      }
      const growthReady = currentActorId && Number(state?.ledger?.advancement_points || 0) > 0;
      const growthActorName = String(actorForId(currentActorId)?.name || "Your avatar").trim();
      const acceptedPayoff = firstTaleAcceptedPayoffVisible();
      const rows = [
        firstTaleCelebration
          ? journalProseRowHtml({
              category: "story",
              prose: `You changed the shared world. ${firstTaleCompletionText()}`,
              kind: "first-thread complete",
              attrs: " data-first-tale-presentation=\"complete\" data-first-tale-completion-memory",
            })
          : acceptedPayoff
          ? journalProseRowHtml({
              category: "story",
              prose: String(state?.first_tale?.continuation?.instruction || ""),
              kind: "first-thread continuation-accepted",
              attrs: " data-first-tale-presentation=\"accepted\"",
            })
          : firstThread
          ? journalProseRowHtml({
              category: "story",
              prose: `Your first tale continues when you ${lowerInitial(firstThread.text)}`,
              kind: "first-thread",
              attrs: ` data-first-tale-presentation="${escapeAttr(state?.first_tale?.phase || "")}"`,
            })
          : "",
        growthReady
          ? journalProseRowHtml({
              category: "growth",
              prose: `A growth choice is ready for ${growthActorName}.`,
              kind: "growth-thread",
            })
          : "",
      ].filter(Boolean);
      updates.hidden = rows.length === 0;
      const html = rows.join("");
      const signature = `${currentActorId}:${state?.first_tale?.phase || ""}:${state?.first_tale?.continuation?.phase || ""}:${state?.first_tale?.phase_exposure_id || ""}:${state?.first_tale?.trace_event_seq || 0}:${firstThread?.text || ""}:${Number(state?.ledger?.advancement_points || 0)}:${Number(firstTaleCelebration)}:${Number(firstTaleCompletionSeen)}:${Number(acceptedPayoff)}`;
      if (signature !== firstTaleRenderSignature) {
        updates.innerHTML = html;
        firstTaleRenderSignature = signature;
      }
      const storyNotice = firstTaleCelebration
        ? `You changed the shared world. ${firstTaleCompletionText()}`
        : acceptedPayoff
          ? String(state?.first_tale?.continuation?.instruction || "")
          : firstThread
            ? `Your first tale continues when you ${lowerInitial(firstThread.text)}`
            : "";
      if (storyNotice) {
        ensureJournalNotification({
          key: `story:${currentActorId}:${state?.first_tale?.phase_exposure_id || state?.first_tale?.phase || firstThread?.stage || 0}:${state?.first_tale?.trace_event_seq || 0}`,
          label: "story",
          text: cleanJournalProseText(storyNotice),
        });
      }
      if (growthReady) {
        ensureJournalNotification({
          key: `growth:${currentActorId}:${Number(state?.ledger?.advancement_points || 0)}`,
          label: "growth",
          text: `A growth choice is ready for ${growthActorName}.`,
        });
      }
      renderJournalActivity();
      scheduleVisibleFirstTalePresentationReceipts();
    }

    function firstTaleCompletionText(view = state) {
      const memory = String(
        view?.first_tale?.completion_memory
          || "You changed the shared world and left the next visitor a clearer way."
      ).trim();
      const invitation = String(view?.first_tale?.next_invitation || "").trim();
      return `${finishSentence(memory)}${invitation ? ` Next: ${finishSentence(invitation)}` : ""}`;
    }

    function firstTaleCompletionStorageKey(view = state) {
      const traceEventSeq = Number(view?.first_tale?.trace_event_seq || 0);
      if (!actorId || !traceEventSeq) return "";
      return `cosyworld.first-tale-completion-seen.${actorId}.${traceEventSeq}`;
    }

    function firstTaleCompletionWasSeen(view = state) {
      const key = firstTaleCompletionStorageKey(view);
      if (!key) return false;
      try {
        return localStorage.getItem(key) === "1";
      } catch (_error) {
        return false;
      }
    }

    function firstTaleAcceptedStorageKey(view = state) {
      const tale = view?.first_tale;
      const exposureId = tale?.continuation?.phase === "accepted"
        ? String(tale?.phase_exposure_id || "")
        : "";
      if (!actorId || !exposureId) return "";
      return `cosyworld.first-tale-accepted-seen.${actorId}.${exposureId}`;
    }

    function firstTaleAcceptedPayoffVisible(view = state) {
      const key = firstTaleAcceptedStorageKey(view);
      if (!key) return false;
      try {
        return localStorage.getItem(key) !== "1";
      } catch (_error) {
        return true;
      }
    }

    function firstTalePayoffVisible(view = state) {
      return firstTaleCelebration || firstTaleAcceptedPayoffVisible(view);
    }

    function dismissFirstTalePayoff(view = state) {
      const completionVisible = firstTaleCelebration;
      const acceptedKey = firstTaleAcceptedStorageKey(view);
      if (!completionVisible && !acceptedKey) return;
      if (completionVisible) {
        firstTaleCelebration = false;
        firstTaleCompletionSeen = true;
      }
      const keys = [
        ...(completionVisible ? [firstTaleCompletionStorageKey(view)] : []),
        acceptedKey,
      ].filter(Boolean);
      for (const key of keys) {
        try {
          localStorage.setItem(key, "1");
        } catch (_error) {
          // Leave the payoff available when storage cannot preserve its acknowledgement.
        }
      }
    }

    function firstTaleIsComplete(view = state) {
      return Boolean(actorId && view?.first_tale?.phase === "complete");
    }

    function nextStoryThreadModel(view = state, availableActions = actions) {
      const findAction = (...labels) => availableActions.find((action) => (
        labels.includes(String(action?.label || "").toLowerCase())
      )) || null;
      const findIntention = (...intentions) => availableActions.find((action) => (
        intentions.includes(String(action?.intention || "").toLowerCase())
      )) || null;
      const makeThread = (action, text, kind) => ({
        actionKey: action ? actionHandKey(action) : "",
        actionLabel: action?.label || "",
        kind,
        text: finishSentence(text),
      });

      const give = availableActions.find((action) => (
        ["give", "give item"].includes(String(action?.label || "").toLowerCase())
          && action.requestedGift === true
      )) || null;
      if (give) {
        const gift = String(give.detail || "").match(/^(.+?)\s+to\s+(.+)$/i);
        return makeThread(
          give,
          gift ? `${gift[2]} is waiting for ${gift[1]}` : "A nearby avatar is hoping for one of your items",
          "gift",
        );
      }
      const urgentUse = availableActions.find((action) => (
        String(action?.label || "").toLowerCase() === "use"
          && Number(actionRank(action)) <= 10
      ));
      if (urgentUse) {
        return makeThread(urgentUse, "One of your items could help someone right now", "care");
      }
      const sharedWork = findIntention("contribute") || findAction("prepare");
      if (sharedWork) {
        const question = (view?.shared_questions || []).find((candidate) => (
          candidate.promoted && candidate.presentation_state === "active"
        ));
        return makeThread(
          sharedWork,
          question?.question || `There is shared work waiting in ${view?.location?.name || "this room"}`,
          "work",
        );
      }
      const danger = findAction("attack", "defend", "flee");
      if (danger) {
        return makeThread(danger, "Something dangerous here needs a careful answer", "danger");
      }
      const inspect = findIntention("inspect");
      if (inspect) {
        const roomName = String(view?.location?.name || "this room");
        const choices = Array.isArray(inspect.choices) ? inspect.choices : [];
        if (choices.length > 1) {
          return makeThread(inspect, "A few details here are still hiding something", "search");
        }
        const target = String(inspect?.target?.label || inspect.detail || "").trim();
        if (target && target !== roomName) {
          return makeThread(inspect, `${target} is still hiding something`, "search");
        }
      }
      const scout = findIntention("scout");
      if (scout) {
        const choices = Array.isArray(scout.choices) ? scout.choices : [];
        if (choices.length > 1) {
          return makeThread(scout, "A few distant routes are waiting to be scouted", "scout");
        }
        const destination = String(scout?.target?.label || scout.detail || "").replace(/^toward\s+/i, "").trim();
        return makeThread(
          scout,
          destination ? `The next stretch toward ${destination} is waiting to be scouted` : "A route is waiting to be scouted",
          "scout",
        );
      }
      const travel = findIntention("travel");
      if (travel) {
        const choices = Array.isArray(travel.choices) ? travel.choices : [];
        const destination = String(travel?.target?.label || travel.detail || "").replace(/^to\s+/i, "").trim();
        return makeThread(
          travel,
          choices.length > 1 || !destination || destination === "choose a path"
            ? "A few paths are open when you're ready"
            : `A path to ${destination} is waiting`,
          "travel",
        );
      }
      if (inspect) {
        const roomName = String(view?.location?.name || "this room");
        return makeThread(inspect, `Something in ${roomName} is still waiting to be found`, "search");
      }
      const chat = findAction("chat");
      if (chat) {
        const target = String(chat.targetName || "").trim();
        return makeThread(chat, target ? `${target} has more to say` : "Someone nearby has more to say", "chat");
      }
      const hook = (view?.room_sheet?.hooks || []).map((value) => String(value || "").trim()).find(Boolean);
      if (hook) {
        return makeThread(null, `${hook.charAt(0).toUpperCase()}${hook.slice(1)}`, "room");
      }
      return null;
    }

    function journalWorldProse(value) {
      const prose = cleanJournalProseText(cleanStatusText(value));
      if (/^world(?:\s*\.\s*[a-z0-9_]+)+[.!?…]*$/i.test(prose)) return "";
      const sentences = prose.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [];
      return cleanStatusText(sentences
        .map((sentence) => cleanStatusText(sentence))
        .filter((sentence) => (
          sentence
          && !/kept a memory:\s*noticed/i.test(sentence)
          && !/journal:\/\/|->|Something changed|\b(?:journey|pathway|world)\.[a-z0-9_.]+/i.test(sentence)
        ))
        .join(" "));
    }

    function renderRoomMemory() {
      const toggle = $("room-log-toggle");
      const panel = $("room-memory");
      const memory = roomMemoryModel();
      const latestJournalBeat = journalBeatsForPresentation().at(-1);
      const latestText = latestJournalBeat
        ? journalFirstPersonProse(latestJournalBeat.headline)
        : memory.hasLatestEvent
          ? atmosphericMemoryBeat(memory.latest) || memory.latest.text
          : "";
      toggle.hidden = false;
      renderRoomLogLatest(latestText);
      panel.hidden = false;
      const latestMemoryProse = journalWorldProse(atmosphericMemoryBeat(memory.latest) || memory.latest.text);
      const memorySummary = journalWorldProse(memory.summary || openingBeat(state))
        || cleanStatusText(openingBeat(state));
      const latestIsHistory = Boolean(
        latestJournalBeat
        && latestMemoryProse === cleanStatusText(latestJournalBeat.headline)
      );
      const latestIsMemoryEcho = /^.+? kept a memory:/i.test(latestMemoryProse);
      const placeProse = (
        !latestIsHistory
        && !latestIsMemoryEcho
        && latestMemoryProse
        && !memorySummary.toLowerCase().includes(memoryPhrase(latestMemoryProse).toLowerCase())
      )
        ? `${memorySummary} ${latestMemoryProse}`
        : memorySummary;
      const distinctPlaceProse = (
        latestJournalBeat
        && placeProse === cleanStatusText(latestJournalBeat.headline)
      )
        ? cleanStatusText(openingBeat(state))
        : placeProse;
      const obviousTells = (Array.isArray(state?.scene_notices) ? state.scene_notices : [])
        .flatMap((notice) => Array.isArray(notice?.tells) ? notice.tells : [])
        .map((tell) => cleanStatusText(tell?.text || ""))
        .filter((text, index, values) => text && values.indexOf(text) === index);
      panel.innerHTML = [
        journalProseRowHtml({
          category: "story",
          prose: distinctPlaceProse,
          kind: "memory",
        }),
        ...obviousTells.map((prose) => journalProseRowHtml({
          category: "discovery",
          prose,
          kind: "scene-notice",
        })),
      ].join("");
    }

    function renderRoomLogLatest(text) {
      const toggle = $("room-log-toggle");
      const latest = $("room-log-latest");
      const track = $("room-log-latest-track");
      const value = String(text || "").trim();
      if (roomLogTickerFrame !== null) {
        window.cancelAnimationFrame(roomLogTickerFrame);
        roomLogTickerFrame = null;
      }
      toggle.dataset.latest = value;
      // The former scrolling Journal ticker is folded into the shared
      // status/error surface, so the room never presents a popup notification.
      latest.hidden = true;
      latest.classList.remove("is-overflowing");
      latest.style.removeProperty("--room-log-duration");
      latest.style.removeProperty("--room-log-overflow");
      track.textContent = value;
    }

    function sharedQuestionsForPresentation(view = state) {
      const questions = Array.isArray(view?.shared_questions) ? view.shared_questions : [];
      return questions
        .filter((question) => question.promoted && question.presentation_state === "active")
        .sort((left, right) => Number(left.promotion_rank || 999) - Number(right.promotion_rank || 999));
    }

    function frontsForPresentation(view = state) {
      const fronts = Array.isArray(view?.fronts) ? view.fronts : [];
      return fronts.filter((front) => (
        ["active", "persisted", "escalated"].includes(String(front.presentation_state || "active"))
      ));
    }

    function sharedFrontHtml(front) {
      const stateName = String(front.presentation_state || "active");
      const unresolved = (front.stakes_questions || []).map(cleanStatusText).find(Boolean) || "";
      const outcome = String(front.outcome_statement || "").trim();
      const prose = [
        cleanStatusText(front.premise),
        unresolved,
        ["persisted", "escalated"].includes(stateName) ? cleanStatusText(outcome) : "",
      ].filter(Boolean).join(" ");
      return journalProseRowHtml({
        category: stateName === "escalated" ? "consequence" : "story",
        prose,
        kind: `story-front ${stateName}`,
      });
    }

    function sharedQuestionHtml(question) {
      const progress = `${Number(question.filled || 0)}/${Number(question.segments || 0)}`;
      const danger = question.danger_segments
        ? `${Number(question.danger_filled || 0)}/${Number(question.danger_segments || 0)} danger`
        : "";
      const status = [progress !== "0/0" ? `${progress} progress` : "", danger].filter(Boolean).join(" and ");
      const prose = [
        cleanStatusText(question.question),
        cleanStatusText(question.situation),
        status ? `The unresolved work stands at ${status}.` : "",
      ].filter(Boolean).join(" ");
      const attrs = ` data-clock-presentation data-clock-id="${escapeAttr(question.progress_clock_id || "")}" data-question-state="active"`;
      return journalProseRowHtml({
        category: "work",
        prose,
        kind: "active-question",
        attrs,
      });
    }

    function renderSharedQuestions() {
      const panel = $("shared-questions");
      const fronts = frontsForPresentation();
      const questions = sharedQuestionsForPresentation();
      panel.hidden = fronts.length === 0 && questions.length === 0;
      panel.innerHTML = [
        ...fronts.slice(0, 1).map(sharedFrontHtml),
        ...questions.map(sharedQuestionHtml),
      ].join("");
      if (questions.length && journalOpen) scheduleVisibleClockPresentationReceipts();
    }

    function syncJournalRegions() {
      const openThreads = $("journal-open-threads");
      openThreads.hidden = $("journal-activity").hidden
        && $("shared-questions").hidden
        && $("updates").hidden;
    }

    const journalBeatCategories = new Set([
      "story",
      "discovery",
      "travel",
      "search",
      "relationship",
      "growth",
      "work",
      "item",
      "consequence",
    ]);

    const journalPageSize = 6;
    const journalThemePhrases = {
      story: "turning points",
      discovery: "discoveries brought to light",
      travel: "roads taken",
      search: "things looked at more closely",
      relationship: "bonds and promises",
      growth: "quiet changes in who people are becoming",
      work: "work carried together",
      item: "items found, made, and shared",
      consequence: "choices that left a mark",
    };
    const journalPageTitles = {
      story: "A turn in the tale",
      discovery: "Things brought to light",
      travel: "Roads taken",
      search: "Looking closer",
      relationship: "Bonds and promises",
      growth: "Becoming",
      work: "Work carried together",
      item: "Things carried",
      consequence: "What followed",
    };

    function journalBeatsForPresentation(view = state) {
      const beats = (Array.isArray(view?.journal_beats) ? view.journal_beats : [])
        .filter((beat) => (
          beat
          && journalBeatCategories.has(String(beat.category || ""))
          && cleanStatusText(beat.headline)
        ))
        .slice()
        .sort((left, right) => (
          Number(left.ordering_seq || 0) - Number(right.ordering_seq || 0)
          || String(left.id || "").localeCompare(String(right.id || ""))
        ))
        .slice(-60);
      const entries = [];
      for (const beat of beats) {
        const headline = cleanStatusText(beat.headline);
        const memory = headline.match(/^(.+?) kept a memory:\s*(.+)$/i);
        if (!memory || beat.world_beat_exposure_id) {
          entries.push(beat);
          continue;
        }
        const subject = cleanStatusText(memory[1]);
        const rememberedMoment = cleanStatusText(memory[2]);
        const memoryKey = rememberedMoment.toLowerCase();
        const prior = entries.at(-1);
        if (prior?._journal_memory_key === memoryKey) {
          prior._journal_memory_subjects = [...new Set([
            ...prior._journal_memory_subjects,
            subject,
          ])];
          prior.source_event_seqs = [...new Set([
            ...(prior.source_event_seqs || []),
            ...(beat.source_event_seqs || []),
          ])].sort((left, right) => Number(left) - Number(right));
          prior.ordering_seq = Math.max(Number(prior.ordering_seq || 0), Number(beat.ordering_seq || 0));
          prior.headline = journalSharedMemoryHeadline(prior._journal_memory_subjects, rememberedMoment);
          continue;
        }
        entries.push({
          ...beat,
          category: "story",
          headline: journalSharedMemoryHeadline([subject], rememberedMoment),
          _journal_memory_key: memoryKey,
          _journal_memory_subjects: [subject],
        });
      }
      return entries;
    }

    function journalSharedMemoryHeadline(subjects, rememberedMoment) {
      const rememberedBy = journalPhraseList(subjects.filter(Boolean));
      const noticedTucking = rememberedMoment.match(/^noticed\s+(.+?)\s+tuck away\s+(.+?)[.!?]?$/i);
      const moment = noticedTucking
        ? `${noticedTucking[1]} tucked away ${noticedTucking[2]}`
        : rememberedMoment.replace(/^noticed\s+/i, "").replace(/[.!?]+$/, "");
      return journalSentence(`The moment ${moment} stayed with ${rememberedBy}`);
    }

    function journalBeatHtml(beat, index) {
      const category = String(beat.category || "");
      const headline = journalFirstPersonProse(beat.headline);
      if (!journalBeatCategories.has(category) || !headline) return "";
      const receiptAttrs = beat.world_beat_exposure_id
        ? ` data-world-beat-receipt data-journal-beat-index="${Number(index)}"`
        : "";
      return journalProseRowHtml({
        category,
        prose: headline,
        kind: `journal-beat ${category}`,
        attrs: receiptAttrs,
      });
    }

    function journalPageDayKey(page) {
      const value = page?.day_index ?? page?.journal_day ?? page?.date ?? "";
      return String(value).trim();
    }

    function dailyJournalPagesForPresentation(view = state) {
      const projected = Array.isArray(view?.journal?.pages)
        ? view.journal.pages
        : Array.isArray(view?.journal_pages)
          ? view.journal_pages
          : [];
      const actorScope = Number(actorId || 0);
      const daily = new Map();
      for (const page of projected) {
        const dayKey = journalPageDayKey(page);
        const imageUrl = cleanStatusText(
          page?.image_url
            || page?.illustration_url
            || page?.media?.image_url
            || "",
        );
        const status = String(page?.status || "ready").toLowerCase();
        const pageActorId = Number(page?.actor_id || actorScope || 0);
        if (
          String(page.rest_kind || "").toLowerCase() !== "long"
          || !dayKey
          || !imageUrl
          || !["ready", "published"].includes(status)
          || (actorScope && pageActorId && pageActorId !== actorScope)
        ) continue;
        const candidate = { ...page, image_url: imageUrl, day_key: dayKey };
        const prior = daily.get(dayKey);
        if (!prior || Number(candidate.page_index ?? candidate.index ?? 0) >= Number(prior.page_index ?? prior.index ?? 0)) {
          daily.set(dayKey, candidate);
        }
      }
      return [...daily.values()].sort((left, right) => (
        String(left.day_key).localeCompare(String(right.day_key), undefined, { numeric: true })
        || Number(left.page_index ?? left.index ?? 0) - Number(right.page_index ?? right.index ?? 0)
      ));
    }

    function journalPageCount(view = state) {
      return dailyJournalPagesForPresentation(view).length;
    }

    function journalPhraseList(values) {
      if (values.length <= 1) return values[0] || "";
      if (values.length === 2) return `${values[0]} and ${values[1]}`;
      return `${values.slice(0, -1).join(", ")}, and ${values.at(-1)}`;
    }

    function journalDominantCategory(beats) {
      const counts = new Map();
      for (const beat of beats) {
        const category = String(beat?.category || "story");
        counts.set(category, Number(counts.get(category) || 0) + 1);
      }
      return [...counts.entries()]
        .sort((left, right) => (
          right[1] - left[1]
          || beats.map((beat) => String(beat?.category || "story")).lastIndexOf(right[0])
            - beats.map((beat) => String(beat?.category || "story")).lastIndexOf(left[0])
        ))[0]?.[0] || "story";
    }

    function journalChapterSummary(beats) {
      if (!beats.length) {
        return "The pages are waiting for their first remembered moment. Explore, listen, or change the world to begin the tale.";
      }
      const latest = journalSentence(beats.at(-1)?.headline);
      if (beats.length === 1) {
        return `The story begins with one remembered moment: ${latest}`;
      }
      const counts = new Map();
      for (const beat of beats) {
        const category = String(beat?.category || "story");
        counts.set(category, Number(counts.get(category) || 0) + 1);
      }
      const themes = [...counts.entries()]
        .sort((left, right) => right[1] - left[1])
        .slice(0, 3)
        .map(([category]) => journalThemePhrases[category])
        .filter(Boolean);
      return `This chapter has been shaped by ${journalPhraseList(themes)}. Its latest turn: ${latest}`;
    }

    function journalPageHtml(page) {
      const imageUrl = cleanStatusText(page?.image_url || "");
      if (!imageUrl) return "";
      const alt = cleanStatusText(
        page?.image_alt
          || page?.illustration_alt
          || page?.alt
          || `My illustrated Journal page for ${page?.day_key || "this day"}.`,
      );
      const artifactId = cleanStatusText(page?.artifact_id || page?.page_id || "");
      const styleRevision = cleanStatusText(page?.style_revision || "");
      const artifactAttrs = `${artifactId ? ` data-journal-artifact-id="${escapeAttr(artifactId)}"` : ""}${styleRevision ? ` data-journal-style-revision="${escapeAttr(styleRevision)}"` : ""} data-journal-day="${escapeAttr(page.day_key)}" data-journal-rest-kind="long"`;
      return `<article class="journal-page"${artifactAttrs}><figure class="journal-page-illustration generated"><img src="${escapeAttr(imageUrl)}" alt="${escapeAttr(alt)}" loading="lazy" /></figure></article>`;
    }

    function turnJournalPage(delta) {
      const pageCount = journalPageCount();
      if (!pageCount) return;
      const currentPage = journalPageIndex < 0
        ? pageCount - 1
        : Math.max(0, Math.min(pageCount - 1, journalPageIndex));
      const nextPage = Math.max(0, Math.min(pageCount - 1, currentPage + Number(delta || 0)));
      journalPageIndex = nextPage === pageCount - 1 ? -1 : nextPage;
      renderJournalLog({ pageTurn: true });
    }

    function scheduleJournalRowOverflowSync() {
      if (journalRowOverflowFrame !== null) {
        window.cancelAnimationFrame(journalRowOverflowFrame);
      }
      journalRowOverflowFrame = window.requestAnimationFrame(() => {
        journalRowOverflowFrame = null;
        syncJournalRowOverflow();
      });
    }

    function syncJournalRowOverflow() {
      for (const row of document.querySelectorAll("#journal-view .journal-prose-row")) {
        const summary = row.querySelector(":scope > summary");
        const headline = summary?.querySelector(".journal-row-summary");
        row.classList.add("is-measuring-overflow");
        const overflowing = Boolean(
          headline
          && headline.clientWidth > 0
          && headline.scrollWidth > headline.clientWidth + 2
        );
        row.classList.remove("is-measuring-overflow");
        row.classList.toggle("is-overflowing", overflowing);
        if (!overflowing) row.open = false;
        if (summary) {
          summary.tabIndex = overflowing ? 0 : -1;
          if (overflowing) {
            summary.removeAttribute("aria-disabled");
          } else {
            summary.setAttribute("aria-disabled", "true");
          }
        }
      }
    }

    function renderJournalLog({ pageTurn = false } = {}) {
      const panel = $("journal-log");
      const stream = panel.closest(".journal-stream");
      const previousScrollTop = stream?.scrollTop || 0;
      const pages = dailyJournalPagesForPresentation();
      const pageCount = pages.length;
      const nav = $("journal-page-nav");
      if (!pageCount) {
        panel.innerHTML = `<div class="journal-empty">No long-rest Journal page has been painted yet.</div>`;
        nav.hidden = true;
        return;
      }
      const pageIndex = journalPageIndex < 0
        ? pageCount - 1
        : Math.max(0, Math.min(pageCount - 1, journalPageIndex));
      panel.innerHTML = journalPageHtml(pages[pageIndex]);
      nav.hidden = pageCount <= 1;
      $("journal-page-label").textContent = `${pageIndex + 1} / ${pageCount}`;
      $("journal-page-previous").disabled = pageIndex === 0;
      $("journal-page-next").disabled = pageIndex === pageCount - 1;
      if (stream) {
        if (pageTurn) {
          stream.scrollTop = 0;
        } else {
          stream.scrollTop = previousScrollTop;
        }
      }
    }

    function roomMemoryModel() {
      const serverMemory = state?.room_memory;
      const serverRecent = Array.isArray(serverMemory?.recent)
        ? dedupeRoomMemoryEntries(
            serverMemory.recent
              .map(normalizeRoomMemoryEntry)
              .filter((entry) => entry && entry.kind !== "chat")
          )
        : [];
      const normalizedServerLatest = normalizeRoomMemoryEntry(serverMemory?.latest);
      const serverLatest = serverRecent[serverRecent.length - 1] || (normalizedServerLatest?.kind === "chat" ? null : normalizedServerLatest);
      const localEntries = logEvents.map(roomMemoryEntryForEvent).filter((entry) => entry && entry.kind !== "chat");
      const serverLatestSeq = Number(serverMemory?.latest_seq || serverLatest?.seq || 0);
      const newerLocalEntries = serverLatestSeq
        ? localEntries.filter((entry) => {
            const seq = Number(entry.seq || 0);
            return !Number.isFinite(seq) || seq > serverLatestSeq;
          })
        : [];
      if (serverMemory && (serverLatest || serverRecent.length || serverMemory.summary)) {
        const recent = dedupeRoomMemoryEntries([...serverRecent, ...newerLocalEntries]).slice(-8);
        const latestEvent = preferredRoomLogEntry(recent, serverLatest);
        const latest = latestEvent || {
          kind: "room",
          label: "room",
          text: openingBeat(state),
        };
        return {
          latest,
          recent: recent.length ? recent : [latest],
          summary: String(serverMemory.summary || openingBeat(state)).trim(),
          hasLatestEvent: Boolean(latestEvent),
        };
      }
      const entries = dedupeRoomMemoryEntries(localEntries);
      const latestEvent = preferredRoomLogEntry(entries);
      const latest = latestEvent || {
        kind: "room",
        label: "room",
        text: openingBeat(state),
      };
      return {
        latest,
        recent: entries.slice(-5),
        summary: roomMemorySummary(entries),
        hasLatestEvent: Boolean(latestEvent),
      };
    }

    function preferredRoomLogEntry(entries, fallback = null) {
      const recent = Array.isArray(entries) ? entries : [];
      const latestHumanCardBeat = recent.slice().reverse().find((entry) => {
        const entryActorId = Number(entry?.actorId || entry?.actor_id || 0);
        if (!entryActorId) return false;
        const entryActor = actorForId(entryActorId);
        const human = entryActorId === Number(actorId || 0)
          || String(entryActor?.kind || "").toLowerCase() === "human";
        const derivedMemory = String(entry?.label || "").toLowerCase() === "memory";
        return human && !derivedMemory;
      });
      return latestHumanCardBeat || recent[recent.length - 1] || fallback;
    }

    function normalizeRoomMemoryEntry(entry) {
      if (!entry) return null;
      const kind = String(entry.kind || "event");
      const rawLabel = String(entry.label || kind || "event");
      const label = kind === "ledger" && rawLabel.toLowerCase() === "ledger"
        ? "memory"
        : kind === "bond" && rawLabel.toLowerCase() === "bond"
          ? "friendship"
          : rawLabel.toLowerCase() === "calling"
            ? "purpose"
            : rawLabel;
      let text = cleanStatusText(entry.text || "")
        .replace(/^A moment stays with you:\s*/i, "")
        .replace(/([.!?])\1+$/g, "$1");
      if (kind === "item") {
        const usefulItem = text.match(/^takes (.+?)\.\s+(.+?) could use (.+?) with (.+?)\.$/i);
        if (usefulItem && usefulItem[1].toLowerCase() === usefulItem[3].toLowerCase()) {
          text = `${usefulItem[2]} carries ${usefulItem[1]} toward ${usefulItem[4]}.`;
        } else {
          text = text.replace(/^take (.+)\.$/i, "$1 changes hands.");
        }
      }
      if (label.toLowerCase() === "join") {
        text = text.replace(/^(.+) entered (.+)$/i, "$1 arrived in $2");
      }
      if (kind === "calling" || rawLabel.toLowerCase() === "calling") {
        text = text.replace(/^choose what calls you:\s*/i, "");
      }
      if (!text) return null;
      return {
        seq: entry.seq,
        actorId: entry.actorId || entry.actor_id || null,
        kind,
        label,
        text,
        actorName: entry.actorName || entry.actor_name || "",
        targetActorName: entry.targetActorName || entry.target_actor_name || "",
        sourceLocationId: entry.sourceLocationId || entry.location_id || null,
        sourceLocationName: entry.sourceLocationName || entry.location_name || "",
        destinationLocationId: entry.destinationLocationId || entry.destination_location_id || null,
        destinationName: entry.destinationName || entry.destination_location_name || "",
        itemName: entry.itemName || entry.item_name || "",
        targetItemName: entry.targetItemName || entry.target_item_name || "",
      };
    }

    function dedupeRoomMemoryEntries(entries) {
      const seen = new Set();
      const unique = [];
      for (let index = entries.length - 1; index >= 0; index -= 1) {
        const entry = entries[index];
        if (!entry?.text) continue;
        const key = memoryPhrase(entry.text).toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        unique.unshift(entry);
      }
      return unique;
    }

    function roomMemoryEntryForEvent(event) {
      if (!event) return null;
      if (["message.created", "image.created", "avatar.thought", "avatar.dream"].includes(event.type)) {
        return null;
      }
      if (
        ["clock.updated", "clock.threshold", "job.updated"].includes(String(event.type || ""))
        && (causalJobContributionEvent(event) || physicalDeliveryEventFor(event))
      ) {
        return null;
      }
      if (
        event.type === "tag.applied"
        && ["search_location", "search_feature"].includes(String(event.content || ""))
      ) {
        return null;
      }
      if (isRollEvent(event)) {
        const meta = rollMeta(event);
      return {
        seq: event.seq,
        actorId: event.actor_id || null,
        kind: "roll",
        label: meta.label,
        text: cleanStatusText(meta.story),
        actorName: event.actor_name || "",
        targetActorName: event.target_actor_name || "",
        sourceLocationId: event.location_id || null,
        sourceLocationName: event.location_name || "",
        destinationLocationId: event.destination_location_id || null,
        destinationName: event.destination_location_name || "",
        itemName: event.item_name || "",
        targetItemName: event.target_item_name || "",
      };
      }
      const meta = statusUpdateMeta(event);
      if (!meta.text) return null;
      return {
        seq: event.seq,
        actorId: event.actor_id || null,
        kind: meta.kind || "event",
        label: meta.label || "event",
        text: cleanStatusText(meta.text),
        actorName: event.actor_name || "",
        targetActorName: event.target_actor_name || "",
        sourceLocationId: event.location_id || null,
        sourceLocationName: event.location_name || "",
        destinationLocationId: event.destination_location_id || null,
        destinationName: event.destination_location_name || "",
        itemName: event.item_name || "",
        targetItemName: event.target_item_name || "",
      };
    }

    function roomMemorySummary(entries) {
      const recent = entries.slice(-9);
      if (!recent.length) return openingBeat(state);
      const beats = recent
        .slice()
        .reverse()
        .map(atmosphericMemoryBeat)
        .filter(Boolean)
        .slice(0, 2)
        .reverse();
      if (!beats.length) return openingBeat(state);
      return finishSentence(`${withoutFinalPeriod(openingBeat(state))} ${beats.join(" ")}`);
    }

    function memoryPhrase(value) {
      return String(value || "").trim().replace(/[.!?]+$/g, "");
    }

    function atmosphericMemoryBeat(entry) {
      if (!entry) return "";
      const label = cleanStatusText(entry.label || "");
      const rawText = cleanStatusText(entry.text || "");
      const text = memoryPhrase(entry.text);
      const kind = String(entry.kind || "").toLowerCase();
      const actor = cleanStatusText(entry.actorName || entry.actor_name || "");
      const sourceLocationId = Number(entry.sourceLocationId || entry.location_id || 0);
      const destinationLocationId = Number(entry.destinationLocationId || entry.destination_location_id || 0);
      const destination = cleanStatusText(entry.destinationName || entry.destination_location_name || "");
      if (!text) return "";
      if (kind === "status" && /^Report submitted for .+\.$/i.test(rawText)) return rawText;
      if (kind === "chat") return finishSentence(`${possessive(label || actor || "someone")} voice stayed in the room`);
      if (kind === "move") {
        const currentLocationId = Number(state?.location?.id || 0);
        if (
          actor
          && destination
          && currentLocationId > 0
          && sourceLocationId === currentLocationId
          && destinationLocationId !== currentLocationId
        ) {
          return `${actor} left for ${destination}.`;
        }
        if (actor && destination) return `${actor} arrived at ${destination}.`;
        const match = text.match(/^(.*?):\s*(.*?)\s*->\s*(.*)$/) || text.match(/^(.*?)\s+moved from\s+(.*?)\s+to\s+(.*)$/i);
        if (match) return `${(match[1] || "Someone").trim()} arrived at ${(match[3] || "somewhere").trim()}.`;
        const entered = text.match(/^(.*?)\s+(?:entered|arrived in)\s+(.+)$/i);
        if (entered) return `${entered[1].trim()} arrived in ${entered[2].trim()}.`;
        return finishSentence(actor ? `${actor}: ${text}` : text);
      }
      if (kind === "hand") {
        if (/^new cards$/i.test(text)) return "A fresh hand of actions is ready.";
        return finishSentence(text);
      }
      if (kind === "search") {
        const path = text.match(/(?:a\s+)?way\s+to\s+(.+?)(?:\s+becomes\s+clear)?$/i);
        if (path?.[1]) return `A path to ${path[1].trim()} opened.`;
        return finishSentence(text);
      }
      if (kind === "roll") {
        if (actor && /^listens?:/i.test(text)) {
          return finishSentence(`${actor} ${text}`);
        }
        return finishSentence(text);
      }
      if (kind === "item") {
        return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
      }
      if (kind === "trade") return finishSentence(actor ? `${actor} ${text}` : text);
      if (kind === "bond") {
        if (actor && /^closer to /i.test(text)) return finishSentence(`${actor} grew ${text}`);
        return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
      }
      if (kind === "calling") {
        const purpose = text.replace(/^what draws you in:\s*/i, "");
        if (/^arrives\b/i.test(purpose)) {
          return finishSentence(actor ? `${actor} ${purpose}` : purpose);
        }
        return finishSentence(actor ? `${actor} chose a purpose: ${purpose}` : purpose);
      }
      if (kind === "bank") return finishSentence(actor ? `${actor} grew from what happened` : text);
      if (kind === "growth") return finishSentence(actor ? `${actor} put what they learned into practice` : text);
      if (kind === "skill") return finishSentence(actor ? `${actor}: ${text}` : text);
      if (kind === "ledger") return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
      return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
    }

    function possessive(name) {
      const text = cleanStatusText(name || "someone");
      return text.endsWith("s") ? `${text}'` : `${text}'s`;
    }

    function roomMemoryEntryHtml(entry) {
      return `<div class="memory-entry ${escapeAttr(entry.kind)}"><span class="memory-entry-label">${escapeHtml(entry.label)}</span><span class="memory-entry-text">${escapeHtml(entry.text)}</span></div>`;
    }

    function eventIsLowSignalStatus(event) {
      return event?.type === "world.reset"
        || event?.type === "action.offer_rejected"
        || event?.type === "advancement.spent"
        || String(event?.type || "").startsWith("community_art.");
    }

    function statusUpdateHtml(event) {
      const meta = statusUpdateMeta(event);
      const attrs = ` aria-label="${escapeAttr(`${meta.label}: ${meta.text}`)}"`;
      return `<div class="update-pill ${escapeAttr(meta.kind)}"${attrs}><span class="update-label">${escapeHtml(meta.label)}</span><span class="update-text">${escapeHtml(meta.text)}</span></div>`;
    }

    function statusUpdateMeta(event) {
      const repeat = Number(event.repeat_count || 0);
      const repeatSuffix = repeat > 1 ? ` x${repeat}` : "";
      const storyReceipt = semanticStoryReceipt(event);
      if (storyReceipt) {
        return { kind: "story", label: "story", text: cleanStatusText(storyReceipt.text) };
      }
      if (event.type === "ledger.marked") {
        return { kind: "ledger", label: "memory", text: cleanStatusText(ledgerEventLabel(event)) };
      }
      if (event.type === "ledger.banked") {
        return { kind: "ledger", label: "growth", text: cleanStatusText(ledgerBankedEventLabel(event)) };
      }
      if (event.type === "advancement.spent") {
        return { kind: "growth", label: "change", text: cleanStatusText(advancementEventLabel(event)) };
      }
      if (event.type === "skill.stepped") {
        return { kind: "skill", label: "ability", text: cleanStatusText(skillEventLabel(event)) };
      }
      if (event.type === "relationship.beat") {
        return { kind: "bond", label: "relationship", text: cleanStatusText(event.content || "a relationship begins to form") };
      }
      if (event.type === "relationship.advanced") {
        return { kind: "bond", label: "relationship", text: cleanStatusText(event.content || "earned trust changes the relationship") };
      }
      if (event.type === "dialogue.unavailable") {
        return { kind: "bond", label: "reply unavailable", text: "The promised resident reply could not run. No substitute reply was created." };
      }
      if (event.type === "calling.set") {
        if (callingEventReason(event) === "avatar_created") {
          return { kind: "calling", label: "purpose", text: "arrives with a purpose still to choose" };
        }
        if (event.actor_id === actorId) {
          return { kind: "calling", label: "purpose", text: `What draws you in: ${cleanStatusText(callingEventLabel(event))}` };
        }
        return { kind: "calling", label: "purpose", text: cleanStatusText(callingEventLabel(event)) };
      }
      if (event.type === "calling.revised") {
        if (event.actor_id === actorId) {
          return { kind: "calling", label: "purpose", text: `What draws you in: ${cleanStatusText(callingEventLabel(event))}` };
        }
        return { kind: "calling", label: "purpose", text: cleanStatusText(callingEventLabel(event)) };
      }
      if (event.type === "bond.deepened") {
        return { kind: "bond", label: "friendship", text: `closer to ${event.target_actor_name || "someone"}` };
      }
      if (event.type === "bond.created") {
        const forming = String(event.content || "").includes(":forming:");
        return forming
          ? { kind: "bond", label: "relationship", text: `a connection with ${event.target_actor_name || "someone"} is forming` }
          : { kind: "bond", label: "friendship", text: `${event.target_actor_name || "someone"} now matters to you` };
      }
      if (event.type === "bond.revised") {
        return { kind: "bond", label: "friendship", text: `what ${event.target_actor_name || "someone"} means to you changed` };
      }
      if (event.type === "bond.resolved") {
        return { kind: "bond", label: "friendship", text: `what mattered with ${event.target_actor_name || "someone"} stays with you` };
      }
      if (event.type === "actor.moved") {
        const actor = event.actor_name || "someone";
        return { kind: "move", label: "move", text: `${actor}: ${event.location_name || "somewhere"} -> ${event.destination_location_name || "somewhere"}` };
      }
      if (event.type === "actor.created") {
        const actor = actorNameForEvent(event);
        if (event.actor_id === actorId) {
          const title = actorTitleForEvent(event);
          return {
            kind: "move",
            label: "you",
            text: `arrive as ${actor}${title ? `, ${title}` : ""}`,
          };
        }
        return { kind: "move", label: "join", text: `${actor} entered ${event.location_name || "the room"}` };
      }
      if (event.type === "actor.entered_location") {
        return { kind: "move", label: "join", text: `arrived ${event.location_name || "here"}` };
      }
      if (event.type === "move.blocked") {
        return { kind: "move", label: "locked", text: event.destination_location_name || "path blocked" };
      }
      if (event.type === "hand.shuffled") {
        return { kind: "hand", label: "hand", text: "Story Hand changed" };
      }
      if (event.type === "hand.thought") {
        return { kind: "hand", label: "discard", text: "one Story Hand card changed" };
      }
      if (event.type === "turn.ping_started") {
        const actor = event.actor_name || "someone";
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "nudge", text: `${actor} gently nudged ${target}${repeatSuffix}` };
      }
      if (event.type === "turn.pong") {
        const actor = event.actor_name || "someone";
        return { kind: "hand", label: "ready", text: `${actor} is here for the next choice${repeatSuffix}` };
      }
      if (event.type === "turn.ping_skipped") {
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "next", text: `${target} was away, so the choice passed on${repeatSuffix}` };
      }
      if (event.type === "turn.timeout_requested") {
        const actor = event.actor_name || "someone";
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "timeout", text: `${actor} asked ${target} to play or pass${repeatSuffix}` };
      }
      if (event.type === "turn.timeout_passed") {
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "passed", text: `${target} passed${repeatSuffix}` };
      }
      if (event.type === "feature.searched" || event.type === "location.searched") {
        return { kind: "search", label: "search", text: cleanStatusText(searchEventText(event)) };
      }
      if (event.type === "exit.discovered") {
        return { kind: "search", label: "entrance", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "ability_check.rolled") {
        const studying = event.content === "study";
        const noticing = event.content === "notice";
        const reflecting = ["think", "dream"].includes(event.content);
        return {
          kind: "roll",
          label: reflecting ? event.content : (studying ? "study" : (noticing ? "notice" : "check")),
          text: cleanStatusText(abilityCheckEventText(event)),
        };
      }
      if (event.type === "study.resolved") {
        return {
          kind: "roll",
          label: "study",
          text: event.content?.includes("yielded")
            ? "the signs yield one understood truth"
            : "the signs remain unresolved",
        };
      }
      if (event.type === "job.contribution.resolved") {
        return { kind: "world", label: "approach", text: cleanStatusText(jobContributionEventText(event)) };
      }
      if (event.type === "clock.threshold") {
        return { kind: "world", label: "turning point", text: cleanStatusText(event.content || "The shared work reaches a turning point.") };
      }
      if (event.type === "natural_feature.revealed") {
        return { kind: "world", label: "discovery", text: naturalFeatureEventText(event) };
      }
      if (event.type === "combat.attack.attempt") {
        return { kind: "roll", label: "roll", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "combat.pass") {
        return { kind: "hand", label: "pass", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "combat.need_time") {
        return { kind: "hand", label: "pause", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "item.traded") {
        return { kind: "trade", label: "trade", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "command.output") {
        return {
          kind: "status",
          label: "status",
          text: cleanStatusText(String(event.content || "").split(/\n+/).map((line) => line.trim()).filter(Boolean).join(" ")),
        };
      }
      if (worldTranscriptEventTypes.has(String(event.type || ""))) {
        return { kind: "world", label: "world", text: sceneCardEventText(event) };
      }
      return { kind: statusKindForEvent(event), label: statusLabelForEvent(event), text: cleanStatusText(eventText(event)) };
    }

    function statusKindForEvent(event) {
      const type = String(event?.type || "");
      if (type.startsWith("item.")) return "item";
      if (type.startsWith("combat.")) return "combat";
      if (type === "exit.discovered") return "search";
      if (type === "encounter.reset") return "combat";
      if (type === "hand.shuffled" || type === "hand.thought") return "hand";
      if (type.startsWith("turn.")) return "hand";
      if (
        type === "job.contribution.resolved"
        || type === "clock.updated"
        || type === "clock.threshold"
        || type === "natural_feature.revealed"
        || type === "tag.applied"
        || type === "tag.cleared"
        || type === "job.updated"
      ) return "world";
      return "status";
    }

    function statusLabelForEvent(event) {
      const type = String(event?.type || "");
      if (type.startsWith("item.")) return "item";
      if (type.startsWith("combat.")) return "combat";
      if (type === "exit.discovered") return "entrance";
      if (type === "encounter.reset") return "frontier";
      if (type === "hand.shuffled") return "hand";
      if (type === "hand.thought") return "discard";
      if (type.startsWith("turn.")) return "turn";
      if (type === "job.contribution.resolved") return "approach";
      if (type === "clock.updated") return "clock";
      if (type === "clock.threshold") return "turning point";
      if (type === "natural_feature.revealed") return "discovery";
      if (type.startsWith("tag.")) return "tag";
      if (type === "job.updated") return "job";
      return "event";
    }

    function cleanStatusText(value) {
      const text = String(value || "").trim();
      return text
        .replace(/:{1,2}(resident_feature_use|resident_autonomy_intent)\b/g, "")
        .replace(/^you:\s*/i, "")
        .replace(/^You\s+/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function renderLog() {
      const log = $("log");
      const previousScrollTop = log.scrollTop;
      const wasAtBottom = log.scrollHeight <= log.clientHeight + 1
        || log.scrollHeight - log.scrollTop - log.clientHeight < 28;
      const libraryPanel = libraryPanelHtml();
      const accountPanel = accountPanelHtml();
      const visibleEvents = sharedRoomTranscriptEvents(logEvents);
      const pendingConversation = pendingConversationHtml();
      const pendingChatReplies = pendingChatsHtml();
      const pendingModelOutputs = pendingModelInteractionsHtml();
      const pendingArrival = pendingAvatarArrivalHtml();
      const defeatScene = defeatTransitionHtml();
      const observerScene = knockedOutObserverHtml();
      const hasTranscript = visibleEvents.length > 0
        || Boolean(pendingConversation)
        || Boolean(pendingChatReplies)
        || Boolean(pendingModelOutputs)
        || Boolean(defeatScene)
        || Boolean(observerScene);
      const inferredOnly = visibleEvents.length > 0 && visibleEvents.every((event) => (
        ["message.created", "image.created", "model_interaction.output"].includes(event.type) && messageActorUsesInference(event)
      ));
      log.classList.toggle("library-mode", Boolean(libraryPanel));
      log.classList.toggle("account-mode", !libraryPanel && Boolean(accountPanel));
      log.classList.toggle("chat-mode", !libraryPanel && !accountPanel && hasTranscript);
      log.classList.toggle("room-mode", !libraryPanel && !accountPanel && !hasTranscript && !pendingArrival && !defeatScene && !observerScene);
      log.classList.toggle("arrival-mode", !libraryPanel && !accountPanel && Boolean(pendingArrival || defeatScene || observerScene));
      log.classList.toggle("quiet-mode", !libraryPanel && !accountPanel && inferredOnly);
      log.classList.toggle("journey-mode", !libraryPanel && !accountPanel && Boolean(state?.journey));
      const panelMode = libraryPanel ? "library" : (accountPanel ? "account" : "");
      document.querySelector(".terminal")?.classList.toggle("panel-open", Boolean(panelMode));
      document.querySelector(".prompt").hidden = Boolean(panelMode);
      if (panelMode) {
        log.setAttribute("role", "region");
        log.setAttribute("aria-label", panelMode === "library" ? "World Library" : "Your avatar menu");
        log.removeAttribute("aria-live");
        log.removeAttribute("aria-relevant");
      } else {
        log.setAttribute("role", "log");
        log.setAttribute("aria-label", state?.journey ? "Travelling party chat" : "Shared room transcript");
        log.setAttribute("aria-live", "polite");
        log.setAttribute("aria-relevant", "additions text");
      }
      if (libraryPanel) {
        log.innerHTML = libraryPanel;
        log.scrollTop = 0;
        return;
      }
      if (accountPanel) {
        log.innerHTML = accountPanel;
        log.scrollTop = 0;
        return;
      }
      if (pendingArrival) {
        log.innerHTML = pendingArrival;
        log.scrollTop = 0;
        return;
      }
      if (!hasTranscript) {
        renderedChatTailKey = "";
        log.innerHTML = quietRoomSceneHtml();
        log.scrollTop = 0;
        return;
      }
      const tailEvent = visibleEvents[visibleEvents.length - 1] || null;
      const chatTailKey = [
        tailEvent?.transcript_tail_seq ?? tailEvent?.seq ?? "",
        tailEvent?.repeat_count ?? 1,
        pendingConversation ? "conversation" : "",
        pendingChats.map((chat) => chat.id).join(","),
        defeatTransition?.eventSeq ?? "",
      ].join(":");
      const firstTranscriptRender = !renderedChatTailKey;
      renderedChatTailKey = chatTailKey;
      log.innerHTML = `${visibleEvents.map(transcriptEventHtml).join("")}${defeatScene}${observerScene}${pendingConversation}${pendingChatReplies}${pendingModelOutputs}`;
      log.scrollTop = firstTranscriptRender || wasAtBottom
        ? log.scrollHeight
        : Math.min(previousScrollTop, Math.max(0, log.scrollHeight - log.clientHeight));
      scheduleVisibleWorldBeatReceipts();
    }

    function menuNavHtml(active = menuSection) {
      const entries = [
        ["deck", "pack"],
        ["character", "character"],
        ["identity", "sign in / identity"],
        ["world", "worlds & packs"],
        ["journal", "journal"],
        ["settings", "orbs & settings"],
      ];
      const icons = {
        deck: "cards",
        character: "avatar",
        identity: "key",
        world: "world",
        journal: "journal",
        settings: "settings",
      };
      return `<nav class="menu-nav" aria-label="Menu sections">${entries.map(([id, label]) => {
        const worldPackAttrs = id === "world"
          ? ' data-player-concept="world-pack" data-analytics-event="world_pack.library.open"'
          : "";
        return `<button type="button" class="${id === active ? "active" : ""}" data-menu-section="${id}"${worldPackAttrs}>${iconSvg(icons[id])}<span>${label}</span></button>`;
      }).join("")}</nav>`;
    }

    function deckWeightLabel(tenths) {
      return `${(Number(tenths || 0) / 10).toFixed(1)} lb`;
    }

    function deckCardRow(card, actionHtml = "") {
      const skill = card.skill_id ? ` · ${card.skill_id.replaceAll("_", " ")} ${Number(card.skill_bonus || 0) >= 0 ? "+" : ""}${card.skill_bonus || 0}` : "";
      const charges = ["spell", "consumable"].includes(String(card.role || "")) ? ` · ${Number(card.charges || 0)} use${Number(card.charges || 0) === 1 ? "" : "s"}` : "";
      const zone = card.zone === "carried" ? "pack" : (card.zone || "pack");
      return `<div class="deck-card"><div class="deck-card-copy"><strong>${escapeHtml(card.name || `Item ${card.id}`)}</strong><small>${escapeHtml(`${zone} · ${card.role || "generic"} · ${card.size || "small"} · ${deckWeightLabel(card.weight_tenths)}${charges}${skill}`)}</small></div>${actionHtml}</div>`;
    }

    function deckPanelHtml() {
      const deck = state?.deck || {};
      const carried = Array.isArray(deck.carried_cards) ? deck.carried_cards : [];
      const equipped = Array.isArray(deck.equipped_charms) ? deck.equipped_charms : [];
      const available = Array.isArray(deck.available_charms) ? deck.available_charms : [];
      const spells = Array.isArray(deck.spell_cards) ? deck.spell_cards : [];
      const preparedSpells = Array.isArray(deck.prepared_spell_cards) ? deck.prepared_spell_cards : [];
      const exhaustedCards = Array.isArray(deck.exhausted_cards) ? deck.exhausted_cards : [];
      const exhaustedSpellIds = new Set((Array.isArray(deck.exhausted_spell_cards) ? deck.exhausted_spell_cards : []).map((card) => Number(card.id)));
      const preparedSpellIds = new Set(preparedSpells.map((card) => Number(card.id)));
      const spellSlots = Number(deck.spell_deck_slots || 0);
      const containers = Array.isArray(deck.containers) ? deck.containers : [];
      const validationErrors = Array.isArray(deck.validation_errors) ? deck.validation_errors : [];
      const bagPreviews = Array.isArray(deck.bag_previews) ? deck.bag_previews : [];
      const slots = Number(deck.bracelet_slots || 0);
      const expansion = deck.charm_slot_expansion || null;
      const unlock = expansion
        ? `<div class="item-note"><strong>${escapeHtml(expansion.label || "Make room")}</strong><br>${escapeHtml(expansion.explanation || "")}</div><button class="account-button secondary" type="button" data-unlock-charm-slot>${escapeHtml(expansion.label || "Make room")} · ${Number(expansion.advancement_cost || 1)} advancement</button>`
        : "";
      const charmRows = [
        ...equipped.map((card) => deckCardRow(card, `<button class="account-button secondary" type="button" data-set-charm="${card.id}" data-equipped="false">remove</button>`)),
        ...available.map((card) => deckCardRow(card, `<button class="account-button secondary" type="button" data-set-charm="${card.id}" data-equipped="true"${equipped.length >= slots ? " disabled" : ""}>wear</button>`)),
      ].join("");
      const firstContainer = containers[0]?.container || null;
      const carriedRows = carried.length ? carried.map((card) => {
        const actionParts = [];
        if (["weapon", "container", "tool"].includes(String(card.role || ""))) {
          const equipped = card.zone === "equipped";
          actionParts.push(`<button class="account-button secondary" type="button" data-set-item-equipped="${card.id}" data-equipped="${equipped ? "false" : "true"}">${equipped ? "unequip" : "equip"}</button>`);
        } else if (card.zone === "contained") {
          actionParts.push(`<button class="account-button secondary" type="button" data-set-contained="${card.id}" data-container="">take out</button>`);
        } else if (firstContainer && !["skill_charm", "spell"].includes(String(card.role || ""))) {
          actionParts.push(`<button class="account-button secondary" type="button" data-set-contained="${card.id}" data-container="${firstContainer.id}">put in ${escapeHtml(firstContainer.name)}</button>`);
        }
        return deckCardRow(card, actionParts.join(""));
      }).join("") : `<div class="deck-empty">Your pack is empty. Pick up item cards in the world.</div>`;
      const spellRows = spells.length ? spells.map((card) => {
        const prepared = preparedSpellIds.has(Number(card.id));
        const exhausted = exhaustedSpellIds.has(Number(card.id));
        const actionHtml = exhausted
          ? `<span class="account-wallet">spent</span>`
          : `<button class="account-button secondary" type="button" data-set-spell="${card.id}" data-prepared="${prepared ? "false" : "true"}"${!prepared && preparedSpells.length >= spellSlots ? " disabled" : ""}>${prepared ? "unprepare" : "prepare"}</button>`;
        return deckCardRow(card, actionHtml);
      }).join("") : `<div class="deck-empty">No spell cards are in your pack.</div>`;
      const loadoutRows = [deck.equipped_weapon, ...(Array.isArray(deck.equipped_containers) ? deck.equipped_containers : [])]
        .filter(Boolean)
        .map((card) => deckCardRow(card))
        .join("");
      const containerRows = containers.map((entry) => {
        const contentNames = (entry.contents || []).map((card) => card.name).join(", ") || "empty";
        return `<div class="item-note"><strong>${escapeHtml(entry.container?.name || "container")}</strong> · ${entry.equipped ? "equipped" : "inactive"} · opening ${escapeHtml(entry.opening_size || "none")} · contents: ${escapeHtml(contentNames)}</div>`;
      }).join("");
      const validation = validationErrors.map((message) => `<div class="deck-empty">${escapeHtml(message)}</div>`).join("");
      const previews = bagPreviews.map((message) => `<div class="item-note">${escapeHtml(message)}</div>`).join("");
      const exhaustedRows = exhaustedCards.length
        ? exhaustedCards.map((card) => deckCardRow(card, `<span class="account-wallet">spent</span>`)).join("")
        : `<div class="deck-empty">No cards are spent.</div>`;
      return `<div class="account-title"><h2 id="account-panel-title">your pack</h2><span class="account-wallet">physical cards, not a fixed card count</span></div><div class="deck-summary"><div class="deck-stat"><strong>${escapeHtml(deckWeightLabel(deck.carried_weight_tenths))} / ${escapeHtml(deckWeightLabel(deck.carrying_capacity_tenths))}</strong><small>pack weight · base ${escapeHtml(deckWeightLabel(deck.base_carrying_capacity_tenths))} + equipped bags ${escapeHtml(deckWeightLabel(deck.container_capacity_tenths))}</small></div><div class="deck-stat"><strong>${equipped.length} / ${slots}</strong><small>bracelet charm slots</small></div><div class="deck-stat"><strong>${preparedSpells.length} / ${spellSlots}</strong><small>prepared spells</small></div></div>${validation}${previews}<div class="account-section-title">loadout</div>${loadoutRows ? `<div class="deck-card-list">${loadoutRows}</div>` : `<div class="deck-empty">No weapon or bag is equipped.</div>`}<div class="account-section-title">containers</div>${containerRows || `<div class="deck-empty">No container cards are carried.</div>`}<div class="account-section-title">skill charms</div>${charmRows ? `<div class="deck-card-list">${charmRows}</div>` : `<div class="deck-empty">Find, earn, trade, or steal a skill charm before you can wear it.</div>`}${unlock}<div class="account-section-title">prepared spells</div><div class="item-note">Only prepared spells can be cast. Spent cards remain in your pack until a rule refreshes them.</div><div class="deck-card-list">${spellRows}</div><div class="account-section-title">spent</div><div class="deck-card-list">${exhaustedRows}</div><div class="account-section-title">pack</div><div class="deck-card-list">${carriedRows}</div>`;
    }

    function journalPanelHtml() {
      return `<div class="account-title"><h2 id="account-panel-title">journal</h2><span class="account-wallet">portable tale</span></div><div class="library-intro">Export the events visible to this avatar as JSON. The export includes current access credentials only in the request, never in the file.</div><div class="account-actions"><button class="account-button" type="button" data-export-journal>export journal</button></div>`;
    }

    function settingsPanelHtml() {

      const largeText = localStorage.getItem("cosyworld.ui.largeText") === "true";

      return `<div class="account-title"><h2 id="account-panel-title">orbs & settings</h2><span class="account-wallet">${escapeHtml(String(economy.orbs || 0))} Orbs</span></div><div class="setting-list"><label class="setting-row"><span class="setting-copy"><strong>Larger text</strong><small>Increase interface and story text throughout the game.</small></span><input type="checkbox" data-ui-setting="largeText"${largeText ? " checked" : ""} /></label><label class="setting-row"><span class="setting-copy"><strong>Reduce motion</strong><small>Minimize dealing, pulsing, and transition animation.</small></span><input type="checkbox" data-ui-setting="reduceMotion"${reduceMotion ? " checked" : ""} /></label></div><div class="account-section"><div class="account-section-title">About Orbs</div><div class="item-note">Orbs fund community images only. They do not buy stronger actions.</div>${accountRow("Chat", "a short avatar and resident exchange")}${accountRow("Befriend", "uses advancement to begin a friendship")}${accountRow("room voices", "one contextual reply per armed card heartbeat")}${accountRow("AI", openRouterApiKey() ? "your OpenRouter connection" : "world default")}${accountRow("pack", `${deckWeightLabel(deck.carried_weight_tenths)} / ${deckWeightLabel(deck.carrying_capacity_tenths)}`)}</div>`;
    }

    function libraryPanelHtml() {
      if (!libraryPanelPinned) return "";
      const packs = Array.isArray(contentPacks?.packs) ? contentPacks.packs.filter((pack) => pack.visible !== false) : [];
      if (!packs.length) {
        return `<section class="account-panel library-panel" aria-labelledby="world-library-title">${menuNavHtml("world")}<div class="library-heading"><h2 id="world-library-title">Worlds</h2></div><div class="library-intro">The worlds are still gathering. Try again in a moment.</div></section>`;
      }
      const bundle = compactAssetId(contentPacks?.bundle_hash || "");
      const playable = packs.filter((pack) => ["world", "campaign"].includes(String(pack.kind || "").toLowerCase()));
      const supporting = packs.filter((pack) => !playable.includes(pack));
      const cards = playable.length
        ? playable.map(libraryPackHtml).join("")
        : `<div class="account-empty">No playable world is available yet.</div>`;
      const supportingCards = supporting.map(libraryPackHtml).join("");
      const bundleDetails = bundle
        ? `<details class="library-technical"><summary>world pack details</summary><code>${escapeHtml(bundle)}</code></details>`
        : "";
      const systemPacks = supportingCards
        ? `<details class="menu-disclosure library-system-packs"><summary>${iconSvg("settings")}<span>About this world</span><small>${escapeHtml(`${supporting.length} supporting ${supporting.length === 1 ? "pack" : "packs"}`)}</small></summary><div class="menu-disclosure-body"><div class="library-grid">${supportingCards}</div>${bundleDetails}</div></details>`
        : bundleDetails;
      return `<section class="account-panel library-panel" aria-labelledby="world-library-title">${menuNavHtml("world")}<div class="library-heading"><h2 id="world-library-title">Worlds</h2><small>${escapeHtml(`${playable.length} playable ${playable.length === 1 ? "world" : "worlds"} · ${packs.length} world packs mounted`)}</small></div><div class="library-intro">Continue through any mounted world. Ordinary places are public and need no wallet.</div>${worldChronicleHtml()}<div class="library-grid featured">${cards}</div>${systemPacks}</section>`;
    }

    function worldChronicleHtml() {
      const simulation = worldView?.simulation;
      if (!simulation) return `<section class="world-chronicle" aria-label="World chronicle"><div class="world-chronicle-head"><strong>the world beyond</strong><small>listening for distant news…</small></div></section>`;
      const history = Array.isArray(simulation.recent_history) ? simulation.recent_history.slice(0, 8) : [];
      const entries = history.length
        ? history.map((event) => {
            const route = event.destination_location_name ? `${event.location_name || "somewhere"} → ${event.destination_location_name}` : (event.location_name || "somewhere beyond this room");
            const copy = worldBeatAuthoredProse(event) || sceneCardEventText(event);
            return `<div class="world-chronicle-entry"><span class="world-chronicle-place">${escapeHtml(route)}</span><span class="world-chronicle-copy">${escapeHtml(copy)}</span></div>`;
          }).join("")
        : `<div class="world-chronicle-entry"><span class="world-chronicle-copy">The wider world is settled. Six committed turns will carry the first distant change.</span></div>`;
      const movingFactions = (simulation.factions || []).filter((faction) => Number(faction.momentum || 0) !== 0).sort((left, right) => Math.abs(Number(right.momentum || 0)) - Math.abs(Number(left.momentum || 0))).slice(0, 4).map((faction) => `${faction.faction_name || faction.faction_id} ${Number(faction.momentum) > 0 ? "+" : ""}${Number(faction.momentum || 0)}`).join(" · ");
      const pulseLabel = Number(simulation.pulse_index || 0) ? `history pulse ${simulation.pulse_index} · played tick ${simulation.last_advanced_tick}` : `moves every ${simulation.pulse_interval_ticks || 6} committed turns`;
      const factionLine = movingFactions ? `<div class="world-faction-current">faction momentum · ${escapeHtml(movingFactions)}</div>` : "";
      return `<section class="world-chronicle" aria-label="World chronicle"><div class="world-chronicle-head"><strong>the world beyond</strong><small>${escapeHtml(pulseLabel)}</small></div><div class="world-chronicle-list">${entries}</div>${factionLine}</section>`;
    }

    function libraryPackHtml(pack) {
      const locations = Array.isArray(pack.locations) ? pack.locations : [];
      const shownLocations = locations.slice(0, 6).map((location) => {
        return `<div class="library-location accessible" data-player-concept="world-pack"><span>${escapeHtml(location.name || `Location ${location.id}`)}</span><span class="library-location-state">open</span></div>`;
      }).join("");
      const remaining = Math.max(0, locations.length - 6);
      const locationList = shownLocations
        ? `<div class="library-locations">${shownLocations}${remaining ? `<div class="library-location"><span>and ${remaining} more</span></div>` : ""}</div>`
        : "";
      const dependencies = Array.isArray(pack.dependencies) && pack.dependencies.length
        ? ` · depends on ${pack.dependencies.map(shortPackName).join(", ")}`
        : "";
      const technical = [
        `${pack.kind || "world pack"} · v${pack.version || "?"} · ${pack.license || "unlicensed"}${dependencies}`,
        pack.distribution?.permanence === "content-addressed" ? "content-addressed release" : "",
      ].filter(Boolean).join(" · ");
      const technicalDetails = technical
        ? `<details class="library-technical"><summary>technical details</summary><div>${escapeHtml(technical)}</div></details>`
        : "";
      const kind = String(pack.kind || "world pack").toLowerCase();
      const icon = ["world", "campaign"].includes(kind) ? "world" : "settings";
      return `<article class="library-pack" data-player-concept="world-pack"><div class="library-pack-top"><div><div class="library-pack-name">${iconSvg(icon)}${escapeHtml(pack.name || pack.id)}</div><div class="library-pack-meta">${escapeHtml(kind)}</div></div><span class="library-access-badge included">public</span></div><div class="library-pack-copy">${escapeHtml(pack.description || "No description yet.")}</div><div class="library-pack-counts">${escapeHtml(libraryPackCountSummary(pack.resource_counts || {}))}</div><div class="library-pack-access">Included with this world.</div>${locationList}${technicalDetails}</article>`;
    }

    function shortPackName(value) {
      return String(value || "")
        .replace(/^cosyworld\./, "")
        .replace(/^campaign\./, "");
    }

    function libraryPackCountSummary(counts) {
      const entries = [
        ["locations", "place", "places"],
        ["actors", "avatar", "avatars"],
        ["items", "item", "items"],
        ["cards", "card", "cards"],
        ["external_cards", "catalog item", "catalog items"],
        ["character_creation", "character path", "character paths"],
        ["rules", "rules reference", "rules references"],
        ["assets", "art asset", "art assets"],
      ];
      const visible = entries
        .map(([key, singular, plural]) => [Number(counts[key] || 0), singular, plural])
        .filter(([count]) => count > 0)
        .map(([count, singular, plural]) => `${count} ${count === 1 ? singular : plural}`);
      return visible.length ? visible.join(" · ") : "metadata-only world pack";
    }

    function pendingConversationHtml() {
      if (!actionBusy || pendingAction?.kind !== "orb-chat") return "";
      const speaker = actorForId(actorId);
      const name = speaker ? actorLabel(speaker) : "Your avatar";
      const aria = `${name} is choosing an opening line.`;
      return `<div class="line chat avatar pending" role="status" aria-label="${escapeAttr(aria)}">${chatPfpHtml({ actor_id: actorId }, name)}<span class="speaker">${escapeHtml(name)}</span><span class="text" aria-hidden="true"><span class="chat-thinking-dots"><i></i><i></i><i></i></span>choosing an opening line…</span></div>`;
    }

    function pendingChatsHtml() {
      if (actionBusy && pendingAction?.kind === "orb-chat") return "";
      return pendingChats.map((chat) => {
        const typingActorId = Number(chat.typingActorId || chat.targetActorId || 0);
        const actor = actorForId(typingActorId);
        const speaker = chat.typingName || (actor ? actorLabel(actor) : chat.targetName || "Someone nearby");
        const deciding = chat.stage === "deciding";
        const status = deciding ? "choosing chat or pass…" : "typing…";
        const aria = `${speaker} is ${deciding ? "choosing whether to chat or pass" : "typing"}. Your next actions are ready while the conversation unfolds.`;
        return `<div class="line chat avatar pending" role="status" aria-label="${escapeAttr(aria)}">${chatPfpHtml({ actor_id: typingActorId }, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><span class="text" aria-hidden="true"><span class="chat-thinking-dots"><i></i><i></i><i></i></span>${status}</span></div>`;
      }).join("");
    }

    function pendingModelInteractionsHtml() {
      return pendingModelInteractions.map((pending) => {
        const actor = actorForId(pending.targetActorId);
        const speaker = pending.targetName || (actor ? actorLabel(actor) : "A resident");
        const presentation = modelInteractionPresentation(pending.profile);
        const stage = presentation.pending[pending.stage] || presentation.pending.queued;
        const aria = presentation.pendingAria(speaker, stage);
        return `<div class="line model-output pending" role="status" aria-label="${escapeAttr(aria)}">${chatPfpHtml({ actor_id: pending.targetActorId }, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><span class="text" aria-hidden="true"><span class="chat-thinking-dots"><i></i><i></i><i></i></span>${escapeHtml(stage)}</span></div>`;
      }).join("");
    }

    function pendingAvatarArrivalHtml() {
      if (!actionBusy || pendingAction?.kind !== "avatar-arrival") return "";
      const creationProfile = pendingAction.creationProfile || null;
      const species = (creationProfile?.species || [])
        .find((choice) => choice.id === pendingAction.selectedSpeciesId)?.label;
      const origin = (creationProfile?.origins || [])
        .find((choice) => choice.id === pendingAction.selectedOriginId)?.label;
      const kicker = "the cottage is making room";
      const text = "A name, a face, and an unfinished path are finding their way to the door.";
      const cue = species && origin
        ? `${species}, from ${origin}. What they become will begin with their first choice.`
        : "Someone classless is arriving. What they become will begin with their first choice.";
      const aria = `${kicker}. ${text} ${cue}`;
      return `<div class="room-scene arrival-scene" role="status" aria-label="${escapeAttr(aria)}"><span class="room-scene-kicker">${escapeHtml(kicker)}</span><span class="room-scene-text">${escapeHtml(text)}</span><span class="room-scene-cue">${escapeHtml(cue)}</span></div>`;
    }

    function defeatTransitionHtml() {
      if (!defeatTransition) return "";
      const actor = defeatTransition.actorName || "Your avatar";
      const opponent = defeatTransition.opponentName || "the danger";
      const knockedOut = defeatTransition.kind === "combat.knockout";
      const canSummonRescuer = state?.primary_action?.kind === "summon_avatar";
      const kicker = knockedOut ? "knocked out" : "this tale has ended";
      const text = knockedOut
        ? `${actor} was knocked out by ${opponent}.`
        : `${actor} was defeated by ${opponent}.`;
      const cue = knockedOut
        ? canSummonRescuer
          ? "Their body is still where it fell, and the world keeps their identity, bonds, belongings, and journal. Summon one new traveler to attempt the rescue."
          : "Their body is still where it fell, and the world keeps their identity, bonds, belongings, and journal. Stay with them while help arrives."
        : "This avatar is gone. Any linked account and items are still here. Choose begin again below when you are ready.";
      const aria = `${kicker}. ${text} ${cue}`;
      return `<div class="room-scene defeat-scene" role="alert" aria-label="${escapeAttr(aria)}"><span class="room-scene-kicker">${escapeHtml(kicker)}</span><span class="room-scene-text">${escapeHtml(text)}</span><span class="room-scene-cue">${escapeHtml(cue)}</span></div>`;
    }

    function knockedOutObserverHtml() {
      const rescueAction = state?.primary_action?.kind;
      if (defeatTransition || !["await_rescue", "summon_avatar"].includes(rescueAction)) return "";
      const actor = actorForId(actorId);
      const name = actor?.name || "Your avatar";
      const text = `${name} is knocked out, but still present in this one shared world.`;
      const cue = rescueAction === "summon_avatar"
