    function renderStatusUpdates() {
      const updates = $("updates");
      const currentActorId = Number(actorId || 0);
      if (currentActorId !== firstTaleActorIdSeen) {
        firstTaleActorIdSeen = currentActorId;
        firstTaleStageSeen = 0;
        firstTaleCelebration = false;
        firstTaleCompletionSeen = false;
        firstTaleRenderSignature = "";
      }
      const firstThread = firstThreadModel();
      if (firstThread) {
        firstTaleStageSeen = Math.max(firstTaleStageSeen, Number(firstThread.stage || 0));
      }
      firstTaleCelebration = Boolean(
        currentActorId && state?.first_tale?.phase === "complete"
      );
      firstTaleCompletionSeen = firstTaleCelebration;
      updates.hidden = !firstThread && !firstTaleCelebration;
      const firstTaleEnding = firstTaleCompletionText(state);
      const html = firstThread
        ? journalRowHtml({
            label: "next",
            summary: firstThread.text,
            detail: `Your first tale continues when you ${lowerInitial(firstThread.text)}`,
            kind: "first-thread",
          })
        : firstTaleCelebration
          ? journalRowHtml({
              label: "tale",
              summary: "Your first tale is yours",
              detail: firstTaleEnding,
              kind: "first-thread complete",
            })
          : "";
      const signature = `${currentActorId}:${state?.first_tale?.phase || ""}:${state?.first_tale?.trace_event_seq || 0}:${firstThread?.text || firstTaleEnding}`;
      if (signature !== firstTaleRenderSignature) {
        updates.innerHTML = html;
        firstTaleRenderSignature = signature;
      }
    }

    function firstTaleCompletionText(view = state) {
      return String(
        view?.first_tale?.next_invitation
          || view?.first_tale?.completion_memory
          || "you changed the shared world and left the next visitor a clearer way."
      );
    }

    function firstTaleIsComplete(view = state) {
      return Boolean(actorId && view?.first_tale?.phase === "complete");
    }

    function nextStoryThreadModel(view = state, availableActions = actions) {
      const findAction = (...labels) => availableActions.find((action) => (
        labels.includes(String(action?.label || "").toLowerCase())
      )) || null;
      const findIntention = (...intentions) => availableActions.find((action) => (
        intentions.includes(String(action?.intention || "").toLowerCase())
      )) || null;
      const makeThread = (action, text, kind) => ({
        actionKey: action ? actionHandKey(action) : "",
        actionLabel: action?.label || "",
        kind,
        text: finishSentence(text),
      });

      const give = availableActions.find((action) => (
        ["give", "give item"].includes(String(action?.label || "").toLowerCase())
          && action.requestedGift === true
      )) || null;
      if (give) {
        const gift = String(give.detail || "").match(/^(.+?)\s+to\s+(.+)$/i);
        return makeThread(
          give,
          gift ? `${gift[2]} is waiting for ${gift[1]}` : "A nearby avatar is hoping for one of your keepsakes",
          "gift",
        );
      }
      const urgentUse = availableActions.find((action) => (
        String(action?.label || "").toLowerCase() === "use"
          && Number(actionRank(action)) <= 10
      ));
      if (urgentUse) {
        return makeThread(urgentUse, "One of your keepsakes could help someone right now", "care");
      }
      const sharedWork = findIntention("contribute") || findAction("prepare");
      if (sharedWork) {
        const question = (view?.shared_questions || []).find((candidate) => (
          candidate.promoted && candidate.presentation_state === "active"
        ));
        return makeThread(
          sharedWork,
          question?.question || `There is shared work waiting in ${view?.location?.name || "this room"}`,
          "work",
        );
      }
      const danger = findAction("attack", "defend", "flee");
      if (danger) {
        return makeThread(danger, "Something dangerous here needs a careful answer", "danger");
      }
      const inspect = findIntention("inspect");
      if (inspect) {
        const roomName = String(view?.location?.name || "this room");
        const target = String(inspect?.target?.label || inspect.detail || "").trim();
        if (target && target !== roomName) {
          return makeThread(inspect, `${target} is still hiding something`, "search");
        }
      }
      const scout = findIntention("scout");
      if (scout) {
        const destination = String(scout?.target?.label || scout.detail || "").replace(/^toward\s+/i, "").trim();
        return makeThread(
          scout,
          destination ? `The next stretch toward ${destination} is waiting to be scouted` : "A route is waiting to be scouted",
          "scout",
        );
      }
      const travel = findIntention("travel");
      if (travel) {
        const choices = Array.isArray(travel.choices) ? travel.choices : [];
        const destination = String(travel?.target?.label || travel.detail || "").replace(/^to\s+/i, "").trim();
        return makeThread(
          travel,
          choices.length > 1 || !destination || destination === "choose a path"
            ? "A few paths are open when you're ready"
            : `A path to ${destination} is waiting`,
          "travel",
        );
      }
      if (inspect) {
        const roomName = String(view?.location?.name || "this room");
        return makeThread(inspect, `Something in ${roomName} is still waiting to be found`, "search");
      }
      const chat = findAction("chat");
      if (chat) {
        const target = String(chat.targetName || "").trim();
        return makeThread(chat, target ? `${target} has more to say` : "Someone nearby has more to say", "chat");
      }
      const hook = (view?.room_sheet?.hooks || []).map((value) => String(value || "").trim()).find(Boolean);
      if (hook) {
        return makeThread(null, `${hook.charAt(0).toUpperCase()}${hook.slice(1)}`, "room");
      }
      return null;
    }

    function renderRoomMemory() {
      const toggle = $("room-log-toggle");
      const panel = $("room-memory");
      const memory = roomMemoryModel();
      const latestJournalEvent = narratedTranscriptEvents(
        logEvents.filter(eventIsJournalEvent),
      ).at(-1);
      const latestText = latestJournalEvent
        ? journalEventSummary(latestJournalEvent)
        : memory.hasLatestEvent
          ? atmosphericMemoryBeat(memory.latest) || memory.latest.text
          : "";
      toggle.hidden = false;
      renderRoomLogLatest(latestText);
      panel.hidden = false;
      panel.innerHTML = journalRowHtml({
        label: "room",
        summary: atmosphericMemoryBeat(memory.latest) || memory.latest.text,
        detail: memory.summary || openingBeat(state),
        kind: "memory",
      });
    }

    function renderRoomLogLatest(text) {
      const toggle = $("room-log-toggle");
      const latest = $("room-log-latest");
      const track = $("room-log-latest-track");
      const value = String(text || "").trim();
      if (roomLogTickerFrame !== null) {
        window.cancelAnimationFrame(roomLogTickerFrame);
        roomLogTickerFrame = null;
      }
      toggle.dataset.latest = value;
      latest.hidden = !value;
      latest.classList.remove("is-overflowing");
      latest.style.removeProperty("--room-log-duration");
      latest.style.removeProperty("--room-log-overflow");
      track.textContent = value;
      if (!value) return;
      roomLogTickerFrame = window.requestAnimationFrame(() => {
        roomLogTickerFrame = null;
        const overflow = Math.max(0, Math.ceil(track.scrollWidth - latest.clientWidth));
        if (overflow <= 4) return;
        latest.style.setProperty("--room-log-overflow", `${overflow}px`);
        latest.style.setProperty("--room-log-duration", `${Math.min(28, Math.max(9, 6 + overflow / 22))}s`);
        latest.classList.add("is-overflowing");
      });
    }

    function sharedQuestionsForPresentation(view = state) {
      const questions = Array.isArray(view?.shared_questions) ? view.shared_questions : [];
      const promoted = questions
        .filter((question) => question.promoted && question.presentation_state === "active")
        .sort((left, right) => Number(left.promotion_rank || 999) - Number(right.promotion_rank || 999));
      if (promoted.length) return promoted;
      return questions
        .filter((question) => question.presentation_state === "completed_memory")
        .sort((left, right) => Number(right.updated_event_seq || 0) - Number(left.updated_event_seq || 0))
        .slice(0, 1);
    }

    function sharedQuestionHtml(question) {
      const completed = question.presentation_state === "completed_memory";
      const rhythm = String(question.rhythm || "shared").replaceAll("_", " ");
      const progress = `${Number(question.filled || 0)}/${Number(question.segments || 0)}`;
      const available = (question.strategies || []).filter((strategy) => strategy.available);
      const helpers = available
        .slice(0, 3)
        .map((strategy) => [
          journalClause(strategy.label || "contribute"),
          strategy.target_label ? `at ${journalClause(strategy.target_label)}` : "",
        ].filter(Boolean).join(" "))
        .filter(Boolean);
      const participants = (question.participant_names || []).slice(0, 4).filter(Boolean);
      const recent = (question.recent_contributions || []).slice(0, 2);
      const attrs = ` data-clock-presentation data-clock-id="${escapeAttr(question.progress_clock_id || "")}" data-question-state="${completed ? "completed_memory" : "active"}"`;
      const action = `<button type="button" data-question-comprehension>${completed ? "understood" : "mark understood"}</button>`;
      if (completed) {
        const hands = recent
          .map((entry) => `${entry.actor_name || "a traveler"} ${lowerInitial(entry.strategy_label || "helped")}`)
          .join(" and ");
        const detail = [
          journalClause(question.completion_memory || question.situation),
          hands ? `${hands} helped change it` : "",
          participants.length ? `${participants.join(", ")} were involved` : "",
        ].filter(Boolean).join("; ");
        return journalRowHtml({
          label: "changed",
          summary: question.completion_memory || question.situation,
          detail,
          progress,
          kind: "completed-memory",
          attrs,
          action,
        });
      }
      const detail = [
        journalClause(question.situation),
        `progress is ${progress}`,
        question.outcome ? `finishing could ${lowerInitial(journalClause(question.outcome))}` : "",
        helpers.length ? `help by ${helpers.join(", ")}` : "",
      ].filter(Boolean).join("; ");
      return journalRowHtml({
        label: `${rhythm} question`,
        summary: question.question,
        detail,
        progress,
        kind: "active-question",
        attrs,
        action,
      });
    }

    function renderSharedQuestions() {
      const panel = $("shared-questions");
      const questions = sharedQuestionsForPresentation();
      panel.hidden = questions.length === 0;
      panel.innerHTML = questions.map(sharedQuestionHtml).join("");
      if (questions.length && journalOpen) scheduleVisibleClockPresentationReceipts();
    }

    function eventIsJournalEvent(event) {
      if (!event || eventIsMuted(event) || eventIsHiddenContext(event) || eventIsLowSignalStatus(event)) return false;
      if (
        (event.location_id || event.destination_location_id)
        && !eventMatchesCurrentLocation(event)
      ) return false;
      if (event.type === "message.created") return true;
      const meta = statusUpdateMeta(event);
      return Boolean(meta?.text || sceneCardEventText(event));
    }

    function journalEventSummary(event) {
      if (event.type === "message.created") {
        return journalSummary(`${event.actor_name || "CosyWorld"} — ${eventText(event)}`);
      }
      if (isRollEvent(event)) {
        const roll = rollMeta(event);
        return journalSummary(`${roll.title} · ${roll.result}`);
      }
      const meta = statusUpdateMeta(event);
      return journalSummary(meta?.text || sceneCardEventText(event));
    }

    function journalEventHtml(event) {
      if (event.type === "message.created") {
        const text = eventText(event);
        return journalRowHtml({
          label: "chat",
          summary: journalEventSummary(event),
          detail: text,
          kind: event.actor_id === actorId ? "you" : "chat",
        });
      }
      if (isRollEvent(event)) {
        const roll = rollMeta(event);
        return journalRowHtml({
          label: roll.label || "roll",
          summary: journalEventSummary(event),
          detail: roll.story || [roll.detail, roll.result].filter(Boolean).join("; "),
          kind: event.success ? "success" : "failure",
        });
      }
      const meta = statusUpdateMeta(event);
      const summary = journalEventSummary(event);
      if (!summary) return "";
      const exposureId = worldBeatExposureId(event);
      const attrs = exposureId
        ? ` data-world-beat-exposure="${escapeAttr(exposureId)}" data-world-beat-seq="${Number(event.seq)}"`
        : "";
      return journalRowHtml({
        label: meta?.label || "event",
        summary,
        detail: sceneCardEventText(event) || summary,
        kind: meta?.kind || "status",
        attrs,
      });
    }

    function renderJournalLog() {
      const panel = $("journal-log");
      const stream = panel.closest(".journal-stream");
      const previousScrollTop = stream?.scrollTop || 0;
      const wasAtBottom = !stream
        || stream.scrollHeight <= stream.clientHeight + 1
        || stream.scrollHeight - stream.scrollTop - stream.clientHeight < 28;
      const events = narratedTranscriptEvents(logEvents.filter(eventIsJournalEvent)).slice(-60);
      panel.innerHTML = events.length
        ? events.map(journalEventHtml).join("")
        : journalRowHtml({
            label: "room",
            summary: "Nothing has been written here yet",
            detail: "Chat with someone or explore the room to leave the first trace",
            kind: "empty",
          });
      if (stream) {
        stream.scrollTop = wasAtBottom ? stream.scrollHeight : previousScrollTop;
      }
    }

    function roomMemoryModel() {
      const serverMemory = state?.room_memory;
      const serverRecent = Array.isArray(serverMemory?.recent)
        ? dedupeRoomMemoryEntries(
            serverMemory.recent
              .map(normalizeRoomMemoryEntry)
              .filter((entry) => entry && entry.kind !== "chat")
          )
        : [];
      const normalizedServerLatest = normalizeRoomMemoryEntry(serverMemory?.latest);
      const serverLatest = serverRecent[serverRecent.length - 1] || (normalizedServerLatest?.kind === "chat" ? null : normalizedServerLatest);
      const localEntries = logEvents.map(roomMemoryEntryForEvent).filter((entry) => entry && entry.kind !== "chat");
      const serverLatestSeq = Number(serverMemory?.latest_seq || serverLatest?.seq || 0);
      const newerLocalEntries = serverLatestSeq
        ? localEntries.filter((entry) => {
            const seq = Number(entry.seq || 0);
            return !Number.isFinite(seq) || seq > serverLatestSeq;
          })
        : [];
      if (serverMemory && (serverLatest || serverRecent.length || serverMemory.summary)) {
        const recent = dedupeRoomMemoryEntries([...serverRecent, ...newerLocalEntries]).slice(-8);
        const latestEvent = preferredRoomLogEntry(recent, serverLatest);
        const latest = latestEvent || {
          kind: "room",
          label: "room",
          text: openingBeat(state),
        };
        return {
          latest,
          recent: recent.length ? recent : [latest],
          summary: String(serverMemory.summary || openingBeat(state)).trim(),
          hasLatestEvent: Boolean(latestEvent),
        };
      }
      const entries = dedupeRoomMemoryEntries(localEntries);
      const latestEvent = preferredRoomLogEntry(entries);
      const latest = latestEvent || {
        kind: "room",
        label: "room",
        text: openingBeat(state),
      };
      return {
        latest,
        recent: entries.slice(-5),
        summary: roomMemorySummary(entries),
        hasLatestEvent: Boolean(latestEvent),
      };
    }

    function preferredRoomLogEntry(entries, fallback = null) {
      const recent = Array.isArray(entries) ? entries : [];
      const latestHumanCardBeat = recent.slice().reverse().find((entry) => {
        const entryActorId = Number(entry?.actorId || entry?.actor_id || 0);
        if (!entryActorId) return false;
        const entryActor = actorForId(entryActorId);
        const human = entryActorId === Number(actorId || 0)
          || String(entryActor?.kind || "").toLowerCase() === "human";
        const derivedMemory = String(entry?.label || "").toLowerCase() === "memory";
        return human && !derivedMemory;
      });
      return latestHumanCardBeat || recent[recent.length - 1] || fallback;
    }

    function normalizeRoomMemoryEntry(entry) {
      if (!entry) return null;
      const kind = String(entry.kind || "event");
      const rawLabel = String(entry.label || kind || "event");
      const label = kind === "ledger" && rawLabel.toLowerCase() === "ledger"
        ? "memory"
        : kind === "bond" && rawLabel.toLowerCase() === "bond"
          ? "friendship"
          : rawLabel.toLowerCase() === "calling"
            ? "purpose"
            : rawLabel;
      let text = cleanStatusText(entry.text || "")
        .replace(/^A moment stays with you:\s*/i, "")
        .replace(/([.!?])\1+$/g, "$1");
      if (kind === "item") {
        const usefulItem = text.match(/^takes (.+?)\.\s+(.+?) could use (.+?) with (.+?)\.$/i);
        if (usefulItem && usefulItem[1].toLowerCase() === usefulItem[3].toLowerCase()) {
          text = `${usefulItem[2]} carries ${usefulItem[1]} toward ${usefulItem[4]}.`;
        } else {
          text = text.replace(/^take (.+)\.$/i, "$1 changes hands.");
        }
      }
      if (label.toLowerCase() === "join") {
        text = text.replace(/^(.+) entered (.+)$/i, "$1 arrived in $2");
      }
      if (kind === "calling" || rawLabel.toLowerCase() === "calling") {
        text = text.replace(/^choose what calls you:\s*/i, "");
      }
      if (!text) return null;
      return {
        seq: entry.seq,
        actorId: entry.actorId || entry.actor_id || null,
        kind,
        label,
        text,
        actorName: entry.actorName || entry.actor_name || "",
        targetActorName: entry.targetActorName || entry.target_actor_name || "",
        sourceLocationId: entry.sourceLocationId || entry.location_id || null,
        sourceLocationName: entry.sourceLocationName || entry.location_name || "",
        destinationLocationId: entry.destinationLocationId || entry.destination_location_id || null,
        destinationName: entry.destinationName || entry.destination_location_name || "",
        itemName: entry.itemName || entry.item_name || "",
        targetItemName: entry.targetItemName || entry.target_item_name || "",
      };
    }

    function dedupeRoomMemoryEntries(entries) {
      const seen = new Set();
      const unique = [];
      for (let index = entries.length - 1; index >= 0; index -= 1) {
        const entry = entries[index];
        if (!entry?.text) continue;
        const key = memoryPhrase(entry.text).toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        unique.unshift(entry);
      }
      return unique;
    }

    function roomMemoryEntryForEvent(event) {
      if (!event) return null;
      if (event.type === "message.created") {
        return null;
      }
      if (
        ["clock.updated", "clock.threshold", "job.updated"].includes(String(event.type || ""))
        && (causalJobContributionEvent(event) || physicalDeliveryEventFor(event))
      ) {
        return null;
      }
      if (
        event.type === "tag.applied"
        && ["search_location", "search_feature"].includes(String(event.content || ""))
      ) {
        return null;
      }
      if (isRollEvent(event)) {
        const meta = rollMeta(event);
      return {
        seq: event.seq,
        actorId: event.actor_id || null,
        kind: "roll",
        label: meta.label,
        text: cleanStatusText(meta.story),
        actorName: event.actor_name || "",
        targetActorName: event.target_actor_name || "",
        sourceLocationId: event.location_id || null,
        sourceLocationName: event.location_name || "",
        destinationLocationId: event.destination_location_id || null,
        destinationName: event.destination_location_name || "",
        itemName: event.item_name || "",
        targetItemName: event.target_item_name || "",
      };
      }
      const meta = statusUpdateMeta(event);
      if (!meta.text) return null;
      return {
        seq: event.seq,
        actorId: event.actor_id || null,
        kind: meta.kind || "event",
        label: meta.label || "event",
        text: cleanStatusText(meta.text),
        actorName: event.actor_name || "",
        targetActorName: event.target_actor_name || "",
        sourceLocationId: event.location_id || null,
        sourceLocationName: event.location_name || "",
        destinationLocationId: event.destination_location_id || null,
        destinationName: event.destination_location_name || "",
        itemName: event.item_name || "",
        targetItemName: event.target_item_name || "",
      };
    }

    function roomMemorySummary(entries) {
      const recent = entries.slice(-9);
      if (!recent.length) return openingBeat(state);
      const beats = recent
        .slice()
        .reverse()
        .map(atmosphericMemoryBeat)
        .filter(Boolean)
        .slice(0, 2)
        .reverse();
      if (!beats.length) return openingBeat(state);
      return finishSentence(`${withoutFinalPeriod(openingBeat(state))} ${beats.join(" ")}`);
    }

    function memoryPhrase(value) {
      return String(value || "").trim().replace(/[.!?]+$/g, "");
    }

    function atmosphericMemoryBeat(entry) {
      if (!entry) return "";
      const label = cleanStatusText(entry.label || "");
      const rawText = cleanStatusText(entry.text || "");
      const text = memoryPhrase(entry.text);
      const kind = String(entry.kind || "").toLowerCase();
      const actor = cleanStatusText(entry.actorName || entry.actor_name || "");
      const sourceLocationId = Number(entry.sourceLocationId || entry.location_id || 0);
      const destinationLocationId = Number(entry.destinationLocationId || entry.destination_location_id || 0);
      const destination = cleanStatusText(entry.destinationName || entry.destination_location_name || "");
      if (!text) return "";
      if (kind === "status" && /^Report submitted for .+\.$/i.test(rawText)) return rawText;
      if (kind === "chat") return finishSentence(`${possessive(label || actor || "someone")} voice stayed in the room`);
      if (kind === "move") {
        const currentLocationId = Number(state?.location?.id || 0);
        if (
          actor
          && destination
          && currentLocationId > 0
          && sourceLocationId === currentLocationId
          && destinationLocationId !== currentLocationId
        ) {
          return `${actor} left for ${destination}.`;
        }
        if (actor && destination) return `${actor} arrived at ${destination}.`;
        const match = text.match(/^(.*?):\s*(.*?)\s*->\s*(.*)$/) || text.match(/^(.*?)\s+moved from\s+(.*?)\s+to\s+(.*)$/i);
        if (match) return `${(match[1] || "Someone").trim()} arrived at ${(match[3] || "somewhere").trim()}.`;
        const entered = text.match(/^(.*?)\s+(?:entered|arrived in)\s+(.+)$/i);
        if (entered) return `${entered[1].trim()} arrived in ${entered[2].trim()}.`;
        return finishSentence(actor ? `${actor}: ${text}` : text);
      }
      if (kind === "hand") {
        if (/^new cards$/i.test(text)) return "A fresh hand of actions is ready.";
        return finishSentence(text);
      }
      if (kind === "search") {
        const path = text.match(/(?:a\s+)?way\s+to\s+(.+?)(?:\s+becomes\s+clear)?$/i);
        if (path?.[1]) return `A path to ${path[1].trim()} opened.`;
        return finishSentence(text);
      }
      if (kind === "roll") {
        if (actor && /^listens?:/i.test(text)) {
          return finishSentence(`${actor} ${text}`);
        }
        return finishSentence(text);
      }
      if (kind === "item") {
        return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
      }
      if (kind === "trade") return finishSentence(actor ? `${actor} ${text}` : text);
      if (kind === "bond") {
        if (actor && /^closer to /i.test(text)) return finishSentence(`${actor} grew ${text}`);
        return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
      }
      if (kind === "calling") {
        const purpose = text.replace(/^what draws you in:\s*/i, "");
        return finishSentence(actor ? `${actor} chose a purpose: ${purpose}` : purpose);
      }
      if (kind === "bank") return finishSentence(actor ? `${actor} grew from what happened` : text);
      if (kind === "growth") return finishSentence(actor ? `${actor} put what they learned into practice` : text);
      if (kind === "skill") return finishSentence(actor ? `${actor}: ${text}` : text);
      if (kind === "ledger") return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
      return finishSentence(actor && !text.toLowerCase().startsWith(actor.toLowerCase()) ? `${actor} ${text}` : text);
    }

    function possessive(name) {
      const text = cleanStatusText(name || "someone");
      return text.endsWith("s") ? `${text}'` : `${text}'s`;
    }

    function roomMemoryEntryHtml(entry) {
      return `<div class="memory-entry ${escapeAttr(entry.kind)}"><span class="memory-entry-label">${escapeHtml(entry.label)}</span><span class="memory-entry-text">${escapeHtml(entry.text)}</span></div>`;
    }

    function eventIsLowSignalStatus(event) {
      return event?.type === "world.reset"
        || event?.type === "action.offer_rejected"
        || event?.type === "advancement.spent"
        || String(event?.type || "").startsWith("community_art.");
    }

    function statusUpdateHtml(event) {
      const meta = statusUpdateMeta(event);
      const attrs = ` aria-label="${escapeAttr(`${meta.label}: ${meta.text}`)}"`;
      return `<div class="update-pill ${escapeAttr(meta.kind)}"${attrs}><span class="update-label">${escapeHtml(meta.label)}</span><span class="update-text">${escapeHtml(meta.text)}</span></div>`;
    }

    function statusUpdateMeta(event) {
      const repeat = Number(event.repeat_count || 0);
      const repeatSuffix = repeat > 1 ? ` x${repeat}` : "";
      if (event.type === "ledger.marked") {
        return { kind: "ledger", label: "memory", text: cleanStatusText(ledgerEventLabel(event)) };
      }
      if (event.type === "ledger.banked") {
        return { kind: "ledger", label: "growth", text: cleanStatusText(ledgerBankedEventLabel(event)) };
      }
      if (event.type === "advancement.spent") {
        return { kind: "growth", label: "change", text: cleanStatusText(advancementEventLabel(event)) };
      }
      if (event.type === "skill.stepped") {
        return { kind: "skill", label: "ability", text: cleanStatusText(skillEventLabel(event)) };
      }
      if (event.type === "calling.set") {
        if (event.actor_id === actorId) {
          return { kind: "calling", label: "purpose", text: `What draws you in: ${cleanStatusText(callingEventLabel(event))}` };
        }
        return { kind: "calling", label: "purpose", text: cleanStatusText(callingEventLabel(event)) };
      }
      if (event.type === "calling.revised") {
        if (event.actor_id === actorId) {
          return { kind: "calling", label: "purpose", text: `What draws you in: ${cleanStatusText(callingEventLabel(event))}` };
        }
        return { kind: "calling", label: "purpose", text: cleanStatusText(callingEventLabel(event)) };
      }
      if (event.type === "bond.deepened") {
        return { kind: "bond", label: "friendship", text: `closer to ${event.target_actor_name || "someone"}` };
      }
      if (event.type === "bond.created") {
        return { kind: "bond", label: "friendship", text: `${event.target_actor_name || "someone"} now matters to you` };
      }
      if (event.type === "bond.revised") {
        return { kind: "bond", label: "friendship", text: `what ${event.target_actor_name || "someone"} means to you changed` };
      }
      if (event.type === "bond.resolved") {
        return { kind: "bond", label: "friendship", text: `what mattered with ${event.target_actor_name || "someone"} stays with you` };
      }
      if (event.type === "actor.moved") {
        const actor = event.actor_name || "someone";
        return { kind: "move", label: "move", text: `${actor}: ${event.location_name || "somewhere"} -> ${event.destination_location_name || "somewhere"}` };
      }
      if (event.type === "actor.created") {
        const actor = actorNameForEvent(event);
        if (event.actor_id === actorId) {
          const title = actorTitleForEvent(event);
          return {
            kind: "move",
            label: "you",
            text: `arrive as ${actor}${title ? `, ${title}` : ""}`,
          };
        }
        return { kind: "move", label: "join", text: `${actor} entered ${event.location_name || "the room"}` };
      }
      if (event.type === "actor.entered_location") {
        return { kind: "move", label: "join", text: `arrived ${event.location_name || "here"}` };
      }
      if (event.type === "move.blocked") {
        return { kind: "move", label: "locked", text: event.destination_location_name || "path blocked" };
      }
      if (event.type === "hand.shuffled") {
        return { kind: "hand", label: "hand", text: "new actions" };
      }
      if (event.type === "turn.ping_started") {
        const actor = event.actor_name || "someone";
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "nudge", text: `${actor} gently nudged ${target}${repeatSuffix}` };
      }
      if (event.type === "turn.pong") {
        const actor = event.actor_name || "someone";
        return { kind: "hand", label: "ready", text: `${actor} is here for the next choice${repeatSuffix}` };
      }
      if (event.type === "turn.ping_skipped") {
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "next", text: `${target} was away, so the choice passed on${repeatSuffix}` };
      }
      if (event.type === "turn.timeout_requested") {
        const actor = event.actor_name || "someone";
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "timeout", text: `${actor} asked ${target} to play or pass${repeatSuffix}` };
      }
      if (event.type === "turn.timeout_passed") {
        const target = event.target_actor_name || "the current player";
        return { kind: "hand", label: "passed", text: `${target} passed${repeatSuffix}` };
      }
      if (event.type === "feature.searched" || event.type === "location.searched") {
        return { kind: "search", label: "search", text: cleanStatusText(searchEventText(event)) };
      }
      if (event.type === "exit.discovered") {
        return { kind: "search", label: "entrance", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "ability_check.rolled") {
        const studying = event.content === "study";
        const noticing = event.content === "notice";
        return {
          kind: "roll",
          label: studying ? "study" : (noticing ? "notice" : "check"),
          text: cleanStatusText(abilityCheckEventText(event)),
        };
      }
      if (event.type === "study.resolved") {
        return {
          kind: "roll",
          label: "study",
          text: event.content?.includes("yielded")
            ? "the signs yield one understood truth"
            : "the signs remain unresolved",
        };
      }
      if (event.type === "job.contribution.resolved") {
        return { kind: "world", label: "approach", text: cleanStatusText(jobContributionEventText(event)) };
      }
      if (event.type === "clock.threshold") {
        return { kind: "world", label: "turning point", text: cleanStatusText(event.content || "The shared work reaches a turning point.") };
      }
      if (event.type === "natural_feature.revealed") {
        return { kind: "world", label: "discovery", text: naturalFeatureEventText(event) };
      }
      if (event.type === "combat.attack.attempt") {
        return { kind: "roll", label: "roll", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "combat.pass") {
        return { kind: "hand", label: "pass", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "combat.need_time") {
        return { kind: "hand", label: "pause", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "item.traded") {
        return { kind: "trade", label: "trade", text: cleanStatusText(eventText(event)) };
      }
      if (event.type === "command.output") {
        return {
          kind: "status",
          label: "status",
          text: cleanStatusText(String(event.content || "").split(/\n+/).map((line) => line.trim()).filter(Boolean).join(" ")),
        };
      }
      return { kind: statusKindForEvent(event), label: statusLabelForEvent(event), text: cleanStatusText(eventText(event)) };
    }

    function statusKindForEvent(event) {
      const type = String(event?.type || "");
      if (type.startsWith("item.")) return "item";
      if (type.startsWith("combat.")) return "combat";
      if (type === "exit.discovered") return "search";
      if (type === "encounter.reset") return "combat";
      if (type === "hand.shuffled") return "hand";
      if (type.startsWith("turn.")) return "hand";
      if (
        type === "job.contribution.resolved"
        || type === "clock.updated"
        || type === "clock.threshold"
        || type === "natural_feature.revealed"
        || type === "tag.applied"
        || type === "tag.cleared"
        || type === "job.updated"
      ) return "world";
      return "status";
    }

    function statusLabelForEvent(event) {
      const type = String(event?.type || "");
      if (type.startsWith("item.")) return "item";
      if (type.startsWith("combat.")) return "combat";
      if (type === "exit.discovered") return "entrance";
      if (type === "encounter.reset") return "frontier";
      if (type === "hand.shuffled") return "hand";
      if (type.startsWith("turn.")) return "turn";
      if (type === "job.contribution.resolved") return "approach";
      if (type === "clock.updated") return "clock";
      if (type === "clock.threshold") return "turning point";
      if (type === "natural_feature.revealed") return "discovery";
      if (type.startsWith("tag.")) return "tag";
      if (type === "job.updated") return "job";
      return "event";
    }

    function cleanStatusText(value) {
      const text = String(value || "").trim();
      return text
        .replace(/:{1,2}(resident_feature_use|resident_autonomy_intent)\b/g, "")
        .replace(/^you:\s*/i, "")
        .replace(/^You\s+/, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function renderLog() {
      const log = $("log");
      const previousScrollTop = log.scrollTop;
      const wasAtBottom = log.scrollHeight <= log.clientHeight + 1
        || log.scrollHeight - log.scrollTop - log.clientHeight < 28;
      const libraryPanel = libraryPanelHtml();
      const accountPanel = accountPanelHtml();
      const visibleEvents = pacedChatTranscriptEvents(logEvents.filter(eventIsChatTranscriptEvent));
      const pendingConversation = pendingConversationHtml();
      const pendingChatReplies = pendingChatsHtml();
      const pendingArrival = pendingAvatarArrivalHtml();
      const defeatScene = defeatTransitionHtml();
      const hasChat = visibleEvents.length > 0 || Boolean(pendingConversation) || Boolean(pendingChatReplies);
      const inferredOnly = visibleEvents.length > 0 && visibleEvents.every(messageActorUsesInference);
      log.classList.toggle("library-mode", Boolean(libraryPanel));
      log.classList.toggle("account-mode", !libraryPanel && Boolean(accountPanel));
      log.classList.toggle("chat-mode", !libraryPanel && !accountPanel && hasChat);
      log.classList.toggle("room-mode", !libraryPanel && !accountPanel && !hasChat && !pendingArrival && !defeatScene);
      log.classList.toggle("arrival-mode", !libraryPanel && !accountPanel && Boolean(pendingArrival || defeatScene));
      log.classList.toggle("quiet-mode", !libraryPanel && !accountPanel && inferredOnly);
      const panelMode = libraryPanel ? "library" : (accountPanel ? "account" : "");
      document.querySelector(".terminal")?.classList.toggle("panel-open", Boolean(panelMode));
      document.querySelector(".prompt").hidden = Boolean(panelMode || journalOpen);
      if (panelMode) {
        log.setAttribute("role", "region");
        log.setAttribute("aria-label", panelMode === "library" ? "World Library" : "Your avatar and collection");
        log.removeAttribute("aria-live");
        log.removeAttribute("aria-relevant");
      } else {
        log.setAttribute("role", "log");
        log.setAttribute("aria-label", "Shared room chat");
        log.setAttribute("aria-live", "polite");
        log.setAttribute("aria-relevant", "additions text");
      }
      if (libraryPanel) {
        log.innerHTML = libraryPanel;
        log.scrollTop = 0;
        return;
      }
      if (accountPanel) {
        log.innerHTML = accountPanel;
        log.scrollTop = 0;
        return;
      }
      if (defeatScene) {
        log.innerHTML = defeatScene;
        log.scrollTop = 0;
        return;
      }
      if (pendingArrival) {
        log.innerHTML = pendingArrival;
        log.scrollTop = 0;
        return;
      }
      if (!hasChat) {
        renderedChatTailKey = "";
        log.innerHTML = quietRoomSceneHtml();
        log.scrollTop = 0;
        return;
      }
      const tailEvent = visibleEvents[visibleEvents.length - 1] || null;
      const chatTailKey = [
        tailEvent?.seq ?? "",
        tailEvent?.repeat_count ?? 1,
        pendingConversation ? "conversation" : "",
        pendingChats.map((chat) => chat.id).join(","),
      ].join(":");
      const tailChanged = chatTailKey !== renderedChatTailKey;
      renderedChatTailKey = chatTailKey;
      log.innerHTML = `${visibleEvents.map(transcriptEventHtml).join("")}${pendingConversation}${pendingChatReplies}`;
      log.scrollTop = tailChanged || wasAtBottom ? log.scrollHeight : previousScrollTop;
      scheduleVisibleWorldBeatReceipts();
    }

    function menuNavHtml(active = menuSection) {

    function deckWeightLabel(tenths) {

    function deckCardRow(card, actionHtml = "") {

    function deckPanelHtml() {

      const preparedSpells = Array.isArray(deck.prepared_spell_cards) ? deck.prepared_spell_cards : [];
      const exhaustedCards = Array.isArray(deck.exhausted_cards) ? deck.exhausted_cards : [];
      const exhaustedSpellIds = new Set((Array.isArray(deck.exhausted_spell_cards) ? deck.exhausted_spell_cards : []).map((card) => Number(card.id)));
      const preparedSpellIds = new Set(preparedSpells.map((card) => Number(card.id)));
      const spellSlots = Number(deck.spell_deck_slots || 0);
      const containers = Array.isArray(deck.containers) ? deck.containers : [];
      const validationErrors = Array.isArray(deck.validation_errors) ? deck.validation_errors : [];
      const bagPreviews = Array.isArray(deck.bag_previews) ? deck.bag_previews : [];
      const slots = Number(deck.bracelet_slots || 0);
      const expansion = deck.charm_slot_expansion || null;
      const unlock = expansion
        ? `<div class="keepsake-note"><strong>${escapeHtml(expansion.label || "Make room")}</strong><br>${escapeHtml(expansion.explanation || "")}</div><button class="account-button secondary" type="button" data-unlock-charm-slot>${escapeHtml(expansion.label || "Make room")} · ${Number(expansion.advancement_cost || 1)} advancement</button>`
        : "";
      const charmRows = [
        ...equipped.map((card) => deckCardRow(card, `<button class="account-button secondary" type="button" data-set-charm="${card.id}" data-equipped="false">remove</button>`)),
        ...available.map((card) => deckCardRow(card, `<button class="account-button secondary" type="button" data-set-charm="${card.id}" data-equipped="true"${equipped.length >= slots ? " disabled" : ""}>wear</button>`)),
      ].join("");
      const firstContainer = containers[0]?.container || null;
      const carriedRows = carried.length ? carried.map((card) => {
        const receipt = (state?.account?.materialization_receipts || []).find((entry) => (
          Number(entry.item_id) === Number(card.id) && entry.status === "materialized"
        ));
        const actionParts = [];
        if (["weapon", "container", "tool"].includes(String(card.role || ""))) {
          const equipped = card.zone === "equipped";
          actionParts.push(`<button class="account-button secondary" type="button" data-set-item-equipped="${card.id}" data-equipped="${equipped ? "false" : "true"}">${equipped ? "unequip" : "equip"}</button>`);
        } else if (card.zone === "contained") {
          actionParts.push(`<button class="account-button secondary" type="button" data-set-contained="${card.id}" data-container="">take out</button>`);
        } else if (firstContainer && !["skill_charm", "spell"].includes(String(card.role || ""))) {
          actionParts.push(`<button class="account-button secondary" type="button" data-set-contained="${card.id}" data-container="${firstContainer.id}">put in ${escapeHtml(firstContainer.name)}</button>`);
        }
        if (receipt && card.zone === "carried") {
          actionParts.push(`<button class="account-button secondary" type="button" data-unmaterialize-receipt="${escapeAttr(receipt.id)}">return to collection</button>`);
        }
        return deckCardRow(card, actionParts.join(""));
      }).join("") : `<div class="deck-empty">Your carried deck is empty. Pick up item cards in the world.</div>`;
      const spellRows = spells.length ? spells.map((card) => {
        const prepared = preparedSpellIds.has(Number(card.id));
        const exhausted = exhaustedSpellIds.has(Number(card.id));
        const actionHtml = exhausted
          ? `<span class="account-wallet">exhausted</span>`
          : `<button class="account-button secondary" type="button" data-set-spell="${card.id}" data-prepared="${prepared ? "false" : "true"}"${!prepared && preparedSpells.length >= spellSlots ? " disabled" : ""}>${prepared ? "unprepare" : "prepare"}</button>`;
        return deckCardRow(card, actionHtml);
      }).join("") : `<div class="deck-empty">No spell cards are currently carried.</div>`;
      const loadoutRows = [deck.equipped_weapon, ...(Array.isArray(deck.equipped_containers) ? deck.equipped_containers : [])]
        .filter(Boolean)
        .map((card) => deckCardRow(card))
        .join("");
      const containerRows = containers.map((entry) => {
        const contentNames = (entry.contents || []).map((card) => card.name).join(", ") || "empty";
        return `<div class="keepsake-note"><strong>${escapeHtml(entry.container?.name || "container")}</strong> · ${entry.equipped ? "equipped" : "inactive"} · opening ${escapeHtml(entry.opening_size || "none")} · contents: ${escapeHtml(contentNames)}</div>`;
      }).join("");
      const validation = validationErrors.map((message) => `<div class="deck-empty">${escapeHtml(message)}</div>`).join("");
      const previews = bagPreviews.map((message) => `<div class="keepsake-note">${escapeHtml(message)}</div>`).join("");
      const exhaustedRows = exhaustedCards.length
        ? exhaustedCards.map((card) => deckCardRow(card, `<span class="account-wallet">exhausted</span>`)).join("")
        : `<div class="deck-empty">No cards are exhausted.</div>`;
      return `<div class="account-title"><h2 id="account-panel-title">your deck</h2><span class="account-wallet">physical cards, not a fixed card count</span></div><div class="deck-summary"><div class="deck-stat"><strong>${escapeHtml(deckWeightLabel(deck.carried_weight_tenths))} / ${escapeHtml(deckWeightLabel(deck.carrying_capacity_tenths))}</strong><small>carried weight · base ${escapeHtml(deckWeightLabel(deck.base_carrying_capacity_tenths))} + equipped bags ${escapeHtml(deckWeightLabel(deck.container_capacity_tenths))}</small></div><div class="deck-stat"><strong>${equipped.length} / ${slots}</strong><small>bracelet charm slots</small></div><div class="deck-stat"><strong>${preparedSpells.length} / ${spellSlots}</strong><small>prepared spell cards</small></div></div>${validation}${previews}<div class="account-section-title">equipped loadout</div>${loadoutRows ? `<div class="deck-card-list">${loadoutRows}</div>` : `<div class="deck-empty">No weapon or bag is equipped.</div>`}<div class="account-section-title">containers</div>${containerRows || `<div class="deck-empty">No container cards are carried.</div>`}<div class="account-section-title">skill charms</div>${charmRows ? `<div class="deck-card-list">${charmRows}</div>` : `<div class="deck-empty">Find, earn, trade, or steal a skill charm before you can wear it.</div>`}${unlock}<div class="account-section-title">spell deck</div><div class="keepsake-note">Only prepared spell cards can be cast. Spent cards remain in the deck as exhausted until a rule refreshes them.</div><div class="deck-card-list">${spellRows}</div><div class="account-section-title">exhausted / discard</div><div class="deck-card-list">${exhaustedRows}</div><div class="account-section-title">all carried cards</div><div class="deck-card-list">${carriedRows}</div>`;
    }

    function journalPanelHtml() {
      return `<div class="account-title"><h2 id="account-panel-title">journal</h2><span class="account-wallet">portable tale</span></div><div class="library-intro">Export the events visible to this avatar as JSON. The export includes current access credentials only in the request, never in the file.</div><div class="account-actions"><button class="account-button" type="button" data-export-journal>export journal</button></div>`;
    }

    function settingsPanelHtml() {
      const economy = state?.economy || {};
      const deck = state?.deck || {};
      const largeText = localStorage.getItem("cosyworld.ui.largeText") === "true";
      const reduceMotion = localStorage.getItem("cosyworld.ui.reduceMotion") === "true";
      return `<div class="account-title"><h2 id="account-panel-title">orbs & settings</h2><span class="account-wallet">${escapeHtml(String(economy.orbs || 0))} Orbs</span></div><div class="setting-list"><label class="setting-row"><span class="setting-copy"><strong>Larger text</strong><small>Increase interface and story text throughout the game.</small></span><input type="checkbox" data-ui-setting="largeText"${largeText ? " checked" : ""} /></label><label class="setting-row"><span class="setting-copy"><strong>Reduce motion</strong><small>Minimize dealing, pulsing, and transition animation.</small></span><input type="checkbox" data-ui-setting="reduceMotion"${reduceMotion ? " checked" : ""} /></label></div><div class="account-section"><div class="account-section-title">About Orbs</div><div class="keepsake-note">Orbs fund community images only. They do not buy stronger actions.</div>${accountRow("Chat", "appears when advancement can begin a friendship")}${accountRow("room voices", "one contextual reply per armed card heartbeat")}${accountRow("AI", economy.openrouter_connected ? "connected" : "world default")}${accountRow("carried deck", `${deckWeightLabel(deck.carried_weight_tenths)} / ${deckWeightLabel(deck.carrying_capacity_tenths)}`)}</div>`;
    }

    function libraryPanelHtml() {
      if (!libraryPanelPinned) return "";
      const packs = Array.isArray(contentPacks?.packs) ? contentPacks.packs.filter((pack) => pack.visible !== false) : [];
      if (!packs.length) {
        return `<section class="account-panel library-panel" aria-labelledby="world-library-title">${menuNavHtml("world")}<div class="library-heading"><h2 id="world-library-title">Worlds</h2></div><div class="library-intro">The worlds are still gathering. Try again in a moment.</div></section>`;
      }
      const bundle = compactAssetId(contentPacks?.bundle_hash || "");
      const playable = packs.filter((pack) => ["world", "campaign"].includes(String(pack.kind || "").toLowerCase()));
      const supporting = packs.filter((pack) => !playable.includes(pack));
      const cards = playable.length
        ? playable.map(libraryPackHtml).join("")
        : `<div class="account-empty">No playable world is available yet.</div>`;
      const supportingCards = supporting.map(libraryPackHtml).join("");
      const bundleDetails = bundle
        ? `<details class="library-technical"><summary>bundle details</summary><code>${escapeHtml(bundle)}</code></details>`
        : "";
      const systemPacks = supportingCards
        ? `<details class="menu-disclosure library-system-packs"><summary>${iconSvg("settings")}<span>About this world</span><small>${escapeHtml(`${supporting.length} supporting ${supporting.length === 1 ? "pack" : "packs"}`)}</small></summary><div class="menu-disclosure-body"><div class="library-grid">${supportingCards}</div>${bundleDetails}</div></details>`
        : bundleDetails;
      return `<section class="account-panel library-panel" aria-labelledby="world-library-title">${menuNavHtml("world")}<div class="library-heading"><h2 id="world-library-title">Worlds</h2><small>${escapeHtml(`${playable.length} playable ${playable.length === 1 ? "world" : "worlds"} · ${packs.length} world packs mounted`)}</small></div><div class="library-intro">Continue through an open world, or see which keepsake unlocks a new place.</div>${worldChronicleHtml()}<div class="library-grid featured">${cards}</div>${systemPacks}</section>`;
    }

    function worldChronicleHtml() {
      const simulation = worldView?.simulation;
      if (!simulation) {
        return `<section class="world-chronicle" aria-label="World chronicle"><div class="world-chronicle-head"><strong>the world beyond</strong><small>listening for distant news…</small></div></section>`;
      }
      const history = Array.isArray(simulation.recent_history) ? simulation.recent_history.slice(0, 8) : [];
      const entries = history.length
        ? history.map((event) => {
            const route = event.destination_location_name
              ? `${event.location_name || "somewhere"} → ${event.destination_location_name}`
              : (event.location_name || "somewhere beyond this room");
            return `<div class="world-chronicle-entry"><span class="world-chronicle-place">${escapeHtml(route)}</span><span class="world-chronicle-copy">${escapeHtml(cleanStatusText(event.content || eventText(event)))}</span></div>`;
          }).join("")
        : `<div class="world-chronicle-entry"><span class="world-chronicle-copy">The wider world is settled. Six committed turns will carry the first distant change.</span></div>`;
      const movingFactions = (simulation.factions || [])
        .filter((faction) => Number(faction.momentum || 0) !== 0)
        .sort((left, right) => Math.abs(Number(right.momentum || 0)) - Math.abs(Number(left.momentum || 0)))
        .slice(0, 4)
        .map((faction) => `${faction.faction_name || faction.faction_id} ${Number(faction.momentum) > 0 ? "+" : ""}${Number(faction.momentum || 0)}`)
        .join(" · ");
      const pulseLabel = Number(simulation.pulse_index || 0)
        ? `history pulse ${simulation.pulse_index} · played tick ${simulation.last_advanced_tick}`
        : `moves every ${simulation.pulse_interval_ticks || 6} committed turns`;
      const factionLine = movingFactions
        ? `<div class="world-faction-current">faction momentum · ${escapeHtml(movingFactions)}</div>`
        : "";
      return `<section class="world-chronicle" aria-label="World chronicle"><div class="world-chronicle-head"><strong>the world beyond</strong><small>${escapeHtml(pulseLabel)}</small></div><div class="world-chronicle-list">${entries}</div>${factionLine}</section>`;
    }

    function libraryPackHtml(pack) {
      const stateName = String(pack.access_state || "included");
      const locations = Array.isArray(pack.locations) ? pack.locations : [];
      const shownLocations = locations.slice(0, 6).map((location) => {
        const open = location.accessible !== false;
        const stateLabel = open ? "open" : (location.required_card_id ? "pass required" : "access required");
        const conceptAttr = open
          ? 'data-player-concept="world-pack"'
          : 'data-player-concept="pass"';
        return `<div class="library-location${open ? " accessible" : ""}" ${conceptAttr}><span>${escapeHtml(location.name || `Location ${location.id}`)}</span><span class="library-location-state">${escapeHtml(stateLabel)}</span></div>`;
      }).join("");
      const remaining = Math.max(0, locations.length - 6);
      const locationList = shownLocations
        ? `<div class="library-locations">${shownLocations}${remaining ? `<div class="library-location"><span>and ${remaining} more</span></div>` : ""}</div>`
        : "";
      const dependencies = Array.isArray(pack.dependencies) && pack.dependencies.length
        ? ` · depends on ${pack.dependencies.map(shortPackName).join(", ")}`
        : "";
      const authority = libraryPackAuthoritySummary(pack);
      const badgeLabel = stateName === "partial" ? "some open" : (stateName === "included" ? "included" : stateName);
      const technical = [
        `${pack.kind || "world pack"} · v${pack.version || "?"} · ${pack.license || "unlicensed"}${dependencies}`,
        authority,
      ].filter(Boolean).join(" · ");
      const technicalDetails = technical
        ? `<details class="library-technical"><summary>technical details</summary><div>${escapeHtml(technical)}</div></details>`
        : "";
      const kind = String(pack.kind || "world pack").toLowerCase();
      const icon = ["world", "campaign"].includes(kind) ? "world" : (kind === "assets" ? "collection" : "settings");
      return `<article class="library-pack" data-player-concept="world-pack"><div class="library-pack-top"><div><div class="library-pack-name">${iconSvg(icon)}${escapeHtml(pack.name || pack.id)}</div><div class="library-pack-meta">${escapeHtml(kind)}</div></div><span class="library-access-badge ${escapeAttr(stateName)}">${escapeHtml(badgeLabel)}</span></div><div class="library-pack-copy">${escapeHtml(pack.description || "No description yet.")}</div><div class="library-pack-counts">${escapeHtml(libraryPackCountSummary(pack.resource_counts || {}))}</div><div class="library-pack-access">${escapeHtml(pack.access_summary || "Included with this world.")}</div>${locationList}${technicalDetails}</article>`;
    }

    function libraryPackAuthoritySummary(pack) {
      const authorities = Array.isArray(pack.entitlement_authorities) ? pack.entitlement_authorities : [];
      const labels = authorities.map((authority) => {
        if (authority.type === "solana_collection") return `Solana collection ${compactAssetId(authority.collection_address || "")}`;
        if (authority.type === "signed_set") return `private set signed by ${compactAssetId(authority.public_key || "")}`;
        if (authority.type === "asset_feed") return `${authority.issuer || "trusted"} verified asset feed`;
        return authority.type || "entitlement authority";
      });
      const permanence = pack.distribution?.permanent_uri
        ? `permanent ${compactAssetId(pack.distribution.permanent_uri)}`
        : pack.distribution?.permanence === "content-addressed"
          ? "content-addressed release"
          : "";
      return [...labels, permanence].filter(Boolean).join(" · ");
    }

    function shortPackName(value) {
      return String(value || "")
        .replace(/^cosyworld\./, "")
        .replace(/^campaign\./, "");
    }

    function libraryPackCountSummary(counts) {
      const entries = [
        ["locations", "places"],
        ["actors", "avatars"],
        ["items", "items"],
        ["cards", "keepsakes"],
        ["external_cards", "catalog keepsakes"],
        ["character_creation", "character paths"],
        ["rules", "rules references"],
        ["assets", "asset collections"],
      ];
      const visible = entries
        .map(([key, label]) => [Number(counts[key] || 0), label])
        .filter(([count]) => count > 0)
        .map(([count, label]) => `${count} ${label}`);
      return visible.length ? visible.join(" · ") : "metadata-only world pack";
    }

    function pendingConversationHtml() {
      if (!actionBusy || pendingAction?.kind !== "orb-chat") return "";
      const targetId = Number(
        typeof pendingAction.pendingTargetActorId === "function"
          ? pendingAction.pendingTargetActorId()
          : pendingAction.targetActorId
      );
      const target = actorForId(targetId);
      const speaker = target ? actorLabel(target) : (pendingAction.targetName || "A neighbour");
      const aria = `${speaker} is finding the thread. Your conversation is unfolding.`;
      return `<div class="line chat avatar pending" role="status" aria-label="${escapeAttr(aria)}">${chatPfpHtml({ actor_id: targetId }, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><span class="text" aria-hidden="true"><span class="chat-thinking-dots"><i></i><i></i><i></i></span>finding the thread…</span></div>`;
    }

    function pendingChatsHtml() {
      if (actionBusy && pendingAction?.kind === "orb-chat") return "";
      return pendingChats.map((chat) => {
        const speaker = chat.targetName || "Someone nearby";
        const aria = `${speaker} is finding the thread. Your next actions are ready while the conversation unfolds.`;
        return `<div class="line chat avatar pending" role="status" aria-label="${escapeAttr(aria)}">${chatPfpHtml({ actor_id: chat.targetActorId }, speaker)}<span class="speaker">${escapeHtml(speaker)}</span><span class="text" aria-hidden="true"><span class="chat-thinking-dots"><i></i><i></i><i></i></span>finding the thread…</span></div>`;
      }).join("");
    }

    function pendingAvatarArrivalHtml() {
      if (!actionBusy || pendingAction?.kind !== "avatar-arrival") return "";
      const creationProfile = pendingAction.creationProfile || null;
      const species = (creationProfile?.species || [])
        .find((choice) => choice.id === pendingAction.selectedSpeciesId)?.label;
      const origin = (creationProfile?.origins || [])
        .find((choice) => choice.id === pendingAction.selectedOriginId)?.label;
      const kicker = "the cottage is making room";
      const text = "A name, a face, and an unfinished path are finding their way to the door.";
      const cue = species && origin
        ? `${species}, from ${origin}. What they become will begin with their first choice.`
        : "Someone classless is arriving. What they become will begin with their first choice.";
      const aria = `${kicker}. ${text} ${cue}`;
      return `<div class="room-scene arrival-scene" role="status" aria-label="${escapeAttr(aria)}"><span class="room-scene-kicker">${escapeHtml(kicker)}</span><span class="room-scene-text">${escapeHtml(text)}</span><span class="room-scene-cue">${escapeHtml(cue)}</span></div>`;
    }

    function defeatTransitionHtml() {
      if (!defeatTransition) return "";
      const actor = defeatTransition.actorName || "Your avatar";
      const opponent = defeatTransition.opponentName || "the danger";
      const kicker = "this tale has ended";
      const text = `${actor} was defeated by ${opponent}.`;
      const cue = "This avatar is gone. Any linked account and keepsakes are still here. Choose begin again below when you are ready.";
      const aria = `${kicker}. ${text} ${cue}`;
      return `<div class="room-scene defeat-scene" role="alert" aria-label="${escapeAttr(aria)}"><span class="room-scene-kicker">${escapeHtml(kicker)}</span><span class="room-scene-text">${escapeHtml(text)}</span><span class="room-scene-cue">${escapeHtml(cue)}</span></div>`;
    }

    function quietRoomSceneHtml() {
      const hasAvatar = Boolean(actorId && state?.primary_action?.kind !== "create_avatar");
      const cue = hasAvatar
        ? "Chat with someone here or explore the room."
        : "Begin a tale, then discover the room through play.";
      return `<p class="chat-empty" role="note">${escapeHtml(cue)}</p>`;
    }

    function eventIsChatTranscriptEvent(event) {
      return event?.type === "message.created";
    }

    function transcriptEventHtml(event) {
      return event?.type === "message.created" ? messageHtml(event) : sceneCardEventHtml(event);
    }

    function accountPanelHtml() {
      if (!accountPanelPinned) return "";
      if (menuSection === "deck") {
        return `<section class="account-panel" aria-labelledby="account-panel-title">${menuNavHtml()}${deckPanelHtml()}</section>`;
      }
      if (menuSection === "journal") {
        return `<section class="account-panel" aria-labelledby="account-panel-title">${menuNavHtml()}${journalPanelHtml()}</section>`;
      }
      if (menuSection === "settings") {
        return `<section class="account-panel" aria-labelledby="account-panel-title">${menuNavHtml()}${settingsPanelHtml()}</section>`;
      }
      if (menuSection === "identity") {
        return `<section class="account-panel" aria-labelledby="account-panel-title">${menuNavHtml()}<div class="account-title"><h2 id="account-panel-title">sign in & identity</h2><span class="account-wallet">portable account, optional NFT access</span></div>${identitySectionHtml()}</section>`;
      }
      const account = state?.account || {};
      const wallet = account.wallet_address || state?.access?.owner_wallet_address || "";
      const ownedCards = Array.isArray(account.owned_cards) ? account.owned_cards : [];
      const boxes = Array.isArray(account.active_box_ids) ? account.active_box_ids : [];
      const packs = Array.isArray(account.unopened_pack_ids) ? account.unopened_pack_ids : [];
      const receipts = Array.isArray(account.recent_box_receipts) ? account.recent_box_receipts : [];
      const openings = Array.isArray(account.recent_pack_openings) ? account.recent_pack_openings : [];
      const signed = state?.access?.mode === "signed_wallet_entitlements" && Boolean(walletSession);
      const assets = [];
      const displayedCards = ownedCards
        .slice()
        .sort((left, right) => (
          Number(equippedCardIds.includes(right.card_id)) - Number(equippedCardIds.includes(left.card_id))
          || String(left.display_name || left.card_id).localeCompare(String(right.display_name || right.card_id))
        ));
      for (const card of displayedCards.slice(0, 24)) {
        assets.push(accountOwnedCard(card));
      }
      for (const boxId of boxes.slice(0, 6)) {
        assets.push(accountBoxCard(boxId, openingBoxId === boxId ? "opening" : "closed"));
      }
      for (const packId of packs.slice(0, 6)) {
        assets.push(accountPackCard(packId));
      }
      const inventoryRows = [
        accountRow("favorites", equippedCardIds.length
          ? `${equippedCardIds.map(cardDisplayName).join(", ")} · ${equippedCardIds.length >= keepsakeCapacity
            ? "all three collection favorites pinned"
            : `room for ${smallNumberWord(keepsakeCapacity - equippedCardIds.length)} more`}`
          : "choose a few collection cards to pin"),
        accountRow("cards", ownedCards.length ? `${smallNumberWord(ownedCards.length)} in your collection` : "waiting to be found"),
        accountRow("boxes", boxes.length ? `${smallNumberWord(boxes.length)} waiting to open` : "a wooden box may turn up"),
        accountRow("bundles", packs.length ? `${smallNumberWord(packs.length)} waiting to open` : "an avatar bundle may turn up"),
      ];
      for (const receipt of receipts.slice(0, 3)) {
        inventoryRows.push(accountRow("opened box", "a wooden box became an avatar bundle"));
      }
      for (const opening of openings.slice(0, 3)) {
        const cards = (opening.card_ids || []).map(cardDisplayName).join(", ");
        inventoryRows.push(accountRow("opened bundle", cards || "a few new keepsakes"));
      }
      const actions = [];
      if (signed) {
        if (boxes.length) {
          actions.push(`<button class="account-button secondary" type="button" data-account-open-box="first">open box</button>`);
        }
        if (packs.length) {
          actions.push(`<button class="account-button secondary" type="button" data-account-open-pack="first" data-player-concept="bundle" data-analytics-event="bundle.open">open bundle</button>`);
        }
      }
      const inventory = assets.length
        ? `<div class="account-assets">${assets.join("")}</div>`
        : `<div class="account-empty">your collection is waiting for its first keepsake</div>`;
      const accountActions = actions.length ? `<div class="account-actions">${actions.join("")}</div>` : "";
      const keepsakeNote = ownedCards.length
        ? `<div class="keepsake-note">Keep a few keepsakes close—up to three. This is a menu preference, not your physical carried deck or bracelet.</div>`
        : "";
      const accountName = identity?.authenticated
        ? "CosyWorld account"
        : (signed ? (compactAssetId(wallet) || "linked account") : "local tale");
      return `<section class="account-panel" aria-labelledby="account-panel-title">${menuNavHtml()}<div class="account-title"><h2 id="account-panel-title">collection & account</h2><span class="account-wallet">${escapeHtml(accountName)}</span></div>${characterSheetHtml()}${accountActions}<div class="account-section"><div class="account-section-title">owned collection</div><div class="keepsake-note">Collection ownership is separate from world, carried, equipped, spell-deck, exhausted, and transfer zones. Materializing an eligible item creates one durable shard instance; it does not grant a slot or advancement.</div>${keepsakeNote}${inventory}${inventoryRows.join("")}</div></section>`;
    }

    function identitySectionHtml() {
      if (!identity?.authenticated) {
        return `<section class="account-section" aria-label="CosyWorld sign in"><div class="account-actions"><button class="account-button" type="button" data-passkey-continue>continue with passkey</button></div></section>`;
      }
      const passkeys = Array.isArray(identity.passkeys) ? identity.passkeys : [];
      const wallets = Array.isArray(identity.wallets) ? identity.wallets : [];
      const walletRows = wallets.length
        ? wallets.map((entry) => {
            const wallet = String(entry.wallet_address || "");
            const active = wallet === identity.active_wallet;
            return `<div class="account-wallet-entry${active ? " active" : ""}"><code>${escapeHtml(compactAssetId(wallet))}</code><div class="account-wallet-controls">${active ? `<span class="account-auth-copy">NFT access active</span>` : `<button class="account-button secondary" type="button" data-wallet-select="${escapeAttr(wallet)}">use</button>`}<button class="account-button secondary" type="button" data-wallet-unlink="${escapeAttr(wallet)}">release</button></div></div>`;
          }).join("")
        : `<div class="account-empty">No NFT wallet claimed. Public play still works.</div>`;
      const passkeyCopy = passkeys.length === 1
        ? "1 passkey — add a second for recovery"
        : `${passkeys.length} passkeys`;
      return `<section class="account-section" aria-label="CosyWorld account"><div class="account-section-title">CosyWorld account</div>${accountRow("passkeys", passkeyCopy)}<div class="account-actions"><button class="account-button secondary" type="button" data-passkey-add>add passkey</button><button class="account-button secondary" type="button" data-wallet-link>claim NFT wallet</button><button class="account-button secondary" type="button" data-account-logout>sign out</button></div><div class="account-wallet-list">${walletRows}</div></section>`;
    }

    function characterSheetHtml() {
      const ledger = state?.ledger || {};
      const avatar = actorForId(actorId);
      const avatarCard = cardForActor(actorId);
      const avatarName = String(avatar?.name || avatarCard?.display_name || "your avatar").trim();
      const avatarTitle = String(avatar?.title || avatarCard?.title || "").trim();
      const avatarBlurb = String(avatarCard?.blurb || avatar?.description || "").trim();
      const avatarImage = cardImage(avatarCard);
      const portrait = avatarImage
        ? `<button class="account-portrait" type="button"${cardDataAttr(avatarCard)} aria-label="Open ${escapeAttr(avatarName)} keepsake" data-player-concept="keepsake" data-analytics-event="keepsake.open"><img src="${escapeAttr(avatarImage)}" alt="" /></button>`
        : "";
      const identity = `<div class="account-identity${portrait ? "" : " no-portrait"}">${portrait}<div class="account-identity-copy"><span class="account-identity-name">${escapeHtml(avatarName)}</span>${avatarTitle ? `<span class="account-identity-title">${escapeHtml(avatarTitle)}</span>` : ""}${avatarBlurb ? `<span class="account-identity-blurb">${escapeHtml(avatarBlurb)}</span>` : ""}</div></div>`;
      const purpose = String(state?.calling?.statement || "").trim() || "still choosing what trouble to get into";
      const memoriesReady = Number(ledger.unbanked_count || 0);
      const growthReady = Number(ledger.advancement_points || 0);
      const growthSummary = [
        memoriesReady ? "something you noticed is ready to keep" : "",
        growthReady ? "you can strengthen a friendship or open bracelet space" : "",
      ].filter(Boolean).join(" · ") || "your first little moment is waiting";
      const composedIdentity = state?.character_identity || null;
      const identityCards = composedIdentity
        ? [
            composedIdentity.species_label,
            composedIdentity.origin_label,
            composedIdentity.class_label
              || (composedIdentity.class_selection_ready ? "Class ready to choose" : "Class veiled"),
          ].filter(Boolean).join(" · ")
        : "";
      const practice = avatar?.practice || null;
      const practiceSummary = practice?.primary
        ? [practice.epithet, practice.known_for].filter(Boolean).join(" — ")
        : "still emerging from shared deeds";
      const level = Number(composedIdentity?.level ?? avatar?.stats?.level ?? 1);
      const rows = [
        accountRow("level", composedIdentity && !composedIdentity.class_id
          ? `${level} · classless`
          : String(level)),
        ...(identityCards ? [accountRow("campaign identity", identityCards)] : []),
        accountRow("purpose", purpose),
        accountRow("known for", practiceSummary),
        accountRow("journal", growthSummary),
      ];
      const equippedCharms = Array.isArray(state?.deck?.equipped_charms) ? state.deck.equipped_charms : [];
      rows.push(accountRow("worn skill charms", equippedCharms.length ? equippedCharms.map((charm) => {
        const skill = abilityLabel(charm.skill_id, charm.skill_id || "skill");
        const bonus = Math.max(0, Number(charm.skill_bonus || 0));
        return `${charm.name} — ${skill}${bonus ? ` +${bonus}` : ""}`;
      }).join(", ") : "find a skill charm, then wear it from Deck"));
      const bonds = Array.isArray(state?.bonds) ? state.bonds : [];
      rows.push(accountRow("friends", bonds.length ? bonds.map((bond) => {
        const name = String(bond.target_actor_name || "someone").trim();
        const statement = String(bond.statement || "").trim();
        const closeness = Number(bond.strength || 0) >= 3 ? "close friend" : (Number(bond.strength || 0) >= 2 ? "getting closer" : "new friend");
        return `${name} — ${statement || closeness}${statement ? ` (${closeness})` : ""}`;
      }).join(" · ") : "someone new is waiting to meet you"));
      const marks = Array.isArray(ledger.unbanked_marks) ? ledger.unbanked_marks : [];
      const markList = marks.length
        ? `<div class="account-list">${marks.slice(0, 4).map((mark) => `<div class="account-list-item">${escapeHtml(mark.label || mark.category || "A remembered moment")}</div>`).join("")}</div>`
        : "";
      return `${identity}<div class="account-section">${rows.join("")}${markList}</div>`;
    }

    function accountBoxCard(boxId, stateName) {
      const title = "Intricately Carved Wooden Box";
      const subtitle = stateName === "opening" ? "opening" : "open box";
      return `<div class="account-asset"><img src="${escapeAttr(boxImageUrl(boxId, stateName))}" alt="${escapeAttr(`${title} ${stateName}`)}" data-card-key="box:${escapeAttr(boxId)}" /><div class="account-asset-title">${emojiHtml("🧰")}${escapeHtml(title)}</div><div class="account-asset-subtitle">${escapeHtml(compactAssetId(boxId))}</div><button class="account-button secondary" type="button" data-account-open-box="${escapeAttr(boxId)}"${stateName === "opening" ? " disabled" : ""}>${escapeHtml(subtitle)}</button></div>`;
    }

    function accountPackCard(packId) {
      const image = fallbackCardImage(accountCard("Avatar Bundle"));
      return `<div class="account-asset" data-player-concept="bundle"><img src="${escapeAttr(image)}" alt="Avatar Bundle" data-card-key="pack:${escapeAttr(packId)}" /><div class="account-asset-title">${emojiHtml("🎴")}Avatar Bundle</div><div class="account-asset-subtitle">${escapeHtml(compactAssetId(packId))}</div><button class="account-button secondary" type="button" data-account-open-pack="${escapeAttr(packId)}" data-analytics-event="bundle.open">open bundle</button></div>`;
    }

    function accountOwnedCard(card) {
      const image = cardImage(card) || fallbackCardImage(card);
      const shape = shapeForCard(card);
      const equipped = equippedCardIds.includes(card.card_id);
      const full = equippedCardIds.length >= keepsakeCapacity;
      const rarity = friendlyCardRarity(card.rarity);
      const buttonLabel = equipped ? "put away" : "keep close";
      const cardName = card.display_name || card.card_id || "Owned keepsake";
      const cardNameHtml = `${emojiHtml(cardEmoji(card, shape))}${escapeHtml(cardName)}`;
      const itemCard = ["item", "weapon", "spell", "container", "skill charm", "skill_charm", "tool", "consumable", "relic"]
        .some((role) => String(card.role || "").toLowerCase().includes(role));
      const receipt = (state?.account?.materialization_receipts || []).find((entry) => entry.card_id === card.card_id);
      const materialized = receipt?.status === "materialized";
      const materializeButton = itemCard && actorId
        ? materialized
          ? `<button class="account-button secondary" type="button" data-unmaterialize-receipt="${escapeAttr(receipt.id)}">return from carried deck</button>`
          : `<button class="account-button secondary" type="button" data-materialize-card="${escapeAttr(card.card_id || "")}">materialize to carried deck</button>`
        : "";
      const zoneCopy = itemCard ? `<div class="account-asset-effect"><span>authoritative zone</span>${materialized ? "carried in this shard" : "collection"}</div>` : "";
      return `<div class="account-asset owned-card ${escapeAttr(shape)}${equipped ? " kept-close" : ""}" data-player-concept="keepsake"><button class="account-card-open" type="button"${cardDataAttr(card)} aria-label="Open ${escapeAttr(cardName)} keepsake details" data-analytics-event="keepsake.open"><img src="${escapeAttr(image)}" alt="" /></button><div class="account-asset-title">${cardNameHtml}</div><div class="account-asset-subtitle">${escapeHtml(rarity)} · ${escapeHtml(card.title || card.role || "keepsake")}</div>${zoneCopy}<div class="account-asset-effect"><span>when kept close</span>${escapeHtml(keepsakePromise(card))}</div><button class="account-button secondary" type="button" data-account-toggle-keepsake="${escapeAttr(card.card_id || "")}" data-analytics-event="keepsake.toggle"${!equipped && full ? " disabled" : ""}>${buttonLabel}</button>${materializeButton}</div>`;
    }

    function materializationReceiptId(cardId) {
      const left = handHash(cardId, Number(actorId || 0)).toString(16).padStart(8, "0");
      const right = handHash([...String(cardId)].reverse().join(""), Number(actorId || 0) ^ 0x9e3779b9).toString(16).padStart(8, "0");
      return `web:${actorId}:${left}${right}`;
    }

    function boxImageUrl(boxId, stateName = "closed") {
      return `/assets/generated/boxes/${encodeURIComponent(stateName)}/${encodeURIComponent(boxId)}.svg`;
    }

    function accountRow(key, value) {
      const empty = [
        "waiting to be found",
        "a wooden box may turn up",
        "an avatar bundle may turn up",
        "your first little moment is waiting",
        "found skill charms will appear here",
        "someone new is waiting to meet you",
      ].includes(value);
      return `<div class="account-row"><span class="account-key">${escapeHtml(key)}</span><span class="account-value${empty ? " account-empty" : ""}">${escapeHtml(value)}</span></div>`;
    }

    function cardDisplayName(cardId) {
      for (const group of [state?.cards?.actors, state?.cards?.items, state?.cards?.locations, state?.account?.owned_cards]) {
        if (!group) continue;
        for (const card of Array.isArray(group) ? group : Object.values(group)) {
          if (card?.card_id === cardId) return card.display_name || cardId;
        }
      }
      return cardId;
    }

    function hasAccountPanelContent() {
      const account = state?.account || {};
      const ledger = state?.ledger || {};
      return Boolean(
        account.wallet_address
          || (account.owned_cards || []).length
          || (account.active_box_ids || []).length
          || (account.unopened_pack_ids || []).length
          || (account.recent_box_receipts || []).length
          || (account.recent_pack_openings || []).length
          || state?.calling
          || (state?.skills || []).length
          || (state?.bonds || []).length
          || Number(ledger.unbanked_count || 0) > 0
          || Number(ledger.banked_count || 0) > 0
      );
    }

    const DEWBRIGHT_BUTTON_ITEM_ID = 2002;
    const RAIN_SOFT_GARDEN_LOCATION_ID = 2;

    function looseItemAtLocation(view, itemId, locationId) {
      return (view?.items || []).some((item) => (
        Number(item?.id || 0) === Number(itemId || 0)
        && Number(item?.location_id || 0) === Number(locationId || 0)
        && Number(item?.holder_actor_id || 0) === 0
      ));
    }

    function gardenHasDewbright(view = state) {
      return looseItemAtLocation(view, DEWBRIGHT_BUTTON_ITEM_ID, RAIN_SOFT_GARDEN_LOCATION_ID);
    }

    function gardenOpeningBeat(view = state) {
      if (gardenHasDewbright(view)) {
        return "Rain beads on the garden leaves. A small pearled button catches the light.";
      }
      return "Rain beads on the garden leaves. The grass shows where something pearled was lifted away.";
    }
