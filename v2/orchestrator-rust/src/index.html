        return `<div class="card-art-status"><span>community portrait</span> <strong>Level ${level} complete · next portrait unlocks at the next level.</strong></div>`;
      }
      const balance = Math.max(0, Number(state?.economy?.orbs || 0));
      const needsOrb = remaining > 0;
      const working = status === "generating" || status === "reviewing";
      const buttonLabel = needsOrb
        ? `add one Orb · ${funded}/${required}`
        : (working
          ? (status === "reviewing" ? "check the saved image review" : "check the image workshop")
          : (status === "review_failed" || status === "review_unavailable"
            ? (retryableWithoutOrbs ? "retry the saved image review" : "image review unavailable")
            : (status === "rejected" || status === "policy_rejected"
              ? (retryableWithoutOrbs ? "try a different image" : "image withheld")
              : (status === "failed"
                ? (retryableWithoutOrbs ? "try the image again" : "image workshop unavailable")
                : "start the image workshop"))));
      const canAct = needsOrb
        ? balance >= 1
        : retryableWithoutOrbs;
      const detail = needsOrb
        ? `${viewerContributed ? "your Orb is already helping; " : ""}${remaining} ${remaining === 1 ? "Orb is" : "Orbs are"} still needed from the community`
        : (working
          ? "fully funded; the saved job is still in progress"
          : (status === "review_failed" || status === "review_unavailable"
            ? "candidate saved; no new image will be bought while review is unavailable"
            : (!retryableWithoutOrbs && providerAttempts >= maxProviderAttempts
              ? `stopped after ${providerAttempts} image ${providerAttempts === 1 ? "attempt" : "attempts"}; no more provider credits will be used`
              : "fully funded; no more Orbs will be taken")));
      const action = canAct
        ? `<button class="account-button" type="button" data-fund-community-image="${escapeAttr(subject.kind)}:${subject.id}">${escapeHtml(buttonLabel)}</button>`
        : "";
      const clientError = clientState?.status === "error"
        ? `<div class="card-art-status error"><span>portrait update</span> <strong>${escapeHtml(clientState.message)}</strong></div>`
        : "";
      return `<div class="card-art-status"><span>level ${level} portrait</span> <strong>${escapeHtml(finishSentence(detail))}</strong></div>${clientError}${action}`;
    }

    function communityArtPlaceholderLabel(card) {
      const art = card?.community_art;
      if (!art) return "no art generated yet";
      const status = String(art.status || "available");
      const remaining = Math.max(0, Number(art.remaining_orbs || 0));
      if (remaining > 0 && art.viewer_contributed) return "community image pending";
      if (["failed", "rejected", "policy_rejected", "review_failed", "review_unavailable"].includes(status)) {
        return "community image unavailable";
      }
      if (["funded", "generating", "reviewing"].includes(status)) return "community image pending";
      return "no art generated yet";
    }

    function actorEconomyTitle(actor) {
      const economy = actor?.economy || null;
      if (!economy) return actorLabel(actor);
      const parts = [];
      const motive = String(economy.motive || "").trim();
      if (motive) parts.push(motive);
      const sought = Array.isArray(economy.sought_items) ? economy.sought_items : [];
      if (sought.length) {
        const labels = sought.slice(0, 3).map((soughtItem) => itemNameForId(soughtItem.item_id));
        if (sought.length > labels.length) labels.push(`+${sought.length - labels.length} more`);
        parts.push(`Seeking: ${labels.join("; ")}`);
      }
      const held = Array.isArray(economy.held_items) ? economy.held_items : [];
      if (held.length) {
        const labels = held.slice(0, 3).map((heldItem) => {
          const itemName = itemNameForId(heldItem.item_id);
          const disposition = String(heldItem.disposition || "held").trim();
          const dispositionLabel = {
            attached: "treasured",
            medicine: "medicine",
            useful: "useful here",
            tradeable: "open to trade",
          }[disposition] || "held";
          return `${itemName}: ${dispositionLabel}`;
        });
        if (held.length > labels.length) labels.push(`+${held.length - labels.length} more`);
        parts.push(`Carries: ${labels.join("; ")}`);
      }
      return parts.join(" ");
    }

    function economyRowHtml(key, value) {
      return `<div class="card-economy-row"><span class="card-economy-key">${escapeHtml(key)}</span><span class="card-economy-value">${value}</span></div>`;
    }

    function cleanEconomyText(value) {
      return String(value || "").replace(/\s+/g, " ").trim();
    }

    function withoutFinalPeriod(value) {
      return cleanEconomyText(value).replace(/[.!?]+$/g, "");
    }

    function sentenceCase(value) {
      const text = cleanEconomyText(value);
      return text ? `${text.charAt(0).toUpperCase()}${text.slice(1)}` : "";
    }

    function finishSentence(value) {
      const text = sentenceCase(value);
      return text && !/[.!?]$/.test(text) ? `${text}.` : text;
    }

    function economyReasonSummary(actor, itemId, reason) {
      const text = withoutFinalPeriod(reason);
      if (!text || !itemId) return sentenceCase(text);
      const actorName = cleanEconomyText(actor?.name || actorLabel(actor));
      const itemName = itemNameForId(itemId);
      const colonPrefixes = [
        `${actorName} wants ${itemName}:`,
        `${actorName} wants ${itemName} back:`,
        `${actorName} needs ${itemName}:`,
        `${actorName} could use ${itemName}:`,
        `${actorName} values ${itemName}:`,
      ];
      for (const prefix of colonPrefixes) {
        if (text.startsWith(prefix)) return sentenceCase(text.slice(prefix.length));
      }
      const forPrefix = `${actorName} wants ${itemName} for `;
      if (text.startsWith(forPrefix)) return sentenceCase(`for ${text.slice(forPrefix.length)}`);
      const exactPrefixes = [
        `${actorName} wants ${itemName}`,
        `${actorName} needs ${itemName}`,
        `${actorName} could use ${itemName}`,
        `${actorName} values ${itemName}`,
      ];
      return exactPrefixes.includes(text) ? "" : sentenceCase(text);
    }

    function economyMotiveSummary(actor, economy) {
      const request = economy?.request || null;
      if (request?.item_id) {
        const requestReason = economyReasonSummary(actor, request.item_id, request.reason);
        if (requestReason) return finishSentence(requestReason);
      }
      const motive = cleanEconomyText(economy?.motive);
      const sought = Array.isArray(economy?.sought_items) ? economy.sought_items : [];
      for (const soughtItem of sought) {
        const summary = economyReasonSummary(actor, soughtItem.item_id, motive);
        if (summary && summary !== motive) return finishSentence(summary);
      }
      return finishSentence(motive);
    }

    function economyMotiveRepeatsRows(actor, economy, motive) {
      const text = withoutFinalPeriod(motive).toLowerCase();
      const actorName = cleanEconomyText(actor?.name || actorLabel(actor)).toLowerCase();
      const sought = Array.isArray(economy?.sought_items) ? economy.sought_items : [];
      const held = Array.isArray(economy?.held_items) ? economy.held_items : [];
      if (sought.length && text.startsWith(`${actorName} seeks `)) return true;
      if (held.length && text.startsWith(`${actorName} is attached to `)) return true;
      if (held.length && text.startsWith(`${actorName} carries `) && text.includes("may trade")) return true;
      return false;
    }

    function economyTagHtml(value) {
      const text = cleanEconomyText(value);
      return text ? `<span class="economy-tag">${escapeHtml(text)}</span>` : "";
    }

    function economyTagsHtml(tags) {
      const html = tags.map(economyTagHtml).filter(Boolean).join("");
      return html ? `<span class="economy-tags">${html}</span>` : "";
    }

    function soughtItemTags(soughtItem) {
      const tags = [];
      const worldStatus = cleanEconomyText(soughtItem?.world_status);
      const worldLocationName = cleanEconomyText(soughtItem?.world_location_name);
      const worldHolderName = cleanEconomyText(soughtItem?.world_holder_actor_name);
      if (worldStatus === "held" && worldHolderName) {
        tags.push(Number(soughtItem?.world_holder_actor_id || 0) === Number(actorId || 0)
          ? "you have it"
          : `currently with ${worldHolderName}`);
      } else if (worldStatus === "available" && worldLocationName) {
        tags.push(`waiting in ${worldLocationName}`);
      } else if (worldStatus === "hidden" && worldLocationName) {
        tags.push(`not yet found near ${worldLocationName}`);
      } else if (worldStatus === "spent") {
        tags.push("already spent");
      }
      const memoryLocation = cleanEconomyText(soughtItem?.memory_location_name);
      const holderName = cleanEconomyText(soughtItem?.holder_actor_name);
      if (tags.length === 0 && memoryLocation) {
        tags.push(holderName ? `with ${holderName} near ${memoryLocation}` : `near ${memoryLocation}`);
      }
      return tags;
    }

    function economyItemSummaryHtml(itemName, tags = []) {
      return `<span class="card-economy-main">${escapeHtml(itemName)}</span>${economyTagsHtml(tags)}`;
    }

    function actorControlModeLabel(actor) {
      return {
        direct_input: Number(actor?.id || 0) === Number(actorId || 0) ? "you" : "another player",
        reactive_ai: "a world character",
        local_ai: "a world character",
        roaming_ai: "a world character",
        delegated_ai: "a delegated character",
      }[String(actor?.control_mode || "")] || "";
    }

    function practiceEvidenceTarget(evidence) {
      const targetKind = cleanEconomyText(evidence?.target_kind).toLowerCase();
      const targetId = Number(evidence?.target_id || 0);
      if (targetKind === "location") {
        const card = targetId ? cardForLocation(targetId) : null;
        return cleanEconomyText(card?.display_name || card?.title) || "a hidden place";
      }
      if (targetKind === "actor" || targetKind === "avatar" || targetKind === "resident") {
        const targetActor = targetId ? actorForId(targetId) : null;
        return targetActor ? actorLabel(targetActor) : "someone in the shared world";
      }
      if (targetKind === "item") {
        return targetId ? itemNameForId(targetId) : "a lasting item";
      }
      return "the shared world";
    }

    function practiceEvidenceSummary(evidence) {
      const target = practiceEvidenceTarget(evidence);
      return {
        exploration: `Discovered ${target}.`,
        craft: `Made or transformed ${target}.`,
        delivery: `Delivered an item to ${target}.`,
        stewardship: `Completed meaningful work for ${target}.`,
        care: `Protected or restored ${target}.`,
        mediation: `Helped resolve a strain involving ${target}.`,
        lore: `Recovered knowledge connected to ${target}.`,
      }[cleanEconomyText(evidence?.category).toLowerCase()] || `Left a lasting mark on ${target}.`;
    }

    function actorAvailabilityLabel(actor) {
      const status = cleanEconomyText(actor?.status).toLowerCase();
      if (status === "active") {
        return Number(actor?.location_id || 0) === Number(state?.location?.id || 0)
          ? "Here and available."
          : "Active elsewhere in the world.";
      }
      if (status === "knocked_out") return "Knocked out and unable to act.";
      if (status === "dead") return "Their tale has ended.";
      return "Current availability is unknown.";
    }

    function actorPracticePanelHtml(actor) {
      const practice = actor?.practice;
      if (!practice?.primary) return "";
      const rows = [
        economyRowHtml("known for", escapeHtml(
          [practice.epithet, practice.known_for].filter(Boolean).join(" — ")
        )),
      ];
      for (const evidence of (practice.evidence || [])) {
        rows.push(economyRowHtml("recently", escapeHtml(practiceEvidenceSummary(evidence))));
      }
      return rows.join("");
    }

    function transferActionForActor(kind, targetActorId) {
      const actorKey = `actor:${Number(targetActorId || 0)}`;
      return (actions || []).find((candidate) => (
        String(candidate?.label || "").toLowerCase() === kind
        && (candidate?.focusKey === actorKey || (candidate?.focusKeys || []).includes(actorKey))
      )) || null;
    }

    function careActionForActor(targetActorId) {
      const actorKey = String(Number(targetActorId || 0));
      return (actions || []).find((candidate) => (
        (
          candidate?.useChoiceKind === "care"
          && Number(candidate?.targetActorId || 0) === Number(targetActorId || 0)
        )
        || (
          candidate?.useChoiceKind === "mixed"
          && Boolean(candidate?.targetActorChoices?.[actorKey])
        )
      )) || null;
    }

    function itemActionForActor(kind, targetActorId, itemId) {
      const actorKey = `actor:${Number(targetActorId || 0)}`;
      const itemKey = `item:${Number(itemId || 0)}`;
      return (actions || []).find((candidate) => {
        if (String(candidate?.label || "").toLowerCase() !== kind) return false;
        if (kind === "steal") {
          return candidate?.focusKey === `theft:${Number(targetActorId || 0)}:${Number(itemId || 0)}`;
        }
        const focusKeys = candidate?.focusKeys || [];
        return focusKeys.includes(actorKey) && focusKeys.includes(itemKey);
      }) || null;
    }

    function avatarKnownItemsHtml(actor, giftRequests) {

        return `<div class="avatar-known-items"><span class="avatar-items-label">known items</span><span class="avatar-items-empty">No carried items have been disclosed.</span></div>`;

      for (const held of heldItems) {

        if (!itemId) continue;
        const itemName = itemNameForId(itemId);
        const itemCard = cardForItem(itemId) || {
          display_name: itemName,
          role: "item",
          aspect: "square",
        };
        const image = cardImage(itemCard) || fallbackCardImage(itemCard);
        const actionsAvailable = new Set(held.available_actions || []);
        const existingRequest = giftRequests.find((request) => Number(request.item_id || 0) === itemId);
        const actionButtons = [];
        if (actionsAvailable.has("request")) {
          actionButtons.push(`<button class="account-button avatar-icon-action" type="button" data-avatar-gift-request="${itemId}" data-avatar-id="${actorNumericId}"${existingRequest ? " disabled" : ""}>${iconSvg("request")}<span>${escapeHtml(existingRequest ? "requested" : "request")}</span></button>`);
        }

    function actorSafetyPanelHtml(actor) {
      if (!actor || Number(actor.id || 0) === Number(actorId || 0)) return "";
      const actorNumericId = Number(actor.id || 0);
      const downed = actorIsDownedForRail(actor);
      const giftAvailable = !downed && Boolean(transferActionForActor("give", actorNumericId));
      const careAvailable = actorNeedsHealing(actor) && Boolean(careActionForActor(actorNumericId));
      const incoming = (state?.safety?.incoming_offers || [])
        .filter((offer) => Number(offer.offered_by_actor_id || 0) === actorNumericId);
      const outgoing = (state?.safety?.outgoing_offers || [])
        .filter((offer) => Number(offer.offered_to_actor_id || 0) === actorNumericId);
      const giftRequests = (state?.safety?.gift_auto_accepts || [])
        .filter((request) => Number(request.offered_by_actor_id || 0) === actorNumericId);
      const offerHtml = [
        ...incoming.map((offer) => {
          const exchange = offer.requested_item_name ? ` for ${offer.requested_item_name}` : "";
          if (offer.kind === "gift") {
            return `<div class="avatar-offer"><strong>gift waiting</strong>${escapeHtml(`${offer.offered_item_name}${exchange}`)}<small>Choose Accept from your hand, or leave the room.</small></div>`;
          }
          return `<div class="avatar-offer"><strong>incoming ${escapeHtml(offer.kind || "transfer")}</strong>${escapeHtml(`${offer.offered_item_name}${exchange}`)}<div class="avatar-controls"><button class="account-button" type="button" data-transfer-offer-decision="accept" data-transfer-offer-id="${escapeAttr(offer.id)}">accept</button><button class="account-button" type="button" data-transfer-offer-decision="decline" data-transfer-offer-id="${escapeAttr(offer.id)}">decline</button></div></div>`;
        }),
        ...outgoing.map((offer) => {
          const exchange = offer.requested_item_name ? ` for ${offer.requested_item_name}` : "";
          if (offer.kind === "gift") {
            return `<div class="avatar-offer"><strong>gift offered</strong>${escapeHtml(`${offer.offered_item_name}${exchange}`)}<small>Waiting while you share this room.</small></div>`;
          }
          return `<div class="avatar-offer"><strong>pending ${escapeHtml(offer.kind || "transfer")}</strong>${escapeHtml(`${offer.offered_item_name}${exchange}`)}<div class="avatar-controls"><button class="account-button" type="button" data-transfer-offer-decision="withdraw" data-transfer-offer-id="${escapeAttr(offer.id)}">withdraw</button></div></div>`;
        }),
      ].join("");
      const muteVerb = actor.muted_by_you ? "unmute" : "mute";
      const blockVerb = actor.blocked_by_you ? "unblock" : "block";
      const giftButton = giftAvailable
        ? `<button class="account-button avatar-icon-action" type="button" data-avatar-transfer="give" data-avatar-id="${actorNumericId}">${iconSvg("gift")}<span>gift</span></button>`
        : "";
      const careButton = careAvailable
        ? `<button class="account-button avatar-icon-action" type="button" data-avatar-care="${actorNumericId}">${iconSvg("utility")}<span>help</span></button>`
        : "";

    function actorEconomyPanelHtml(actor) {
      if (!actor) return "";
      const currentRows = [
        economyRowHtml("availability", escapeHtml(actorAvailabilityLabel(actor))),
      ];
      const detailRows = [];
      const practice = actorPracticePanelHtml(actor);
      if (practice) detailRows.push(practice);
      const controller = actorControlModeLabel(actor);
      if (controller) detailRows.push(economyRowHtml("played by", escapeHtml(controller)));
      const economy = actor?.economy || null;
      if (!economy) {
        if (Number(actor.id || 0) !== Number(actorId || 0)) {
          currentRows.push(economyRowHtml("today", "Nothing known yet."));
        }
        const current = currentRows.length
          ? `<section class="card-current" aria-label="Current character state"><div class="card-section-label">Now</div>${currentRows.join("")}</section>`
          : "";
        const details = detailRows.length
          ? `<details class="card-more"><summary>History & details</summary><div class="card-more-body">${detailRows.join("")}</div></details>`
          : "";
        return `${current}${actorSafetyPanelHtml(actor)}${details}`;
      }
      const motive = economyMotiveSummary(actor, economy);
      if (motive && !economyMotiveRepeatsRows(actor, economy, motive)) {
        currentRows.push(economyRowHtml("today", escapeHtml(motive)));
      }
      const inventoryCount = Number(economy.inventory_count);
      const carriedWeight = Number(economy.carried_weight_tenths || 0);
      const carryingCapacity = Number(economy.carrying_capacity_tenths || 0);
      if (Number.isFinite(inventoryCount) && Number.isFinite(carryingCapacity) && carryingCapacity > 0) {
        const carrying = inventoryCount === 0
          ? "Nothing right now."
          : `${inventoryCount} item${inventoryCount === 1 ? "" : "s"} · ${deckWeightLabel(carriedWeight)} / ${deckWeightLabel(carryingCapacity)}`;
        detailRows.push(economyRowHtml("carrying", escapeHtml(carrying)));
      }
      const sought = Array.isArray(economy.sought_items) ? economy.sought_items : [];
      const listedSoughtIds = new Set();
      const request = economy.request || null;
      if (request?.item_id) {
        const matchingSought = sought.find((soughtItem) => Number(soughtItem.item_id) === Number(request.item_id));
        const tags = soughtItemTags(matchingSought || {});
        currentRows.push(economyRowHtml("wants", economyItemSummaryHtml(itemNameForId(request.item_id), tags)));
        listedSoughtIds.add(Number(request.item_id));
      }
      const trade = economy.trade_stance || economy.trade_offer || null;
      if (trade?.offered_item_id && trade?.requested_item_id) {
        const tradeText = `${itemNameForId(trade.offered_item_id)} for ${itemNameForId(trade.requested_item_id)}; ${trade.willingness || "willing"}`;
        currentRows.push(economyRowHtml("trade", escapeHtml(trade.reason ? `${tradeText}. ${trade.reason}` : tradeText)));
      }
      for (const soughtItem of sought) {
        if (listedSoughtIds.has(Number(soughtItem.item_id))) continue;
        const itemName = itemNameForId(soughtItem.item_id);
        currentRows.push(economyRowHtml("seeks", economyItemSummaryHtml(itemName, soughtItemTags(soughtItem))));
      }
      const current = currentRows.length
        ? `<section class="card-current" aria-label="Current character state"><div class="card-section-label">Now</div>${currentRows.join("")}</section>`
        : "";
      const details = detailRows.length
        ? `<details class="card-more"><summary>History & details</summary><div class="card-more-body">${detailRows.join("")}</div></details>`
        : "";
      return `${current}${actorSafetyPanelHtml(actor)}${details}`;
    }

    function openCardModal(card, preservePosition = false) {
      if (!card) return;
      const key = cardKey(card);
      const dialog = $("card-modal").querySelector(".card-dialog");
      const scroller = dialog?.querySelector(".card-dialog-scroll");
      const copy = dialog?.querySelector(".card-copy");
      const dialogScrollTop = preservePosition ? Number(scroller?.scrollTop || 0) : 0;
      const copyScrollTop = preservePosition ? Number(copy?.scrollTop || 0) : 0;
      const image = cardImage(card) || fallbackCardImage(card);
      const actor = actorForCard(card);
      openCardModalKey = key;
      dialog?.classList.toggle("portrait-card", shapeForCard(card) === "avatar");
      const modalImage = $("card-modal-image");
      delete modalImage.dataset.artFallback;
      delete modalImage.dataset.artFallbackSrc;
      delete modalImage.dataset.artMissing;
      modalImage.dataset.artRole = card.role || "card";
      modalImage.dataset.artPlaceholder = communityArtPlaceholderLabel(card);
      modalImage.src = image;
      modalImage.alt = card.display_name || "CosyWorld card";
      $("card-modal-name").innerHTML = `${iconSvg(cardRoleIconName(card))}${escapeHtml(card.display_name || "CosyWorld Card")}`;
      $("card-modal-title").textContent = card.title || card.role || "";
      $("card-modal-blurb").textContent = card.blurb || "";
      const meta = [
        friendlyCardRarity(card.rarity),
        card.role,
        card.biome ? `biome: ${card.biome}` : "",
        Array.isArray(card.terrain) && card.terrain.length ? `terrain: ${card.terrain.join(" · ")}` : "",
        card.accessible === false ? "unavailable" : "",

      $("card-modal-meta").innerHTML = meta.map((value) => `<span>${escapeHtml(value)}</span>`).join("");

      $("card-modal-economy").innerHTML = `${actorEconomyPanelHtml(actor)}${nearbyLocationPanelHtml(card)}`;

      if (scroller) scroller.scrollTop = dialogScrollTop;
      if (copy) copy.scrollTop = copyScrollTop;

    function syncOpenCardModal() {
      const modal = $("card-modal");
      if (!openCardModalKey || !modal || modal.hidden) return;
      const card = cardByKey(openCardModalKey);
      if (!card) {
        closeCardModal();
        return;
      }
      const active = document.activeElement;
      const retryKey = active?.closest?.("[data-fund-community-image]")
        ?.getAttribute("data-fund-community-image") || "";
      const closeWasFocused = Boolean(active?.closest?.("[data-card-close]"));
      openCardModal(card, true);
      if (retryKey) {
        modal.querySelector(`[data-fund-community-image="${retryKey}"]`)?.focus();
      } else if (closeWasFocused) {
        modal.querySelector("[data-card-close]")?.focus();
      }
    }

    function closeCardModal() {
      openCardModalKey = "";
      closeModal("card-modal");
      $("card-modal-image").removeAttribute("src");
      $("card-modal-art-workshop").innerHTML = "";
      $("card-modal-economy").innerHTML = "";
    }

    async function retryCommunityArt(subjectKind, subjectId) {
      const subject = { kind: subjectKind, id: Number(subjectId) };
      const subjectKey = communityArtSubjectKey(subject);
      const card = subjectKind === "actor"
        ? cardForActor(subject.id)
        : (subjectKind === "item" ? cardForItem(subject.id) : cardForLocation(subject.id));
      const art = card?.community_art;
      if (!subjectKey || !art || communityArtClientStates.get(subjectKey)?.status === "starting") return;

      const clientState = {
        status: "starting",
        authoritativeSignature: communityArtStateSignature(art),
        timeout: null,
      };
      communityArtClientStates.set(subjectKey, clientState);
      clientState.timeout = window.setTimeout(() => {
        if (communityArtClientStates.get(subjectKey) !== clientState) return;
        clientState.status = "error";
        clientState.message = "The image workshop is taking longer than expected. Check the current status and try again.";
        setError(clientState.message);
        syncOpenCardModal();
        void queueRefresh();
      }, 45_000);
      syncOpenCardModal();

      try {
        const result = await action("/actions/fund-image", {
          actor_id: actorId,
          subject_kind: subjectKind,
          subject_id: subject.id,
          intent_id: `web-image:${globalThis.crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`}`,
        });
        if (!result?.ok) {
          const failure = new Error(actionFailureMessage("/actions/fund-image", result));
          failure.communityArtSafe = true;
          throw failure;
        }
        await queueRefresh();
        syncOpenCardModal();
      } catch (error) {
        if (clientState.timeout) window.clearTimeout(clientState.timeout);
        if (communityArtClientStates.get(subjectKey) !== clientState) return;
        clientState.status = "error";
        clientState.message = error?.communityArtSafe
          ? String(error.message || "")
          : "The image workshop could not be reached. Check the current status and try again.";
        setError(clientState.message);
        await queueRefresh();
        syncOpenCardModal();
      }
    }

    function cardRoleIconName(card, fallbackShape = "item") {
      const shape = shapeForCard(card, fallbackShape);
      if (shape === "location") return "world";
      if (shape === "avatar") return "character";
      return "item";

    function cardEmoji(card, fallbackShape = "item") {
      const explicit = String(card?.emoji || card?.icon || "").trim();
      if (explicit) return Array.from(explicit)[0] || explicit;
      const shape = shapeForCard(card, fallbackShape);
      const text = `${card?.display_name || ""} ${card?.title || ""} ${card?.role || ""}`.toLowerCase();
      const matches = [
        [/garden|flower|grove|meadow/, "🌿"], [/cottage|home|house|hearth/, "🏡"],
        [/forest|wood/, "🌲"], [/river|pond|lake|rain|water/, "💧"], [/mountain|hill|cliff/, "⛰️"],
        [/book|story|journal/, "📖"], [/key/, "🗝️"], [/button/, "🔘"], [/tea|cup|mug/, "☕"],
        [/lantern|lamp|light/, "🏮"], [/sword|blade/, "🗡️"], [/shield/, "🛡️"], [/coin|orb|gem/, "💎"],
        [/cat/, "🐈"], [/dog|hound/, "🐕"], [/fox/, "🦊"], [/bird|owl|raven/, "🦉"], [/rabbit|hare/, "🐇"],
        [/witch|mage|wizard/, "🧙"], [/farmer|gardener/, "🧑‍🌾"], [/teacher|scholar/, "🧑‍🏫"],
      ];
      const match = matches.find(([pattern]) => pattern.test(text));
      if (match) return match[1];
      return shape === "location" ? "🗺️" : (shape === "avatar" ? "🧑" : "🎒");
    }

    function actionEmoji(action) {
      return actionCardSuitEmoji(actionCardSuit(action)) || cardEmoji(action?.card, action?.shape);
    }

    function actionIconName(action) {
      const label = String(action?.label || action?.command || "").trim().toLowerCase();
      if (String(action?.intention || "").toLowerCase() === "travel" || label === "travel") return "travel";
      if (label === "dodge") return "shield";
      if (label === "escape" || label === "flee") return "travel";
      const bySuit = {
        head: "notice",
        heart: "bond",
        honor: "shield",
        hustle: "craft",
      };
      return bySuit[actionCardSuit(action)] || cardRoleIconName(action?.card, action?.shape);
    }

    function emojiHtml(emoji) {
      return `<span class="card-emoji" aria-hidden="true">${escapeHtml(emoji)}</span>`;
    }

    function handProviderReason(action) {
      const source = action?.presentation?.source;
      if (source?.label) return `From ${source.label}`;
      return String(action?.handProvider?.reason || "").trim();
    }

    function thumbnailHtml(action, interactive = true, extraClass = "") {
      const card = action.card || null;
      const shape = action.shape || shapeForCard(card);
      const fallback = card || {
        display_name: action.detail || action.label || "Action",
        role: shape === "location" ? "location" : (shape === "avatar" ? "avatar" : "item"),
        aspect: shape === "location" ? "wide" : (shape === "avatar" ? "tall" : "square"),
      };
      const image = cardImage(card) || fallbackCardImage(fallback);
      const imageEmoji = cardImage(card) ? "" : emojiHtml(cardEmoji(fallback, shape));
      const dataAttr = interactive && card ? cardDataAttr(card) : "";
      const className = ["thumb", extraClass, shape].filter(Boolean).join(" ");
      return `<span class="${escapeAttr(className)}"${dataAttr} aria-hidden="true" style="background-image:url('${escapeAttr(image)}')">${imageEmoji}</span>`;
    }

    function actionImage(action) {
      const card = actionChoiceCard(action);
      if (!card) return fallbackCardImage({ display_name: action?.label || "Action", role: "card", aspect: "wide" });
      return cardImage(card) || fallbackCardImage(card);
    }

    function selectedActionChoice(action) {
      const choices = Array.isArray(action?.choices) ? action.choices : [];
      return choices.find((choice) => String(choice.value || "") === String(action?.selectedChoice || ""))
        || choices[0]
        || null;
    }

    function actionChoiceCard(action, choice = selectedActionChoice(action)) {
      return choice?.card || action?.card || cardForActor(actorId) || cardForLocation(state?.location?.id) || null;
    }

    function syncActionChoicePreview(action, choice = selectedActionChoice(action)) {
      const card = actionChoiceCard(action, choice);
      const art = $("action-modal").querySelector(".action-art");
      art?.classList.remove("avatar", "item", "location");
      art?.classList.add(shapeForCard(card));
      $("action-modal-image").src = actionImage(action);
      $("action-modal-image").alt = choice?.previewAlt || choice?.label || card?.display_name || action?.detail || actionTitle(action);
    }

    function smallNumberWord(value) {
      const number = Math.max(0, Number(value) || 0);
      return ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"][number]
        || String(number);
    }

    function projectProgressDetail(value) {
      const amount = Math.max(1, Number(value) || 1);
      if (amount >= 3) return "make great headway";
      if (amount === 2) return "make good headway";
      return "make a little headway";
    }

    function projectProgressResult(value) {
      const amount = Math.max(1, Number(value) || 1);
      if (amount >= 3) return "makes great headway";
      if (amount === 2) return "makes good headway";
      return "makes a little headway";
    }

    function actionTitle(action) {
      if (action?.modalTitle) return String(action.modalTitle);
      if (["notice", "inspect", "scout", "travel"].includes(String(action?.intention || ""))) {
        return String(action?.accessibleLabel || action?.label || "action").toLowerCase();
      }
      const label = String(action?.label || action?.command || "action").toLowerCase();
      if (label === "evolve") return action?.choices?.length ? "choose how to evolve" : "evolve";
      if (label === "nudge" || label === "ping") {
        const currentName = String(state?.turn?.current_actor_name || action?.detail || "them")
          .replace(/\s+is (?:choosing|thinking)$/i, "");
        return `gently nudge ${currentName}`;
      }
      if (label === "i'm here" || label === "pong") return "say you're here";
      if (label === "listen") return "listen to the room";
      if (label === "listen again") return "listen once more";
      if (label === "travel" && action?.detail) return `go to ${action.detail}`;
      if (label === "search" && action?.detail) return `search ${action.detail}`;
      if (label === "chat" && action?.choices?.length) return "choose someone to chat with";
      if (label === "chat" && action?.detail) {
        const targetName = action?.targetName || String(action.detail).split(/[·,]/)[0].trim();
        return `chat with ${targetName}`;
      }
      if (label === "befriend" && action?.choices?.length) return "choose someone to befriend";
      if (label === "befriend" && action?.detail) {
        const targetName = action?.targetName || String(action.detail).split(/[·,]/)[0].trim();
        return `befriend ${targetName}`;
      }
      if (label === "take" && action?.choices?.length) return "choose what to take";
      if (label === "swap" && action?.choices?.length) return "choose what to swap";
      if (label === "give" && action?.choices?.length) return "choose who receives it";
      if (label === "give" && action?.detail) return `give ${action.detail}`;
      if (label === "trade" && action?.targetName) return `trade with ${action.targetName}`;
      if (label === "take" && action?.detail) return `pick up ${String(action.detail).split(",")[0]}`;
      if (label === "swap" && action?.detail) return `swap ${action.detail}`;
      if (label === "rest") return "catch your breath";
      if (label === "help") return "lend a hand";
      return label;
    }

    function compactActionLabel(action) {
      const label = String(action?.label || "").trim().toLowerCase();
      if (action?.busy && action?.busyLabel) return String(action.busyLabel).trim().toLowerCase();
      if (["notice", "inspect", "scout", "travel", "contribute"].includes(String(action?.intention || ""))) {
        return label || String(action?.project?.verb || action?.intention || "act").toLowerCase();
      }
      if (String(action?.command || "").trim().toLowerCase() === "create avatar") return "begin";
      if (label === "evolve") return "evolve";
      if (label === "travel") return "go";
      if (label === "listen again") return "listen again";
      if (label === "nudge" || label === "ping") return "nudge";
      if (label === "i'm here" || label === "pong") return "I'm here";
      return label || "act";
    }

    function friendlyActionText(value) {
      return compactActionDetail(value)
        .replace(/\bfirst help deepens Bond with\s+([^;,.]+)/gi, "first help brings you closer to $1")
        .replace(/\bdeepens Bond with\b/gi, "brings you closer to")
        .replace(/marks?\s+the\s+Visit Ledger/gi, "leaves you with a memory")
        .replace(/marks?\s+Visit Ledger/gi, "leaves you with a memory")
        .replace(/Visit Ledger marks?/gi, "memories")
        .replace(/Visit Ledger/gi, "memory")
        .replace(/advancement points?/gi, "growth")
        .replace(/growth points?/gi, "growth")
        .replace(/uses complete project evidence/gi, "brings together every clue you found")
        .replace(/uses partial project evidence/gi, "uses the clues you found here")
        .replace(/unprepared effort can leave you tired/gi, "you may get tired")
        .replace(/repeated help can leave you tired/gi, "helping again may tire you")
        .replace(/repeat listening on the frontier can leave you tired/gi, "listening again may tire you")
        .replace(/resting on the frontier advances the danger clock/gi, "the trouble may draw nearer while you rest")
        .replace(/can damage or knock out the target/gi, "someone may be hurt or fall quiet")
        .replace(/forgoes an attack this turn/gi, "you guard instead of striking")
        .replace(/fleeing exits danger but gives up the current room position/gi, "you leave the danger behind")
        .replace(/training settles for another skill step/gi, "another ability will be ready to practice")
        .replace(/spends hearth tonic warmth; danger does not advance/gi, "uses the tonic's warmth; trouble stays back")
        .replace(/may advance danger in frontier rooms/gi, "the trouble may draw nearer out here")
        .replace(/\bbanks?\b/gi, "claims")
        .replace(/\badvances? danger(?: clock)?(?: by)? \+?([1-9]\d*)\b/gi, "trouble draws near")
        .replace(/\bdanger \+([1-9]\d*)\b/gi, "trouble draws near")
        .replace(/\buses 1 growth\b/gi, "uses what you learned")
        .replace(/\b([A-Z][A-Za-z0-9' -]*?)\s+bond \+1\b/g, "friendship with $1 grows")
        .replace(/\bbond \+1\b/gi, "friendship grows")
        .replace(/\bsetup \+[1-9]\d*(?: progress)?\b/gi, "make the next try count")
        .replace(/\+([1-9]\d*) progress\b/gi, (_, amount) => projectProgressResult(amount))
        .replace(/\bone-shot\b/gi, "once")
        .replace(/\bclears tired\b/gi, "helps you feel fresh")
        .replace(/\btired\b/gi, "worn out")
        .trim();
    }

    function actionModalRows(action) {
      if (["avatar-arrival", "campaign-avatar-arrival"].includes(String(action?.kind || ""))) {
        const creationProfile = action?.creationProfile || null;
        if (creationProfile) {
          const entryName = creationProfile.entry_location_name
            || cardForLocation(creationProfile.entry_location_id)?.display_name
            || "the campaign threshold";
          if (action?.creationStage === "species") {
            return [
              ["Choose", "a Species card"],
              ["Next", "choose an Origin card"],
              ["Begin at", entryName],
            ];
          }
          if (action?.creationStage === "origin") {
            const species = (creationProfile.species || [])
              .find((choice) => choice.id === action.selectedSpeciesId)?.label || "your chosen species";
            return [
              ["Species", species],
              ["Choose", "an Origin card"],
              ["Then", "begin classless at level 0"],
              ["Begin at", entryName],
            ];
          }
          return [
            ["Campaign", creationProfile.name],
            ["Begin at", entryName],
          ];
        }
        return [
          ["Choose", "the trouble that always draws you in"],
          ["Then", "your new avatar arrives in The Cosy Cottage"],
        ];
      }
      if (String(action?.kind || "") === "choose-class") {
        const evidence = action?.characterIdentity?.class_readiness_evidence || null;
        const recommendation = action?.characterIdentity?.class_recommendation || null;
        const selected = (action?.creationProfile?.choices || [])
          .find((choice) => choice.id === action.selectedChoice)
          || action?.creationProfile?.choices?.[0]
          || null;
        return [
          evidence
            ? ["First qualifying action", evidence.summary || `${evidence.strategy_label} changed ${evidence.target?.label || "a shared task"} by +${evidence.progress} progress (${evidence.outcome})`]
            : ["First qualifying action", "a contribution changed a shared task"],
          recommendation
            ? ["Recommendation", `${recommendation.class_label}: ${recommendation.explanation}`]
            : ["Recommendation", "the evidence does not point to one Class"],
          selected
            ? ["Selected Class", `${selected.label} — ${selected.campaign_use}`]
            : ["Choose", "one of this campaign's Classes"],
          ["Ordinary verbs", "remain available to every avatar"],
        ];
      }
      if (String(action?.intention || "").toLowerCase() === "notice"
          && String(action?.label || "").toLowerCase().endsWith("again")) {
        const orbCost = Math.max(0, Number(action?.orbCost || 0));
        return [
          ["Costs", orbCost ? (orbCost === 1 ? "one Orb" : `${orbCost} Orbs`) : ""],
          ["What may happen", friendlyActionText(action?.effect)],
          ["Watch for", friendlyActionText(action?.risk)],
        ].filter((row) => String(row[1] || "").trim());
      }
      if (String(action?.kind || "") === "orb-chat") {
        if (action?.choices?.length) {
          return [
            ["Choose", "who you want to talk with"],
            ["Opening", "your avatar and theirs trade one line each"],
            ["Then", "nearby avatars take initiative turns to chat or pass"],
            ["Ends", "when one full initiative round passes"],
          ];
        }
        return [
          ["With", action?.targetName || String(action?.detail || "").split(/[·,]/)[0].trim()],
          ["Opening", "your avatar and theirs trade one line each"],
          ["Then", "nearby avatars take initiative turns to chat or pass"],
          ["Ends", "when one full initiative round passes"],
        ];
      }
      if (String(action?.label || "").toLowerCase() === "befriend") {
        const selectedRelationship = action?.selectedTarget?.()?.relationship || action?.relationship;
        if (selectedRelationship?.initial_status === "forming") {
          return [
            ["Relationship", selectedRelationship.statement],
            ["Status", "forming acquaintance; this does not claim friendship"],
            ["Campaign beat", selectedRelationship.deterministic_consequence],
            ["Spend", "one advancement point"],
            ["Dialogue", selectedRelationship.dialogue_contract],
          ];
        }
        if (action?.choices?.length) {
          return [
            ["Choose", "who you want to begin a friendship with"],
            ["Spend", "one advancement point"],
            ["Then", "their response arrives on the room heartbeat"],
          ];
        }
        return [
          ["With", action?.targetName || String(action?.detail || "").split(/[·,]/)[0].trim()],
          ["Spend", "one advancement point"],
          ["Then", "a friendship begins and their response arrives on the room heartbeat"],
        ];
      }
      if (["take", "swap"].includes(String(action?.label || "").toLowerCase()) && action?.choices?.length) {
        const swapping = String(action.label || "").toLowerCase() === "swap";
        return [
          ["Choose", "what you want to keep"],
          swapping
            ? ["In its place", `${action.heldItemName || "what you carry"} stays in ${state?.location?.name || "the room"}`]
            : ["Then", "it comes with you"],
        ];
      }
      if (String(action?.label || "").toLowerCase() === "use" && action?.choices?.length) {
        if (action.useChoiceKind === "mixed") {
          return [
            ["Choose", "how you want to use the item"],
            ["Then", "the use you chose changes the scene"],
          ];
        }
        return [
          ["Choose", "who should receive the care"],
          ["Then", "they may feel steadier"],
        ];
      }
      if (String(action?.label || "").toLowerCase() === "trade" && action?.choices?.length) {
        return [
          ["Choose", "the avatar and item swap"],
          ["Then", "both items change hands"],
        ];
      }
      if (String(action?.label || "").toLowerCase() === "attack" && action?.choices?.length) {
        return [
          ["Choose", "who you want to confront"],
          ["What may happen", friendlyActionText(action?.effect)],
          ["Watch for", friendlyActionText(action?.risk)],
        ].filter((row) => String(row[1] || "").trim());
      }
      if (["grow closer", "bond"].includes(String(action?.label || "").toLowerCase()) && action?.choices?.length) {
        return [
          ["Choose", "who you want to grow closer to"],
          ["Then", "a new friendship begins"],
        ];
      }
      if (String(action?.label || "").toLowerCase() === "remember" && action?.choices?.length) {
        return [
          ["Choose", "whose shared story you want to keep"],
          ["Then", "what mattered stays with you"],
        ];
      }
      if (String(action?.label || "").toLowerCase() === "evolve") {
        return [
          ["What changes", friendlyActionText(action?.effect)],
        ];
      }
      if (String(action?.label || "").toLowerCase() === "rest") {
        const warmed = String(action?.effect || "").includes("hearth tonic warmth")
          || String(action?.detail || "").includes("use the warmth");
        return [
          ["What changes", "you feel fresh again"],
          warmed
            ? ["What helps", "the tonic\'s warmth keeps trouble back"]
            : ["Watch for", friendlyActionText(action?.risk)],
        ].filter((row) => String(row[1] || "").trim());
      }
      if (["travel", "flee"].includes(String(action?.label || "").toLowerCase()) && action?.choices?.length) {
        const fleeing = String(action.label || "").toLowerCase() === "flee";
        return [
          ["Choose", fleeing ? "the way out that feels safest" : "the path you want to follow"],
          ["Then", fleeing ? "you leave the danger behind" : "you arrive in the next room"],
        ];
      }
      if (["nudge", "ping"].includes(String(action?.label || "").toLowerCase())) {
        const currentName = String(state?.turn?.current_actor_name || "the current player");
        return [
          ["Right now", `${currentName} has the room`],
          ["What happens", "give them a moment, then pass the choice if they're away"],
        ];
      }
      if (["i'm here", "pong"].includes(String(action?.label || "").toLowerCase())) {
        return [
          ["The room", "is gathering its next choice"],
          ["Your reply", "lets everyone know you're still here"],
        ];
      }
      return [
        ["Focus", action?.detail],
        ["What changes", friendlyActionText(action?.effect)],
        ["Watch for", friendlyActionText(action?.risk)],
      ].filter((row) => String(row[1] || "").trim());
    }

    function renderActionModalRows(action) {
      const showConversationDetails = ["orb-chat", "advancement-bond", "choose-class"]
        .includes(String(action?.kind || ""));
      const rows = (showConversationDetails ? actionModalRows(action) : [])
        .filter((row) => String(row?.[0] || "").trim() && String(row?.[1] || "").trim());
      const meta = $("action-modal-meta");
      meta.innerHTML = rows.map(([key, value]) => {
        const label = String(key).trim();
        const detail = String(value).trim();
        const risk = /^watch for$/i.test(label) ? " risk" : "";
        return `<div class="action-row${risk}" role="group" aria-label="${escapeAttr(label)}"><span class="action-row-key">${escapeHtml(label)}</span><span class="action-row-value">${escapeHtml(detail)}</span></div>`;
      }).join("");
    }

    function actionSummary(action) {
      if (action?.minimalTravelPresentation) return String(action?.modalSummary || "");
      if (action?.modalSummary) return String(action.modalSummary);
      if (["nudge", "ping"].includes(String(action?.label || "").toLowerCase())) {
        return "Give them a moment. If they're away, the room passes the next choice to someone who's here.";
      }
      if (["i'm here", "pong"].includes(String(action?.label || "").toLowerCase())) {
        return "Let the room know you're here and ready for the next choice.";
      }
      const detail = String(action?.detail || "").trim();
      const effect = friendlyActionText(action?.effect);
      const risk = friendlyActionText(action?.risk);
      if (effect && risk) return `${actionSentence(effect)} ${actionSentence(risk)}`;
      if (effect) return actionSentence(effect);
      if (risk) return actionSentence(risk);
      if (detail) return actionSentence(detail);
      return "See what happens, then let the room answer.";
    }

    function actionSentence(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      const sentence = `${text.charAt(0).toUpperCase()}${text.slice(1)}`;
      return /[.!?]$/.test(sentence) ? sentence : `${sentence}.`;
    }

    function actionConfirmLabel(action) {
      const label = String(action?.label || "").toLowerCase();
      if (action?.creationStage === "species") return "next";
      if (action?.creationStage === "origin") return "begin";
      if (String(action?.kind || "") === "choose-class") return "choose campaign class";
      if (String(action?.intention || "") === "contribute") {
        return String(action?.project?.verb || "contribute").toLowerCase();
      }
      if (String(action?.intention || "") === "travel") {
        return action?.choices?.length ? "travel" : "begin route";
      }
      if (["notice", "inspect", "scout"].includes(String(action?.intention || ""))) {
        return label || String(action.intention);
      }
      if (label === "begin again") return "begin again";
      if (String(action?.command || "").trim().toLowerCase() === "create avatar") return "begin";
      if (label === "evolve") return "evolve";
      if (label === "travel") return "go";
      if (label === "listen") return "listen";
      if (label === "listen again") return "listen again";
      if (label === "chat") return "chat";
      if (label === "give") return "give";
      if (label === "take") return "take";
      if (label === "swap") return "swap";
      if (label === "grow closer" || label === "bond") return "grow closer";
      if (label === "remember") return "remember";
      if (label === "practice" || label === "train") return "practice";
      if (label === "rest") return "rest";
      if (label === "shuffle") return "shuffle";
      if (label === "nudge" || label === "ping") return "gentle nudge";
      if (label === "i'm here" || label === "pong") return "I'm here";
      if (label.includes("generate")) return "begin";
      const fallback = compactActionLabel(action);
      return fallback === "act" ? "take this turn" : fallback;
    }

    function actionCancelLabel(action) {
      if (action?.creationStage === "origin") return "back";
      if (["travel", "flee"].includes(String(action?.intention || "").toLowerCase())) return "stay here";
      return "not now";
    }

    function handCardThink(action) {
      return projectedHandEntryForAction(action)?.think || null;
    }

    function canDiscardHandCard(action) {
      return Boolean(
        !state?.branch
        && actorId
        && actorSession
        && state?.primary_action?.kind !== "create_avatar"
        && (!state?.combat || state?.turn?.is_current_actor)
        && handCardThink(action)?.available
        && handCardThink(action)?.offer_id
      );
    }

    function usesInlineStoryHand() {
      return Boolean(
        !state?.branch
        && state?.primary_action?.kind !== "create_avatar"
        && !actionBusy
      );
    }

    function storyHandKey(action) {
      return String(action?.handKey || actionHandKey(action) || action?.focusKey || "");
    }

    function originalStoryHandAction(action) {
      const index = Number(action?.actionIndex);
      return Number.isInteger(index) && index >= 0 && index < actions.length
        ? actions[index]
        : action;
    }

    function storyHandRowsHtml(action) {
      return actionModalRows(action)
        .filter((row) => String(row?.[0] || "").trim() && String(row?.[1] || "").trim())
        .map(([key, value]) => {
          const label = String(key).trim();
          const detail = String(value).trim();
          const risk = /^watch for$/i.test(label) ? " risk" : "";
          return `<div class="action-row${risk}" role="group" aria-label="${escapeAttr(label)}"><span class="action-row-key">${escapeHtml(label)}</span><span class="action-row-value">${escapeHtml(detail)}</span></div>`;
        })
        .join("");
    }

    function storyHandChoicesHtml(action) {
      const choices = Array.isArray(action?.choices) ? action.choices : [];
      if (!choices.length) return "";
      const selected = action.selectedChoice || choices[0]?.value || "";
      action.selectedChoice = selected;
      return choices.map((choice, index) => {
        const value = String(choice.value || "");
        const active = value === String(selected);
        const choiceAria = [choice.label || value, choice.detail || value].filter(Boolean).join(". ");
        return `<label class="action-choice${active ? " active" : ""}" data-hand-choice-index="${index}"><input type="radio" name="hand-action-choice" value="${escapeAttr(value)}" aria-label="${escapeAttr(choiceAria)}"${active ? " checked" : ""} /><span class="action-choice-text"><span class="action-choice-label">${escapeHtml(choice.label || value)}</span><span class="action-choice-detail">${escapeHtml(choice.detail || value)}</span></span></label>`;
      }).join("");
    }

    function renderStoryHandInspector(action) {
      const inspector = $("hand-inspector");
      inspector.hidden = true;
      $("hand-title").textContent = "";
      $("hand-summary").textContent = "";
      $("hand-meta").innerHTML = "";
      $("hand-choices").hidden = true;
      $("hand-choices").innerHTML = "";
    }

    function scrollStoryHandCardIntoView(action, behavior = "smooth") {
      if (!usesInlineStoryHand() || !storyHandExpanded || !action) return;
      const rail = $("hand-rail");
      const key = storyHandKey(action);
      const card = [...rail.querySelectorAll(".cmd[data-hand-key]")]
        .find((button) => String(button.dataset.handKey || "") === key);
      if (!card) return;
      const left = card.offsetLeft - Math.max(0, (rail.clientWidth - card.offsetWidth) / 2);
      rail.scrollTo({ left, behavior });
    }

    function renderStoryHandChrome(visibleActions) {
      const prompt = document.querySelector(".prompt");
      const inline = usesInlineStoryHand();
      const expanded = inline && storyHandExpanded && !actionBusy && visibleActions.length > 0;
      if (!expanded && storyHandExpanded && (!inline || !visibleActions.length || actionBusy)) {
        storyHandExpanded = false;
        storyHandActiveKey = "";
      }
      prompt.classList.toggle("hand-expanded", expanded);
      $("hand-toggle").setAttribute("aria-expanded", expanded ? "true" : "false");
      const count = visibleActions.length;
      $("hand-toggle-status").textContent = expanded ? "Close" : `${count} ${count === 1 ? "card" : "cards"}`;
      ["primary", "secondary", "tertiary"].forEach((id, index) => {
        const action = visibleActions[index] || null;
        const slot = document.querySelector(`[data-story-card-slot="${id}"]`);
        const play = document.querySelector(`[data-hand-play="${id}"]`);
        const discard = document.querySelector(`[data-hand-discard="${id}"]`);
        slot.hidden = !action;
        if (!action) return;
        const original = originalStoryHandAction(action);
        const title = actionTitle(original);
        play.disabled = !inline || Boolean(original.busy);
        play.setAttribute("aria-label", `Play ${title}`);
        discard.disabled = !inline || !canDiscardHandCard(original) || handShuffleBusy;
        discard.setAttribute("aria-label", `Discard ${title}`);
        discard.title = discard.disabled
          ? "No replacement is available for this card right now."
          : `Discard ${title} and draw its replacement`;
      });
      for (const button of $("hand-rail").querySelectorAll(".cmd")) button.removeAttribute("aria-current");
      storyHandScrollPending = false;
      renderStoryHandInspector(null);
    }

    function setStoryHandExpanded(expanded, action = null) {
      if (!usesInlineStoryHand()) return false;
      storyHandExpanded = Boolean(expanded);
      if (storyHandExpanded) {
        const visibleActions = actionBarActions();
        const actionIndex = actions.indexOf(action);
        const selected = visibleActions.find((candidate) => candidate.actionIndex === actionIndex)
          || visibleActions.find((candidate) => storyHandKey(candidate) === storyHandActiveKey)
          || visibleActions[0]
          || null;
        if (selected) {
          storyHandActiveKey = storyHandKey(selected);
          focusIndex = selected.actionIndex;
          focusedKey = originalStoryHandAction(selected)?.focusKey || "";
          actionConfirmAction = originalStoryHandAction(selected);
          storyHandScrollPending = true;
        }
      } else {
        storyHandActiveKey = "";
        actionConfirmAction = null;
      }
      renderCommands();
      return true;
    }

    function activateStoryHandAction(action) {
      if (!action || actionBusy) return;
      if (!usesInlineStoryHand()) {
        openActionModal(action, { handCard: true });
        return;
      }
      const index = actions.indexOf(action);
      if (index >= 0) focusIndex = index;
      focusedKey = action.focusKey || actionHandKey(action) || "";
      storyHandActiveKey = storyHandKey(action);
      setStoryHandExpanded(true, action);
    }

    async function discardStoryHandCard(id) {
      const action = actionForButton(id);
      if (!action || !canDiscardHandCard(action) || handShuffleBusy) return;
      const index = Number($(id)?.dataset?.actionIndex);
      if (Number.isInteger(index) && index >= 0) focusIndex = index;
      focusedKey = action.focusKey || actionHandKey(action) || "";
      await discardActionCard(action);
    }

    function playStoryHandCard(id) {
      const action = actionForButton(id);
      if (!action || actionBusy) return;
      if (Array.isArray(action.choices) && action.choices.length > 1) {
        openActionModal(action);
        return;
      }
      if (Array.isArray(action.choices) && action.choices.length === 1 && !action.selectedChoice) {
        action.selectedChoice = action.choices[0].value;
      }
      void runAction(action);
    }

    function selectStoryHandCardFromScroll() {
      if (!usesInlineStoryHand() || !storyHandExpanded) return;
      const rail = $("hand-rail");
      const cards = [...rail.querySelectorAll(".cmd[data-action-index]")]
        .filter((button) => getComputedStyle(button).display !== "none");
      if (!cards.length) return;
      const railCenter = rail.scrollLeft + rail.clientWidth / 2;
      const card = cards.reduce((nearest, candidate) => {
        const candidateCenter = candidate.offsetLeft + candidate.offsetWidth / 2;
        const nearestCenter = nearest.offsetLeft + nearest.offsetWidth / 2;
        return Math.abs(candidateCenter - railCenter) < Math.abs(nearestCenter - railCenter)
          ? candidate
          : nearest;
      });
      const action = actionForButton(card.id);
      const key = String(card.dataset.handKey || "");
      if (!action || !key || key === storyHandActiveKey) return;
      storyHandActiveKey = key;
      focusIndex = Number(card.dataset.actionIndex);
      focusedKey = action.focusKey || "";
      actionConfirmAction = action;
      for (const button of cards) {
        if (button === card) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      }
      const index = cards.indexOf(card);
      $("hand-toggle-status").textContent = `${index + 1} of ${cards.length} · swipe between cards`;
      renderStoryHandInspector(action);
    }

    function openActionModal(action, { handCard = false } = {}) {
      if (!action || actionBusy) return;
      if (action.kind === "orb-chat" && pendingChats.length) {
        setError("Let the current conversation settle before starting another.");
        render();
        return;
      }
      actionConfirmAction = action;
      const dialog = $("action-modal").querySelector(".action-dialog");
      dialog.classList.remove("hand-card-mode", "travel-card-mode", ...actionCardAccentClasses);
      if (handCard) {
        dialog.classList.add("hand-card-mode", actionCardAccentClass(action).className);
        if (action.minimalTravelPresentation) dialog.classList.add("travel-card-mode");
      }
      const label = action.modalTitle || actionTitle(action);
      const selectedChoice = Array.isArray(action?.choices)
        ? (action.choices.find((choice) => String(choice.value || "") === String(action.selectedChoice || "")) || action.choices[0])
        : null;
      syncActionChoicePreview(action, selectedChoice);
      const eyebrow = handCard
        ? (action.minimalTravelPresentation
          ? String(action?.presentation?.verb || action?.label || "travel").trim()
          : [actionCardSuitEmoji(actionCardSuit(action)), String(action?.presentation?.verb || action?.label || "play").trim()]
            .filter(Boolean)
            .join(" · "))
        : String(action.modalEyebrow || "").trim();
      $("action-modal-eyebrow").textContent = eyebrow;
      $("action-modal-eyebrow").hidden = !eyebrow;
      $("action-modal-title").textContent = label;
      $("action-modal-summary").textContent = journalSentence(actionSummary(action));
      if (handCard) $("action-modal-meta").innerHTML = "";
      else renderActionModalRows(action);
      renderActionChoices(action);
      renderRoomAvatarRail();
      $("action-modal-confirm").textContent = handCard && !action.minimalTravelPresentation
        ? "play"
        : actionConfirmLabel(action);
      const cancelButton = $("action-modal-cancel");
      cancelButton.textContent = handCard ? "close" : actionCancelLabel(action);
      cancelButton.hidden = false;
      cancelButton.setAttribute("aria-label", handCard ? `Close ${label} card` : cancelButton.textContent);
      const discardButton = $("action-modal-discard");
      const discardCertificate = projectedHandEntryForAction(action)?.think || null;
      const canDiscard = !state?.branch
        && actorId
        && actorSession
        && discardCertificate?.available
        && discardCertificate?.offer_id
        && (!state?.combat || state?.turn?.is_current_actor);
      discardButton.hidden = handCard ? false : !canDiscard;
      discardButton.disabled = handShuffleBusy || (handCard && !canDiscard);
      discardButton.textContent = handCard ? "discard" : (discardCertificate?.free ? "discard · free" : "discard");
      discardButton.setAttribute(
        "aria-label",
        canDiscard
          ? `Discard this ${discardCertificate.slot || action.storyHandSlot || "Story Hand"} card; ${discardCertificate.free ? "free" : "uses this turn"}`
          : "This Story Hand card cannot be discarded",
      );
      const actionButtons = discardButton.closest(".action-actions");
      actionButtons?.classList.toggle("has-discard", Boolean(canDiscard) && !handCard);
      actionButtons?.classList.toggle("hand-card-actions", handCard);
      openModal("action-modal", $("action-modal-confirm"));

    function setCreationModalStage(action, stage) {
      const profile = action?.creationProfile;
      if (!profile || !["species", "origin"].includes(stage)) return;
      action.creationStage = stage;
      if (stage === "species") {

    function renderActionChoices(action) {

    function fallbackCardImage(card) {
      const role = card?.role || "card";
      const color = role === "location" ? "#1a3d2a" : role === "item" ? "#3b2f1a" : "#203047";

          ? "<circle cx='160' cy='88' r='44' fill='#efc96b' opacity='.28'/><path d='M121 99 C134 65 186 65 199 99 C183 116 137 116 121 99 Z' fill='#d8f7dc' opacity='.72'/><circle cx='160' cy='91' r='18' fill='#efc96b' opacity='.82'/>"
          : "<circle cx='160' cy='74' r='36' fill='#d8f7dc' opacity='.72'/><path d='M88 150 C102 108 128 95 160 95 C192 95 218 108 232 150 Z' fill='#65e68a' opacity='.38'/><path d='M112 78 C130 45 190 45 208 78' fill='none' stroke='#efc96b' stroke-width='8' stroke-linecap='round' opacity='.82'/>";
