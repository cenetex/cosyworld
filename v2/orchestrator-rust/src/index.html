    function backgroundImageStyle(image) {
      if (!image) return "";
      const cssUrl = String(image)
        .replaceAll("\\", "\\\\")
        .replaceAll('"', '\\"')
        .replaceAll("\n", "")
        .replaceAll("\r", "");
      return ` style="background-image:url(&quot;${escapeAttr(cssUrl)}&quot;)"`;
    }

    function initials(value) {
      const words = String(value || "?").trim().split(/\s+/).filter(Boolean);
      if (!words.length) return "?";
      return words.slice(0, 2).map((word) => word[0]).join("").toUpperCase();
    }

    function compactAssetId(value) {
      const text = String(value || "");
      if (text.length <= 18) return text;
      return `${text.slice(0, 8)}...${text.slice(-6)}`;
    }

    function actorLabel(actor) {
      return actor?.name || "Someone";
    }

    function actorForId(id) {
      const numeric = Number(id);
      return (state?.actors || []).find((actor) => Number(actor.id) === numeric) || null;
    }

    function actorNameForEvent(event) {
      return actorForId(event?.actor_id)?.name || event?.actor_name || "someone";
    }

    function actorTitleForEvent(event) {
      return String(actorForId(event?.actor_id)?.title || "").trim();
    }

    function defaultBondStatement(targetName) {
      return `I bring small kindnesses to ${targetName || "someone"}.`;
    }

    function compactActionDetail(value) {
      return String(value || "")
        .replace(/^advances progress clock\s+.+?\s+by\s+([1-9]\d*)/i, (_, amount) => projectProgressResult(amount))
        .replace(/^finishes progress clock\s+.+?\s+by\s+([1-9]\d*)/i, "finishes the work")
        .replace(/^sets up \+([1-9]\d*) progress/i, "makes the next try count")
        .replace(/;\s*advances progress clock\s+.+?\s+by\s+([1-9]\d*)/gi, (_, amount) => `; ${projectProgressResult(amount)}`)
        .replace(/;\s*finishes progress clock\s+.+?\s+by\s+([1-9]\d*)/gi, "; finishes the work")
        .replace(/;\s*sets up \+([1-9]\d*) progress/gi, "; makes the next try count")
        .replace(/\sand advances progress clock\s+.+?\s+by\s+([1-9]\d*)/gi, (_, amount) => ` and ${projectProgressResult(amount)}`)
        .replace(/\sand finishes progress clock\s+.+?\s+by\s+([1-9]\d*)/gi, " and finishes the work")
        .replace(/\sand sets up \+([1-9]\d*) progress/gi, " and makes the next try count")
        .replace(/^marks you\s+/i, "")
        .replace(/^helps (?:a resident|an avatar) and\s+/i, "")
        .trim();
    }

    function actorNeedsHealing(actor) {
      const hp = Number(actor?.hp ?? 0);
      const maxHp = Number(actor?.stats?.hp_base ?? 0);
      return actor?.status === "knocked_out" || (actor?.status === "active" && maxHp > 0 && hp < maxHp);
    }

    function actorIsTired(view = state) {
      return Boolean(actorId && (view?.tags || []).some((tag) => (
        tag.label === "tired"
        && (!tag.scope_id || Number(tag.scope_id) === Number(actorId))
      )));
    }

    function focusedAction() {
      if (!actions.length) return null;
      if (focusIndex < 0 || focusIndex >= actions.length) focusIndex = 0;
      return actions[focusIndex] || actions[0] || null;
    }

    function actionMatchesFocusKey(action, key) {
      if (!key) return false;
      if (action?.focusKey === key) return true;
      return Array.isArray(action?.focusKeys) && action.focusKeys.includes(key);
    }

    function actionHandKey(action) {
      const offerIds = Array.isArray(action?.offerIds)
        ? action.offerIds.map((offerId) => String(offerId || "")).filter(Boolean)
        : [];
      if (offerIds.length === 1) return `offer:${offerIds[0]}`;
      return String(action?.focusKey || action?.command || `${action?.label || ""}:${action?.detail || ""}`).trim();
    }

    function actionFocusKeys(action) {
      return [action?.focusKey, ...(Array.isArray(action?.focusKeys) ? action.focusKeys : [])]
        .map((key) => String(key || ""))
        .filter(Boolean);
    }

    function firstThreadModel(view = state, availableActions = actions) {
      if (!actorId || !view || view?.primary_action?.kind === "create_avatar") return null;
      const tale = view.first_tale;
      if (!tale) return null;
      const continuation = tale.phase === "complete" ? tale.continuation : null;
      if (continuation?.phase === "accepted" || (tale.phase === "complete" && !continuation)) return null;
      const advancingOfferId = String(
        continuation?.advancing_offer_id || tale.advancing_offer_id || "",
      );
      const actionHasOffer = (action) => advancingOfferId && (
        Array.isArray(action?.offerIds) && action.offerIds.includes(advancingOfferId)
      );
      const actionTargets = (action, targetId) => (
        Number(action?.target?.id || 0) === Number(targetId || 0)
          || actionFocusKeys(action).includes(`exit:${targetId}`)
          || actionFocusKeys(action).includes(`actor:${targetId}`)
      );
      const matchesPhase = (action) => {
        if (actionHasOffer(action)) return true;
        if (continuation?.phase === "travel") {
          const destinationId = Number(
            continuation.required_location_id || continuation.destination_location_id || 0,
          );
          return action.intention === "travel" && actionTargets(action, destinationId);
        }
        if (continuation?.phase === "arrived") {
          return ["create_bond", "bond"].includes(String(action?.intention || action?.kind || ""))
            && actionTargets(action, continuation.target_actor_id);
        }
        if (tale.phase === "notice") {
          return (action.intention === "notice" || action.focusKey === "check")
            && actionTargets(action, tale.lead_location_id);
        }
        if (["return_to_lead", "follow_lead", "return_to_destination"].includes(tale.phase)) {
          const destinationId = Number(tale.required_location_id || (
            tale.phase === "return_to_lead" ? tale.lead_location_id : tale.destination_location_id
          ));
          return action.intention === "travel"
            && actionTargets(action, destinationId);
        }
        if (tale.phase === "contribute") {
          return String(action?.project?.id || "") === String(tale.job_id || "")
            || String(action?.project?.progress_clock_id || "") === String(tale.progress_clock_id || "")
            || action.intention === "notice"
            || action.focusKey === "check";
        }
        return false;
      };
      const matching = availableActions.filter(matchesPhase);
      const stage = continuation
        ? (continuation.phase === "travel" ? 4 : 5)
        : (["notice", "return_to_lead"].includes(tale.phase) ? 1
          : (tale.phase === "follow_lead" ? 2 : 3));
      return {
        stage,
        total: continuation ? 5 : 3,
        actionKey: matching[0] ? actionHandKey(matching[0]) : "",
        actionKeys: matching.map(actionHandKey),
        text: String(continuation?.instruction || tale.instruction || ""),
      };
    }

    function dealtStoryGuide(view = state, availableActions = actions) {
      const firstThread = firstThreadModel(view, availableActions);
      if (firstThread) {
        return {
          kind: "first-tale",
          label: "next tale beat",
          actionKeys: [...new Set([
            firstThread.actionKey,
            ...(Array.isArray(firstThread.actionKeys) ? firstThread.actionKeys : []),
          ].filter(Boolean))],
        };
      }
      if (firstTaleCelebration || !firstTaleIsComplete(view)) return null;
      const roomThread = nextStoryThreadModel(view, availableActions);
      if (!roomThread?.actionKey) return null;
      return {
        kind: "room-thread",
        label: "room thread",
        actionKeys: [roomThread.actionKey],
      };
    }

    function authoritativeHandSignature(view = state) {
      return JSON.stringify({
        entries: (view?.action_hand?.entries || []).map((entry) => [
          String(entry?.offer_id || ""),
          String(entry?.kind || ""),
          String(entry?.intention || ""),
          String(entry?.provider?.kind || ""),
          String(entry?.provider?.id || ""),
          String(entry?.slot || ""),
          String(entry?.suit || ""),
          String(entry?.think?.offer_id || ""),
        ]),
        think: [
          String(view?.action_hand?.generation || ""),
          ...(view?.action_hand?.entries || []).map((entry) => String(entry?.think?.offer_id || "")),
        ],
      });
    }

    function actionMatchesProjectedHandEntry(action, entry) {
      const offerIds = Array.isArray(action?.offerIds) ? action.offerIds : [];
      return offerIds.includes(String(entry?.offer_id || ""));
    }

    function projectedHandEntryForAction(action) {
      return (state?.action_hand?.entries || []).find((entry) => (
        actionMatchesProjectedHandEntry(action, entry)
      )) || null;
    }

    function actionIndexForHandKey(key) {
      if (!key) return -1;
      let index = actions.findIndex((action) => actionHandKey(action) === key);
      if (index >= 0) return index;
      index = actionIndexForKey(key);
      return index;
    }

    function orderedActionIndexesForHand() {
      const indexes = actions.map((_, index) => index);
      if (state?.branch) return indexes;
      const ordered = [];
      const chosen = new Set();
      const authoritativeEntries = state?.action_hand?.entries || [];
      for (const entry of authoritativeEntries) {
        const index = indexes.find((candidate) => (
          !chosen.has(candidate) && actionMatchesProjectedHandEntry(actions[candidate], entry)
        ));
        if (index < 0 || index === undefined) continue;
        ordered.push(index);
        chosen.add(index);
      }
      if (authoritativeEntries.length) return ordered;
      const remaining = indexes
        .filter((index) => !chosen.has(index))
        .sort((left, right) => (
          Number(actions[left]?.handProvider?.priority ?? 255)
            - Number(actions[right]?.handProvider?.priority ?? 255)
          || actionRank(actions[left]) - actionRank(actions[right])
          || actionHandKey(actions[left]).localeCompare(actionHandKey(actions[right]))
        ));
      return [...ordered, ...remaining];
    }

    function handCapacity() {
      return state?.branch ? 2 : Number(state?.action_hand?.capacity || 3);
    }

    function validActionHandKeySet() {
      const keys = new Set();
      for (const action of actions) {
        const key = actionHandKey(action);
        if (key) keys.add(key);
      }
      return keys;
    }

    function pruneDiscardedHandKeys(validKeys = validActionHandKeySet()) {
      const seen = new Set();
      discardedHandKeys = discardedHandKeys.filter((key) => {
        if (!validKeys.has(key) || seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function pushDiscardedHandKey(key) {
      if (!key || actionIndexForHandKey(key) < 0) return;
      if (!discardedHandKeys.includes(key)) discardedHandKeys.push(key);
    }

    function dealHandKeys(kept, seen, capacity) {
      const discarded = new Set(discardedHandKeys);
      for (const index of orderedActionIndexesForHand()) {
        if (kept.length >= capacity) break;
        const key = actionHandKey(actions[index]);
        if (!key || seen.has(key) || discarded.has(key)) continue;
        kept.push(key);
        seen.add(key);
      }
    }

    function reconcileHand() {
      if (state?.branch) {
        handKeys = actions.slice(0, 2).map(actionHandKey).filter(Boolean);
        discardedHandKeys = [];
        playerPromotedHandKey = "";
        return;
      }
      const nextAuthoritativeIdentity = JSON.stringify(
        orderedActionIndexesForHand().map((index) => actionHandKey(actions[index])),
      );
      const compositionChanged = nextAuthoritativeIdentity !== authoritativeHandIdentity;
      authoritativeHandIdentity = nextAuthoritativeIdentity;
      const validKeys = validActionHandKeySet();
      if (compositionChanged) {
        handKeys = [];
        discardedHandKeys = [];
        playerPromotedHandKey = "";
      } else {
        pruneDiscardedHandKeys(validKeys);
        handKeys = handKeys.filter((key) => (
          validKeys.has(key) && !discardedHandKeys.includes(key)
        ));
        if (playerPromotedHandKey && !validKeys.has(playerPromotedHandKey)) {
          playerPromotedHandKey = "";
        }
      }
      const kept = [];
      const seen = new Set();
      for (const key of handKeys) {
        if (!key || seen.has(key)) continue;
        kept.push(key);
        seen.add(key);
        if (kept.length >= handCapacity()) break;
      }
      dealHandKeys(kept, seen, handCapacity());
      handKeys = kept;
    }

    function promoteActionToHand(index, key = "") {
      if (state?.branch || index < 0 || index >= actions.length) return;
      const handKey = actionHandKey(actions[index]) || key;
      if (!handKey) return;
      discardedHandKeys = discardedHandKeys.filter((entry) => entry !== handKey);
      handKeys = [handKey, ...handKeys.filter((entry) => entry !== handKey)].slice(0, handCapacity());
      reconcileHand();
    }

    function promotePendingRecoveryAction() {
      const index = actionIndexForKey("rest");
      if (index < 0 || actionRank(actions[index]) > 25) return false;
      const authoritativeEntries = state?.action_hand?.entries || [];
      if (authoritativeEntries.length && !authoritativeEntries.some((entry) => (
        actionMatchesProjectedHandEntry(actions[index], entry)
      ))) return false;
      const key = actionHandKey(actions[index]);
      if (!key) return false;
      discardedHandKeys = discardedHandKeys.filter((entry) => entry !== key);
      handKeys = [key, ...handKeys.filter((entry) => entry !== key)].slice(0, handCapacity());
      focusIndex = index;
      focusedKey = key;
      return true;
    }

    function discardHandKey(key, shouldReconcile = true) {
      if (!key) return;
      pushDiscardedHandKey(key);
      handKeys = handKeys.filter((entry) => entry !== key);
      if (focusedKey === key) {
        focusedKey = "";
        focusIndex = 0;
      }
      if (playerPromotedHandKey === key) playerPromotedHandKey = "";
      if (shouldReconcile) reconcileHand();
    }

    function actionIndexForKey(key) {
      if (!key) return -1;
      return actions.findIndex((action) => actionMatchesFocusKey(action, key));
    }

    function restoreFocusedActionChoice(action, key) {
      if (!String(key || "").startsWith("exit:")) return;
      const destinationId = String(key).slice("exit:".length);
      const choice = (action?.choices || []).find((candidate) => (
        String(candidate?.value || "") === destinationId
      ));
      if (choice) action.selectedChoice = choice.value;
    }

    function restoreFocusedAction() {
      if (!actions.length) {
        focusIndex = 0;
        focusedKey = "";
        return;
      }
      if (focusedKey) {
        const index = actionIndexForKey(focusedKey);
        if (index >= 0) {
          focusIndex = index;
          restoreFocusedActionChoice(actions[index], focusedKey);
          return;
        }
      }
      const firstHandIndex = handKeys.length ? actionIndexForHandKey(handKeys[0]) : -1;
      if (focusIndex >= actions.length || focusIndex < 0) focusIndex = firstHandIndex >= 0 ? firstHandIndex : 0;
      focusedKey = actions[focusIndex]?.focusKey || "";
    }

    function focusAction(index, key = "") {
      if (!actions.length) return;
      accountPanelPinned = false;
      libraryPanelPinned = false;
      focusIndex = ((index % actions.length) + actions.length) % actions.length;
      focusedKey = key || actions[focusIndex]?.focusKey || "";
      render();
    }

    function focusActionByKey(key) {
      const index = actionIndexForKey(key);
      if (index < 0) return false;
      focusAction(index, key);
      return true;
    }

    function actionBarActions() {
      if (state?.branch) {
        return actions.slice(0, 2).map((action, actionIndex) => ({ ...action, actionIndex }));
      }
      if (!actions.length) return [];
      reconcileHand();
      const storyGuide = dealtStoryGuide();
      const storyActionKeys = new Set(
        storyGuide?.kind === "first-tale" ? storyGuide.actionKeys || [] : [],
      );
      const entries = [];
      for (const key of handKeys) {
        const index = actionIndexForHandKey(key);
        if (index < 0) continue;
        entries.push({
          ...actions[index],
          actionIndex: index,
          handKey: key,
          storyGuide: storyActionKeys.has(actionHandKey(actions[index])),
          storyGuideLabel: storyActionKeys.has(actionHandKey(actions[index]))
            ? storyGuide?.label || "next tale beat"
            : "",
        });
      }
      return entries;
    }

    function visibleFocusedAction() {
      const visible = actionBarActions();
      return visible.find((action) => action.actionIndex === focusIndex) || visible[0] || null;
    }

    function moveVisibleActionFocus(delta) {
      const visible = actionBarActions();
      if (!visible.length) return;
      const current = visible.findIndex((action) => action.actionIndex === focusIndex);
      const next = current < 0
        ? (delta > 0 ? 0 : visible.length - 1)
        : ((current + delta) % visible.length + visible.length) % visible.length;
      const action = visible[next];
      focusIndex = action.actionIndex;
      focusedKey = action.focusKey || "";
      if (usesInlineStoryHand() && storyHandExpanded) {
        storyHandActiveKey = storyHandKey(action);
        actionConfirmAction = originalStoryHandAction(action);
        storyHandScrollPending = true;
      }
      renderRoomAvatarRail();
      renderCommands();
      $((["primary", "secondary", "tertiary"])[next])?.focus();
    }

    function isDefinitivePassRejection(result = {}) {
      return [400, 409, 423].includes(Number(result.status || 0));
    }

    async function discardActionCard(focused = visibleFocusedAction()) {
      if (handShuffleBusy
        || !actorId
        || !actorSession
        || state?.primary_action?.kind === "create_avatar") {
        return null;
      }
      handShuffleBusy = true;
      try {
        const entry = projectedHandEntryForAction(focused);
        const think = entry?.think;
        if (!think?.available || !think?.offer_id) {
          setError("That Story Hand card has no other current possibility to discard into.");
          return null;
        }
        if (handPassSubmission?.offer_id !== think.offer_id) {
          handPassSubmission = {
            offer_id: think.offer_id,
            envelope: canonicalCommandEnvelope(),
          };
        }
        const result = await postResult("/commands", withAccess({
          actor_id: actorId,
          actor_session: actorSession,
          command: "think",
          offer_id: handPassSubmission.offer_id,
          envelope: handPassSubmission.envelope,
        }));
        pushEvents(result.events || []);
        if (!result.ok) {
          setError(commandFailureMessage(result));
          if (isDefinitivePassRejection(result)) {
            // A confirmed stale card or changed turn cannot succeed with this
            // receipt. Keep it only for ambiguous transport/server retries.
            handPassSubmission = null;
            await refresh();
            renderCommands();
          }
          return result;
        }
        handPassSubmission = null;
        await refresh();
        renderCommands();
        return result;
      } finally {
        handShuffleBusy = false;
        renderCommands();
      }
    }

    // Kept for transport/browser compatibility; the player-facing control is
    // Discard on each card in the expanded Story Hand.
    async function passHand(focused = visibleFocusedAction()) {
      return discardActionCard(focused);
    }

    function renderCommands() {
      const prompt = document.querySelector(".prompt");
      const buttonIds = ["primary", "secondary", "tertiary"];
      renderTurnPingPill();
      prompt.classList.toggle("single-action", actionBusy);
      if (actionBusy) {
        prompt.classList.remove("choice-mode");
        const busyDetail = typeof pendingAction?.busyDetail === "function"
          ? pendingAction.busyDetail()
          : pendingAction?.busyDetail;
        const detail = actionSlow
          ? "saving safely — this is taking longer than usual"
          : (busyDetail || pendingAction?.detail || pendingAction?.label || "working");
        renderButton("primary", {
          ...(pendingAction || {}),
          label: actionSlow ? "still working" : (pendingAction?.busyLabel || "working"),
          detail,
          busy: true,
        });
        for (const id of buttonIds.slice(1)) {
          renderButton(id, null);
          $(id).style.display = "none";
        }
        renderStoryHandChrome([]);
        $("hand-toggle-status").textContent = "action in progress";
        return;
      }
      const choiceMode = Boolean(state?.branch && actions.length > 1);
      const visibleActions = actionBarActions().slice(0, handCapacity());
      prompt.classList.toggle("combat-mode", Boolean(state?.combat));
      prompt.classList.toggle("choice-mode", choiceMode);
      for (let index = 0; index < buttonIds.length; index += 1) {
        const id = buttonIds[index];
        const visibleAction = visibleActions[index]
          ? {
              ...visibleActions[index],
              suggestionIndex: index,
              suggestionCount: visibleActions.length,
            }
          : null;
        renderButton(id, visibleAction);
        $(id).style.display = visibleAction ? "flex" : "none";
      }
      renderStoryHandChrome(visibleActions);
    }

    function actionForButton(id) {
      const button = $(id);
      const actionIndex = Number(button?.dataset?.actionIndex);
      if (!Number.isInteger(actionIndex) || actionIndex < 0 || actionIndex >= actions.length) {
        return null;
      }
      return actions[actionIndex] || null;
    }

    async function runAction(action) {
      if (actionBusy) return;
      if (action?.kind === "orb-chat" && pendingChats.length) {
        setError("Let the current conversation settle before starting another.");
        render();
        return;
      }
      if (action?.kind === "model-interaction" && pendingModelInteractions.length) {
        setError("Let the current model interaction finish before starting another.");
        render();
        return;
      }
      actionBusy = true;
      actionSlow = false;
      pendingAction = action;
      clearTimeout(actionSlowTimer);
      actionSlowTimer = setTimeout(() => {
        if (!actionBusy || pendingAction !== action) return;
        actionSlow = true;
        renderCommands();
      }, 3000);
      const pendingChat = beginPendingChat(action);
      const pendingInteraction = beginPendingModelInteraction(action);
      renderCommands();
      renderLog();
      try {
        const result = await action.run();
        if (result?.ok === false) {
          cancelPendingChat(pendingChat);
          cancelPendingModelInteraction(pendingInteraction);
        }
      } catch (error) {
        cancelPendingChat(pendingChat);
        cancelPendingModelInteraction(pendingInteraction);
        setError(actionExceptionMessage(error));
      } finally {
        clearTimeout(actionSlowTimer);
        actionSlowTimer = null;
        actionBusy = false;
        actionSlow = false;
        pendingAction = null;
        render();
      }
    }

    function channelName(name) {
      return String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    function writeStatus(message, kind = "error", source = "system") {
      const node = $("error");
      const text = String(message || "");
      const ok = Boolean(text) && kind === "ok";
      const notice = Boolean(text) && kind === "notice";
      if (node.textContent === text
          && node.classList.contains("ok") === ok
          && node.classList.contains("notice") === notice
          && node.dataset.statusSource === (text ? source : "")) return;
      node.textContent = text;
      node.classList.toggle("ok", ok);
      node.classList.toggle("notice", notice);
      node.dataset.statusSource = text ? source : "";
    }

    function setTransientStatus(kind, message) {
      const next = { kind, message: String(message || "") };
      if (
        transientStatus?.kind === next.kind
        && transientStatus.message === next.message
        && $("error").textContent === next.message
      ) return;
      transientStatus = next;
      writeStatus(next.message, "error");
    }

    function clearTransientStatus(kind) {
      if (transientStatus?.kind !== kind) return;
      const message = transientStatus.message;
      transientStatus = null;
      if ($("error").textContent === message) {
        writeStatus("");
        renderJournalActivity();
      }
    }

    function setError(message) {
      transientStatus = null;
      writeStatus(message, "error");
      if (!message) renderJournalActivity();
    }

    function setStatus(message, kind = "error") {
      transientStatus = null;
      writeStatus(message, kind);
      if (!message) renderJournalActivity();

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("'", "&#39;");
    }

    function markdownInlineHtml(value) {
      const codeTokens = [];
      const tokenized = String(value || "").replace(/`([^`\n]+)`/g, (_match, code) => {
        const token = `\uE000${codeTokens.length}\uE001`;
        codeTokens.push(code);
        return token;
      });
      let html = escapeHtml(tokenized)
        .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
        .replace(/~~([^~\n]+)~~/g, "<del>$1</del>")
        .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
      codeTokens.forEach((code, index) => {
        html = html.replaceAll(`\uE000${index}\uE001`, `<code>${escapeHtml(code)}</code>`);
      });
      return html;
    }

    function markdownTableCells(line) {
      const source = String(line || "").trim().replace(/^\|/, "").replace(/\|$/, "");
      const cells = [];
      let current = "";
      let escaped = false;
      for (const character of source) {
        if (escaped) {
          current += character;
          escaped = false;
        } else if (character === "\\") {
          escaped = true;
        } else if (character === "|") {
          cells.push(current.trim());
          current = "";
        } else {
          current += character;
        }
      }
      if (escaped) current += "\\";
      cells.push(current.trim());
      return cells;
    }

    function markdownTableAlignments(line) {
      const cells = markdownTableCells(line);
      if (!cells.length || cells.some((cell) => !/^:?-{3,}:?$/.test(cell))) return null;
      return cells.map((cell) => (
        cell.startsWith(":") && cell.endsWith(":") ? "center" : cell.endsWith(":") ? "right" : "left"
      ));
    }

    function markdownFence(line) {
      const match = String(line || "").match(/^ {0,3}(`{3,}|~{3,})\s*([^\s`~]*)\s*$/);
      if (!match) return null;
      return { marker: match[1][0], length: match[1].length, language: match[2] || "code" };
    }

    function markdownLineStartsBlock(lines, index) {
      const line = lines[index] || "";
      if (!line.trim()) return true;
      if (markdownFence(line) || /^ {0,3}#{1,3}\s+/.test(line) || /^ {0,3}>\s?/.test(line)) return true;
      if (/^ {0,3}(?:[-+*]|\d+\.)\s+/.test(line)) return true;
      return index + 1 < lines.length
        && line.includes("|")
        && Boolean(markdownTableAlignments(lines[index + 1]));
    }

    function markdownHtml(value) {
      const lines = String(value || "").replace(/\r\n?/g, "\n").split("\n");
      const blocks = [];
      let index = 0;
      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) {
          index += 1;
          continue;
        }
        const fence = markdownFence(line);
        if (fence) {
          const code = [];
          index += 1;
          const closing = new RegExp(`^ {0,3}${fence.marker}{${fence.length},}\\s*$`);
          while (index < lines.length && !closing.test(lines[index])) {
            code.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          const language = fence.language.toLowerCase().replace(/[^a-z0-9+#.-]/g, "").slice(0, 24) || "code";
          blocks.push(`<div class="chat-code-block"><div class="chat-code-label">${escapeHtml(language)}</div><pre><code data-language="${escapeAttr(language)}">${escapeHtml(code.join("\n"))}</code></pre></div>`);
          continue;
        }
        const alignments = index + 1 < lines.length && line.includes("|")
          ? markdownTableAlignments(lines[index + 1])
          : null;
        if (alignments) {
          const headers = markdownTableCells(line);
          index += 2;
          const rows = [];
          while (index < lines.length && lines[index].trim() && lines[index].includes("|")) {
            rows.push(markdownTableCells(lines[index]));
            index += 1;
          }
          const cellHtml = (cell, column, tag) => {
            const alignment = alignments[column] || "left";
            return `<${tag} class="align-${alignment}">${markdownInlineHtml(cell || "")}</${tag}>`;
          };
          const width = Math.max(headers.length, alignments.length, ...rows.map((row) => row.length));
          const header = Array.from({ length: width }, (_unused, column) => cellHtml(headers[column], column, "th")).join("");
          const body = rows.map((row) => `<tr>${Array.from({ length: width }, (_unused, column) => cellHtml(row[column], column, "td")).join("")}</tr>`).join("");
          blocks.push(`<div class="chat-table-scroll"><table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table></div>`);
          continue;
        }
        const heading = line.match(/^ {0,3}(#{1,3})\s+(.+)$/);
        if (heading) {
          const level = heading[1].length;
          blocks.push(`<h${level}>${markdownInlineHtml(heading[2])}</h${level}>`);
          index += 1;
          continue;
        }
        if (/^ {0,3}>\s?/.test(line)) {
          const quote = [];
          while (index < lines.length && /^ {0,3}>\s?/.test(lines[index])) {
            quote.push(lines[index].replace(/^ {0,3}>\s?/, ""));
            index += 1;
          }
          blocks.push(`<blockquote>${markdownInlineHtml(quote.join(" "))}</blockquote>`);
          continue;
        }
        const listMatch = line.match(/^ {0,3}([-+*]|\d+\.)\s+(.+)$/);
        if (listMatch) {
          const ordered = /\d+\./.test(listMatch[1]);
          const items = [];
          const matcher = ordered ? /^ {0,3}\d+\.\s+(.+)$/ : /^ {0,3}[-+*]\s+(.+)$/;
          while (index < lines.length) {
            const item = lines[index].match(matcher);
            if (!item) break;
            items.push(`<li>${markdownInlineHtml(item[1])}</li>`);
            index += 1;
          }
          const tag = ordered ? "ol" : "ul";
          blocks.push(`<${tag}>${items.join("")}</${tag}>`);
          continue;
        }
        const paragraph = [line.trim()];
        index += 1;
        while (index < lines.length && !markdownLineStartsBlock(lines, index)) {
          paragraph.push(lines[index].trim());
          index += 1;
        }
        blocks.push(`<p>${markdownInlineHtml(paragraph.join(" "))}</p>`);
      }
      return blocks.join("") || "<p></p>";
    }

    function escapeSvg(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    // Art that never generated used to reach the DOM as a live URL and render
    // as the browser's broken-image icon: the `cardImage(x) || fallbackCardImage(x)`
    // guard at each call site only catches an empty URL, not one that 404s.
    // `error` does not bubble, but it does fire during capture, so one listener
    // here covers every image including those built through innerHTML.
    // See issue #476.
    document.addEventListener("error", (event) => {
      const image = event.target;
      if (!(image instanceof HTMLImageElement)) return;
      const failedSrc = image.currentSrc || image.src;
      if (failedSrc === image.dataset.artFallbackSrc) return;
      image.dataset.artFallback = "applied";
      image.dataset.artMissing = "true";
      if (!image.dataset.artPlaceholder) {
        const key = image.closest("[data-card-key]")?.getAttribute("data-card-key") || "";
        image.dataset.artPlaceholder = communityArtPlaceholderLabel(cardByKey(key));
      }
      const role = image.dataset.artRole
        || (image.closest("[data-card-key]")?.getAttribute("data-card-key") || "").split(":")[0]
        || "card";
      const fallbackSrc = fallbackCardImage({ role, display_name: image.alt || "CosyWorld art" });
      image.dataset.artFallbackSrc = fallbackSrc;
      image.src = fallbackSrc;
    }, true);

    document.addEventListener("load", (event) => {
      const image = event.target;
      if (!(image instanceof HTMLImageElement)) return;
      if (image.dataset.artFallback !== "applied") return;
      if ((image.currentSrc || image.src) === image.dataset.artFallbackSrc) return;
      delete image.dataset.artFallback;
      delete image.dataset.artFallbackSrc;
      delete image.dataset.artMissing;
    }, true);

    $("hand-close").addEventListener("click", (event) => {
      event.preventDefault();
      setStoryHandExpanded(false);
      $("hand-toggle").focus();
    });

    $("hand-choices").addEventListener("change", (event) => {
      const input = event.target.closest("input[name='hand-action-choice']");
      if (!input || !actionConfirmAction) return;
      const choice = input.closest("[data-hand-choice-index]");
      const index = Number(choice?.dataset.handChoiceIndex || 0);
      const selected = actionConfirmAction.choices?.[index];
      if (!selected) return;
      actionConfirmAction.selectedChoice = selected.value;
      renderStoryHandInspector(actionConfirmAction);
    });

    $("hand-confirm").addEventListener("click", (event) => {
      event.preventDefault();
      void confirmStoryHandAction();
    });

    $("hand-discard").addEventListener("click", (event) => {
      event.preventDefault();
      const action = actionConfirmAction;
      setStoryHandExpanded(false);
      if (action) void discardActionCard(action);
    });

    $("hand-rail").addEventListener("scroll", () => {
      if (storyHandScrollFrame !== null) return;
      storyHandScrollFrame = window.requestAnimationFrame(() => {
        storyHandScrollFrame = null;
        selectStoryHandCardFromScroll();
      });
    }, { passive: true });

    window.matchMedia("(max-width: 900px)").addEventListener("change", () => {
      storyHandExpanded = false;
      storyHandActiveKey = "";
      actionConfirmAction = null;
      renderCommands();
    });

    $("action-modal-discard").addEventListener("click", (event) => {
      event.preventDefault();
      const action = actionConfirmAction;
      closeActionModal();
      if (action) void discardActionCard(action);
    });

    document.addEventListener("keydown", (event) => {
      if (event.defaultPrevented) return;
      if (!$("wallet-modal").hidden) {
        if (trapModalFocus(event, $("wallet-modal"))) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeWalletQrModal(false);
        }
        return;
      }
      if (!$("action-modal").hidden) {
        if (trapModalFocus(event, $("action-modal"))) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeActionModal();
        } else if (event.key === "Enter" && !event.target?.matches?.("button, input, select, textarea, a, label")) {
          event.preventDefault();
          confirmActionModal();
        }
        return;
      }
      if (!$("card-modal").hidden) {
        if (trapModalFocus(event, $("card-modal"))) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeCardModal();
        }
        return;
      }
      if (storyHandExpanded && event.key === "Escape") {
        event.preventDefault();
        setStoryHandExpanded(false);
        $("hand-toggle").focus();
        return;
      }
      if (libraryPanelPinned && event.key === "Escape") {
        event.preventDefault();
        toggleLibraryPanel(false);
        libraryPill.focus();
        return;
      }
      if (libraryPanelPinned) return;
      if (accountPanelPinned && event.key === "Escape") {
        event.preventDefault();
        toggleAccountPanel(false);
        libraryPill.focus();
        return;
      }
      if (accountPanelPinned) return;
      if (journalOpen && event.key === "Escape") {
        event.preventDefault();
        setJournalOpen(false);
        $("room-log-toggle").focus();
        return;
      }
      if (journalOpen) return;
      const actionArrow = ["ArrowLeft", "ArrowRight"].includes(event.key)
        && Boolean(event.target?.closest?.(".hand-rail .cmd"));
      if (
        event.target?.matches?.("button, a, input, select, textarea, [role='button'], [contenteditable='true']")
        && !actionArrow
      ) return;
      if (event.key === "Enter") {
        event.preventDefault();
        const action = state?.branch ? actions[0] : visibleFocusedAction();
        if (action) activateStoryHandAction(originalStoryHandAction(action));
      } else if (event.key === " ") {
        event.preventDefault();
        if (state?.branch && actions[1]) activateStoryHandAction(actions[1]);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        moveVisibleActionFocus(1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        moveVisibleActionFocus(-1);
      }
    });

    $("log").addEventListener("scroll", scheduleVisibleWorldBeatReceipts, { passive: true });
    $("journal-log").closest(".journal-stream")?.addEventListener("scroll", scheduleVisibleWorldBeatReceipts, { passive: true });
    $("journal-page-previous").addEventListener("click", () => turnJournalPage(-1));
    $("journal-page-next").addEventListener("click", () => turnJournalPage(1));
    $("journal-view").addEventListener("click", (event) => {
      const summary = event.target.closest(".journal-prose-row > summary");
      if (summary && !summary.parentElement?.classList.contains("is-overflowing")) {
        event.preventDefault();
      }
    });
    $("shared-questions").addEventListener("toggle", (event) => {
      const details = event.target.closest("details");
      if (!details?.open) return;
      const row = details.closest("[data-clock-presentation][data-clock-id]");
      const clockId = String(row?.dataset.clockId || "");
      const question = (state?.shared_questions || []).find((candidate) => (
        String(candidate?.progress_clock_id || "") === clockId
      ));
      if (question) void acknowledgeClockPresentation(question, "explanation_opened");
    }, true);
    window.addEventListener("scroll", scheduleVisibleClockPresentationReceipts, { passive: true });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        scheduleVisibleWorldBeatReceipts();
        scheduleVisibleClockPresentationReceipts();
      }
    });

    window.addEventListener("pagehide", leavePresence);
    window.addEventListener("beforeunload", leavePresence);
    window.addEventListener("resize", () => {
      if (state) {
        renderEconomy();
        renderSpatialScene(state?.spatial_scene);
        renderRoomLogLatest($("room-log-toggle").dataset.latest || "");
        reconcileHand();
        renderCommands();
        scheduleJournalRowOverflowSync();
        scheduleVisibleClockPresentationReceipts();
      }
    });

    if (typeof ResizeObserver === "function") {
      journalRowResizeObserver = new ResizeObserver(scheduleJournalRowOverflowSync);
      journalRowResizeObserver.observe($("journal-view"));
    }
    document.fonts?.addEventListener?.("loadingdone", scheduleJournalRowOverflowSync);

    applyUiPreferences();

    (async function boot() {
      try {
        await requestDevResetIfNeeded();
        await loadIdentity();
        const completedOpenRouter = await completeOpenRouterConnection();
        if (!completedOpenRouter && openRouterApiKey() && identity?.authenticated) {
          try {
            await refreshOpenRouterConnection();
          } catch (error) {
            setError(String(error.message || error));
          }
        }
        await Promise.all([pingPresence(), refresh()]);
        connectStream();
      } catch (error) {
        setError(refreshExceptionMessage(error));
      }
    })();
  </script>
</body>
</html>
