          } catch (error) {
            setWalletQrStatus(String(error.message || error), "error");
          }
        };
        walletQrPollTimer = window.setInterval(poll, 1400);
        poll();
      });
    }

    async function connectWallet() {
      const provider = solanaProvider();
      if (!provider?.connect || !provider?.signMessage) {
        return openQrWalletLogin();
      }
      try {
        setStatus("Confirm wallet access in your Solana wallet.", "ok");
        const connected = await withTimeout(
          provider.connect(),
          walletRequestTimeoutMs,
          "Wallet connection timed out."
        );
        const publicKey = connected?.publicKey || provider.publicKey;
        const nextWallet = publicKey?.toString?.() || "";
        if (!nextWallet) {
          setError("Wallet connection failed.");
          return false;
        }
        const challenge = await api(`/wallet/challenge?wallet_address=${encodeURIComponent(nextWallet)}`);
        if (!challenge.ok) {
          setError("Wallet challenge failed.");
          return false;
        }
        setStatus("Sign the CosyWorld wallet challenge.", "ok");
        const encoded = new TextEncoder().encode(challenge.message);
        const signed = await withTimeout(
          provider.signMessage(encoded, "utf8"),
          walletRequestTimeoutMs,
          "Wallet signature timed out."
        );
        const signature = Array.from(signed?.signature || signed || []);
        const session = await post("/wallet/session", {
          wallet_address: nextWallet,
          nonce: challenge.nonce,
          signature,
        });
        if (!session.ok || !session.wallet_session) {
          setError(session.error || "Wallet signature rejected.");
          return false;
        }
        walletAddress = session.wallet_address || nextWallet;
        walletSession = session.wallet_session;
        localStorage.setItem("cosyworld.wallet", walletAddress);
        localStorage.setItem("cosyworld.walletSession", walletSession);
        setStatus("Wallet connected.", "ok");
        focusIndex = 0;
        focusedKey = "";
        playerPromotedHandKey = "";
        await refresh();
        connectStream();
        return true;
      } catch (error) {
        setError(walletRequestError(error, "Wallet connection failed"));
        return false;
      }
    }

    function avatarFailureMessage(result = {}) {
      const status = Number(result.status || 0);
      if (status === 429) return "Avatar creation is moving too quickly. Try again in a moment.";
      if (status === 403) return "That avatar cannot be used right now.";
      if (status === 502) return "AI could not shape that avatar.";
      return "Avatar could not be generated.";
    }

    function offerKindsForPath(path, actionCard = pendingAction) {
      const byPath = {
        "/actions/chat": ["chat"],
        "/actions/model-interaction": ["model_interaction"],
        "/actions/move": ["move"],
        "/actions/explore-path": ["explore_path"],
        "/actions/flee": ["flee"],
        "/actions/notice": ["notice_actor"],
        "/actions/open": ["open"],
        "/actions/check": ["check"],
        "/actions/study": ["study"],
        "/actions/discover": [
          "focused_notice",
          "search_discovery",
          "study_discovery",
          "scout_discovery",
        ],
        "/actions/influence": ["influence"],
        "/actions/cast-spell": ["cast_spell"],
        "/actions/pick-up": ["pick_up"],
        "/actions/drop": ["drop_item"],
        "/actions/give-item": ["give_item"],
        "/actions/trade-item": ["trade_item"],
        "/actions/accept-transfer-offer": ["accept_transfer"],
        "/actions/theft": ["theft"],
        "/actions/craft": ["craft"],
        "/actions/declare-combat": ["attack"],
        "/actions/attack": ["attack"],
        "/actions/defend": ["defend"],
        "/actions/prepare": ["prepare"],
        "/actions/contribute": ["work", "help", "check", "study", "use_item"],
        "/actions/work": ["work"],
        "/actions/help": ["help"],
        "/actions/rest": ["rest"],
        "/actions/create-bond": ["create_bond"],
        "/actions/resolve-bond": ["resolve_bond"],
      };
      if (path === "/actions/use-item") {
        const selected = actionCard?.selectedMode?.()?.source || actionCard;
        return (selected?.offerKinds || []).filter((kind) => (
          kind === "use_item" || kind === "use_feature"
        ));
      }
      const explicitKinds = new Set(actionCard?.offerKinds || []);
      return (byPath[path] || []).filter((kind) => explicitKinds.has(kind));
    }

    const offerBoundPaths = new Set([
      "/actions/chat",
      "/actions/model-interaction",
      "/actions/move",
      "/actions/explore-path",
      "/actions/flee",
      "/actions/notice",
      "/actions/open",
      "/actions/check",
      "/actions/study",
      "/actions/discover",
      "/actions/influence",
      "/actions/cast-spell",
      "/actions/pick-up",
      "/actions/drop",
      "/actions/use-item",
      "/actions/give-item",
      "/actions/trade-item",
      "/actions/accept-transfer-offer",
      "/actions/theft",
      "/actions/craft",
      "/actions/declare-combat",
      "/actions/attack",
      "/actions/defend",
      "/actions/prepare",
      "/actions/contribute",
      "/actions/work",
      "/actions/help",
      "/actions/rest",
      "/actions/create-bond",
      "/actions/resolve-bond",
    ]);

    function offerPayloadTarget(path, offer, payload) {
      const targetKind = String(offer?.target?.kind || "");
      if (["/actions/move", "/actions/flee", "/actions/explore-path"].includes(path)
          && targetKind === "location") {
        return Number(payload.destination_location_id || 0);
      }
      if (path === "/actions/open" && targetKind === "location") {
        return Number(payload.destination_location_id || 0);
      }
      if (path === "/actions/craft" && targetKind === "recipe") return Number(payload.recipe_id || 0);
      if ((path === "/actions/pick-up" || path === "/actions/drop") && targetKind === "item") {
        return Number(payload.item_id || 0);
      }
      if (["/actions/trade-item", "/actions/theft"].includes(path) && targetKind === "item") return Number(payload.target_item_id || 0);
      if (["/actions/chat", "/actions/notice", "/actions/model-interaction", "/actions/declare-combat", "/actions/attack", "/actions/give-item", "/actions/create-bond", "/actions/resolve-bond", "/actions/cast-spell", "/actions/influence", "/actions/use-item"].includes(path)
          && targetKind === "actor") {
        return Number(payload.target_actor_id || 0);
      }
      if (path === "/actions/use-item" && targetKind === "feature") {
        return Number(payload.location_id || 0);
      }
      return 0;
    }

    function currentOfferForSubmission(path, payload) {
      const kinds = offerKindsForPath(path);
      if (!kinds.length) return null;
      const activeCard = pendingAction?.selectedMode?.()?.source || pendingAction;
      const cardOfferIds = new Set((activeCard?.offerIds || [])
        .map((offerId) => String(offerId || ""))
        .filter(Boolean));
      const handOfferIds = new Set((state?.action_hand?.entries || [])
        .map((entry) => String(entry?.offer_id || ""))
        .filter(Boolean));
      const certificateRequired = handOfferIds.size > 0;
      if (certificateRequired && cardOfferIds.size !== 1) return null;
      const candidates = (state?.action_offers || []).filter((offer) => (
        kinds.includes(offer.kind)
          && (!certificateRequired || (
            handOfferIds.has(String(offer.offer_id || ""))
              && cardOfferIds.has(String(offer.offer_id || ""))
          ))
      ));
      return candidates.find((offer) => {
        const contributionMatches = !["/actions/contribute", "/actions/work", "/actions/help", "/actions/study", "/actions/prepare"].includes(path)
          || (String(offer?.project?.id || "") === String(payload.job_id || "")
            && String(offer?.project?.strategy_id || "") === String(payload.strategy_id || ""));
        const thresholdMethodMatches = path !== "/actions/open"
          || Number(offer?.threshold_method?.method_id || 0)
            === Number(payload.threshold_method_id || 0);
        const submittedTarget = offerPayloadTarget(path, offer, payload);
        const targetMatches = !submittedTarget
          || !offer?.target?.id
          || Number(offer.target.id) === submittedTarget;
        const providerMatches = path !== "/actions/use-item"
          || offer?.provider?.id === `item:${Number(payload.item_id || 0)}`;
        const discoveryMatches = path !== "/actions/discover"
          || (
            String(offer?.discovery?.procedure || "") === String(payload.procedure || "")
            && String(offer?.discovery?.slot_id || "") === String(payload.slot_id || "")
            && (!payload.receipt_id
              || String(offer?.discovery?.receipt_id || "") === String(payload.receipt_id || ""))
          );
        const featureMatches = path !== "/actions/use-item"
          || offer.kind !== "use_feature"
          || String(offer.id || "").startsWith(
            `use_feature:${Number(payload.item_id || 0)}:${Number(payload.location_id || 0)}:`
          ) && String(offer.id || "").slice(
            `use_feature:${Number(payload.item_id || 0)}:${Number(payload.location_id || 0)}:`.length
          ) === String(payload.feature_key || "");
        return contributionMatches
          && thresholdMethodMatches
          && targetMatches
          && providerMatches
          && discoveryMatches
          && featureMatches;
      }) || null;
    }

    async function action(path, payload) {
      setError("");
      const clearFirstTaleAfterAction = firstTalePayoffVisible()
        && path !== "/actions/timeout";
      const beforeOrbs = economyOrbCount();
      const modelInteractionOffer = path === "/actions/model-interaction"
        ? currentOfferForSubmission(path, withAccess(payload))
        : null;
      const durableBatchInteraction = modelInteractionOffer
        && modelInteractionPresentation(modelInteractionOffer).profile === "batch_talk";
      const donatedPayload = path === "/actions/model-interaction"
        && openRouterApiKey()
        && !durableBatchInteraction
        ? { ...payload, openrouter_api_key: openRouterApiKey() }
        : payload;
      const authoritativePayload = withAccess(donatedPayload);
      const offer = currentOfferForSubmission(path, authoritativePayload);
      if (!offer && offerBoundPaths.has(path)) {
        const result = {
          ok: false,
          status: 409,
          events: [],
          output: "That card is no longer in your Story Hand. Discard or choose a current card.",
        };
        setError(result.output);
        void queueRefresh();
        return result;
      }
      const submit = () => {
        const currentPayload = withAccess(donatedPayload);
        return offer
          ? postResult("/actions/submit", {
              path,
              offer_id: offer.offer_id,
              composition_id: offer.composition_id,
              kind: offer.kind,
              payload: currentPayload,
            })
          : postResult(path, currentPayload);
      };
      let result = await submit();
      if (Number(result.status || 0) === 403) {
        const recovery = await renewActorSession();
        if (recovery.ok && recovery.renewed) result = await submit();
      }
      pushEvents(result.events || []);
      if (!result.ok) {
        setError(actionFailureMessage(path, result));
      } else {
        await refresh();
      }
      if (result.ok && clearFirstTaleAfterAction) {
        dismissFirstTalePayoff();
        renderStatusUpdates();
      }
      focusIndex = 0;
      focusedKey = "";
      playerPromotedHandKey = "";
      if (!result.ok) void queueRefresh();
      announceOrbChange(beforeOrbs, result.ok);
      return result;
    }

    function actionFailureMessage(path, result = {}) {
      const status = Number(result.status || 0);
      const conflict = (result.events || []).find((event) => event?.type === "action.conflict");
      if (conflict?.content) {
        const content = String(conflict.content);
        if (/stale .* version|observed \d+, current \d+|refresh before retrying/i.test(content)) {
          return "That choice changed while you were deciding. Nothing else happened; check what is here and choose again.";
        }
        return cleanStatusText(content);
      }
      const modelFailure = (result.events || []).find((event) => (
        event?.type === "model_interaction.failed"
      ));
      if (path === "/actions/model-interaction" && modelFailure?.content) {
        return cleanStatusText(modelFailure.content);
      }
      const timeoutRefusal = (result.events || []).find((event) => (
        String(event?.type || "").startsWith("turn.timeout_refused.")
      ));
      if (path === "/actions/timeout" && timeoutRefusal?.content) {
        return String(timeoutRefusal.content);
      }
      if (status === 402 && path.includes("fund-image")) {
        return "You need one Orb to add to this community image.";
      }
      if (path.includes("fund-image") && result.error_code === "community_art_evolution_reference_unavailable") {
        return "The earlier portrait is not available for a safe evolution, so no Orb was taken.";
      }
      if (path.includes("fund-image") && result.error_code === "community_art_storage_failed") {
        return "The saved image job needs repair before it can start. No Orb was taken.";
      }
      if (status === 502 && path.includes("fund-image")) {
        return "The image workshop could not be reached. Check the current status and try again.";
      }
      if (status === 503 && path.includes("fund-image")) return "The image workshop is unavailable, so no Orb was taken.";
      if (status === 503 && path === "/actions/model-interaction") {
        return "That model route is resting right now. Choose another action; nothing was spent.";
      }
      if (status === 403) return "Reconnect your account to restore this same avatar. The world will not replace it.";
      if (status === 400 && path.includes("/actions/rest")) return "You are already steady enough to keep going.";
      if (status === 409) return "That choice changed while you were deciding. Nothing else happened; check what is here and choose again.";
      if (status === 423) return "This is an explicitly ordered scene. The named combat participant acts now; chat and inspection stay available.";
      if (status === 429) return "The room needs a breath. Try again in a moment.";
      if (status === 502) return "That reply got lost. Try talking again in a moment.";
      return "That choice did not land. Here are the choices you have now.";
    }

    function commandFailureMessage(result = {}) {
      if (isStaleCommandObservation(result)) {
        return "That choice changed while you were deciding. Nothing else happened; check what is here and choose again.";
      }
      const output = String(result.output || "").trim();
      if (output) return output;
      const status = Number(result.status || 0);
      if (status === 403) return "Reconnect your account to restore this same avatar. The world will not replace it.";
      if (status === 409) return "That choice changed while you were deciding. Nothing else happened; look again.";
      if (status === 423) return "This is an explicitly ordered scene. The named combat participant acts now; chat and inspection stay available.";
      if (status === 429) return "The room needs a breath. Try again in a moment.";
      return "The room did not catch that. Look around and try another choice.";
    }

    function isStaleCommandObservation(result = {}) {
      if (Number(result.status || 0) !== 409) return false;
      if ([
        "stale_actor_version",
        "stale_location_version",
        "stale_entity_version",
      ].includes(String(result.error_kind || ""))) return true;
      return /stale (?:actor|location) version|stale or unknown entity version|refresh before retrying/i
        .test(String(result.output || ""));
    }

    function isNetworkError(error) {
      const message = String(error?.message || error || "");
      return error?.name === "TypeError"
        && /failed to fetch|networkerror|network request failed|load failed/i.test(message);
    }

    function actionExceptionMessage(error) {
      if (isNetworkError(error)) {
        return "Connection lost. Check the refreshed world before trying again; your action may already have landed.";
      }
      return String(error?.message || error || "That choice could not be sent. Check what is here before trying again.");
    }

    function refreshExceptionMessage(error) {
      if (isNetworkError(error)) {
        return "The world could not be reached. Check your connection; reconnecting will restore the latest safe state.";
      }
      return String(error?.message || error || "The world could not be refreshed. Reload to try again.");
    }

    function canonicalCommandEnvelope() {
      const commandContext = state?.command_context || {};
      const randomIntent = globalThis.crypto?.randomUUID?.()
        || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      return {
        world_id: state?.world_id || "world://cosyworld/official",
        intent_id: `web:${randomIntent}`,
        actor_ref: commandContext.actor_ref || "",
        observed: {
          ...(Number(commandContext.actor_version) > 0 ? { actor_version: Number(commandContext.actor_version) } : {}),
          ...(Number(commandContext.location_version) > 0 ? { location_version: Number(commandContext.location_version) } : {}),
        },
        last_world_seq: Math.max(0, Number(state?.world_seq) || latestSeenSeq() || 0),
      };
    }

    function commandOfferRetryFingerprint(offer = {}) {
      return JSON.stringify({
        kind: String(offer.kind || ""),
        command: String(offer.command || "").trim(),
        target: offer.target ? {
          kind: String(offer.target.kind || ""),
          id: String(offer.target.id || ""),
        } : null,
        provider: offer.provider ? {
          kind: String(offer.provider.kind || ""),
          id: String(offer.provider.id || ""),
        } : null,
        project: offer.project ? {
          id: String(offer.project.id || ""),
          strategy_id: String(offer.project.strategy_id || ""),
        } : null,
        threshold_method: offer.threshold_method ? {
          descriptor_id: String(offer.threshold_method.descriptor_id || ""),
          method_id: String(offer.threshold_method.method_id || ""),
        } : null,
        cost: offer.cost || null,
        effect: String(offer.effect || ""),
        risk: String(offer.risk || ""),
      });
    }

    function equivalentCommandOffer(previousOffer) {
      const fingerprint = commandOfferRetryFingerprint(previousOffer);
      const handOfferIds = new Set((state?.action_hand?.entries || [])
        .map((entry) => String(entry?.offer_id || ""))
        .filter(Boolean));
      const matches = (state?.action_offers || []).filter((offer) => (
        handOfferIds.has(String(offer?.offer_id || ""))
          && commandOfferRetryFingerprint(offer) === fingerprint
      ));
      return matches.length === 1 ? matches[0] : null;
    }

    async function runCommandText(commandText, exactOffer = null) {
      const command = String(commandText || "").trim();
      if (!command) return;
      if (!actorId || !actorSession) {
        setError("Begin with an avatar first.");
        return;
      }
      setError("");
      const clearFirstTaleAfterAction = firstTalePayoffVisible()
        && !/^(?:need[ -]time)$/i.test(command);
      if (/^(shuffle|deal|more|redraw)$/i.test(command)) {
        setError("Whole-hand redeals have retired. Open the card you want to replace, then choose Discard.");
        return null;
      }
      const beforeOrbs = economyOrbCount();
      let envelope = canonicalCommandEnvelope();
      let submittedOffer = exactOffer;
      const submit = () => postResult("/commands", withAccess({
          actor_id: actorId,
          command,
          ...(submittedOffer?.offer_id ? { offer_id: submittedOffer.offer_id } : {}),
          envelope,
        }));
      let result = await submit();
      if (Number(result.status || 0) === 403) {
        const recovery = await renewActorSession();
        if (recovery.ok && recovery.renewed) result = await submit();
      }
      if (isStaleCommandObservation(result)) {
        await refresh();
        const refreshedOffer = exactOffer ? equivalentCommandOffer(exactOffer) : null;
        if (!exactOffer || refreshedOffer) {
          submittedOffer = refreshedOffer;
          envelope = canonicalCommandEnvelope();
          result = await submit();
          if (Number(result.status || 0) === 403) {
            const recovery = await renewActorSession();
            if (recovery.ok && recovery.renewed) result = await submit();
          }
        }
      }
      const resultEvents = result.events || [];
      pushEvents(resultEvents);
      const visibleOutput = !result.ok && isStaleCommandObservation(result)
        ? commandFailureMessage(result)
        : result.output;
      if (visibleOutput) pushCommandOutput(result.command || command, visibleOutput, result.ok, resultEvents);
      if (!result.ok) {
        const message = commandFailureMessage(result);
        if (!visibleOutput) pushCommandOutput(result.command || command, message, false, resultEvents);
        setError(message);
      }
      if (result.ok && clearFirstTaleAfterAction) {
        dismissFirstTalePayoff();
        renderStatusUpdates();
      }
      focusIndex = 0;
      focusedKey = "";
      playerPromotedHandKey = "";
      await refresh();
      announceOrbChange(beforeOrbs, result.ok);
      return result;
    }

    function economyOrbCount(view = state) {
      const value = Number(view?.economy?.orbs);
      return Number.isFinite(value) ? value : null;
    }

    function announceOrbChange(beforeOrbs, ok) {
      if (!ok || beforeOrbs === null) return;
      const afterOrbs = economyOrbCount();
      if (afterOrbs === null || afterOrbs === beforeOrbs) return;
      const delta = afterOrbs - beforeOrbs;
      if (delta > 0) {
        flashEconomy(orbChangeText(delta), "gain");
      } else {
        flashEconomy(orbChangeText(delta), "spend");
      }
    }

    function orbChangeText(delta) {
      const amount = Math.abs(Number(delta) || 0);
      return `${Number(delta) >= 0 ? "earned" : "spent"} ${smallNumberWord(amount)}`;
    }

    function flashEconomy(text, kind) {
      economyFlash = { text, kind };
      if (economyFlashTimer) window.clearTimeout(economyFlashTimer);
      renderEconomy();
      economyFlashTimer = window.setTimeout(() => {
        economyFlash = null;
        economyFlashTimer = null;
        if (state) renderEconomy();
      }, 2200);
    }

    function pushCommandOutput(command, output, ok, events = []) {
      if (ok && /^search(?:\s|$)/i.test(String(command || "").trim()) && events.some((event) => (
        event?.type === "feature.searched"
          || event?.type === "location.searched"
          || event?.type === "exit.discovered"
          || event?.type === "item.found"
      ))) {
        renderTimelines();
        return;
      }
      if (ok && commandOutputLooksMechanical(output) && events.some(eventIsStatusUpdate)) {
        renderTimelines();
        return;
      }
      if (ok && commandOutputDuplicatesChat(output, events)) {
        renderTimelines();
        return;
      }
      const event = {
        seq: `command-${Date.now()}-${Math.random()}`,
        type: "command.output",
        actor_id: actorId || null,
        actor_name: ok ? ">" : "command",
        content: output,
        command,
      };
      logEvents.push(event);
      logEvents = logEvents.slice(-90);
      renderTimelines();
    }

    const collapsibleTurnStatusTypes = new Set([
      "turn.ping_started",
      "turn.pong",
      "turn.ping_skipped",
      "turn.timeout_requested",
      "turn.timeout_passed",
    ]);

    function logEventCollapseKey(event) {
      if (!event || !collapsibleTurnStatusTypes.has(event.type)) return "";
      const location = event.location_id ?? "";
      const target = event.target_actor_id ?? "";
      if (event.type === "turn.pong") {
        return `${event.type}:${location}:${event.actor_id ?? ""}:${target}`;
      }
      return `${event.type}:${location}:${target}`;
    }

    function inferredMessageCollapseKey(event) {
      if (!messageActorUsesInference(event)) return "";
      const numericActorId = Number(event.actor_id || 0);
      const content = cleanStatusText(event.content).toLowerCase();
      if (!content) return "";
      return `${numericActorId}:${Number(event.location_id || 0)}:${content}`;
    }

    function messageActorUsesInference(event) {
      if (!["message.created", "image.created", "model_interaction.output"].includes(event?.type)) return false;
      const numericActorId = Number(event.actor_id || 0);
      const actor = actorForId(numericActorId);
      return event.source_world_tick != null
        || Boolean(actor && actor.control_mode !== "direct_input");
    }

    function pacedChatTranscriptEvents(events) {
      // Exact duplicate avatar lines are already collapsed when events enter
      // the transcript. Keep distinct replies here so consecutive card plays do
      // not erase one another just because the same avatar answered them.
      return [...(events || [])].slice(-24);
    }

    function combatAttackEventsShareBeat(attempt, outcome) {
      if (attempt?.type !== "combat.attack.attempt") return false;
      if (!["combat.attack.hit", "combat.attack.miss", "combat.knockout"].includes(outcome?.type)) {
        return false;
      }
      return Number(attempt.actor_id || 0) === Number(outcome.actor_id || 0)
        && Number(attempt.target_actor_id || 0) === Number(outcome.target_actor_id || 0)
        && Number(attempt.content_id || 0) === Number(outcome.content_id || 0);
    }

    function combatEventsForPresentation(events) {
      const visible = [];
      let combatActive = Boolean(state?.combat);
      const currentLocationId = Number(state?.location?.id || 0);
      const localEvents = (events || []).filter((event) => {
        const eventLocationId = Number(event?.location_id || 0);
        return !(currentLocationId && eventLocationId && eventLocationId !== currentLocationId);
      });
      let encounterStart = -1;
      for (let index = localEvents.length - 1; index >= 0; index -= 1) {
        if (localEvents[index]?.type === "combat.encounter.started") {
          encounterStart = index;
          break;
        }
      }
      const encounterEvents = encounterStart >= 0 ? localEvents.slice(encounterStart) : localEvents;
      for (let index = 0; index < encounterEvents.length; index += 1) {
        const event = encounterEvents[index];
        if (event?.type === "combat.encounter.started") combatActive = true;
        if (event?.type === "combat.attack.attempt") {
          const grouped = { ...event };
          let lastSeq = Number(event.seq || 0);
          for (let cursor = index + 1; cursor < encounterEvents.length; cursor += 1) {
            const outcome = encounterEvents[cursor];
            if (!combatAttackEventsShareBeat(event, outcome)) break;
            if (outcome.type === "combat.knockout") grouped.combat_knockout = outcome;
            else grouped.combat_outcome = outcome;
            lastSeq = Math.max(lastSeq, Number(outcome.seq || 0));
            index = cursor;
          }
          grouped.transcript_tail_seq = lastSeq;
          visible.push(grouped);
          continue;
        }
        if (
          combatTranscriptEventTypes.has(event?.type)
          || (combatActive && combatOnlyTranscriptEventTypes.has(event?.type))
        ) {
          visible.push(event);
        }
        if (event?.type === "combat.encounter.resolved") combatActive = false;
      }
      return visible.slice(-24);
    }

    function sharedRoomTranscriptEvents(events) {
      const currentLocationId = Number(state?.location?.id || 0);
      const visible = (events || []).filter((event) => {
        const eventLocationId = Number(event?.location_id || 0);
        return eventIsChatTranscriptEvent(event)
          && !(currentLocationId && eventLocationId && eventLocationId !== currentLocationId);
      });
      return visible.slice(-40);
    }

    function narratedTranscriptEvents(events) {
      const narrated = [];
      const coveredSeqs = semanticReceiptCoveredSeqs(events);
      for (let index = 0; index < (events || []).length; index += 1) {
        const event = events[index];
        if (coveredSeqs.has(Number(event?.seq || 0))) continue;
        const next = events[index + 1];
        if (eventsShareAJourneyBeat(event, next)) {
          narrated.push(String(event.type || "").startsWith("journey.") ? event : next);
          index += 1;
          continue;
        }
        if (eventsShareAStoryBeat(event, next)) {
          const search = eventIsSearchBeat(event) ? event : next;
          const discovery = eventIsDiscoveryBeat(event) ? event : next;
          narrated.push({ ...search, narrative_outcome: discovery });
          index += 1;
          continue;
        }
        narrated.push(event);
      }
      return narrated;
    }

    function semanticStoryReceipt(event) {
      if (event?.type !== "story.receipt" || !event.content) return null;
      try {
        const receipt = JSON.parse(event.content);
        return receipt?.schema_version === 1 && receipt?.text ? receipt : null;
      } catch {
        return null;
      }
    }

    function semanticReceiptCoveredSeqs(events) {
      return new Set((events || [])
        .map(semanticStoryReceipt)
        .filter(Boolean)
        .flatMap((receipt) => receipt.event_seqs || [])
        .map(Number)
        .filter((seq) => Number.isSafeInteger(seq) && seq > 0));
    }

    function eventIsSearchBeat(event) {
      return event?.type === "feature.searched" || event?.type === "location.searched";
    }

    function eventIsJourneyNarration(event) {
      return String(event?.type || "").startsWith("journey.")
        || event?.type === "pathway.discovered"
        || event?.type === "pathway.familiarized";
    }

    function eventsShareAJourneyBeat(left, right) {
      if (!left || !right) return false;
      if (!(left.type === "actor.moved" && eventIsJourneyNarration(right))
        && !(right.type === "actor.moved" && eventIsJourneyNarration(left))) return false;
      return Number(left.actor_id || 0) === Number(right.actor_id || 0);
    }

    function eventIsDiscoveryBeat(event) {
      return event?.type === "item.found"
        || event?.type === "exit.discovered"
        || event?.type === "avatar.discovered";
    }

    function eventsShareAStoryBeat(left, right) {
      if (!left || !right) return false;
      if (!(eventIsSearchBeat(left) && eventIsDiscoveryBeat(right))
        && !(eventIsDiscoveryBeat(left) && eventIsSearchBeat(right))) return false;
      const leftId = Number(left.actor_id || 0);
      const rightId = Number(right.actor_id || 0);
      if (leftId && rightId) return leftId === rightId;
      return String(left.actor_name || "").trim() === String(right.actor_name || "").trim();
    }

    function resetTranscriptAtWorldBoundary(event) {
      logEvents = [];
      pendingChats = [];
      pendingReflection = null;
      journalNotifications = [];
      dismissedJournalActivityKeys.clear();
      pendingModelInteractions = [];
      seenSeq.clear();
      streamReplayFloorSeq = 0;
      if (event?.seq !== undefined && event?.seq !== null) seenSeq.add(event.seq);
    }

    function appendLogEvent(event) {
      if (event?.type === "study.resolved") {
        const rollIndex = logEvents.findLastIndex((prior) => (
          prior?.type === "ability_check.rolled"
          && Number(prior.actor_id || 0) === Number(event.actor_id || 0)
          && Number(prior.seq || 0) < Number(event.seq || 0)
          && Number(event.seq || 0) - Number(prior.seq || 0) <= 2
        ));
        if (rollIndex >= 0) logEvents.splice(rollIndex, 1);
      }
      const messageKey = inferredMessageCollapseKey(event);
      if (messageKey) {
        let inferredMessagesSeen = 0;
        for (let index = logEvents.length - 1; index >= 0; index -= 1) {
          const prior = logEvents[index];
          if (prior?.type !== "message.created") continue;
          if (!inferredMessageCollapseKey(prior)) break;
          inferredMessagesSeen += 1;
          if (inferredMessageCollapseKey(prior) === messageKey) {
            const collapsed = {
              ...event,
              first_seq: prior.first_seq ?? prior.seq,
              repeat_count: Math.max(1, Number(prior.repeat_count || 1)) + 1,
            };
            logEvents.splice(index, 1);
            logEvents.push(collapsed);
            return;
          }
          if (inferredMessagesSeen >= 4) break;
        }
      }
      const key = logEventCollapseKey(event);
      if (key) {
        for (let index = logEvents.length - 1; index >= 0; index -= 1) {
          const prior = logEvents[index];
          if (logEventCollapseKey(prior) === key) {
            logEvents[index] = {
              ...event,
              first_seq: prior.first_seq ?? prior.seq,
              repeat_count: Math.max(1, Number(prior.repeat_count || 1)) + 1,
            };
            return;
          }
          if (!collapsibleTurnStatusTypes.has(prior?.type)) break;
        }
      }
      logEvents.push(event);
    }

    function applyActionReceipt(event) {
      if (event?.type !== "action.receipt" || !event.content) return false;
      try {
        const receipt = JSON.parse(event.content);
        if (!receipt?.state) {
          if (!state || !Number.isFinite(Number(receipt?.state_revision))) return false;
          state.world_tick = Number(receipt.world_tick || state.world_tick || 0);
          state.state_revision = Math.max(
            Number(state.state_revision || 0),
            Number(receipt.state_revision || 0),
          );
          return true;
        }
        const previousLocationId = state?.location?.id || null;
        state = receipt.state;
        state.world_tick = Number(receipt.world_tick || 0);
        state.state_revision = Number(receipt.state_revision || 0);
        const locationChanged = previousLocationId && previousLocationId !== state.location?.id;
        if (locationChanged) {
          pendingChats = [];
          rebuildLogFromAuthoritativeState(state);
          connectStream();
        }
        actions = buildActions(state);
        return true;
      } catch {
        return false;
      }
    }

    const importantNotificationTypes = new Set([
      "combat.knockout",
      "combat.flee.success",
      "combat.encounter.resolved",
      "clock.threshold",
      "relationship.advanced",
      "world.conflict.escalated",
    ]);
    const dockOwnedCombatNotificationTypes = new Set([
      "combat.encounter.started",
      "combat.attack.attempt",
      "combat.attack.hit",
      "combat.attack.miss",
      "combat.defend",
      "combat.dodge",
      "combat.pass",
      "combat.need_time",
    ]);

    function enqueueImportantNotification(event) {
      const type = String(event?.type || "");
      if (!importantNotificationTypes.has(type) && !type.startsWith("clock.threshold")) return;
      const key = String(event?.seq || `${type}:${Date.now()}`);
      if (journalNotifications.some((notification) => notification.key === key)) return;
      const text = sceneCardEventText(event)
        || cleanStatusText(event?.content || eventText(event))
        || "Something important changed.";
      const clockSegments = Math.max(0, Number(event?.clock_segments || 0));
      journalNotifications.push({
        key,
        label: type.startsWith("clock.") ? "clock" : "notice",
        text,
        filled: clockSegments ? Math.max(0, Number(event?.clock_filled || 0)) : 0,
        segments: clockSegments,
      });
      journalNotifications = journalNotifications.slice(-6);
      dismissedJournalActivityKeys.delete(key);
      renderJournalActivity();
    }

    function enqueueJournalNotification(event) {
      if (!sceneCardEventTypes.has(String(event?.type || ""))) return;
      if (["ability_check.rolled", "avatar.thought", "avatar.dream"].includes(event.type)) return;
      if (dockOwnedCombatNotificationTypes.has(event.type)) return;
      const key = String(event?.seq || `${event.type}:${Date.now()}`);
      if (journalNotifications.some((notification) => notification.key === key)) return;
      const meta = statusUpdateMeta(event);
      const clockSegments = Math.max(0, Number(event?.clock_segments || 0));
      journalNotifications.push({
        key,
        label: meta.label || "journal",
        text: meta.text || cleanStatusText(eventText(event)) || "The shared world changed.",
        filled: clockSegments ? Math.max(0, Number(event?.clock_filled || 0)) : 0,
        segments: clockSegments,
      });
      journalNotifications = journalNotifications.slice(-6);
      dismissedJournalActivityKeys.delete(key);
    }

    function ensureJournalNotification(notification) {
      if (!notification?.key || dismissedJournalActivityKeys.has(notification.key)) return;
      if (journalNotifications.some((candidate) => candidate.key === notification.key)) return;
      journalNotifications.push({ filled: 0, segments: 0, ...notification });
      journalNotifications = journalNotifications.slice(-6);
    }

    function journalProgressSegmentsHtml(filled, total, label) {
      const segmentCount = Math.max(0, Math.min(12, Number(total || 0)));
      if (!segmentCount) return "";
      const filledCount = Math.max(0, Math.min(segmentCount, Number(filled || 0)));
      const segments = Array.from({ length: segmentCount }, (_, index) => (
        `<span${index < filledCount ? ' class="filled"' : ""}></span>`
      )).join("");
      return `<span class="journal-progress-segments" style="--journal-segment-count:${segmentCount}" role="progressbar" aria-label="${escapeAttr(label)}" aria-valuemin="0" aria-valuemax="${segmentCount}" aria-valuenow="${filledCount}">${segments}</span>`;
    }

    function pendingChatJournalActivity(chat) {
      if (!chat) return null;
      const total = Math.max(1, Number(chat.segmentCount || chatOpeningTurnCount));
      const filled = Math.max(0, Math.min(total, Number(chat.segmentsCompleted || 0)));
      const speaker = String(chat.typingName || chat.targetName || "Someone nearby");
      return {
        key: `chat:${chat.id}:${filled}`,
        label: "chat",
        text: String(chat.activityText || `${speaker} is continuing the conversation`),
        filled,
        segments: total,
      };
    }

    function currentJournalActivities() {
      return [
        ...journalNotifications,
        pendingChatJournalActivity(pendingChats[0]),
        pendingReflection ? {
          key: `reflection:${pendingReflection.sourceSeq}`,
          label: pendingReflection.kind,
          text: pendingReflection.text,
          filled: 0,
          segments: 1,
        } : null,
      ].filter((activity) => activity && !dismissedJournalActivityKeys.has(activity.key));
    }

    function journalActivityRowHtml(activity) {
      const progress = journalProgressSegmentsHtml(
        activity.filled,
        activity.segments,
        `${activity.label} progress: ${activity.filled} of ${activity.segments}`,
      );
      return `<div class="journal-activity-row"><span class="journal-activity-row-label">${escapeHtml(activity.label)}</span><span class="journal-activity-row-text">${escapeHtml(activity.text)}</span>${progress}</div>`;
    }

    function renderJournalActivity() {
      const activities = currentJournalActivities()
        .map((activity) => ({
          ...activity,
          text: journalWorldProse(activity.text),
        }))
        .filter((activity) => activity.text);
      const notificationCount = $("journal-notification-count");
      if (notificationCount) {
        notificationCount.textContent = "0";
        notificationCount.hidden = true;
      }
      const panel = $("journal-activity");
      if (!panel) return;
      panel.hidden = activities.length === 0;
      panel.innerHTML = activities.map(journalActivityRowHtml).join("");
      syncJournalRegions();
    }

    function pushEvents(events) {
      let changed = false;
      const pendingChatCountBefore = pendingChats.length;
      const pendingInteractionCountBefore = pendingModelInteractions.length;
      let chatProgressChanged = false;
      let modelInteractionProgressChanged = false;
      for (const event of events) {
        if (captureDefeatTransition(event)) changed = true;
        if (applyActionReceipt(event)) {
          changed = true;
          continue;
        }
        if (event?.type === "world.reset") {
          resetTranscriptAtWorldBoundary(event);
          changed = true;
          continue;
        }
        const authoritativeSeq = Number(event?.seq || 0);
        if (!event || eventIsMuted(event) || (authoritativeSeq > 0 && seenSeq.has(authoritativeSeq))) continue;
        if (authoritativeSeq > 0) seenSeq.add(authoritativeSeq);
        if (resolvePendingChat(event)) {
          changed = true;
          chatProgressChanged = true;
        }
        if (resolvePendingModelInteraction(event)) {
          changed = true;
          modelInteractionProgressChanged = true;
        }
        if (
          event?.type === "ability_check.rolled"
          && ["think", "dream"].includes(String(event.content || ""))
        ) {
          if (event.success === true) {
            pendingReflection = {
              sourceSeq: Number(event.seq || 0),
              kind: String(event.content || "think"),
              text: event.content === "dream"
                ? "A dream is taking shape…"
                : "A thought is taking shape…",
            };
          } else {
            const key = String(event.seq || `reflection:${Date.now()}`);
            journalNotifications.push({
              key,
              label: String(event.content || "think"),
              text: event.content === "dream"
                ? "No dream came back this time."
                : "No clear thought settled this time.",
              filled: 1,
              segments: 1,
            });
          }
        }
        if (["avatar.thought", "avatar.dream"].includes(event?.type)) {
          pendingReflection = null;
          const key = String(event.seq || `reflection:${Date.now()}`);
          journalNotifications.push({
            key,
            label: event.type === "avatar.dream" ? "dream" : "think",
            text: cleanStatusText(event.content || "A private reflection settled."),
            filled: 1,
            segments: 1,
          });
          dismissedJournalActivityKeys.delete(key);
        }
        if (eventIsHiddenContext(event)) continue;
        enqueueImportantNotification(event);
        enqueueJournalNotification(event);
        if (!eventIsLowSignalStatus(event)) appendLogEvent(event);
        changed = true;
      }
      logEvents = logEvents.slice(-90);
      if (pendingChats.length !== pendingChatCountBefore
          || pendingModelInteractions.length !== pendingInteractionCountBefore
          || chatProgressChanged || modelInteractionProgressChanged) renderCommands();
      renderJournalActivity();
      return changed;
    }

    function reactionTargetForAction(action) {
      let selectedTargetId = 0;
      if (typeof action?.selectedPayload === "function") {
        try {
          selectedTargetId = Number(action.selectedPayload()?.target_actor_id || 0);
        } catch {
          selectedTargetId = 0;
        }
      }
      const avatars = (state?.actors || []).filter((actor) => (
        actor.status === "active"
        && Number(actor.location_id || state?.location?.id || 0) === Number(state?.location?.id || 0)
      ));
      const selected = avatars.find((actor) => Number(actor.id) === selectedTargetId);
      if (selected) return selected;
      if (!avatars.length) return actorForId(actorId);
      const latestAvatarId = [...logEvents].reverse().find((event) => (
        ["message.created", "image.created"].includes(event?.type)
        && avatars.some((actor) => Number(actor.id) === Number(event.actor_id))
      ))?.actor_id;
      if (!latestAvatarId) return avatars[0];
      const latestIndex = avatars.findIndex((actor) => Number(actor.id) === Number(latestAvatarId));
      return avatars[(latestIndex + 1) % avatars.length];
    }

    function beginPendingChat(action) {
      if (!actorId || action?.kind !== "orb-chat") return 0;
      const active = pendingChats[0];
      if (active) {
        return { id: active.id, created: false };
      }
      const target = reactionTargetForAction(action);
      if (!target) return 0;
      const id = nextPendingChatId++;
      const self = actorForId(actorId);
      pendingChats.push({
        id,
        targetActorId: Number(target.id || 0),
        targetName: actorLabel(target),
        typingActorId: Number(actorId),
        typingName: self ? actorLabel(self) : "Your avatar",
        afterSeq: latestSeenSeq(),
        segmentsCompleted: 0,
        segmentCount: chatOpeningTurnCount,
        activityText: `${self ? actorLabel(self) : "Your avatar"} is opening the conversation`,
      });
      window.setTimeout(() => {
        if (!pendingChats.some((chat) => chat.id === id)) return;
        cancelPendingChat({ id, created: true });
        renderCommands();
        renderLog();
      }, 180000);
      return { id, created: true };
    }

    function cancelPendingChat(pending) {
      if (!pending || pending.created === false) return;
      const id = Number(pending.id || pending || 0);
      if (!id) return;
      pendingChats = pendingChats.filter((chat) => chat.id !== id);
      renderJournalActivity();
    }

    function pendingChatMatchesEvent(chat, event) {
      const eventSeq = Number(event?.seq || 0);
      if (!eventSeq || eventSeq <= Number(chat.afterSeq || 0)) return false;
      const queueEventSeq = Number(chat.queueEventSeq || 0);
      const eventQueueSeq = event.type === "chat.queued"
        ? eventSeq
        : Number(event.caused_by_event_seq || 0);
      if (queueEventSeq && eventQueueSeq) return queueEventSeq === eventQueueSeq;
      const pairMatches = (
        (Number(event.actor_id || 0) === Number(actorId || 0)
          && Number(event.target_actor_id || 0) === Number(chat.targetActorId || 0))
        || (Number(event.actor_id || 0) === Number(chat.targetActorId || 0)
          && Number(event.target_actor_id || 0) === Number(actorId || 0))
      );
      if (!pairMatches) return false;
      return pairMatches;
    }

    function chatFloorPresentation(event) {
      if (!String(event?.type || "").startsWith("chat.")) return null;
      try {
        const value = JSON.parse(String(event.content || ""));
        if (Number(value?.schema_version) !== 1) return null;
        const round = Math.max(1, Number(value.round || 1));
        const seat = Math.max(0, Number(value.seat || 0));
        const seats = Math.max(1, Number(value.seats || 1));
        const decision = String(value.decision || "");
        if (!Number.isFinite(round) || !Number.isFinite(seat) || !Number.isFinite(seats)) return null;
        return { round, seat, seats, decision };
      } catch {
        return null;
      }
    }

    function resolvePendingChat(event) {
      if (!event || !pendingChats.length) return false;
      const eventSeq = Number(event.seq || 0);
      const matchingChatIndex = pendingChats.findIndex((chat) => pendingChatMatchesEvent(chat, event));
      if (
        event.type === "chat.queued"
        || event.type === "chat.typing"
        || event.type === "chat.retrying"
      ) {
        if (matchingChatIndex >= 0) {
          const matchingChat = pendingChats[matchingChatIndex];
          pendingChats = pendingChats.filter((chat, index) => (
            index === matchingChatIndex || !pendingChatMatchesEvent(chat, event)
          ));
          matchingChat.queueEventSeq = event.type === "chat.queued"
            ? eventSeq
            : Number(matchingChat.queueEventSeq || event.caused_by_event_seq || 0);
          if (event.type === "chat.queued" || event.type === "chat.retrying") return true;
          const speakerId = Number(event.actor_id || 0);
          const speaker = actorForId(speakerId);
          matchingChat.typingActorId = speakerId;
          matchingChat.typingName = String(
            event.actor_name || (speaker ? actorLabel(speaker) : "Someone nearby"),
          );
          matchingChat.activityText = `${matchingChat.typingName} is composing a line`;
          return true;
        }
        return false;
      }
      if (event.type === "message.created") {
        const messageChatIndex = pendingChats.findIndex((chat) => (
          eventSeq > Number(chat.afterSeq || 0)
          && Number(event.actor_id || 0) === Number(chat.typingActorId || 0)
        ));
        if (messageChatIndex >= 0) {
          const chat = pendingChats[messageChatIndex];
          if (Number(chat.round || 0) > 0) return true;
          pendingChats[messageChatIndex] = {
            ...chat,
            afterSeq: eventSeq,
            segmentsCompleted: Math.min(
              Number(chat.segmentCount || chatOpeningTurnCount),
              Number(chat.segmentsCompleted || 0) + 1,
            ),
          };
          return true;
        }
        return false;
      }
      if (["chat.round", "chat.deciding", "chat.spoke", "chat.passed"].includes(event.type)) {
        if (matchingChatIndex < 0) return false;
        const floor = chatFloorPresentation(event);
        if (!floor) return false;
        const chat = pendingChats[matchingChatIndex];
        const speakerId = Number(event.actor_id || 0);
        const speaker = actorForId(speakerId);
        const speakerName = String(
          event.actor_name || (speaker ? actorLabel(speaker) : "Someone nearby"),
        );
        pendingChats[matchingChatIndex] = {
          ...chat,
          round: floor.round,
          segmentCount: floor.seats,
          segmentsCompleted: event.type === "chat.round"
            ? 0
            : Math.min(floor.seats, floor.seat + (event.type === "chat.deciding" ? 0 : 1)),
          typingActorId: speakerId || chat.typingActorId,
          typingName: event.type === "chat.passed"
            ? `${speakerName} passes`
            : event.type === "chat.spoke"
              ? `${speakerName} spoke`
              : event.type === "chat.round"
                ? `initiative round ${floor.round}`
                : `${speakerName} is choosing chat or pass`,
          activityText: event.type === "chat.passed"
            ? `${speakerName} passed`
            : event.type === "chat.spoke"
              ? `${speakerName} spoke`
              : event.type === "chat.round"
                ? `Initiative round ${floor.round} began`
                : `${speakerName} is choosing chat or pass`,
        };
        return true;
      }
      if (event.type === "chat.failed" || event.type === "chat.completed") {
        if (matchingChatIndex >= 0) {
          if (event.type === "chat.failed") {
            pendingChats.splice(matchingChatIndex, 1);
            ensureJournalNotification({
              key: `chat-failed:${eventSeq}`,
              label: "chat",
              text: cleanStatusText(event.content || "The conversation ended early."),
              filled: 1,
              segments: 1,
            });
            return true;
          }
          const chat = pendingChats[matchingChatIndex];
          ensureJournalNotification({
            key: `chat-completed:${eventSeq}`,
            label: "chat",
            text: `${chat.targetName || "The conversation"} settled after everyone passed.`,
            filled: Number(chat.segmentCount || chatOpeningTurnCount),
            segments: Number(chat.segmentCount || chatOpeningTurnCount),
          });
          pendingChats[matchingChatIndex] = {
            ...chat,
            segmentsCompleted: Number(chat.segmentCount || chatOpeningTurnCount),
            typingName: "the conversation settles",
            activityText: "The conversation settled after everyone passed",
          };
          window.setTimeout(() => {
            cancelPendingChat(chat.id);
            renderCommands();
            renderLog();
          }, 500);
          return true;
        }
      }
      return false;
    }

    function beginPendingModelInteraction(action) {
      if (!actorId || action?.kind !== "model-interaction") return null;
      const targetActorId = Number(action.targetActorId || action.selectedPayload?.()?.target_actor_id || 0);
      const target = actorForId(targetActorId);
      if (!targetActorId || !target) return null;
      const existing = pendingModelInteractions.find((pending) => (
        Number(pending.targetActorId) === targetActorId
      ));
      if (existing) return { id: existing.id, created: false };
      const pending = {
        id: nextPendingModelInteractionId++,
        targetActorId,
        targetName: actorLabel(target),
        profile: modelInteractionPresentation(action).profile,
        afterSeq: latestSeenSeq(),
        stage: "queued",
      };
      pendingModelInteractions.push(pending);
      window.setTimeout(() => {
        if (!pendingModelInteractions.some((candidate) => candidate.id === pending.id)) return;
        pendingModelInteractionRehydrationRequired = true;
        queueRefresh();
      }, 180000);
      return { id: pending.id, created: true };
    }

    function cancelPendingModelInteraction(pending) {
      if (!pending || pending.created === false) return;
      const id = Number(pending.id || pending || 0);
      if (!id) return;
      pendingModelInteractions = pendingModelInteractions.filter((candidate) => candidate.id !== id);
    }

    function modelInteractionProfileForTarget(targetActorId, view = state) {
      const offer = (view?.action_offers || []).find((candidate) => (
        candidate?.kind === "model_interaction"
        && Number(candidate?.target?.id || 0) === Number(targetActorId || 0)
      ));
      return modelInteractionPresentation(offer || "").profile;
    }

    function modelInteractionLifecycleSnapshot(events, view = state, existingPending = []) {
      const viewerActorId = Number(actorId || 0);
      const activeByQueue = new Map();
      const terminalQueueSeqs = new Set();
      let sawWorldReset = false;
      if (!viewerActorId) return { pending: [], terminalQueueSeqs, sawWorldReset };
      const chronological = [...(events || [])].sort((left, right) => (
        Number(left?.seq || 0) - Number(right?.seq || 0)
      ));
      const pendingFor = (queueEventSeq, targetActorId, event) => {
        const existing = existingPending.find((candidate) => (
          Number(candidate.queueEventSeq || 0) === queueEventSeq
          || (!candidate.queueEventSeq
            && Number(candidate.targetActorId || 0) === targetActorId)
        ));
        const target = (view?.actors || []).find((actor) => Number(actor.id) === targetActorId);
        const targetName = String(
          event?.target_actor_name
          || target?.name
          || existing?.targetName
          || `Resident ${targetActorId}`,
        );
        return {
          id: existing?.id || nextPendingModelInteractionId++,
          targetActorId,
          targetName,
          profile: existing?.profile
            || modelInteractionProfileForTarget(targetActorId, view),
          afterSeq: Math.max(0, queueEventSeq - 1),
          queueEventSeq,
          stage: "queued",
          lastEventSeq: queueEventSeq,
          rehydrated: true,
        };
      };
      for (const event of chronological) {
        const type = String(event?.type || "");
        if (type === "world.reset") {
          activeByQueue.clear();
          terminalQueueSeqs.clear();
          sawWorldReset = true;
          continue;
        }
        if (!type.startsWith("model_interaction.")) continue;
        const queued = type === "model_interaction.queued";
        const output = type === "model_interaction.output";
        const activeStage = queued
          || type === "model_interaction.generating"
          || type === "model_interaction.retrying";
        const terminal = output
          || type === "model_interaction.completed"
          || type === "model_interaction.failed";
        if (!activeStage && !terminal) continue;
        const eventActorId = Number(event.actor_id || 0);
        const eventTargetActorId = Number(event.target_actor_id || 0);
        const targetActorId = output ? eventActorId : eventTargetActorId;
        const belongsToViewer = output
          ? eventTargetActorId === viewerActorId
          : eventActorId === viewerActorId;
        if (!belongsToViewer || !targetActorId || targetActorId === viewerActorId) continue;
        const queueEventSeq = queued
          ? Number(event.seq || 0)
          : Number(event.caused_by_event_seq || 0);
        if (!Number.isSafeInteger(queueEventSeq) || queueEventSeq < 1) continue;
        if (terminal) {
          const lifecycle = activeByQueue.get(queueEventSeq)
            || existingPending.find((candidate) => (
              Number(candidate.queueEventSeq || 0) === queueEventSeq
              && Number(candidate.targetActorId || 0) === targetActorId
            ));
          if (lifecycle && Number(lifecycle.targetActorId || 0) !== targetActorId) continue;
          terminalQueueSeqs.add(queueEventSeq);
          if (lifecycle) {
            if (type === "model_interaction.failed") {
              event.clientModelInteractionProfile = lifecycle.profile;
            }
            activeByQueue.delete(queueEventSeq);
          }
          continue;
        }
        if (terminalQueueSeqs.has(queueEventSeq)) continue;
        let lifecycle = activeByQueue.get(queueEventSeq);
        if (!lifecycle) {
          lifecycle = pendingFor(queueEventSeq, targetActorId, event);
          activeByQueue.set(queueEventSeq, lifecycle);
        }
        if (Number(lifecycle.targetActorId || 0) !== targetActorId) continue;
        lifecycle.stage = queued ? "queued" : type.slice("model_interaction.".length);
        lifecycle.lastEventSeq = Math.max(
          Number(lifecycle.lastEventSeq || 0),
          Number(event.seq || queueEventSeq),
        );
      }
      const pending = [...activeByQueue.values()]
        .sort((left, right) => Number(left.lastEventSeq || 0) - Number(right.lastEventSeq || 0))
        .slice(-1);
      return { pending, terminalQueueSeqs, sawWorldReset };
    }

    function pendingModelInteractionMatchesEvent(pending, event) {
      const eventSeq = Number(event?.seq || 0);
      if (!eventSeq || eventSeq <= Number(pending.afterSeq || 0)) return false;
      const pairMatches = (
        (Number(event.actor_id || 0) === Number(actorId)
          && Number(event.target_actor_id || 0) === Number(pending.targetActorId))
        || (Number(event.actor_id || 0) === Number(pending.targetActorId)
          && Number(event.target_actor_id || 0) === Number(actorId))
      );
      if (!pairMatches) return false;
      const queueSeq = Number(pending.queueEventSeq || 0);
      const eventQueueSeq = event.type === "model_interaction.queued"
        ? eventSeq
        : Number(event.caused_by_event_seq || 0);
      return !queueSeq || !eventQueueSeq || queueSeq === eventQueueSeq;
    }

    function resolvePendingModelInteraction(event) {
      if (!event || !pendingModelInteractions.length) return false;
      if (!String(event.type || "").startsWith("model_interaction.")) return false;
      const index = pendingModelInteractions.findIndex((pending) => (
        pendingModelInteractionMatchesEvent(pending, event)
      ));
      if (index < 0) return false;
      const pending = pendingModelInteractions[index];
      if (event.type === "model_interaction.queued") {
        pending.queueEventSeq = Number(event.seq || 0);
        pending.stage = "queued";
      } else if (event.type === "model_interaction.generating") {
        pending.stage = "generating";
      } else if (event.type === "model_interaction.retrying") {
        pending.stage = "retrying";
      } else if ([
        "model_interaction.output",
        "model_interaction.completed",
        "model_interaction.failed",
      ].includes(event.type)) {
        if (event.type === "model_interaction.failed") {
          event.clientModelInteractionProfile = pending.profile;
        }
        pendingModelInteractions.splice(index, 1);
      }
      return true;
    }

    function rebuildLog(events) {
      const previousPendingModelInteractions = pendingModelInteractions.map((pending) => ({
        ...pending,
      }));
      pendingReflection = null;
      logEvents = [];
      seenSeq.clear();
      for (const event of events) {
        if (event?.type === "world.reset") {
          resetTranscriptAtWorldBoundary(event);
          continue;
        }
        if (!event || eventIsMuted(event)) continue;
        resolvePendingChat(event);
        resolvePendingModelInteraction(event);
        if (
          event.type === "ability_check.rolled"
          && ["think", "dream"].includes(String(event.content || ""))
          && event.success === true
        ) {
          pendingReflection = {
            sourceSeq: Number(event.seq || 0),
            kind: String(event.content || "think"),
            text: event.content === "dream"
              ? "A dream is taking shape…"
              : "A thought is taking shape…",
          };
        }
        if (["avatar.thought", "avatar.dream"].includes(event.type)) pendingReflection = null;
        if (eventIsHiddenContext(event)) continue;
        if (event.seq !== undefined && event.seq !== null) {
          if (seenSeq.has(event.seq)) continue;
          seenSeq.add(event.seq);
        }
        if (!eventIsLowSignalStatus(event)) appendLogEvent(event);
      }
      logEvents = logEvents.slice(-90);
      const lifecycle = modelInteractionLifecycleSnapshot(
        events,
        state,
        previousPendingModelInteractions,
      );
      const preserved = lifecycle.sawWorldReset
        ? []
        : previousPendingModelInteractions.filter((pending) => (
          !pending.queueEventSeq
          || !lifecycle.terminalQueueSeqs.has(Number(pending.queueEventSeq || 0))
        ));
      pendingModelInteractions = lifecycle.pending.length
        ? lifecycle.pending
        : preserved.slice(-1);
      renderJournalActivity();
    }

    function rebuildLogFromAuthoritativeEvents(events = []) {
      rebuildLog(Array.isArray(events) ? events : []);
      roomHistoryHydrated = true;
      pendingModelInteractionRehydrationRequired = false;
    }

    function rebuildLogFromAuthoritativeState(view = state) {
      rebuildLogFromAuthoritativeEvents([...(view?.recent_events || [])].reverse());
    }

    function eventIsMuted(event) {
      const muted = new Set((state?.safety?.muted_actor_ids || []).map(Number));
      return muted.has(Number(event?.actor_id || 0));
    }

    const chatEventTypes = new Set([

    const sceneCardEventTypes = new Set([

    function worldBeatExposureId(event) {
      const seq = Number(event?.seq || 0);
      if (!Number.isSafeInteger(seq) || seq <= 0 || !worldTranscriptEventTypes.has(event?.type)) return "";
      return `world-beat:v${worldBeatPresentationContractVersion}:${seq}`;
    }

    function worldBeatRowIsActuallyVisible(row, log) {
      if (!row?.isConnected || !log?.isConnected || row.getClientRects().length === 0) return false;
      const style = window.getComputedStyle(row);
      if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) return false;
      const rowRect = row.getBoundingClientRect();
      const logRect = log.getBoundingClientRect();
      const top = Math.max(logRect.top, 0);
      const left = Math.max(logRect.left, 0);
      const bottom = Math.min(logRect.bottom, window.innerHeight);
      const right = Math.min(logRect.right, window.innerWidth);
      return rowRect.bottom > top && rowRect.top < bottom && rowRect.right > left && rowRect.left < right;
    }

    function scheduleVisibleWorldBeatReceipts() {
      if (worldBeatVisibilityFrame !== null) return;
      worldBeatVisibilityFrame = window.requestAnimationFrame(() => {
        worldBeatVisibilityFrame = null;
        acknowledgeVisibleWorldBeatRows();
      });
    }

    function acknowledgeVisibleWorldBeatRows() {
      if (!actorId || !actorSession || document.visibilityState !== "visible" || activeModal()) return;
      const log = journalOpen ? $("journal-view") : $("log");
      if (!log || log.hidden || log.getClientRects().length === 0 || libraryPanelPinned || accountPanelPinned) return;
      if (journalOpen) {
        const beats = journalBeatsForPresentation();
        for (const row of log.querySelectorAll("[data-world-beat-receipt][data-journal-beat-index]")) {
          if (!worldBeatRowIsActuallyVisible(row, log)) continue;
          const beat = beats[Number(row.dataset.journalBeatIndex || -1)];
          if (!beat?.world_beat_exposure_id || !cleanStatusText(beat.headline)) continue;
          void acknowledgeWorldBeatExposureId(beat.world_beat_exposure_id);
        }
        return;
      }
      for (const row of log.querySelectorAll("[data-world-beat-exposure][data-world-beat-seq]")) {
        if (!worldBeatRowIsActuallyVisible(row, log)) continue;
        const seq = Number(row.dataset.worldBeatSeq || 0);
        const event = logEvents.find((candidate) => Number(candidate?.seq || 0) === seq);
        if (!event || !sceneCardEventText(event)) continue;
        void acknowledgeWorldBeatExposure(event);
      }
    }

    async function acknowledgeWorldBeatExposure(event) {
      const exposureId = worldBeatExposureId(event);
      await acknowledgeWorldBeatExposureId(exposureId);
    }

    async function acknowledgeWorldBeatExposureId(exposureId) {
      if (!exposureId) return;
      const previous = worldBeatReceiptState.get(exposureId);
      if (["in_flight", "acknowledged", "rejected"].includes(previous?.status)) return;
      const attempts = Number(previous?.attempts || 0) + 1;
      worldBeatReceiptState.set(exposureId, { status: "in_flight", attempts });
      try {
        const result = await post("/story/world-beat-exposures", {
          actor_id: actorId,
          actor_session: actorSession,
          exposure_id: exposureId,
          transport: "browser",
          state_revision: Math.max(
            Number(state?.state_revision || 0),
            Number(state?.world_seq || 0),
            latestSeenSeq(),
          ),
        });
        if (result?.ok) {
          worldBeatReceiptState.set(exposureId, { status: "acknowledged", attempts });
          return;
        }
        const status = Number(result?.status || 0);
        if ([403, 404, 409, 422].includes(status)) {
          worldBeatReceiptState.set(exposureId, { status: "rejected", attempts });
          return;
        }
        throw new Error(result?.error || "world-beat exposure receipt failed");
      } catch (error) {
        worldBeatReceiptState.set(exposureId, { status: "retry", attempts });
        if (attempts < 3) {
          window.setTimeout(scheduleVisibleWorldBeatReceipts, attempts * 1000);
        } else {
          console.warn("World-beat exposure receipt was not recorded", exposureId, error);
        }
      }
    }

    function clockPresentationExposure(question, interaction) {
      const clockId = String(question?.progress_clock_id || "");
      const stateRevision = Math.max(
        1,
        Number(state?.state_revision || 0),
        Number(state?.world_seq || 0),
        latestSeenSeq(),
      );
      if (!clockId || !["promoted_seen", "explanation_opened", "completion_seen", "return_change_seen", "comprehension_confirmed"].includes(interaction)) {
        return null;
      }
      return {
        clockId,
        interaction,
        stateRevision,
        exposureId: `clock-presentation:v${clockPresentationContractVersion}:${interaction}:${stateRevision}:${clockId}`,
      };
    }

    function clockPresentationRowIsActuallyVisible(row, panel) {
      if (!row?.isConnected || !panel?.isConnected || row.getClientRects().length === 0) return false;
      const style = window.getComputedStyle(row);
      if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) return false;
      const rowRect = row.getBoundingClientRect();
      const panelRect = panel.getBoundingClientRect();
      const top = Math.max(panelRect.top, 0);
      const left = Math.max(panelRect.left, 0);
      const bottom = Math.min(panelRect.bottom, window.innerHeight);
      const right = Math.min(panelRect.right, window.innerWidth);
      return rowRect.bottom > top && rowRect.top < bottom && rowRect.right > left && rowRect.left < right;
    }

    function scheduleVisibleClockPresentationReceipts() {
      if (clockPresentationVisibilityFrame !== null) return;
      clockPresentationVisibilityFrame = window.requestAnimationFrame(() => {
        clockPresentationVisibilityFrame = null;
        acknowledgeVisibleClockPresentations();
      });
    }

    function acknowledgeVisibleClockPresentations() {
      if (!actorId || !actorSession || document.visibilityState !== "visible" || activeModal()) return;
      if (libraryPanelPinned || accountPanelPinned) return;
      const panels = [$("shared-questions")]
        .filter((panel) => panel && !panel.hidden && panel.getClientRects().length > 0);
      for (const panel of panels) {
        for (const row of panel.querySelectorAll("[data-clock-presentation][data-clock-id]")) {
          if (!clockPresentationRowIsActuallyVisible(row, panel)) continue;
          const clockId = String(row.dataset.clockId || "");
          const question = (state?.shared_questions || []).find((candidate) => (
            String(candidate?.progress_clock_id || "") === clockId
          ));
          if (!question) continue;
          const interaction = row.dataset.questionState === "completed_memory"
            ? "completion_seen"
            : "promoted_seen";
          void acknowledgeClockPresentation(question, interaction);
          const updatedEventSeq = Number(question.updated_event_seq || 0);
          const lastSeenEventSeq = clockPresentationLastSeenEventSeq(clockId);
          if (
            lastSeenEventSeq > 0
            && updatedEventSeq > lastSeenEventSeq
            && (
              (question.recent_contributions || []).some((entry) => Number(entry.event_seq || 0) > lastSeenEventSeq)
              || question.presentation_state === "completed_memory"
            )
          ) {
            void acknowledgeClockPresentation(question, "return_change_seen");
          }
          if (updatedEventSeq > lastSeenEventSeq) {
            rememberClockPresentationEventSeq(clockId, updatedEventSeq);
          }
        }
      }
    }

    function clockPresentationLastSeenEventSeq(clockId) {
      try {
        return Number(localStorage.getItem(`cosyworld.clock-presentation.last-seen.${clockId}`) || 0);
      } catch (_error) {
        return 0;
      }
    }

    function rememberClockPresentationEventSeq(clockId, eventSeq) {
      try {
        localStorage.setItem(
          `cosyworld.clock-presentation.last-seen.${clockId}`,
          String(Math.max(0, Number(eventSeq || 0))),
        );
      } catch (_error) {
        // Presentation remains usable when storage is unavailable.
      }
    }

    async function acknowledgeClockPresentation(question, interaction) {
      const exposure = clockPresentationExposure(question, interaction);
      if (!exposure) return;
      const previous = clockPresentationReceiptState.get(exposure.exposureId);
      if (["in_flight", "acknowledged", "rejected"].includes(previous?.status)) return;
      const attempts = Number(previous?.attempts || 0) + 1;
      clockPresentationReceiptState.set(exposure.exposureId, { status: "in_flight", attempts });
      try {
        const result = await post("/story/clock-presentations", {
          actor_id: actorId,
          actor_session: actorSession,
          exposure_id: exposure.exposureId,
          clock_id: exposure.clockId,
          interaction: exposure.interaction,
          transport: "browser",
          state_revision: exposure.stateRevision,
        });
        if (result?.ok) {
          clockPresentationReceiptState.set(exposure.exposureId, { status: "acknowledged", attempts });
          return;
        }
        const status = Number(result?.status || 0);
        if ([403, 404, 409, 422].includes(status)) {
          clockPresentationReceiptState.set(exposure.exposureId, { status: "rejected", attempts });
          return;
        }
        throw new Error(result?.error || "shared-question exposure receipt failed");
      } catch (error) {
        clockPresentationReceiptState.set(exposure.exposureId, { status: "retry", attempts });
        if (attempts < 3) {
          window.setTimeout(
            () => void acknowledgeClockPresentation(question, interaction),
            attempts * 1000,
          );
        } else {
          console.warn("Shared-question exposure receipt was not recorded", exposure.exposureId, error);
        }
      }
    }

    function firstTalePresentationExposure(interaction, view = state) {

        Number(view?.state_revision || 0),
        Number(view?.world_seq || 0),

        || !["phase_seen", "growth_feedback_seen", "completion_memory_seen", "journal_opened_after_growth"].includes(interaction)
      ) return null;
