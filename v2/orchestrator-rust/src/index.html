<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b09" />
  <title>CosyWorld</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b09;
      --terminal: #0d140f;
      --terminal-2: #101912;
      --line: rgba(129, 255, 167, 0.18);
      --line-strong: rgba(239, 201, 107, 0.34);
      --text: #d8f7dc;
      --dim: #85a58a;
      --green: #65e68a;
      --amber: #efc96b;
      --blue: #8bb7ff;
      --red: #ff8d8d;
      --suit-head: #79c7ff;
      --suit-head-rgb: 121, 199, 255;
      --suit-heart: #f2a5c4;
      --suit-heart-rgb: 242, 165, 196;
      --suit-honor: #ff7b72;
      --suit-honor-rgb: 255, 123, 114;
      --suit-hustle: #efc96b;
      --suit-hustle-rgb: 239, 201, 107;
      --card-control: #9db3c7;
      --card-control-rgb: 157, 179, 199;
      --type-travel: #65e68a;
      --type-travel-rgb: 101, 230, 138;
      --type-chat: #f2df9b;
      --type-chat-rgb: 242, 223, 155;
      --type-bond: #ffd36a;
      --type-bond-rgb: 255, 211, 106;
      --type-listen: #79c7ff;
      --type-listen-rgb: 121, 199, 255;
      --type-notice: #79c7ff;
      --type-notice-rgb: 121, 199, 255;
      --type-inspect: #d7a7ff;
      --type-inspect-rgb: 215, 167, 255;
      --type-scout: #58d7d0;
      --type-scout-rgb: 88, 215, 208;
      --type-train: #b89cff;
      --type-train-rgb: 184, 156, 255;
      --type-evolve: #a8bdf0;
      --type-evolve-rgb: 168, 189, 240;
      --type-trade: #f2a65a;
      --type-trade-rgb: 242, 166, 90;
      --type-bank: #82e6c2;
      --type-bank-rgb: 130, 230, 194;
      --type-craft: #59dbc8;
      --type-craft-rgb: 89, 219, 200;
      --type-project: #a6e37b;
      --type-project-rgb: 166, 227, 123;
      --type-item: #efc96b;
      --type-item-rgb: 239, 201, 107;
      --type-combat: #ff6b6b;
      --type-combat-rgb: 255, 107, 107;
      --type-danger: #ff8a5b;
      --type-danger-rgb: 255, 138, 91;
      --type-shuffle: #9db3c7;
      --type-shuffle-rgb: 157, 179, 199;
      --type-utility: #aab7a4;
      --type-utility-rgb: 170, 183, 164;
      --avatar-pfp-background-size: 138%;
      --avatar-pfp-background-position: center top;
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.48 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 4px);
      opacity: 0.11;
      z-index: 10;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .shell {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr) auto auto;
      background:
        radial-gradient(circle at 18% 12%, rgba(101, 230, 138, 0.09), transparent 25%),
        radial-gradient(circle at 78% 8%, rgba(239, 201, 107, 0.08), transparent 26%),
        var(--bg);
      overflow: hidden;
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 8, 6, 0.96);
    }
    .brand {
      min-height: 44px;
      border: 0;
      padding: 0;
      background: transparent;
      min-width: 0;
      color: var(--green);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .brand::before { content: "cosyworld://"; color: var(--dim); }
    .economy {
      min-height: 44px;
      border: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      color: var(--dim);
      font-size: 13px;
      white-space: nowrap;
      max-width: min(260px, 34vw);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: default;
    }
    .economy strong {
      color: var(--amber);
      font-weight: 850;
    }
    .economy-flash {
      color: var(--green);
      font-weight: 850;
    }
    .economy-flash.spend {
      color: var(--amber);
    }
    .economy.focused,
    .economy:focus-visible {
      color: var(--green);
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    .location-pill {
      min-height: 44px;
      border: 0;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      min-width: 0;
      color: var(--amber);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-align: right;
      cursor: pointer;
    }
    .location-pill:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    .location-pill img {
      width: 58px;
      height: 32px;
      border-radius: 5px;
      object-fit: cover;
      border: 1px solid var(--line-strong);
      flex: 0 0 auto;
    }
    .location-pill span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .terminal {
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      margin: 12px;
      border: 1px solid var(--line);
      background: rgba(13, 20, 15, 0.94);
      box-shadow: 0 18px 50px rgba(0,0,0,0.48), inset 0 0 0 1px rgba(255,255,255,0.018);
      overflow: hidden;
    }
    .room {
      grid-row: 1;
      min-width: 0;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(16, 25, 18, 0.98), rgba(11, 17, 12, 0.96));
    }
    #location-name {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .room-log-toggle {
      flex: 1 1 280px;
      min-width: 140px;
      max-width: min(620px, 54vw);
      border: 1px solid rgba(129, 255, 167, 0.24);
      border-radius: 4px;
      background: rgba(8, 20, 12, 0.62);
      color: var(--text);
      padding: 5px 8px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      text-align: left;
      font-size: 12px;
      line-height: 1.18;
    }
    .room-log-toggle[hidden] {
      display: none;
    }
    .room-log-toggle::after {
      content: "+";
      color: var(--green);
      font-weight: 900;
    }
    .room-log-toggle[aria-expanded="true"] {
      border-color: rgba(101, 230, 138, 0.58);
      background: rgba(16, 35, 20, 0.78);
    }
    .room-log-toggle[aria-expanded="true"]::after {
      content: "-";
    }
    .room-log-kicker {
      color: var(--amber);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .room-log-latest {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--dim);
    }
    .room-memory {
      margin-top: 8px;
      border-top: 1px solid rgba(129, 255, 167, 0.2);
      padding-top: 8px;
      display: grid;
      gap: 8px;
    }
    .room-memory[hidden] {
      display: none;
    }
    .shared-questions {
      margin-top: 9px;
      display: grid;
      gap: 7px;
    }
    .shared-questions[hidden] {
      display: none;
    }
    .shared-question {
      min-width: 0;
      border: 1px solid rgba(129, 255, 167, 0.22);
      border-radius: 8px;
      background: rgba(8, 19, 12, 0.72);
      padding: 9px 11px;
      color: var(--text);
    }
    .shared-question.completed-memory {
      border-color: rgba(226, 187, 121, 0.28);
      background: rgba(24, 19, 10, 0.66);
    }
    .story-front {
      border-color: rgba(226, 187, 121, 0.34);
      background:
        linear-gradient(110deg, rgba(45, 31, 13, 0.45), rgba(8, 19, 12, 0.76));
    }
    .story-front.persisted,
    .story-front.escalated {
      border-color: rgba(226, 187, 121, 0.5);
    }
    .story-front-stakes {
      margin-top: 8px;
      display: grid;
      gap: 5px;
    }
    .story-front-question,
    .story-front-reference,
    .story-front-outcome {
      margin: 0;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .story-front-question {
      color: var(--text);
      font-weight: 700;
    }
    .story-front-reference {
      margin-top: 8px;
      color: var(--dim);
    }
    .story-front-outcome {
      margin-top: 8px;
      border-top: 1px solid rgba(226, 187, 121, 0.2);
      padding-top: 7px;
      color: var(--amber);
      font-weight: 700;
    }
    .shared-question-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
      align-items: start;
    }
    .shared-question-kicker {
      color: var(--amber);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .shared-question h2 {
      margin: 2px 0 0;
      font: inherit;
      font-weight: 800;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .shared-question-progress {
      min-width: 4.5ch;
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }
    .shared-question-situation {
      margin-top: 5px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .shared-question details {
      margin-top: 7px;
      border-top: 1px solid rgba(129, 255, 167, 0.14);
      padding-top: 6px;
    }
    .shared-question summary {
      color: var(--green);
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }
    .shared-question-detail {
      margin-top: 7px;
      display: grid;
      gap: 6px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.35;
    }
    .shared-question-detail strong {
      color: var(--amber);
      font-size: 10px;
      text-transform: uppercase;
    }
    .shared-question-strategies,
    .shared-question-contributors {
      margin: 0;
      padding-left: 18px;
    }
    .shared-question-strategies li + li,
    .shared-question-contributors li + li {
      margin-top: 3px;
    }
    .shared-question-strategies .unavailable {
      color: var(--faint);
    }
    .shared-question-meters {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .shared-question-meter {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 8px;
      color: var(--dim);
      font-size: 11px;
    }
    .shared-question-meter strong {
      color: var(--amber);
      text-transform: uppercase;
    }
    .shared-question-meter-track {
      grid-column: 1 / -1;
      height: 5px;
      overflow: hidden;
      border: 1px solid rgba(129, 255, 167, 0.2);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.42);
    }
    .shared-question-meter-track span {
      display: block;
      width: var(--meter-fill);
      height: 100%;
      background: var(--green);
    }
    .shared-question-meter.danger .shared-question-meter-track span {
      background: var(--amber);
    }
    .shared-question-suggestions {
      margin: 8px 0 0;
      padding: 7px 0 0 18px;
      border-top: 1px solid rgba(129, 255, 167, 0.14);
      color: var(--dim);
      font-size: 11px;
      line-height: 1.35;
    }
    .shared-question-suggestions li + li {
      margin-top: 6px;
    }
    .shared-question-suggestions strong {
      color: var(--text);
    }
    .memory-summary {
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.34;
      overflow-wrap: anywhere;
    }
    .memory-summary::before {
      content: "summary ";
      color: var(--amber);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .memory-recent {
      display: grid;
      gap: 5px;
      min-width: 0;
    }
    .memory-entry {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(5ch, 8ch) minmax(0, 1fr);
      gap: 7px;
      align-items: start;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.25;
    }
    .memory-entry-label {
      min-width: 0;
      color: var(--amber);
      font-size: 10px;
      font-weight: 900;
      text-align: right;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .memory-entry-text {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--dim);
    }
    .memory-entry.chat .memory-entry-text {
      color: var(--text);
    }
    .room-copy {
      margin-top: 8px;
      color: var(--text);
      max-width: 980px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      white-space: nowrap;
    }
    .room.collapsed {
      padding-bottom: 0;
    }
    .room.collapsed .room-hero {
      margin-bottom: 0;
    }
    .room.collapsed .room-copy {
      margin-top: 6px;
    }
    .room-hero {
      position: relative;
      min-width: 0;
      height: clamp(118px, 24vh, 210px);
      margin: -14px -16px 12px;
      border-bottom: 1px solid rgba(239, 201, 107, 0.22);
      background: rgba(5, 8, 6, 0.68);
      overflow: hidden;
    }
    .room-hero img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      filter: saturate(0.94) contrast(1.02);
    }
    .room-hero-card {
      position: relative;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: zoom-in;
    }
    .room-hero-card:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: -4px;
    }
    .room-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(5, 8, 6, 0.08), rgba(5, 8, 6, 0.18) 43%, rgba(5, 8, 6, 0.78)),
        radial-gradient(circle at 18% 84%, rgba(101, 230, 138, 0.2), transparent 32%);
    }
    .pathway-stage {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      padding: 14px 18px 12px;
      pointer-events: none;
      color: #fff3d4;
      background:
        linear-gradient(180deg, rgba(5, 8, 6, 0.34), rgba(5, 8, 6, 0.2) 38%, rgba(5, 8, 6, 0.84)),
        radial-gradient(circle at 50% 62%, rgba(var(--type-travel-rgb), 0.16), transparent 48%);
    }
    .pathway-stage[hidden] { display: none; }
    .room-hero.pathway .room-hero-card { cursor: default; }
    .room-hero.pathway .room-hero-card img {
      filter: saturate(0.72) contrast(1.04) brightness(0.72);
      transform: scale(1.015);
    }
    .room-hero.pathway .room-avatar-rail { display: none; }
    .pathway-stage-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .pathway-stage-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }
    .pathway-stage-title strong {
      min-width: 0;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(16px, 2.4vw, 23px);
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pathway-stage-meta {
      min-width: 0;
      overflow: hidden;
      color: rgba(255, 243, 212, 0.7);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pathway-stage-progress {
      flex: 0 0 auto;
      color: rgba(255, 243, 212, 0.76);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pathway-track-wrap {
      position: relative;
      align-self: end;
      height: 52px;
      margin: 0 22px;
    }
    .pathway-track,
    .pathway-track-progress {
      position: absolute;
      left: 0;
      top: 29px;
      height: 4px;
      border-radius: 999px;
    }
    .pathway-track {
      right: 0;
      background: rgba(255, 243, 212, 0.28);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.42);
    }
    .pathway-track-progress {
      width: var(--pathway-position);
      background: var(--type-travel);
      box-shadow: 0 0 12px rgba(var(--type-travel-rgb), 0.48);
    }
    .pathway-track-point {
      position: absolute;
      left: var(--pathway-point);
      top: 25px;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 243, 212, 0.72);
      border-radius: 999px;
      background: #142019;
      transform: translateX(-50%);
    }
    .pathway-track-point.passed {
      border-color: var(--type-travel);
      background: var(--type-travel);
    }
    .pathway-avatar-position {
      position: absolute;
      left: var(--pathway-position);
      top: 0;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 3px solid #f4d77f;
      border-radius: 999px;
      background: #142019 center top / cover no-repeat;
      color: #142019;
      font-size: 12px;
      font-weight: 900;
      transform: translateX(-50%);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.48), 0 0 0 2px rgba(5, 8, 6, 0.58);
    }
    .pathway-directions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      color: rgba(255, 243, 212, 0.82);
      font-size: 12px;
      font-weight: 800;
    }
    .pathway-directions span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pathway-directions span:first-child::before { content: "← "; color: var(--type-travel); }
    .pathway-directions span:last-child { text-align: right; }
    .pathway-directions span:last-child::after { content: " →"; color: var(--type-travel); }
    .room-avatar-rail {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-width: thin;
      pointer-events: auto;
    }
    .room-avatar-rail:empty {
      display: none;
    }
    .room-hero.has-rescue-row .room-avatar-rail {
      bottom: 40px;
    }
    .room-hero.spatial {
      height: clamp(210px, 36vh, 330px);
      background:
        radial-gradient(circle at 50% 92%, rgba(204, 159, 65, 0.13), transparent 38%),
        linear-gradient(180deg, #091210, #050908);
    }
    .room-hero.spatial .room-hero-card {
      display: none;
    }
    .spatial-stage {
      position: absolute;
      inset: 0;
      z-index: 1;
      color: #f8edcf;
    }
    .spatial-stage[hidden] { display: none; }
    .spatial-stage svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }
    .spatial-link {
      stroke: rgba(186, 224, 207, 0.2);
      stroke-width: 8;
      stroke-linecap: round;
    }
    .spatial-tile {
      stroke: rgba(244, 226, 176, 0.23);
      stroke-width: 1.5;
    }
    .spatial-tile.entry { fill: #344a3d; }
    .spatial-tile.feature { fill: #755e2d; }
    .spatial-tile.crossing { fill: #504a3b; }
    .spatial-tile.exit { fill: #3d534e; }
    .spatial-tile.ground { fill: #314039; }
    .spatial-site-label {
      fill: rgba(248, 237, 207, 0.72);
      font: 600 11px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.03em;
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(4, 8, 7, 0.92);
      stroke-width: 3px;
    }
    .spatial-token .token-disc {
      fill: #d9e6dc;
      stroke: #102019;
      stroke-width: 3;
    }
    .spatial-token.viewer .token-disc { fill: #f4d77f; }
    .spatial-token.hostile .token-disc { fill: #b96358; }
    .spatial-token.feature .token-disc { fill: #d5ad42; }
    .spatial-token .token-mark {
      fill: #0b1410;

    /* Art that has not been generated yet. The image itself already falls back
       to the authored placeholder; this marks it as pending rather than final
       so it never reads as finished art. See issue #476. */

    .action-art:has(img[data-art-missing="true"])::after {

      right: 0;
      bottom: 0;
      padding: 4px 8px;
      background: rgba(5, 12, 7, 0.82);

        grid-template-columns: auto auto minmax(0, 1fr);

    /* The room is chat-first. Everything explanatory lives in one quiet Journal. */
    .terminal {
      grid-template-rows: auto minmax(0, 1fr);
    }
    .log {
      grid-row: 2;
    }
    .room-log-toggle {
      flex: 0 0 auto;
      min-width: auto;
      min-height: 44px;
      max-width: none;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--dim);
      padding: 3px 1px 2px;
      display: inline-flex;
      align-items: center;
      font: inherit;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.02em;
      text-transform: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .room-log-toggle[hidden] {
      display: none;
    }
    .room-log-toggle::after {
      content: "";
    }
    .room-log-toggle[aria-expanded="true"]::after {
      content: "";
    }
    .room-log-toggle:hover,
    .room-log-toggle:focus-visible,
    .room-log-toggle[aria-expanded="true"] {
      border-bottom-color: var(--amber);
      background: transparent;
      color: var(--amber);
      outline: 0;
    }
    .room-log-kicker {
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-transform: none;
    }
    .room-log-latest {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      padding: 4px 1px 5px;
      white-space: nowrap;
      color: var(--faint);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
      text-align: left;
      cursor: pointer;
    }
    .room-log-latest.is-overflowing {
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8px, #000 calc(100% - 12px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8px, #000 calc(100% - 12px), transparent);
    }
    .room-log-latest[hidden] {
      display: none;
    }
    .room-log-latest-track {
      display: block;
      width: max-content;
      min-width: 100%;
      overflow: visible;
      text-overflow: clip;
    }
    .room-log-latest.is-overflowing .room-log-latest-track {
      animation: room-log-scroll var(--room-log-duration, 12s) ease-in-out 1.2s infinite alternate;
    }
    .room-log-latest:hover,
    .room-log-latest:focus-visible {
      border-bottom-color: var(--line-strong);
      color: var(--dim);
      outline: 0;
    }
    .room-log-latest:hover .room-log-latest-track,
    .room-log-latest:focus-visible .room-log-latest-track {
      animation-play-state: paused;
    }
    @keyframes room-log-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-1 * var(--room-log-overflow, 0px))); }
    }
    @media (prefers-reduced-motion: reduce) {
      .room-log-latest.is-overflowing {
        -webkit-mask-image: none;
        mask-image: none;
      }
      .room-log-latest-track,
      .room-log-latest.is-overflowing .room-log-latest-track {
        width: 100%;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        animation: none;
        transform: none;
      }
    }
    .journal-view {

    .journal-activity-row-text {

    .journal-progress-segments {

  <script>
    const avatarGateVersion = "2";
    const actorSessionExpiryStorageKey = "cosyworld.actorSessionExpiresAtUnix";

    const walletRequestTimeoutMs = 20000;
    const presenceHeartbeatMs = 60000;
    const authoredCallingChoices = [
      {
        label: "odd jobs",

        label: "lost property",

    ];

    function authoredAbilityChoice(value) {
      const normalized = String(value || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
      return authoredAbilityChoices.find((choice) => (
        choice.id === normalized
        || choice.label.toLowerCase().replace(/[^a-z0-9]+/g, "_") === normalized
      )) || null;
    }

    function abilityLabel(value, fallback = "an ability") {
      return authoredAbilityChoice(value)?.label || String(value || fallback);
    }
    const actionCardSuits = ["head", "heart", "honor", "hustle"];
    const actionCardSuitEmojis = {
      head: "🧠",

      honor: "🛡️",

    const actionCardSuitClasses = actionCardSuits.map((suit) => `suit-${suit}`);
    const actionCardAccentClasses = [...actionCardSuitClasses, "card-control"];
    const bootParams = new URLSearchParams(window.location.search);

        return stored && typeof stored === "object" ? stored : null;
      } catch {
        return null;
      }
    }

    function saveDefeatTransition() {
      try {
        if (defeatTransition) {
          sessionStorage.setItem(defeatTransitionStorageKey, JSON.stringify(defeatTransition));
        } else {
          sessionStorage.removeItem(defeatTransitionStorageKey);
        }
      } catch {
        // The transition remains visible for this page even when storage is unavailable.
      }
    }

    function clearDefeatTransition() {
      defeatTransition = null;
      saveDefeatTransition();
    }

    function captureDefeatTransition(event) {
      if (
        !["combat.knockout", "combat.death"].includes(String(event?.type || ""))
        || !actorId
        || Number(event.target_actor_id || 0) !== Number(actorId)
      ) return false;
      const defeated = actorForId(actorId);
      defeatTransition = {
        actorName: event.target_actor_name || defeated?.name || "Your avatar",
        opponentName: event.actor_name || "the danger",
        kind: String(event.type || ""),
        eventSeq: Number(event.seq || 0),
      };
      saveDefeatTransition();
      return true;
    }

    function setModalBackgroundInert(inert) {
      const shell = document.querySelector(".shell");
      if (inert) shell?.setAttribute("inert", "");
      else shell?.removeAttribute("inert");
    }

    function activeModal() {
      return ["wallet-modal", "action-modal", "card-modal"]
        .map((id) => $(id))
        .find((modal) => modal && !modal.hidden) || null;
    }

    function openModal(modalId, preferredFocus, shouldFocus = true) {
      const modal = $(modalId);
      if (!modal) return;
      if (modal.hidden) {
        const active = document.activeElement;
        modalReturnFocus.set(modalId, active instanceof HTMLElement ? active : null);
      }
      modal.hidden = false;
      setModalBackgroundInert(true);
      if (!shouldFocus) return;
      window.requestAnimationFrame(() => {
        if (modal.hidden) return;
        const target = preferredFocus || modal.querySelector("[autofocus], button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])") || modal.querySelector("[role='dialog']");
        target?.focus?.();
      });
    }

    function closeModal(modalId) {
      const modal = $(modalId);
      if (!modal || modal.hidden) return;
      modal.hidden = true;
      if (!activeModal()) setModalBackgroundInert(false);
      const returnTarget = modalReturnFocus.get(modalId);
      modalReturnFocus.delete(modalId);
      window.requestAnimationFrame(() => {
        if (returnTarget?.isConnected && !returnTarget.closest("[inert]")) returnTarget.focus();
        if (!activeModal()) {
          scheduleVisibleWorldBeatReceipts();
          scheduleVisibleClockPresentationReceipts();
        }
      });
    }

    function trapModalFocus(event, modal) {
      if (event.key !== "Tab" || !modal) return false;
      const focusable = [...modal.querySelectorAll("button:not([disabled]), summary, [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])")]
        .filter((node) => !node.hidden && node.getAttribute("aria-hidden") !== "true" && node.getClientRects().length > 0);
      const dialog = modal.querySelector("[role='dialog']");
      if (!focusable.length) {
        event.preventDefault();
        dialog?.focus();
        return true;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      const current = document.activeElement;
      if (!modal.contains(current) || (event.shiftKey && current === first) || (!event.shiftKey && current === last)) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus();
      }
      return true;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const payload = await response.json().catch(() => null);
      if (!response.ok) {
        const error = new Error(payload?.error || payload?.error_code || `${response.status} ${response.statusText}`);
        error.status = response.status;
        error.payload = payload && typeof payload === "object"
          ? { ...payload, status: Number(payload.status || response.status) }
          : { ok: false, status: response.status, events: [] };
        throw error;
      }
      return payload;
    }

    async function post(path, payload) {
      return api(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(payload),
      });
    }

    async function postResult(path, payload) {
      try {
        return await post(path, payload);
      } catch (error) {
        if (error?.payload && typeof error.payload === "object" && Number(error.status || 0)) {
          return error.payload;
        }
        throw error;
      }
    }

    function loadOpenRouterConnection() {
      try {
        return JSON.parse(localStorage.getItem(openRouterConnectionStorage) || "null");
      } catch {
        return null;
      }
    }

    function openRouterApiKey() {
      try {
        return localStorage.getItem(openRouterApiKeyStorage) || "";
      } catch {
        return "";
      }
    }

    function saveOpenRouterConnection(connection, apiKey) {
      localStorage.setItem(openRouterApiKeyStorage, apiKey);
      localStorage.setItem(openRouterConnectionStorage, JSON.stringify({
        connected: true,
        provider: "openrouter",
        label: connection?.label || "OpenRouter",
        limit_remaining_usd: connection?.limit_remaining_usd ?? null,
        usage_daily_usd: connection?.usage_daily_usd ?? null,
        cosyworld_user_id: identity?.user_id || "",
        verified_at: Date.now(),
      }));
      openRouterConnection = loadOpenRouterConnection();
    }

    function clearOpenRouterConnection() {
      localStorage.removeItem(openRouterApiKeyStorage);
      localStorage.removeItem(openRouterConnectionStorage);
      sessionStorage.removeItem(openRouterOauthVerifierStorage);
      openRouterConnection = null;
    }

    async function openRouterCodeChallenge(verifier) {
      const digest = await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(verifier),
      );
      return bytesToBase64Url(digest);
    }

    async function startOpenRouterConnection() {
      if (!identity?.authenticated) throw new Error("Sign in with a passkey before connecting OpenRouter.");
      if (!crypto?.subtle || !crypto?.getRandomValues) {
        throw new Error("This browser cannot create a secure OpenRouter connection.");
      }
      const verifier = bytesToBase64Url(crypto.getRandomValues(new Uint8Array(64)));
      const challenge = await openRouterCodeChallenge(verifier);
      sessionStorage.setItem(openRouterOauthVerifierStorage, verifier);
      const callbackUrl = `${window.location.origin}${window.location.pathname}`;
      const authorization = new URL("https://openrouter.ai/auth");
      authorization.searchParams.set("callback_url", callbackUrl);
      authorization.searchParams.set("code_challenge", challenge);
      authorization.searchParams.set("code_challenge_method", "S256");
      authorization.searchParams.set("key_label", "CosyWorld");
      window.location.assign(authorization.toString());
    }

    async function completeOpenRouterConnection() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code") || "";
      const verifier = sessionStorage.getItem(openRouterOauthVerifierStorage) || "";
      if (!code || !verifier) return false;
      params.delete("code");
      const cleanQuery = params.toString();
      window.history.replaceState({}, "", `${window.location.pathname}${cleanQuery ? `?${cleanQuery}` : ""}${window.location.hash}`);
      sessionStorage.removeItem(openRouterOauthVerifierStorage);
      const connected = await post("/ai/openrouter/exchange", {
        code,
        code_verifier: verifier,
      });
      if (!connected?.ok || !connected?.api_key) {
        throw new Error("OpenRouter connection could not be completed.");
      }
      saveOpenRouterConnection(connected, connected.api_key);
      setStatus("OpenRouter connected for public model interactions.", "ok");
      return true;
    }

    async function refreshOpenRouterConnection() {
      const apiKey = openRouterApiKey();
      if (!apiKey || !identity?.authenticated) return false;
      if (openRouterConnection?.cosyworld_user_id
          && openRouterConnection.cosyworld_user_id !== identity.user_id) {
        clearOpenRouterConnection();
        return false;
      }
      const connection = await post("/ai/openrouter/verify", { api_key: apiKey });
      if (!connection?.connected) throw new Error("OpenRouter connection is no longer available.");
      saveOpenRouterConnection(connection, apiKey);
      return true;
    }

    async function disconnectOpenRouter() {
      try {
        if (identity?.authenticated) await post("/ai/openrouter/disconnect", {});
      } finally {
        clearOpenRouterConnection();
      }
    }

    function base64UrlToBytes(value) {
      const normalized = String(value || "").replaceAll("-", "+").replaceAll("_", "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      return Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
    }

    function bytesToBase64Url(value) {
      const bytes = new Uint8Array(value || []);
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary).replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");
    }

    function creationOptionsFromJson(value) {
      const options = value?.publicKey || value;
      if (window.PublicKeyCredential?.parseCreationOptionsFromJSON) {
        return PublicKeyCredential.parseCreationOptionsFromJSON(options);
      }
      return {
        ...options,
        challenge: base64UrlToBytes(options.challenge),
        user: { ...options.user, id: base64UrlToBytes(options.user.id) },
        excludeCredentials: (options.excludeCredentials || []).map((entry) => ({
          ...entry,
          id: base64UrlToBytes(entry.id),
        })),
      };
    }

    function requestOptionsFromJson(value) {
      const options = value?.publicKey || value;
      if (window.PublicKeyCredential?.parseRequestOptionsFromJSON) {
        return PublicKeyCredential.parseRequestOptionsFromJSON(options);
      }
      return {
        ...options,
        challenge: base64UrlToBytes(options.challenge),
        allowCredentials: (options.allowCredentials || []).map((entry) => ({
          ...entry,
          id: base64UrlToBytes(entry.id),
        })),
      };
    }

    function credentialToJson(credential) {
      if (typeof credential?.toJSON === "function") return credential.toJSON();
      const response = credential.response || {};
      const registration = "attestationObject" in response;
      return {
        id: credential.id,
        rawId: bytesToBase64Url(credential.rawId),
        type: credential.type,
        authenticatorAttachment: credential.authenticatorAttachment || undefined,
        clientExtensionResults: credential.getClientExtensionResults?.() || {},
        response: registration
          ? {
              attestationObject: bytesToBase64Url(response.attestationObject),
              clientDataJSON: bytesToBase64Url(response.clientDataJSON),
              transports: response.getTransports?.() || [],
            }
          : {
              authenticatorData: bytesToBase64Url(response.authenticatorData),
              clientDataJSON: bytesToBase64Url(response.clientDataJSON),
              signature: bytesToBase64Url(response.signature),
              userHandle: response.userHandle ? bytesToBase64Url(response.userHandle) : null,
            },
      };
    }

    function applyIdentity(nextIdentity) {
      identity = nextIdentity || { authenticated: false, wallets: [], passkeys: [] };
      if (identity.authenticated) {
        passkeyRecoveryAvailable = false;
        walletAddress = identity.active_wallet || "";
        walletSession = identity.wallet_session || "";
        localStorage.removeItem("cosyworld.walletSession");
        if (walletAddress) localStorage.setItem("cosyworld.wallet", walletAddress);
      }
      return identity;
    }

    async function loadIdentity() {
      try {
        const nextIdentity = await api("/auth/account");
        const preferredWallet = localStorage.getItem("cosyworld.wallet") || "";
        const canRestorePreference = nextIdentity?.authenticated
          && preferredWallet
          && preferredWallet !== nextIdentity.active_wallet
          && (nextIdentity.wallets || []).some((entry) => entry.wallet_address === preferredWallet);
        return applyIdentity(canRestorePreference
          ? await post("/auth/wallets/select", { wallet_address: preferredWallet })
          : nextIdentity);
      } catch (error) {
        identity = { authenticated: false, wallets: [], passkeys: [], error: String(error.message || error) };
        return identity;
      }
    }

    async function registerPasskey(additional = false) {
      if (!window.PublicKeyCredential || !navigator.credentials?.create) {
        throw new Error("Passkeys are not supported by this browser.");
      }
      const username = additional ? (identity?.username || "") : "";
      const displayName = additional ? (identity?.display_name || username) : "";
      const started = await post("/auth/passkey/register/start", {
        username,
        display_name: displayName,
        wallet_session: identity?.authenticated ? null : (walletSession || null),
      });
      if (!started.ok) throw new Error(started.error || "Passkey registration could not start.");
      const credential = await navigator.credentials.create({
        publicKey: creationOptionsFromJson(started.public_key),
      });
      if (!credential) throw new Error("Passkey registration was cancelled.");
      const finished = await post("/auth/passkey/register/finish", {
        ceremony_id: started.ceremony_id,
        credential: credentialToJson(credential),
      });
      if (!finished.ok) throw new Error(finished.error || "Passkey registration failed.");
      applyIdentity(finished);
      await refresh();
      connectStream();
    }

    async function loginWithPasskey() {
      if (!window.PublicKeyCredential || !navigator.credentials?.get) {
        throw new Error("Passkeys are not supported by this browser.");
      }
      const started = await post("/auth/passkey/login/start", { username: "" });
      if (!started.ok) throw new Error(started.error || "Passkey sign-in could not start.");
      const credential = await navigator.credentials.get({
        publicKey: requestOptionsFromJson(started.public_key),
      });
      if (!credential) throw new Error("Passkey sign-in was cancelled.");
      const finished = await post("/auth/passkey/login/finish", {
        ceremony_id: started.ceremony_id,
        credential: credentialToJson(credential),
      });
      if (!finished.ok) throw new Error(finished.error || "Passkey sign-in failed.");
      applyIdentity(finished);
      await refresh();
      connectStream();
    }

    function passkeyServerRecordIsMissing(error) {
      return Number(error?.status || 0) === 401
        && String(error?.message || "") === "passkey sign-in was not accepted";
    }

    async function continueWithPasskey() {
      try {
        await loginWithPasskey();
      } catch (error) {
        if (String(error?.name || "") === "NotAllowedError") {
          await registerPasskey(false);
          return;
        }
        if (passkeyServerRecordIsMissing(error)) {
          passkeyRecoveryAvailable = true;
          setStatus("This passkey's server record is missing. Choose a recovery option below.", "notice");
          return false;
        }
        throw error;
      }
    }

    async function recoverWithReplacementPasskey() {
      await registerPasskey(false);
      passkeyRecoveryAvailable = false;
    }

      applyIdentity(await post("/auth/logout", {}));
      clearOpenRouterConnection();
      walletAddress = "";
      walletSession = "";

    async function runIdentityTask(label, task) {
      setError("");
      setStatus(label, "ok");
      try {
        const result = await task();

    function rememberActorSession(response, { allowHandoff = false } = {}) {
      const nextActorId = Number(response?.actor?.id || 0);
      const nextSession = String(response?.actor_session || "");
      const currentActorId = Number(actorId);
      const handoffFromActorId = Number(response?.previous_actor_id || 0);
      const canAdoptHandoff = allowHandoff
        && Boolean(response?.handoff)
        && handoffFromActorId === currentActorId
        && nextActorId !== currentActorId;
      if (
        !nextActorId
        || (nextActorId !== currentActorId && !canAdoptHandoff)
        || !nextSession
      ) return false;
      actorId = nextActorId;
      actorSession = nextSession;
      actorSessionExpiresAtUnix = Math.max(
        0,
        Number(response?.actor_session_expires_at_unix || 0),
      );
      actorSessionTerminal = false;
      localStorage.setItem("cosyworld.actorId", String(actorId));
      localStorage.setItem("cosyworld.actorSession", actorSession);
      localStorage.setItem("cosyworld.avatarGateVersion", avatarGateVersion);
      if (actorSessionExpiresAtUnix) {
        localStorage.setItem(actorSessionExpiryStorageKey, String(actorSessionExpiresAtUnix));
      } else {
        localStorage.removeItem(actorSessionExpiryStorageKey);
      }
      return true;
    }

    async function renewActorSession({ rotate = false } = {}) {
      if (!actorId) return { ok: false, renewed: false, status: 400 };
      if (actorSessionRenewalInFlight) return actorSessionRenewalInFlight;
      const requestedActorId = Number(actorId);
      actorSessionRenewalInFlight = (async () => {
        const result = await postResult("/avatar/session", {
          actor_id: requestedActorId,
          ...(actorSession ? { actor_session: actorSession } : {}),
          ...(walletSession ? { wallet_session: walletSession } : {}),
          rotate,
        });
        if (requestedActorId !== Number(actorId)) {
          return { ok: false, renewed: false, status: 409 };
        }
        if (!result.ok) {
          if (Number(result.status || 0) === 409) actorSessionTerminal = true;
          return { ok: false, renewed: false, status: Number(result.status || 0) };
        }
        const handoff = Boolean(result?.handoff)
          && Number(result?.previous_actor_id || 0) === requestedActorId;
        if (!rememberActorSession(result, { allowHandoff: handoff })) {
          return { ok: false, renewed: false, status: 409 };
        }
        if ((result.renewed || handoff) && stream) connectStream();
        return {
          ok: true,
          renewed: Boolean(result.renewed),
          handoff,
          status: Number(result.status || 0),
        };
      })();
      try {
        return await actorSessionRenewalInFlight;
      } finally {
        actorSessionRenewalInFlight = null;
      }
    }

    async function rotateActorSessionIfNeeded() {
      if (!actorId) return;
      if (!actorSessionHandoffChecked) {
        const checked = await renewActorSession();
        if (checked.ok || [403, 409].includes(Number(checked.status || 0))) {
          actorSessionHandoffChecked = true;
        }
        if (checked.handoff || !actorId) return;
      }
      const now = Math.floor(Date.now() / 1000);
      if (
        actorSession
        && actorSessionExpiresAtUnix > now + actorSessionRenewalWindowSeconds
      ) return;
      await renewActorSession({ rotate: true });
    }

    async function createAvatar(selection = null) {
      const profile = selection?.profileId
        ? (state?.character_creation || [])
          .find((candidate) => candidate.id === selection.profileId) || null
        : null;
      const choiceId = selection?.choiceId || profile?.default_choice_id || null;
      const creationPayload = profile
        ? {
            character_creation_id: selection?.profileId || profile.id,
            ...(profile.schema_version === 2
              ? {
                  species_id: selection?.speciesId || profile.default_species_id,
                  origin_id: selection?.originId || profile.default_origin_id,
                }
              : { character_choice_id: choiceId }),
          }
        : { calling: selection?.calling || authoredCallingChoices[0].statement };
      const summonFromActorId = Number(selection?.summonFromActorId || 0);
      const payload = {
        ...creationPayload,
        ...(summonFromActorId ? { summon_from_actor_id: summonFromActorId } : {}),
      };
      const avatar = await post("/avatar", withAccess(payload));
      if (!avatar.ok || !avatar.actor?.id || !avatar.actor_session) {
        throw new Error(avatarFailureMessage(avatar));
      }
      actorId = avatar.actor.id;
      if (!rememberActorSession(avatar)) throw new Error("The avatar session could not be stored safely.");
      clearDefeatTransition();
      pushEvents(avatar.events || []);
      await pingPresence();
      handKeys = [];
      discardedHandKeys = [];
      handCompositionSignature = "";
      focusIndex = 0;
      focusedKey = "";
      playerPromotedHandKey = "";
      await refresh();
      connectStream();
    }

    async function chooseAvatarClass(selection) {
      const result = await post("/avatar/class", withAccess({
        actor_id: actorId,
        character_creation_id: selection.profileId,
        class_id: selection.classId,
      }));
      if (!result.ok) throw new Error(actionFailureMessage(result, "That class is not ready yet."));
      pushEvents(result.events || []);
      await refresh();
      return result;
    }

    async function requestDevResetIfNeeded() {
      if (!wantsReset) return;
      try {
        await post("/dev/reset", {});
      } catch {
        // The reset endpoint is dev-gated; clearing the local avatar is still useful.
      }
      bootParams.delete("reset");
      const qs = bootParams.toString();
      window.history.replaceState(null, "", `${window.location.pathname}${qs ? `?${qs}` : ""}`);
    }

    async function refresh() {
      const attemptId = ++refreshAttemptId;
      const previousLocationId = state?.location?.id || null;
      const wasTired = actorIsTired(state);
      const requestedActorId = actorId;
      await rotateActorSessionIfNeeded();
      const historyWasNeeded = !roomHistoryHydrated
        || pendingModelInteractionRehydrationRequired;
      let recentEventsRequest = historyWasNeeded ? fetchRecentEvents() : null;
      let stateRequest = api(statePath());
      const contentPacksRequest = ensureContentPacks().catch(() => null);
      let nextState = await stateRequest;
      if (requestedActorId !== actorId) return;
      if (actorId && nextState.primary_action?.kind === "create_avatar") {
        const recovery = await renewActorSession();
        if (recovery.ok && recovery.renewed) {
          stateRequest = api(statePath());
          if (historyWasNeeded) recentEventsRequest = fetchRecentEvents();
          nextState = await stateRequest;
        }
      } else if (actorId) {
        actorSessionTerminal = false;
      }
      await contentPacksRequest;
      const timelineRewound = transcriptTimelineRewound(nextState);
      state = nextState;
      const nextHandCompositionSignature = authoritativeHandSignature(state);
      if (nextHandCompositionSignature !== handCompositionSignature) {
        handKeys = [];
        discardedHandKeys = [];
        handCompositionSignature = nextHandCompositionSignature;
        handDealNonce += 1;
        playerPromotedHandKey = "";
        handCompositionSignature = nextHandCompositionSignature;
      }
      const locationChanged = previousLocationId && previousLocationId !== state.location?.id;
      if (historyWasNeeded || locationChanged || timelineRewound
          || pendingModelInteractionRehydrationRequired) {
        const replay = recentEventsRequest
          ? await recentEventsRequest
          : await fetchRecentEvents();
        rebuildLogFromAuthoritativeEvents(replay?.events || []);
      }
      if (locationChanged) {
        handKeys = [];
        discardedHandKeys = [];
        focusIndex = 0;
        focusedKey = "";
        playerPromotedHandKey = "";
        connectStream();
      }
      const isTired = actorIsTired(state);
      if (!isTired) recoveryPromptPending = false;
      else if (!wasTired || locationChanged) recoveryPromptPending = true;
      actions = buildActions(state);
      if (recoveryPromptPending) {
        const prompted = promotePendingRecoveryAction();
        if (prompted || actions.some((action) => action.focusKey === "rest")) {
          recoveryPromptPending = false;
        }
      }
      reconcileHand();
      restoreFocusedAction();
      render();
      syncOpenCardModal();
      if (recoveryRefreshAttemptId && attemptId >= recoveryRefreshAttemptId) {
        recoveryRefreshAttemptId = 0;
        clearTransientStatus("refresh");
      }
    }

    function queueRefresh() {
      if (refreshInFlight) {
        refreshQueued = true;
        return refreshInFlight;
      }
      refreshInFlight = refresh()
        .catch((error) => {
          if (!recoveryRefreshAttemptId) {
            setError(refreshExceptionMessage(error));
          } else if (refreshAttemptId >= recoveryRefreshAttemptId) {
            setTransientStatus(
              "refresh",
              "The room could not catch up. Check your connection and reload to try again.",
            );
          }
        })
        .finally(() => {
          refreshInFlight = null;
          if (refreshQueued) {
            refreshQueued = false;
            queueRefresh();
          }
        });
      return refreshInFlight;
    }

    function requestParams() {
      const params = new URLSearchParams();
      if (actorId) params.set("actor_id", String(actorId));
      if (actorSession) params.set("actor_session", actorSession);
      if (walletSession) params.set("wallet_session", walletSession);
      return params;
    }

    function statePath() {
      const params = requestParams();
      const qs = params.toString();
      return `/state${qs ? `?${qs}` : ""}`;
    }

    function eventsPath(limit = 80) {
      const params = requestParams();
      params.set("limit", String(limit));
      return `/events?${params.toString()}`;
    }

    async function fetchRecentEvents() {
      const replay = await api(eventsPath());
      if (!replay || !Array.isArray(replay.events)) {
        throw new Error("Room history received an invalid /events response.");
      }
      if (Number.isSafeInteger(replay.next_after)) {

    async function exportJournal() {
      const params = requestParams();
      params.set("limit", "500");
      let after = 0;
      let caughtUp = false;
      const events = [];
      while (!caughtUp) {
        const pageParams = new URLSearchParams(params);
        pageParams.set("after", String(after));
        const page = await api(`/events?${pageParams.toString()}`);
        if (!page || !Array.isArray(page.events) || !Number.isSafeInteger(page.next_after) || typeof page.caught_up !== "boolean") {
          throw new Error("Journal export received an invalid /events response.");
        }
        events.push(...page.events);
        caughtUp = page.caught_up;
        if (!caughtUp) {
          if (page.next_after <= after) {
            throw new Error("Journal export could not advance through the event history.");
          }
          after = page.next_after;
        }
      }
      const payload = {
        format: "cosyworld.journal/1",
        exported_at: new Date().toISOString(),
        actor_id: actorId || null,
        worldpack_bundle_hash: contentPacks?.bundle_hash || null,
        events,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `cosyworld-journal-${actorId || "visitor"}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus("Journal exported.", "ok");
    }

    function latestSeenSeq() {
      let latest = streamReplayFloorSeq;
      for (const seq of seenSeq) {
        latest = Math.max(latest, Number(seq) || 0);

    function withTimeout(promise, ms, message) {
      return new Promise((resolve, reject) => {
        const timer = window.setTimeout(() => reject(new Error(message)), ms);
        Promise.resolve(promise)
          .then((value) => {
            window.clearTimeout(timer);
            resolve(value);
          })
          .catch((error) => {
            window.clearTimeout(timer);
            reject(error);
          });
      });
    }

    function normalizeModelInteractionProfile(value) {
      const normalized = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
      if (normalized === "illustrate" || normalized === "image" || normalized.startsWith("illustrate_")) return "image";
      if (normalized === "find_resonance" || normalized === "embeddings" || normalized.startsWith("find_resonance_")) return "embeddings";
      if (normalized === "rank_echoes" || normalized === "rerank" || normalized.startsWith("rank_echoes_")) return "rerank";
      if (normalized === "speak" || normalized === "speech" || normalized.startsWith("speak_")) return "speech";

        if (authoredIntention) {
          const exactProfile = normalizeModelInteractionProfile(authoredIntention);
          return modelInteractionPresentations[exactProfile || "generic"];
        }
        const explicitProfile = normalizeModelInteractionProfile(source.modelInteractionProfile || source.profile);
        if (explicitProfile) return modelInteractionPresentations[explicitProfile];
        for (const fallback of [source.verb, source.label, source.command]) {
          const fallbackProfile = normalizeModelInteractionProfile(fallback);
          if (fallbackProfile) return modelInteractionPresentations[fallbackProfile];

        return modelInteractionPresentations.generic;

      return modelInteractionPresentations[profile || "generic"];

    function mergeDuplicateUseCards(builtActions) {
      const uses = builtActions.filter((action) => (
        action?.offerKinds?.includes("use_item")
          || action?.offerKinds?.includes("use_feature")
      ));
      if (uses.length <= 1) return;

      const modes = [];
      uses.forEach((source, sourceIndex) => {
        const sourceChoices = Array.isArray(source.choices) && source.choices.length
          ? source.choices
          : [null];
        sourceChoices.forEach((choice, choiceIndex) => {
          const rawDetail = String(choice?.detail || source.detail || "").trim();
          const itemName = String(source.itemName || rawDetail.split("·")[0].split(/\s+(?:with|on)\s+/i)[0] || "item").trim();
          const feature = source.useChoiceKind === "feature";
          const targetLabel = String(choice?.label || source.targetName || "you").trim();
          const label = feature
            ? `with ${source.featureName || String(source.detail || "the room").split(/\s+with\s+/i).at(-1)}`
            : `help ${targetLabel.toLowerCase() === "you" ? "you" : targetLabel}`;
          const detail = feature
            ? [itemName, friendlyActionText(source.effect)].filter(Boolean).join(" · ")
            : (rawDetail || [itemName, friendlyActionText(source.effect)].filter(Boolean).join(" · "));
          modes.push({
            key: `mode:${sourceIndex}:${choiceIndex}:${choice?.value || source.focusKey || source.command || "use"}`,
            label,
            detail,
            itemName,
            card: choice?.card || source.card,
            source,
            choiceValue: choice?.value,
            focusKeys: [source.focusKey, ...(source.focusKeys || [])].filter(Boolean),
            priority: Number.isFinite(Number(source.priority)) ? Number(source.priority) : actionRank(source),
          });
        });
      });
      modes.sort((left, right) => left.priority - right.priority || left.label.localeCompare(right.label));
      const first = modes[0];
      const itemNames = [...new Set(modes.map((mode) => mode.itemName).filter(Boolean))];
      const sameItem = itemNames.length === 1;
      const selectMode = (mode) => {
        if (mode?.choiceValue !== undefined && mode?.choiceValue !== null) {
          mode.source.selectedChoice = mode.choiceValue;
        }
        return mode;
      };
      const merged = {
        offerKinds: [...new Set(uses.flatMap((action) => action.offerKinds || []))],
        handProvider: uses.find((action) => action.handProvider)?.handProvider || null,
        offerRank: Math.min(...uses.map((action) => Number(action.offerRank)).filter(Number.isFinite)),
        label: "use",
        detail: sameItem ? `${itemNames[0]} · choose how` : "choose what to use",
        command: "use",
        focusKey: `use:${modes.map((mode) => mode.key).join("|")}`,
        focusKeys: [...new Set(modes.flatMap((mode) => mode.focusKeys))],
        card: first.card,
        shape: "item",
        useChoiceKind: "mixed",
        itemName: sameItem ? itemNames[0] : "",
        priority: Math.min(...modes.map((mode) => mode.priority)),
        modalTitle: sameItem ? `choose how to use ${itemNames[0]}` : "choose what to use",
        modalSummary: sameItem
          ? `Choose what ${itemNames[0]} should do here.`
          : "Choose an item and how to use it.",
        effect: "the use you choose changes the scene",
        choices: modes.map((mode) => ({
          label: mode.label,
          detail: mode.detail,
          value: mode.key,
          card: mode.card,
        })),
        selectedChoice: first.key,
        targetActorChoices: Object.fromEntries(modes
          .filter((mode) => Number(mode.source?.targetActorId || 0) > 0)
          .map((mode) => [String(mode.source.targetActorId), mode.key])),
      };
      merged.selectedMode = () => selectMode(
        modes.find((mode) => mode.key === merged.selectedChoice) || first,
      );
      merged.selectedPayload = () => {
        const mode = merged.selectedMode();
        return mode.source.selectedPayload?.() || { command: mode.source.command };
      };
      merged.run = () => {
        const mode = merged.selectedMode();
        return mode.source.run();
      };

      for (let index = builtActions.length - 1; index >= 0; index -= 1) {
        if (uses.includes(builtActions[index])) builtActions.splice(index, 1);
      }
      builtActions.push(merged);
    }

    function turnPingPillHtml(turn = state?.turn, combat = state?.combat) {
      if (!turn?.enabled) return "";
      const currentName = turn.current_actor_name || combat?.current_actor_name || "the current player";
      // scene-turn is the ordered-combat protocol identity even when the
      // adjacent combat projection has not arrived yet.
      const combatCopy = Boolean(combat || turn.policy === "scene-turn");
      const copy = combatCopy
        ? (turn.is_current_actor ? "ordered combat — your turn" : `ordered combat — ${currentName} acts now`)
        : (turn.is_current_actor ? "ordered scene — your turn" : `ordered scene — ${currentName} acts now`);
      const grace = Math.round(Number(turn.grace_period_ms || 0) / 1000);
      // Urgency carries a glyph and distinct wording, never colour alone.
      const mark = turn.is_current_actor
        ? `<span class="turn-ping-mark" aria-hidden="true">&#9654;</span>`
        : "";
      return `${mark}<span class="turn-ping-copy">${escapeHtml(copy)}</span>${grace > 0 ? `<span class="turn-ping-time" aria-hidden="true">${escapeHtml(`${grace}s grace`)}</span>` : ""}`;
    }

    function turnBannerControlSpecs(turn = state?.turn) {
      if (!turn?.enabled || turn?.policy !== "scene-turn" || !turn?.is_current_actor) return [];
      if (!turn.can_need_time) return [];
      const seconds = Math.round(Number(turn.need_time_extension_ms || 60000) / 1000);
      return [{
        key: "need-time",
        label: "need time",
        title: `Keep this activation and add ${seconds} seconds of grace without passing.`,
        run: () => action("/actions/need-time", { actor_id: actorId }),
      }];
    }

    function renderTurnBannerControls() {
      const host = $("turn-banner-controls");
      if (!host) return;
      const specs = turnBannerControlSpecs();
      turnBannerControlRuns = new Map(specs.map((spec) => [spec.key, spec.run]));
      const html = specs
        .map((spec) => (
          `<button type="button" class="turn-banner-control" data-turn-control="${escapeAttr(spec.key)}" title="${escapeAttr(spec.title)}">${escapeHtml(spec.label)}</button>`
        ))
        .join("");
      if (host.innerHTML !== html) host.innerHTML = html;
    }

    function renderTurnPingPill() {
      const pill = $("turn-ping-pill");
      if (!pill) return;
      const html = turnPingPillHtml();
      const banner = $("turn-banner");
      if (banner) banner.hidden = !html;
      renderTurnBannerControls();
      pill.classList.toggle("urgent", Boolean(state?.turn?.enabled && state?.turn?.is_current_actor));
      const handoffKey = html ? String(state?.turn?.handoff_key || "") : "";
      if (!html) {
        announcedTurnHandoffKey = "";
        pill.innerHTML = "";
      } else if (handoffKey !== announcedTurnHandoffKey) {
        announcedTurnHandoffKey = handoffKey;
        pill.innerHTML = html;
      } else {
        const visualGrace = pill.querySelector(".turn-ping-time");
        const grace = Math.round(Number(state?.turn?.grace_period_ms || 0) / 1000);
        if (visualGrace && grace > 0) visualGrace.textContent = `${grace}s grace`;
      }
    }

    function compareActions(left, right) {
      const rank = actionRank(left) - actionRank(right);
      if (rank) return rank;
      return String(left.detail || left.label || "").localeCompare(String(right.detail || right.label || ""));
    }

    function actionRank(action) {
      if (action.offerRank !== null && action.offerRank !== undefined && Number.isFinite(Number(action.offerRank))) {
        return Number(action.offerRank);
      }
      if (Number.isFinite(Number(action.priority))) return Number(action.priority);
      return 500;
    }

    function normalizeActionCardSuit(suit) {
      const normalized = String(suit || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      return actionCardSuits.includes(normalized) ? normalized : "";
    }

    function actionCardSuitEmoji(suit) {
      return actionCardSuitEmojis[normalizeActionCardSuit(suit)] || "";
    }

    function normalizeActionCardRarity(rarity) {
      const normalized = String(rarity || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      if (["everyday", "curious", "rare", "storybook"].includes(normalized)) return normalized;
      if (["ultra-rare", "mythic", "legendary"].includes(normalized)) return "storybook";
      if (["rare", "super-rare"].includes(normalized)) return "rare";
      if (normalized === "uncommon") return "curious";
      return "everyday";
    }

    function friendlyCardRarity(rarity) {
      return normalizeActionCardRarity(rarity);
    }

    function actionCardSuit(action) {
      if (String(action?.presentation?.family || "") !== "action") return "";
      return normalizeActionCardSuit(action?.presentation?.suit);
    }

    function actionCardAccentClass(action) {
      const suit = actionCardSuit(action);
      const rarity = friendlyCardRarity(action?.presentation?.rarity);
      return {
        cardType: suit || "control",
        suit,
        rarity,
        className: suit ? `suit-${suit}` : "card-control",
      };
    }

    function setWalletQrStatus(message, kind = "ok") {

      node.classList.toggle("error", kind === "error");

    function stopWalletQrPolling() {

      walletQrPollTimer = null;
    }

    function closeWalletQrModal(result = false) {

    async function linkAvatarWallet() {
      if (!identity?.authenticated) throw new Error("Sign in with a passkey first.");
      setStatus("Create a portable linked-avatar wallet claim.", "ok");
      const started = await post("/auth/wallet-claims/start", {});
      if (!started.ok || !started.claim_id || !started.poll_token) {
        throw new Error(started.error || "Wallet claim could not start.");
      }
      const portableUrl = new URL(started.mobile_path || `/wallet/claim/${started.claim_id}`, window.location.href).toString();
      const qrSvgUrl = new URL(started.qr_svg_path || `/wallet/claim/${started.claim_id}/code.svg`, window.location.href).toString();

      setWalletQrStatus("Waiting for the wallet signature. You can keep using this browser.");

      return new Promise((resolve) => {
        walletQrResolve = resolve;

          try {
            const status = await api(`/auth/wallet-claims/status?claim_id=${encodeURIComponent(started.claim_id)}&poll_token=${encodeURIComponent(started.poll_token)}`);
            if (status.ok && status.state === "complete" && status.wallet_address) {
              applyIdentity(await api("/auth/account"));
              setStatus(status.moved ? "Avatar wallet link moved here." : "Avatar wallet linked.", "ok");
              focusIndex = 0;
              focusedKey = "";
              playerPromotedHandKey = "";
              await refresh();
              connectStream();
              closeWalletQrModal(true);
            } else if (!status.ok && status.state === "expired") {
              setWalletQrStatus("Wallet claim expired. Start a fresh claim.", "error");
              closeWalletQrModal(false);

          } catch (error) {
            setWalletQrStatus(String(error.message || error), "error");

        walletQrPollTimer = window.setInterval(poll, 1400);
        poll();

    async function openQrWalletLogin() {
      $("wallet-modal-title").textContent = "wallet sign-in";
      $("wallet-modal").querySelector(".wallet-copy").textContent = "Scan this with your phone. Sign one message. No transaction, no fee.";
      $("wallet-app-links").hidden = true;
      setStatus("Scan the wallet sign-in QR.", "ok");
      const started = await post("/wallet/qr/start", {});
      if (!started.ok || !started.login_id || !started.poll_token) {

      }
      const mobileUrl = new URL(started.mobile_path || `/wallet/qr/${started.login_id}`, window.location.href).toString();
      const qrSvgUrl = new URL(started.qr_svg_path || `/wallet/qr/${started.login_id}/code.svg`, window.location.href).toString();
      $("wallet-qr-image").src = qrSvgUrl;

            if (status.ok && status.state === "complete" && status.wallet_session) {

              closeWalletQrModal(false);
