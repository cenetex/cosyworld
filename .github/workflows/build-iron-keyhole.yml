name: Build approved iron keyhole card back

on:
  push:
    branches: [codex/locked-card-recessed-iron-keyhole]
    paths: [.github/workflows/build-iron-keyhole.yml]

permissions:
  contents: write

concurrency:
  group: build-iron-keyhole-artwork
  cancel-in-progress: false

jobs:
  artwork:
    if: github.repository == 'cenetex/cosyworld' && github.ref == 'refs/heads/codex/locked-card-recessed-iron-keyhole'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: source
          fetch-depth: 0
      - name: Use an isolated artwork worktree
        run: |
          git -C source fetch --no-tags origin refs/heads/codex/locked-card-recessed-iron-keyhole:refs/remotes/origin/codex/locked-card-recessed-iron-keyhole
          git -C source worktree add ../artwork -b codex/locked-card-recessed-iron-keyhole origin/codex/locked-card-recessed-iron-keyhole
          git -C artwork status --short --branch
          git -C artwork rev-parse HEAD
          git -C artwork merge-base origin/main HEAD
          node -p 'require("./artwork/package.json").version'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: artwork/package-lock.json
      - name: Install project dependencies
        working-directory: artwork
        run: npm ci
      - name: Build the exact painting and owning image and media outputs
        working-directory: artwork
        run: node v2/card-game/assets/locked-card/build.mjs
      - name: Update only the obsolete stand-in descriptions
        working-directory: artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patches = {
              'v2/card-game/locked-box.mjs': (
                  '// The locked lid. A stand-in darkened from the card back until its own\n// painting drops in at this path (assets/README.md).',
                  '// The locked carved lid has a recessed iron keyhole (assets/README.md).'),
              'v2/card-game/public-assets.mjs': (
                  '// The locked box (locked-box.mjs); a stand-in until its own painting.',
                  '// The locked box lid with its recessed iron keyhole (locked-box.mjs).'),
          }
          for name, (old, new) in patches.items():
              path = Path(name)
              text = path.read_text()
              assert text.count(old) == 1 or new in text, name
              path.write_text(text.replace(old, new))
          path = Path('v2/card-game/assets/README.md')
          text = path.read_text()
          heading = '## The locked box lid'
          assert text.count(heading) == 1
          text = text.split(heading)[0] + '''## The locked box lid

          `card-back-locked.webp` is the approved carved-oak lid for a card locked
          behind a quest (`locked-box.mjs`). A fixed, recessed blackened-iron
          keyhole plate replaces the earlier darkened stand-in. There is no
          padlock shackle. The surrounding moths, acorns, bells and carving remain
          part of the painting. Quest, reveal and unlock behavior are unchanged.

          The runtime image is opaque, full bleed and 1024 by 1536 pixels, with
          no cropping or lettering, at most 300,000 bytes. Its native PNG is kept
          byte for byte at `locked-card/iron-keyhole-master.png`; the adjacent
          `iron-keyhole-source.json` pins the approved generation and SHA-256.
          The master is authoring material, not an additional public download.

          To encode the master and run the existing image/media builders:

          ```sh
          node v2/card-game/assets/locked-card/build.mjs
          npm run v2:card:images:check
          npm run v2:card:assets:check
          ```

          `card-back-locked-provenance.json` records the source identity, chosen
          encoder settings and hashes for the full-size, card and phone files.
          The existing runtime URL is preserved; the media manifest changes its
          cache key so the new painting is fetched. `card-back.webp` is unchanged.
          '''.replace('\n          ', '\n')
          path.write_text(text)
          PY
      - name: Format authored files and verify generated outputs
        working-directory: artwork
        run: |
          npx prettier --write v2/card-game/assets/locked-card/build.mjs v2/card-game/assets/locked-card/iron-keyhole-source.json v2/card-game/assets/card-back-locked-provenance.json v2/card-game/assets/README.md test/card-locked-back-art.test.mjs
          npm run v2:card:images:check
          npm run v2:card:assets:check
          npm run check:version
          npm run docs:check
          npx eslint test/card-locked-back-art.test.mjs v2/card-game/locked-box.mjs v2/card-game/public-assets.mjs
          npx vitest run test/card-locked-back-art.test.mjs test/card-assets.test.mjs test/card-image-streaming.test.mjs --maxWorkers=2
          git diff --check
      - name: Commit only the approved artwork integration
        working-directory: artwork
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              'v2/card-game/assets/card-back-locked.webp',
              'v2/card-game/assets/card-back-locked-provenance.json',
              'v2/card-game/assets/optimized/card/webp/card-back-locked.webp',
              'v2/card-game/assets/optimized/phone/webp/card-back-locked.webp',
              'v2/card-game/image-variants.json', 'v2/card-game/media-manifest.json',
              'v2/card-game/assets/README.md', 'v2/card-game/locked-box.mjs',
              'v2/card-game/public-assets.mjs',
              'v2/card-game/assets/locked-card/build.mjs',
              'v2/card-game/assets/locked-card/iron-keyhole-source.json',
              'test/card-locked-back-art.test.mjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert not (changed - allowed), 'Unrelated generated churn: ' + str(changed - allowed)
          subprocess.run(['git','add','-f','--',*sorted(changed)],check=True)
          PY
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Replace the locked lid with the approved recessed iron keyhole and rebuilt variants'
          git push origin HEAD:refs/heads/codex/locked-card-recessed-iron-keyhole
      - name: Run the full JavaScript suite
        working-directory: artwork
        run: npm test -- --maxWorkers=2
      - name: Install Chromium for the locked-card journey
        working-directory: artwork
        run: npx playwright install --with-deps chromium
      - name: Check locked cards at desktop and phone widths
        working-directory: artwork
        run: node v2/scripts/smoke-card-locked-box.mjs
