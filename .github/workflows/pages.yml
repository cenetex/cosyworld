name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "*.md"
      - "v2/**/*.md"
      - ".github/AGENT.md"
      - "scripts/build-docs.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "*.md"
      - "v2/**/*.md"
      - ".github/AGENT.md"
      - "scripts/build-docs.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

# A newer push cancels a pull request's run. Main runs each get their own
# group, so every merge's documentation build finishes.
concurrency:
  group: documentation-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build documentation
        run: npm run docs

      - name: Upload rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-documentation
          path: dist/docs
