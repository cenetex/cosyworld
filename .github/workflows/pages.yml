name: Documentation

on:
  workflow_dispatch:

# CI runs only by manual dispatch. Each run gets its own group and always
# finishes; nothing cancels a run.
concurrency:
  group: documentation-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build documentation
        run: npm run docs

      - name: Upload rendered documentation
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-documentation
          path: dist/docs
