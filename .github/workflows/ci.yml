name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Test builds keep assertions and overflow checks, with compact symbols.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  node:
    name: Node, content, and kernel checks
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version check fetches only its base branch when it needs it.
          fetch-depth: 1

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Ensure version bumped
        run: npm run check:version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Keep the non-Rust commands from `npm run check` here so they can run
      # beside the longer Rust and browser gate rather than before it.
      - name: Test, validate content, and check the kernel
        run: |
          npm test
          npm run docs:check
          npm run v2:worldpack
          npm run v2:kernel
          npm run v2:syntax

  runtime:
    name: Rust build and tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Only main saves the Cargo cache; pull requests restore it. Saving a
      # new commit-keyed cache on every run cost about 45 seconds each.
      - name: Restore Cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-compact-v1-

      - name: Test Rust orchestrator
        run: bash v2/scripts/check-rust.sh test

      - name: Save Cargo build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}

  # The browser and composition checks need only the debug binary, so it is
  # built beside the Rust tests instead of after them.
  smoke-binary:
    name: Smoke-test binary
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-compact-v1-

      - name: Build V2 binary
        run: bash v2/scripts/check-rust.sh build

      - name: Prepare smoke-test binary
        run: |
          mkdir -p dist/ci
          cp v2/orchestrator-rust/target/debug/cosyworld-orchestrator dist/ci/
          strip --strip-debug dist/ci/cosyworld-orchestrator

      - name: Share smoke-test binary
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-smoke-binary
          path: dist/ci/cosyworld-orchestrator
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  rust-quality:
    name: Rust architecture and lint
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust architecture
        run: |
          bash v2/scripts/check-main-size.sh
          bash v2/scripts/check-rust-lint.sh

  composition:
    name: Composition checks (${{ matrix.suite }})
    needs: smoke-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [standalone, core-ruby]
    env:
      CI: true
      COSYWORLD_COMPOSITION_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Verify composition action loop
        run: |
          chmod 0755 "$COSYWORLD_COMPOSITION_SMOKE_BINARY"
          npm run "v2:composition:smoke:${COMPOSITION_SUITE}"
        env:
          COMPOSITION_SUITE: ${{ matrix.suite }}

  browser:
    name: Browser checks (${{ matrix.mode }})
    needs: smoke-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - baseline
          - living-world
          - cards-shared
          - cards-ui
          - cards-routes
          - cards-drama
          - cards-dialogue
          - cards-quests
    env:
      CI: true
      COSYWORLD_BROWSER_CHECK_MODE: ${{ matrix.mode }}
      COSYWORLD_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Mark smoke-test binary executable
        run: chmod 0755 "$COSYWORLD_SMOKE_BINARY"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Use Ubuntu archive and bound package download waits
        run: |
          # The Azure mirror delivered browser fonts at 63 kB/s in CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99cosyworld-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF

      - name: Install fresh-seed browser gate system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes screen

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run fresh-seed browser gate
        if: matrix.mode == 'baseline' || matrix.mode == 'living-world'
        run: npm run v2:browser:check

      # Each group has its own runner, ports, and files. All groups feed the
      # required build check. Commands within a group run in order.
      - name: Check shared card worlds with real passkeys
        if: matrix.mode == 'cards-shared'
        run: |
          node v2/scripts/smoke-shared-cards.mjs
          node v2/scripts/smoke-card-greek-capacity.mjs

      - name: Check card opening, hand, and music
        if: matrix.mode == 'cards-ui'
        run: |
          node v2/scripts/check-card-awakening.mjs
          node v2/scripts/smoke-card-unveil.mjs
          node v2/scripts/smoke-card-hand.mjs
          node v2/scripts/smoke-card-music.mjs
          node v2/scripts/smoke-card-music-network.mjs
          node v2/scripts/smoke-card-media-cache.mjs
          node v2/scripts/smoke-scene-video.mjs

      - name: Check card routes and actions
        if: matrix.mode == 'cards-routes'
        run: |
          node v2/scripts/smoke-card-narrative-contract.mjs
          node v2/scripts/smoke-card-home-rescue.mjs
          node v2/scripts/smoke-card-pond-access.mjs
          node v2/scripts/smoke-card-clearing-access.mjs
          node v2/scripts/smoke-card-pond-crossings.mjs
          node v2/scripts/smoke-shared-ship.mjs
          node v2/scripts/smoke-card-facing.mjs
          node v2/scripts/smoke-card-image-first.mjs
          node v2/scripts/smoke-card-toolbar.mjs
          node v2/scripts/smoke-card-learning.mjs
          node v2/scripts/smoke-shared-snapshot-order.mjs
          node v2/scripts/smoke-card-actions.mjs

      - name: Check Greek drama, Thebes, and the Open Door
        if: matrix.mode == 'cards-drama'
        run: |
          node v2/scripts/smoke-card-greek-drama.mjs
          node v2/scripts/smoke-card-theban-scenery.mjs
          node v2/scripts/smoke-card-open-door.mjs
          node v2/scripts/smoke-card-greek-homecoming.mjs

      - name: Check dialogue and movement
        if: matrix.mode == 'cards-dialogue'
        run: |
          node v2/scripts/smoke-card-dialogue-recovery.mjs
          node v2/scripts/smoke-card-dialogue-timing.mjs
          node v2/scripts/smoke-card-movement.mjs

      - name: Check quests, shared discovery, and voice
        if: matrix.mode == 'cards-quests'
        run: |
          node v2/scripts/smoke-card-quests.mjs
          node v2/scripts/smoke-card-quest-collection.mjs
          node v2/scripts/smoke-card-shared-discovery.mjs
          node v2/scripts/smoke-card-bard-travel.mjs
          node v2/scripts/smoke-card-shared-quests.mjs
          node v2/scripts/smoke-card-voice.mjs

      - name: Upload browser images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-browser-${{ matrix.mode }}
          path: |
            output/shared-cards/*.png
            output/greek-homecoming/*.png
            output/greek-homecoming/*.json
            output/greek-capacity/*.png
            output/greek-capacity/*.json
            v2/orchestrator-rust/.runtime/visual-smoke/*.png
            v2/orchestrator-rust/.runtime/visual-smoke/*.json
            output/badger-check/*.png
            output/theban-scenery/*.png
            output/theban-scenery/*.json
            output/image-first/*.png
            output/card-toolbar/*.png
            output/card-learning/*.png
            output/image-first/*.json
            output/pond-crossings-check/*.png
            output/pond-crossings-check/*.json
            output/dialogue-recovery/*.png
            output/dialogue-timing/*.png
            output/dialogue-timing/*.json
            output/movement/*.png
            output/movement/*.json
            output/card-quests-chromium/*.png
            output/card-quests-chromium/*.json
            output/card-voice-chromium/*.png
            output/card-facing/*.png
          if-no-files-found: ignore
          retention-days: 7

  publication:
    name: Referee guide publication
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Use Ubuntu archive and bound package download waits
        run: |
          # The Azure mirror delivered browser fonts at 63 kB/s in CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99cosyworld-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF

      - name: Install pinned publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-jre-headless poppler-utils qpdf unzip
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 \
            --output /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.8.1/pandoc-3.8.1-1-amd64.deb
          sudo dpkg --install /tmp/pandoc.deb
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 \
            --output /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          sudo unzip -q /tmp/epubcheck.zip -d /opt/epubcheck
          epubcheck_dir="$(find /opt/epubcheck -maxdepth 1 -type d -name 'epubcheck-*' -print -quit)"
          test -n "$epubcheck_dir"
          sudo tee /usr/local/bin/epubcheck >/dev/null <<EOF
          #!/bin/sh
          exec java -jar "$epubcheck_dir/epubcheck.jar" "\$@"
          EOF
          sudo chmod 0755 /usr/local/bin/epubcheck
          pandoc --version
          epubcheck --version

      - name: Restore Playwright browsers
        id: publication-playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.publication-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build and validate the guide
        run: npm run docs:dm-guide:check

      - name: Upload publication
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-referee-guide
          path: dist/publications/dm-guide/
          if-no-files-found: error

  # Keep the existing `CI / build` required-check context while allowing the
  # independent verification paths above to run concurrently.
  build:
    name: build
    if: ${{ always() }}
    needs:
      [
        node,
        runtime,
        smoke-binary,
        rust-quality,
        composition,
        browser,
        publication,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPOSITION_RESULT: ${{ needs.composition.result }}
          NODE_RESULT: ${{ needs.node.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          SMOKE_BINARY_RESULT: ${{ needs.smoke-binary.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
        run: |
          test "$BROWSER_RESULT" = success
          test "$COMPOSITION_RESULT" = success
          test "$NODE_RESULT" = success
          test "$PUBLICATION_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$SMOKE_BINARY_RESULT" = success
          test "$RUST_QUALITY_RESULT" = success
