name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node, content, and kernel checks
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Ensure version bumped
        run: npm run check:version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test, validate content, and check the kernel
        run: |
          npm test
          npm run v2:worldpack
          npm run v2:kernel
          npm run v2:syntax
          npm run v2:lonelyforest:contract

  runtime:
    name: Rust build and tests
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-orchestrator-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-orchestrator-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-orchestrator-

      - name: Test Rust orchestrator
        run: bash v2/scripts/check-rust.sh test

      - name: Build V2 binary
        run: bash v2/scripts/check-rust.sh build

      - name: Prepare smoke-test binary
        run: |
          mkdir -p dist/ci
          cp v2/orchestrator-rust/target/debug/cosyworld-orchestrator dist/ci/
          strip --strip-debug dist/ci/cosyworld-orchestrator

      - name: Share smoke-test binary
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-smoke-binary
          path: dist/ci/cosyworld-orchestrator
          if-no-files-found: error
          retention-days: 1

  rust-quality:
    name: Rust architecture and lint
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust architecture
        run: |
          bash v2/scripts/check-main-size.sh
          bash v2/scripts/check-rust-lint.sh

  composition:
    name: Composition checks (${{ matrix.suite }})
    needs: runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [standalone, core-ruby]
    env:
      CI: true
      COSYWORLD_COMPOSITION_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Verify composition action loop
        run: |
          chmod 0755 "$COSYWORLD_COMPOSITION_SMOKE_BINARY"
          npm run "v2:composition:smoke:${COMPOSITION_SUITE}"
        env:
          COMPOSITION_SUITE: ${{ matrix.suite }}

  browser:
    name: Browser checks (${{ matrix.mode }})
    needs: runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, living-world]
    env:
      CI: true
      COSYWORLD_BROWSER_CHECK_MODE: ${{ matrix.mode }}
      COSYWORLD_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Mark smoke-test binary executable
        run: chmod 0755 "$COSYWORLD_SMOKE_BINARY"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install fresh-seed browser gate system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes screen

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run fresh-seed browser gate
        run: npm run v2:browser:check

  build:
    name: build
    if: ${{ always() }}
    needs: [node, runtime, rust-quality, composition, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPOSITION_RESULT: ${{ needs.composition.result }}
          NODE_RESULT: ${{ needs.node.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
        run: |
          test "$BROWSER_RESULT" = success
          test "$COMPOSITION_RESULT" = success
          test "$NODE_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$RUST_QUALITY_RESULT" = success
