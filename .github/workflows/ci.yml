name: CI

on:
  # Manual only, before a production release: gh workflow run ci.yml --ref main.
  # The commit to be tagged needs a green run. PRs and main pushes run the
  # fast check (fast-check.yml) instead.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

# Every checkout is blobless with full history (fetch-depth 0, blob:none).
# That fetched the same working tree in a median 15 s, against 33 s for a
# depth-1 checkout (2026-11-01, 49 and 475 jobs), since about 920 MB of it is
# art. Git fetches any older file a step reads on demand.

# Test builds keep assertions and overflow checks, with compact symbols.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  node:
    name: Node, content, and kernel checks
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Pull requests do not bump the version; only its files' agreement is
      # checked. A release bumps it once (docs/release.md).
      - name: Check version alignment
        run: npm run check:version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Keep the non-Rust commands from `npm run check` here so they can run
      # beside the longer Rust and browser gate rather than before it.
      - name: Test, validate content, and check the kernel
        run: |
          npm test
          npm run docs:check
          npm run v2:worldpack
          npm run v2:kernel
          npm run v2:syntax

  # FLY_RUNNERS=on (repository variable) moves this job to the self-hosted Fly
  # runners in infra/ci-runners, whose volume keeps Cargo's cache. Fork pull
  # requests always stay on GitHub-hosted runners.
  runtime:
    name: Rust build and tests
    runs-on: ${{ vars.FLY_RUNNERS == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fly","cosyworld"]') || 'ubuntu-latest' }}
    env:
      CI: true
      RUST_TEST_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs runs Node to generate the embedded card asset list.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Only main saves the Cargo cache; pull requests restore it. Saving a
      # new commit-keyed cache on every run cost about 45 seconds each.
      # Main saves one Cargo cache per UTC day. Every commit changes
      # Cargo.lock, and the repository keeps only 10 GB of caches, so a 2 GB
      # save per commit evicted the other caches before a run could use them.
      # The prefix finds the newest day's copy.
      - name: Choose Cargo cache day
        id: cargo-cache-day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo build cache
        id: cargo-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-day-${{ steps.cargo-cache-day.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-

      - name: Check Rust formatting
        run: bash v2/scripts/check-rust.sh fmt

      - name: Compile Rust tests
        working-directory: v2/orchestrator-rust
        run: cargo test --no-run

      # Main saves today's cache right after compiling, before the tests, so
      # the entry exists even if the tests fail. The debug build adds the
      # crates the smoke-test binary needs.
      - name: Compile the smoke-test binary's crates for the cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        working-directory: v2/orchestrator-rust
        run: cargo build

      - name: Save Cargo build cache
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Test Rust orchestrator
        run: bash v2/scripts/check-rust.sh test

  # The browser and composition checks need only the debug binary, so it is
  # built beside the Rust tests instead of after them.
  smoke-binary:
    name: Smoke-test binary
    runs-on: ubuntu-latest
    env:
      CI: true
    outputs:
      browser-shards: ${{ steps.browser-shards.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs runs Node to generate the embedded card asset list.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The browser job's matrix: measured checks packed into even shards.
      - name: Plan browser shards
        id: browser-shards
        run: echo "matrix=$(node scripts/plan-browser-shards.mjs)" >> "$GITHUB_OUTPUT"

      # Main saves one Cargo cache per UTC day. Every commit changes
      # Cargo.lock, and the repository keeps only 10 GB of caches, so a 2 GB
      # save per commit evicted the other caches before a run could use them.
      # The prefix finds the newest day's copy.
      - name: Choose Cargo cache day
        id: cargo-cache-day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo build cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-day-${{ steps.cargo-cache-day.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-

      - name: Build V2 binary
        run: bash v2/scripts/check-rust.sh build

      # While the Rust tests run on Fly, this job keeps main's daily cache.
      - name: Save Cargo build cache
        if: vars.FLY_RUNNERS == 'on' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Prepare smoke-test binary
        run: |
          mkdir -p dist/ci
          cp v2/orchestrator-rust/target/debug/cosyworld-orchestrator dist/ci/
          strip --strip-debug dist/ci/cosyworld-orchestrator

      - name: Share smoke-test binary
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-smoke-binary
          path: dist/ci/cosyworld-orchestrator
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  # Known flaky tests run here, apart from the blocking Rust job, so they still
  # run and report on every push without blocking a merge. The `build` gate
  # does not need this job. Each test has an issue and a fix-by date; see
  # QUARANTINED_TESTS in v2/scripts/check-rust.sh.
  rust-quarantine:
    name: Quarantined Rust tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: true
      RUST_TEST_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs runs Node to generate the embedded card asset list.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Choose Cargo cache day
        id: cargo-cache-day
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-day-${{ steps.cargo-cache-day.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-

      - name: Run quarantined Rust tests
        run: |
          if ! bash v2/scripts/check-rust.sh quarantine; then
            echo "::warning title=Quarantined Rust test failed::A known flaky test failed (#1553, #1554). It does not block the merge."
            exit 1
          fi

  rust-quality:
    name: Rust architecture and lint
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # build.rs runs Node to generate the embedded card asset list.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check Rust architecture
        run: |
          bash v2/scripts/check-main-size.sh
          bash v2/scripts/check-rust-lint.sh

  composition:
    name: Composition checks (${{ matrix.suite }})
    needs: smoke-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [standalone, core-ruby]
    env:
      CI: true
      COSYWORLD_COMPOSITION_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Verify composition action loop
        run: |
          chmod 0755 "$COSYWORLD_COMPOSITION_SMOKE_BINARY"
          npm run "v2:composition:smoke:${COMPOSITION_SUITE}"
        env:
          COMPOSITION_SUITE: ${{ matrix.suite }}

  browser:
    name: Browser checks (${{ matrix.shard }})
    needs: smoke-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each shard has its own runner, ports, and files, and all of them feed
      # the required build check. Checks within a shard run in order.
      # scripts/plan-browser-shards.mjs packs the measured checks in
      # scripts/browser-shards.json into shards of about six minutes; add a
      # new journey there.
      matrix: ${{ fromJSON(needs.smoke-binary.outputs.browser-shards) }}
    env:
      CI: true
      COSYWORLD_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Mark smoke-test binary executable
        run: chmod 0755 "$COSYWORLD_SMOKE_BINARY"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Use Ubuntu archive and bound package download waits
        run: |
          # The Azure mirror delivered browser fonts at 63 kB/s in CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99cosyworld-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF

      - name: Install browser system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run browser checks
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          for check in $CHECKS; do
            echo "::group::$check"
            case "$check" in
              *@*)
                COSYWORLD_SMOKE_WIDTHS="${check#*@}" \
                  node "v2/scripts/${check%@*}.mjs"
                ;;
              *) node "v2/scripts/$check.mjs" ;;
            esac
            echo "::endgroup::"
          done

      - name: Upload browser images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-browser-${{ strategy.job-index }}
          path: |
            output/shared-cards/*.png
            output/greek-homecoming/*.png
            output/greek-homecoming/*.json
            output/greek-capacity/*.png
            output/greek-capacity/*.json
            output/badger-check/*.png
            output/theban-scenery/*.png
            output/theban-scenery/*.json
            output/card-weather/*.png
            output/card-weather/*.json
            output/image-first/*.png
            output/card-toolbar/*.png
            output/card-learning/*.png
            output/image-first/*.json
            output/pond-crossings-check/*.png
            output/pond-crossings-check/*.json
            output/dialogue-recovery/*.png
            output/silent-reply/*.png
            output/dialogue-timing/*.png
            output/dialogue-timing/*.json
            output/movement/*.png
            output/movement/*.json
            output/card-quests-chromium/*.png
            output/card-quests-chromium/*.json
            output/card-voice-chromium/*.png
            output/card-facing/*.png
          if-no-files-found: ignore
          retention-days: 7

  publication:
    name: Referee guide publication
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Use Ubuntu archive and bound package download waits
        run: |
          # The Azure mirror delivered browser fonts at 63 kB/s in CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99cosyworld-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF

      - name: Install pinned publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-jre-headless poppler-utils qpdf unzip
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 \
            --output /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.8.1/pandoc-3.8.1-1-amd64.deb
          sudo dpkg --install /tmp/pandoc.deb
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 \
            --output /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          sudo unzip -q /tmp/epubcheck.zip -d /opt/epubcheck
          epubcheck_dir="$(find /opt/epubcheck -maxdepth 1 -type d -name 'epubcheck-*' -print -quit)"
          test -n "$epubcheck_dir"
          sudo tee /usr/local/bin/epubcheck >/dev/null <<EOF
          #!/bin/sh
          exec java -jar "$epubcheck_dir/epubcheck.jar" "\$@"
          EOF
          sudo chmod 0755 /usr/local/bin/epubcheck
          pandoc --version
          epubcheck --version

      - name: Restore Playwright browsers
        id: publication-playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.publication-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build and validate the guide
        run: npm run docs:dm-guide:check

      - name: Upload publication
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-referee-guide
          path: dist/publications/dm-guide/
          if-no-files-found: error

  # Keep the existing `CI / build` required-check context while allowing the
  # independent verification paths above to run concurrently.
  build:
    name: build
    if: ${{ always() }}
    needs:
      [
        node,
        runtime,
        smoke-binary,
        rust-quality,
        composition,
        browser,
        publication,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          COMPOSITION_RESULT: ${{ needs.composition.result }}
          NODE_RESULT: ${{ needs.node.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          SMOKE_BINARY_RESULT: ${{ needs.smoke-binary.result }}
          RUST_QUALITY_RESULT: ${{ needs.rust-quality.result }}
        run: |
          test "$BROWSER_RESULT" = success
          test "$COMPOSITION_RESULT" = success
          test "$NODE_RESULT" = success
          test "$PUBLICATION_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$SMOKE_BINARY_RESULT" = success
          test "$RUST_QUALITY_RESULT" = success
