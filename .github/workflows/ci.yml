name: CI

on:
  pull_request:
    branches: ["**"]
    # A `full-ci` label runs the main-only checks on a pull request.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, develop]
  # The Version workflow dispatches CI for its bump commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Test builds keep assertions and overflow checks, with compact symbols.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  node:
    name: Node, content, and kernel checks
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version check fetches only its base branch when it needs it.
          fetch-depth: 1

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Ensure version bumped
        run: npm run check:version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Keep the non-Rust commands from `npm run check` here so they can run
      # beside the Rust gate rather than before it. Vitest has its own shards.
      - name: Validate content and check the kernel
        run: |
          npm run docs:check
          npm run v2:worldpack
          npm run v2:kernel
          npm run v2:syntax

  vitest:
    name: Vitest (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Shards split files by the seconds in test/ci-timings.json.
      - name: Run Vitest shard
        run: npm test -- --shard=${{ matrix.shard }}/3 --maxWorkers=4

  # Pull requests run the released-rule replay suite only when they can change
  # shared rules. Main always runs it.
  changes:
    name: Detect shared-rule changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rules: ${{ steps.files.outputs.rules }}
    steps:
      - name: List changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL_CI" = true ]; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > changed.txt
          # Rule modules rebuild card_shared/engine-v*.js, which the content
          # check keeps current, so the bundle path covers them.
          pattern='^(v2/orchestrator-rust/src/card_shared|v2/orchestrator-rust/Cargo\.|v2/core-c/|v2/card-game/(packs|shared-cast)\.json$|test/fixtures/|\.github/workflows/ci\.yml$|v2/scripts/(check-rust\.sh|rust-test-shard\.mjs|rust-test-timings\.json)$)'
          if grep -qE "$pattern" changed.txt; then
            grep -E "$pattern" changed.txt | head -20
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "No shared-rule changes; the replay suite runs after merge."
            echo "rules=false" >> "$GITHUB_OUTPUT"
          fi

  rust-fast:
    name: Rust tests (fast ${{ matrix.index }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3]
    env:
      CI: true
      RUST_TEST_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Only main saves the Cargo cache; pull requests restore it. Saving a
      # new commit-keyed cache on every run cost about 45 seconds each.
      - name: Restore Cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-compact-v1-

      - name: Test Rust orchestrator shard
        run: bash v2/scripts/check-rust.sh shard fast ${{ matrix.index }} 3

      - name: Save Cargo build cache
        if: matrix.index == 1 && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}

  rust-rules:
    name: Rust shared-rule replay (${{ matrix.index }}/4)
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        index: [1, 2, 3, 4]
    env:
      CI: true
      RUST_TEST_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-compact-v1-

      - name: Test shared-rule replay shard
        run: bash v2/scripts/check-rust.sh shard rules ${{ matrix.index }} 4

  # The production gate reuses this check by name. It passes when every fast
  # shard passed and the replay shards passed, or were skipped on a pull
  # request that cannot change shared rules.
  runtime:
    name: Rust build and tests
    if: ${{ always() }}
    needs: [changes, rust-fast, rust-rules]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Rust shards
        env:
          EVENT: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_RESULT: ${{ needs.rust-fast.result }}
          RULES_RESULT: ${{ needs.rust-rules.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$FAST_RESULT" = success
          if [ "$EVENT" = pull_request ] && [ "$RULES_RESULT" = skipped ]; then
            exit 0
          fi
          test "$RULES_RESULT" = success

  # The browser and composition checks need only the debug binary, so it is
  # built beside the Rust tests instead of after them.
  # Main runs these after merge; a pull request runs them with `full-ci`.
  smoke-binary:
    name: Smoke-test binary
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-compact-v1-

      - name: Build V2 binary
        run: bash v2/scripts/check-rust.sh build

      - name: Prepare smoke-test binary
        run: |
          mkdir -p dist/ci
          cp v2/orchestrator-rust/target/debug/cosyworld-orchestrator dist/ci/
          strip --strip-debug dist/ci/cosyworld-orchestrator

      - name: Share smoke-test binary
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-smoke-binary
          path: dist/ci/cosyworld-orchestrator
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  rust-quality:
    name: Rust architecture and lint
    runs-on: ubuntu-latest
    env:
      CI: true
      COSYWORLD_CLIPPY_TARGET_DIR: ${{ github.workspace }}/v2/orchestrator-rust/target-clippy
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Restore Clippy build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target-clippy
          key: ${{ runner.os }}-cargo-clippy-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-clippy-v1-

      - name: Check Rust architecture
        run: |
          bash v2/scripts/check-rust.sh fmt
          bash v2/scripts/check-main-size.sh
          bash v2/scripts/check-rust-lint.sh

      - name: Save Clippy build cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target-clippy
          key: ${{ runner.os }}-cargo-clippy-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}

  composition:
    name: Composition checks (${{ matrix.suite }})
    needs: smoke-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [standalone, core-ruby]
    env:
      CI: true
      COSYWORLD_COMPOSITION_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Verify composition action loop
        run: |
          chmod 0755 "$COSYWORLD_COMPOSITION_SMOKE_BINARY"
          npm run "v2:composition:smoke:${COMPOSITION_SUITE}"
        env:
          COMPOSITION_SUITE: ${{ matrix.suite }}

  browser:
    name: Browser checks (${{ matrix.mode }})
    needs: smoke-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each group has its own runner, ports, and files. Scripts within a
      # group run in order. The longest journeys have groups of their own.
      matrix:
        include:
          - mode: baseline
          - mode: living-world
          - mode: cards-shared
            scripts: smoke-shared-cards
          - mode: cards-capacity
            scripts: smoke-card-greek-capacity
          - mode: cards-ui
            scripts: check-card-awakening smoke-card-unveil smoke-card-hand smoke-card-boardyai smoke-card-music smoke-card-music-network smoke-card-media-cache smoke-scene-video
          - mode: cards-routes
            scripts: smoke-card-narrative-contract smoke-card-home-rescue smoke-card-pond-access smoke-card-clearing-access smoke-card-pond-crossings smoke-shared-ship smoke-card-facing smoke-card-image-first smoke-card-toolbar smoke-card-learning smoke-shared-snapshot-order smoke-card-actions
          - mode: cards-drama
            scripts: smoke-card-greek-drama smoke-card-theban-scenery
          - mode: cards-weather
            scripts: smoke-card-weather
          - mode: cards-open-door
            scripts: smoke-card-open-door
          - mode: cards-travel
            scripts: smoke-card-greek-travel smoke-card-greek-homecoming
          - mode: cards-ajax
            scripts: smoke-card-ajax
          - mode: cards-dialogue
            scripts: smoke-card-dialogue-recovery smoke-card-dialogue-timing smoke-card-movement
          - mode: cards-quests
            scripts: smoke-card-quests smoke-card-quest-collection smoke-card-shared-discovery smoke-card-bard-travel smoke-card-shared-quests smoke-card-voice
    env:
      CI: true
      COSYWORLD_BROWSER_CHECK_MODE: ${{ matrix.mode }}
      COSYWORLD_SMOKE_BINARY: ${{ github.workspace }}/dist/ci/cosyworld-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download smoke-test binary
        uses: actions/download-artifact@v8
        with:
          name: cosyworld-smoke-binary
          path: dist/ci

      - name: Mark smoke-test binary executable
        run: chmod 0755 "$COSYWORLD_SMOKE_BINARY"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Use Ubuntu archive and bound package download waits
        run: |
          # The Azure mirror delivered browser fonts at 63 kB/s in CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99cosyworld-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF

      - name: Install fresh-seed browser gate system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes screen

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run fresh-seed browser gate
        if: matrix.mode == 'baseline' || matrix.mode == 'living-world'
        run: npm run v2:browser:check

      - name: Run card browser journeys
        if: matrix.scripts
        env:
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          for script in $SCRIPTS; do
            echo "::group::$script"
            node "v2/scripts/$script.mjs"
            echo "::endgroup::"
          done

      - name: Upload browser images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-browser-${{ matrix.mode }}
          path: |
            output/shared-cards/*.png
            output/greek-homecoming/*.png
            output/greek-homecoming/*.json
            output/greek-capacity/*.png
            output/greek-capacity/*.json
            v2/orchestrator-rust/.runtime/visual-smoke/*.png
            v2/orchestrator-rust/.runtime/visual-smoke/*.json
            output/badger-check/*.png
            output/theban-scenery/*.png
            output/theban-scenery/*.json
            output/card-weather/*.png
            output/card-weather/*.json
            output/image-first/*.png
            output/card-toolbar/*.png
            output/card-learning/*.png
            output/image-first/*.json
            output/pond-crossings-check/*.png
            output/pond-crossings-check/*.json
            output/dialogue-recovery/*.png
            output/dialogue-timing/*.png
            output/dialogue-timing/*.json
            output/movement/*.png
            output/movement/*.json
            output/card-quests-chromium/*.png
            output/card-quests-chromium/*.json
            output/card-voice-chromium/*.png
            output/card-facing/*.png
          if-no-files-found: ignore
          retention-days: 7

  publication:
    name: Referee guide publication
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Use Ubuntu archive and bound package download waits
        run: |
          # The Azure mirror delivered browser fonts at 63 kB/s in CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99cosyworld-ci >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF

      - name: Install pinned publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-jre-headless poppler-utils qpdf unzip
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 \
            --output /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.8.1/pandoc-3.8.1-1-amd64.deb
          sudo dpkg --install /tmp/pandoc.deb
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 --retry 2 \
            --output /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          sudo unzip -q /tmp/epubcheck.zip -d /opt/epubcheck
          epubcheck_dir="$(find /opt/epubcheck -maxdepth 1 -type d -name 'epubcheck-*' -print -quit)"
          test -n "$epubcheck_dir"
          sudo tee /usr/local/bin/epubcheck >/dev/null <<EOF
          #!/bin/sh
          exec java -jar "$epubcheck_dir/epubcheck.jar" "\$@"
          EOF
          sudo chmod 0755 /usr/local/bin/epubcheck
          pandoc --version
          epubcheck --version

      - name: Restore Playwright browsers
        id: publication-playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.publication-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build and validate the guide
        run: npm run docs:dm-guide:check

      - name: Upload publication
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-referee-guide
          path: dist/publications/dm-guide/
          if-no-files-found: error

  # Keep the existing `CI / build` required-check context while allowing the
  # independent verification paths above to run concurrently. A pull request
  # may skip the main-only checks; main must pass all of them.
  build:
    name: build
    if: ${{ always() }}
    needs:
      [
        node,
        vitest,
        changes,
        rust-fast,
        rust-rules,
        runtime,
        smoke-binary,
        rust-quality,
        composition,
        browser,
        publication,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries
            | map(select(
                .value.result != "success"
                and ($event != "pull_request" or .value.result != "skipped"
                  or (.key | IN("node", "vitest", "changes", "rust-fast", "runtime", "rust-quality")))
              ))
            | if length == 0 then true else (map("\(.key): \(.value.result)") | join("\n") | halt_error(1)) end
          '
