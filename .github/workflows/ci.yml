name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node, content, and kernel checks
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version check fetches only its base branch when it needs it.
          fetch-depth: 1

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Ensure version bumped
        run: npm run check:version

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Keep the non-Rust commands from `npm run check` here so they can run
      # beside the longer Rust and browser gate rather than before it.
      - name: Test, validate content, and check the kernel
        run: |
          npm test
          npm run v2:worldpack
          npm run v2:kernel
          npm run v2:syntax
          npm run v2:lonelyforest:contract

  runtime:
    name: Rust and browser checks
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-orchestrator-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-orchestrator-

      - name: Test Rust orchestrator
        run: npm run v2:rust:test

      - name: Check Rust architecture
        run: npm run v2:architecture

      - name: Build V2 release binary
        run: npm run v2:rust:build

      - name: Verify composition action loops
        run: npm run v2:composition:smoke
        env:
          COSYWORLD_COMPOSITION_SMOKE_BINARY: ${{ github.workspace }}/v2/orchestrator-rust/target/debug/cosyworld-orchestrator

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install fresh-seed browser gate system dependencies
        run: |
          npx playwright install-deps chromium
          sudo apt-get install --yes screen

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run fresh-seed browser gate
        run: npm run v2:browser:check

  publication:
    name: Referee guide publication
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install pinned publication tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-jre-headless poppler-utils qpdf unzip
          curl --fail --location --silent --show-error \
            --output /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.8.1/pandoc-3.8.1-1-amd64.deb
          sudo dpkg --install /tmp/pandoc.deb
          curl --fail --location --silent --show-error \
            --output /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          sudo unzip -q /tmp/epubcheck.zip -d /opt/epubcheck
          epubcheck_dir="$(find /opt/epubcheck -maxdepth 1 -type d -name 'epubcheck-*' -print -quit)"
          test -n "$epubcheck_dir"
          sudo tee /usr/local/bin/epubcheck >/dev/null <<EOF
          #!/bin/sh
          exec java -jar "$epubcheck_dir/epubcheck.jar" "\$@"
          EOF
          sudo chmod 0755 /usr/local/bin/epubcheck
          pandoc --version
          epubcheck --version

      - name: Restore Playwright browsers
        id: publication-playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.publication-playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build and validate the guide
        run: npm run docs:dm-guide:check

      - name: Upload publication
        uses: actions/upload-artifact@v7
        with:
          name: cosyworld-referee-guide
          path: dist/publications/dm-guide/
          if-no-files-found: error

  # Keep the existing `CI / build` required-check context while allowing the
  # independent verification paths above to run concurrently.
  build:
    name: build
    if: ${{ always() }}
    needs: [node, runtime, publication]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        env:
          NODE_RESULT: ${{ needs.node.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$PUBLICATION_RESULT" = success
          test "$RUNTIME_RESULT" = success
