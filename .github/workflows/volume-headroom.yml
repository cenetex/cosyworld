name: Volume headroom

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: volume-headroom-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  primary:
    name: Primary volume below 70%
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check primary volume headroom
        run: scripts/check-fly-volume-space.sh cosyworld /data 70
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check primary storage budgets
        run: node v2/scripts/check-storage-budget.mjs primary

  lonely-forest:
    name: Lonely Forest volume below 70%
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check Lonely Forest volume headroom
        run: scripts/check-fly-volume-space.sh cosyworld-lonelyforest /data 70
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Check Lonely Forest storage budgets
        run: node v2/scripts/check-storage-budget.mjs lonelyforest
