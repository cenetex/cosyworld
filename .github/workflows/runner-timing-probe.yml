name: Runner timing probe
on:
  pull_request:
    branches: [codex/greek-epic-complete]
jobs:
  timing:
    if: github.head_ref == 'codex/campaign-runner-cancellation'
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check the original test deadlines
        run: >-
          npx vitest run
          test/card-game.test.mjs
          test/card-liveness.test.mjs
          test/card-greek-book-one.test.mjs
          test/cancellable-attempt.test.mjs
          -t 'preserves unique objects and valid state across 4000 varied turns|keeps every avatar progressing after long loose play|replays ordered dialogue and deeds through the bundled shared rules|serves only the game assets and supports a clean browser reload|stops a timed-out simulation before its retry starts|keeps normal results and assertion failures visible'
          --reporter=verbose
