name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Committed production target to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - primary
          - lonelyforest

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  primary-fly:
    name: Deploy primary to Fly
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'both' ||
      inputs.target == 'primary'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard primary volume free space
        run: scripts/check-fly-volume-space.sh cosyworld /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Guard primary worldpack bundle compatibility
        run: node v2/scripts/check-deploy-worldpack.mjs https://cosyworld.fly.dev

      - name: Deploy primary Fly app
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  lonelyforest-fly:
    name: Deploy Lonely Forest to Fly
    # Ordinary main pushes must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'both' || inputs.target == 'lonelyforest'))
    runs-on: ubuntu-latest
    environment: lonelyforest-production
    concurrency:
      group: deploy-lonelyforest-production
      cancel-in-progress: false
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard Lonely Forest volume free space
        run: scripts/check-fly-volume-space.sh cosyworld-lonelyforest /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Guard Lonely Forest worldpack bundle compatibility
        run: node v2/scripts/check-deploy-worldpack.mjs https://lonelyforest.com

      - name: Build and deploy Lonely Forest
        run: flyctl deploy --remote-only --config fly.lonelyforest.toml --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [primary-fly, lonelyforest-fly]
    permissions:
      contents: write
    steps:
      - name: Create release notes
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
