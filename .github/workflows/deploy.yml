name: Deploy

# Every push to main deploys .dev unless it changes only docs or tests; a
# newer push cancels an older build. The schedule catches up a push that never
# ran. COSYWORLD_DEV_TRAIN=off pauses both, not the `dev` dispatch. Tags and
# the other dispatch targets are production.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "sites/**", "test/**", "v2/docs/**", "v2/tests/**", "v2/mvp.sh"]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Committed production target to deploy, or dev to run the .dev train now
        required: true
        default: both
        type: choice
        options:
          - both
          - primary
          - lonelyforest
          - dev

# scripts/serialize-primary-rollout.sh finds .dev runs by this name, and
# scripts/supersede-production-deploy.mjs a production run's target in it.
run-name: ${{ ((github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') || inputs.target == 'dev') && format('.dev train {0}', github.sha) || format('Deploy {0} to {1}', github.ref_name, inputs.target || 'both') }}

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  dev-plan:
    name: Plan the .dev deploy
    if: >-
      github.ref == 'refs/heads/main' &&
      (((github.event_name == 'push' || github.event_name == 'schedule') && vars.COSYWORLD_DEV_TRAIN != 'off') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'dev'))
    runs-on: ${{ vars.DEV_DEPLOY_RUNNER == 'fly' && fromJSON('["self-hosted","fly","cosyworld"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      # Reads earlier Deploy runs to find what .dev runs.
      actions: read
    outputs:
      image: ${{ steps.path.outputs.image }}
      server: ${{ steps.path.outputs.server }}
      deploy: ${{ steps.impact.outputs.deploy }}
      base: ${{ steps.impact.outputs.base }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: scripts

      - name: Install the GitHub CLI on a Fly runner
        if: runner.environment != 'github-hosted'
        run: |
          command -v gh >/dev/null || {
            curl -fsSL "https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_2.63.2_linux_amd64/bin" >> "$GITHUB_PATH"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check whether production inputs changed
        id: impact
        run: |
          serving="$(node scripts/fly-machines-serve-commit.mjs cosyworld --serving || true)"
          grep '^image_commit=' <<< "$serving" >> "$GITHUB_OUTPUT" || true
          sed -n 's/^commit=/serving_commit=/p' <<< "$serving" >> "$GITHUB_OUTPUT"
          base="$(sed -n 's/^commit=//p' <<< "$serving")"
          bash scripts/plan-dev-deploy.sh "${base:-$(node scripts/last-dev-rollout.mjs)}" >> "$GITHUB_OUTPUT"

      # COSYWORLD_DEV_RELEASES=off builds an image for every change. A Rust
      # change ships its server in the release: built, or carried from .dev.
      - name: Choose between a new image and a release on the volume
        id: path
        if: steps.impact.outputs.deploy == 'true'
        env:
          IMAGE_COMMIT: ${{ steps.impact.outputs.image_commit }}
          SERVING_COMMIT: ${{ steps.impact.outputs.serving_commit }}
          RELEASES: ${{ vars.COSYWORLD_DEV_RELEASES }}
        run: |
          if [ "$RELEASES" != off ] && [ -n "$IMAGE_COMMIT" ] &&
            git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$IMAGE_COMMIT"; then
            [ -z "$SERVING_COMMIT" ] || git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$SERVING_COMMIT" || SERVING_COMMIT=""
            node scripts/dev-release.mjs image-input "$IMAGE_COMMIT" "$GITHUB_SHA" $SERVING_COMMIT | tee -a "$GITHUB_OUTPUT"
          else
            echo "image=true" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Record the train
        if: steps.impact.outputs.deploy == 'true'
        env:
          BASE: ${{ steps.impact.outputs.base }}
          DEPLOY: ${{ steps.impact.outputs.deploy }}
        run: bash scripts/dev-train-summary.sh >> "$GITHUB_STEP_SUMMARY"

  # Lint, tests and smokes for main, beside the build. They never hold .dev;
  # a failure turns main red, and the tag's gates keep it out of production.
  # Latest wins: checks start where they last passed, so they cover cancelled ones.
  dev-checks-base:
    name: Find where main's checks last passed
    needs: dev-plan
    if: needs.dev-plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.checked.outputs.base || needs.dev-plan.outputs.base }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: scripts

      - name: Find the commit main's checks last passed
        id: checked
        run: echo "base=$(node scripts/last-dev-rollout.mjs --checked)" >> "$GITHUB_OUTPUT"

  dev-checks:
    name: Check main
    needs: [dev-plan, dev-checks-base]
    if: needs.dev-plan.outputs.deploy == 'true'
    concurrency:
      group: deploy-${{ github.repository }}-dev-checks
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/fast-check.yml
    with:
      base: ${{ needs.dev-checks-base.outputs.base }}

  # Latest wins: a newer main push cancels this build. Only a run that will
  # deploy joins the group, so a no-op run never cancels a real build.
  dev-image:
    name: Build the .dev image
    needs: dev-plan
    if: needs.dev-plan.outputs.deploy == 'true' && needs.dev-plan.outputs.image == 'true'
    concurrency:
      group: deploy-${{ github.repository }}-dev-image${{ needs.dev-plan.outputs.deploy != 'true' && format('-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install image transfer tool
        run: |
          command -v skopeo >/dev/null ||
            { sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo; }

      # Reuse the release target from earlier deploys, so a UI or art change
      # recompiles only what changed.
      - name: Choose release build cache key
        id: release-cache-key
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore release build cache
        id: release-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/release-target
          key: release-target-v1-${{ hashFiles('Dockerfile') }}-${{ steps.release-cache-key.outputs.day }}
          restore-keys: |
            release-target-v1-${{ hashFiles('Dockerfile') }}-
            release-target-v1-

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Prepare primary image
        id: image
        run: bash scripts/prepare-fly-image.sh cosyworld fly.toml
        env:
          COSYWORLD_IMAGE_BUILDER: runner
          COSYWORLD_RELEASE_TARGET_CACHE: ${{ runner.temp }}/release-target
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Save once per UTC day, while the rollout runs. The key leaves out
      # Cargo.lock, which every version bump changes; Cargo rebuilds changed
      # dependencies itself.
      - name: Check release build cache
        id: release-cache-state
        if: >-
          !cancelled() &&
          steps.image.outcome == 'success' &&
          steps.release-cache.outputs.cache-hit != 'true'
        run: |
          if [ -d "$RUNNER_TEMP/release-target/target/release" ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save release build cache
        if: "!cancelled() && steps.release-cache-state.outputs.save == 'true'"
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/release-target
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

  # A Rust change without an image input: only the server is compiled, and
  # .dev stages it with the release. Latest wins, as for the image.
  dev-server:
    name: Compile the .dev server
    needs: dev-plan
    if: needs.dev-plan.outputs.deploy == 'true' && needs.dev-plan.outputs.image != 'true' && needs.dev-plan.outputs.server == 'build'
    concurrency:
      group: deploy-${{ github.repository }}-dev-server
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the server's source
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Dockerfile
            scripts
            v2/ai-model-rust
            v2/rules-rust
            v2/orchestrator-rust
          sparse-checkout-cone-mode: false

      - name: Choose release build cache key
        id: release-cache-key
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore release build cache
        id: release-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/release-target
          key: release-target-v1-${{ hashFiles('Dockerfile') }}-${{ steps.release-cache-key.outputs.day }}
          restore-keys: |
            release-target-v1-${{ hashFiles('Dockerfile') }}-
            release-target-v1-

      - name: Compile the server
        run: bash scripts/compile-release-server.sh "$RUNNER_TEMP/release-target" "$RUNNER_TEMP/server"

      - name: Hand the server to the rollout
        uses: actions/upload-artifact@v7
        with:
          name: dev-server
          path: ${{ runner.temp }}/server/cosyworld-orchestrator
          retention-days: 1
          if-no-files-found: error

      - name: Save release build cache
        if: steps.release-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/release-target
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

  # Rollouts never cancel: a newer one waits, replacing any older waiting one.
  # It skips a commit .dev contains and undoes a rollout that fails a check.
  dev-deploy:
    name: Deploy main to .dev
    needs: [dev-plan, dev-image, dev-server]
    if: >-
      !cancelled() && needs.dev-plan.outputs.deploy == 'true' &&
      (needs.dev-image.result == 'success' || needs.dev-plan.outputs.image != 'true') &&
      (needs.dev-server.result == 'success' || needs.dev-plan.outputs.server != 'build')
    concurrency:
      group: deploy-${{ github.repository }}-dev
      cancel-in-progress: false
    runs-on: ${{ vars.DEV_DEPLOY_RUNNER == 'fly' && fromJSON('["self-hosted","fly","cosyworld"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      rolled-out: ${{ steps.rollout.outcome == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FAST: ${{ needs.dev-plan.outputs.image != 'true' }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            v2/scripts

      - name: Install the GitHub CLI on a Fly runner
        if: runner.environment != 'github-hosted'
        run: |
          command -v gh >/dev/null || {
            curl -fsSL "https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_2.63.2_linux_amd64/bin" >> "$GITHUB_PATH"
          }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Waits while a production deploy is queued or running. Production
      # waits for .dev runs past this step.
      - name: Wait for production deploys
        run: bash scripts/serialize-primary-rollout.sh dev

      - name: Check what .dev serves
        id: serving
        run: |
          release="$(node scripts/fly-machines-serve-commit.mjs cosyworld --serving)"
          echo "$release" >> "$GITHUB_OUTPUT"
          commit="$(sed -n 's/^commit=//p' <<< "$release")"
          status=ahead
          if [ -n "$commit" ]; then
            status="$(gh api "repos/${GH_REPO}/compare/${commit}...${GITHUB_SHA}" --jq .status)" ||
              { echo "::error::Could not compare ${GITHUB_SHA:0:7} with ${commit:0:7}, which .dev serves; not rolling out." >&2; exit 1; }
          fi
          case "$status" in
            ahead | diverged) echo "rollout=true" >> "$GITHUB_OUTPUT" ;;
            identical) echo ".dev already serves ${GITHUB_SHA:0:7}." ;;
            *) echo "::notice::.dev serves ${commit:0:7}, which contains ${GITHUB_SHA:0:7} ($status); not rolling it back." ;;
          esac

      - name: Fetch the compiled server
        if: steps.serving.outputs.rollout == 'true' && needs.dev-plan.outputs.server == 'build'
        uses: actions/download-artifact@v4
        with:
          name: dev-server
          path: ${{ runner.temp }}/server

      - name: Stage the release on .dev
        id: stage
        if: steps.serving.outputs.rollout == 'true' && env.FAST == 'true'
        env:
          IMAGE_COMMIT: ${{ steps.serving.outputs.image_commit }}
          MACHINE: ${{ steps.serving.outputs.machine }}
          SERVER: ${{ needs.dev-plan.outputs.server == 'build' && format('{0}/server/cosyworld-orchestrator', runner.temp) || needs.dev-plan.outputs.server == 'carry' && 'carry' || '' }}
        run: bash scripts/stage-dev-release.sh >> "$GITHUB_OUTPUT"

      # Another Fly release can restore the old image after flyctl reports
      # success (scripts/fly-machines-serve-commit.mjs); roll out again.
      - name: Roll out .dev
        id: rollout
        if: steps.serving.outputs.rollout == 'true' && steps.stage.outputs.unchanged != 'true'
        run: |
          for attempt in 1 2 3; do
            bash scripts/fly-rollout.sh --config fly.toml --image "$RELEASE_IMAGE" --strategy "$STRATEGY" --env "COSYWORLD_SOURCE_COMMIT=$GITHUB_SHA" --env "COSYWORLD_IMAGE_COMMIT=$IMAGE_COMMIT"
            sleep "$SETTLE"
            for poll in $(seq "$POLLS"); do
              node scripts/fly-machines-serve-commit.mjs cosyworld "$GITHUB_SHA" && exit 0
              [ "$poll" = "$POLLS" ] || sleep 3
            done
            echo "::warning::Another Fly release replaced rollout $attempt; rolling out again"
          done
          echo "::error::.dev machines did not keep $GITHUB_SHA after three rollouts" >&2
          exit 1
        env:
          RELEASE_IMAGE: ${{ needs.dev-image.outputs.image || steps.serving.outputs.image }}
          IMAGE_COMMIT: ${{ env.FAST == 'true' && steps.serving.outputs.image_commit || github.sha }}
          STRATEGY: ${{ env.FAST == 'true' && 'immediate' || 'rolling' }}
          SETTLE: ${{ env.FAST == 'true' && '0' || '20' }}
          POLLS: ${{ env.FAST == 'true' && '20' || '1' }}

      - name: Verify primary readiness and persistence
        if: steps.rollout.outcome == 'success'
        env:
          COSYWORLD_EXPECT_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..60}; do
            if node v2/scripts/smoke-deployed-readiness.mjs https://cosyworld.fly.dev; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Primary readiness remained degraded after 120 seconds" >&2
              exit 1
            fi
            echo "::warning::Primary readiness attempt $attempt failed; retrying in 2 seconds"
            sleep 2
          done

      - name: Check .dev booted on the staged release
        if: steps.rollout.outcome == 'success' && env.FAST == 'true'
        env:
          MACHINE: ${{ steps.serving.outputs.machine }}
        run: |
          served="$(timeout 60 flyctl ssh console --quiet --app cosyworld --machine "$MACHINE" --command "readlink /data/releases/current" | tr -d '\r' || true)"
          [ "$served" = "/data/releases/$GITHUB_SHA" ] ||
            { echo "::error::.dev serves ${served:-unknown assets}, not the release staged for ${GITHUB_SHA:0:7}." >&2; exit 1; }

      # The card smoke compares every served file with this commit's.
      - name: Checkout committed release
        if: steps.rollout.outcome == 'success' && env.FAST != 'true'
        uses: actions/checkout@v7
        with:
          path: release

      - name: Verify primary card game
        if: steps.rollout.outcome == 'success'
        run: |
          if [ "$FAST" = true ]; then
            COSYWORLD_SMOKE_MANIFEST="$RUNNER_TEMP/dev-release/manifest.json" node v2/scripts/smoke-deployed-card-game.mjs https://cosyworld.fly.dev
          else
            node release/v2/scripts/smoke-deployed-card-game.mjs https://cosyworld.fly.dev
          fi

      - name: Roll .dev back to ${{ steps.serving.outputs.commit }}
        if: failure() && steps.rollout.outcome != 'skipped' && steps.serving.outputs.image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.serving.outputs.image }}
          PREVIOUS_COMMIT: ${{ steps.serving.outputs.commit }}
          PREVIOUS_IMAGE_COMMIT: ${{ steps.serving.outputs.image_commit }}
        run: |
          echo "::error::${GITHUB_SHA:0:7} failed its .dev rollout or checks; returning .dev to ${PREVIOUS_IMAGE}."
          config=fly.toml
          if [ -n "$PREVIOUS_COMMIT" ] && git fetch --quiet --no-tags --depth=1 origin "$PREVIOUS_COMMIT" &&
            git show "$PREVIOUS_COMMIT:fly.toml" > fly.previous.toml; then
            config=fly.previous.toml
          fi
          bash scripts/fly-rollout.sh --config "$config" --image "$PREVIOUS_IMAGE" --strategy rolling --env "COSYWORLD_SOURCE_COMMIT=$PREVIOUS_COMMIT" --env "COSYWORLD_IMAGE_COMMIT=$PREVIOUS_IMAGE_COMMIT"
          [ -z "$PREVIOUS_COMMIT" ] || node scripts/fly-machines-serve-commit.mjs cosyworld "$PREVIOUS_COMMIT"

  deployment-impact:
    name: Check production impact
    # Tags and production dispatches only; dev-deploy runs the .dev train.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target != 'dev')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check whether production inputs changed
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=explicit deployment or tag release" >> "$GITHUB_OUTPUT"
          else
            node scripts/check-deployment-impact.mjs "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  release-owner:
    name: Confirm committed release still owns production
    needs: deployment-impact
    if: needs.deployment-impact.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads other Deploy runs and cancels older ones this run supersedes.
      actions: write
    outputs:
      owns: ${{ steps.ownership.outputs.owns }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # A newer tag or dispatch supersedes an older production run: cancel
      # an older run that has not started a Fly rollout, and stop this run
      # when a run that supersedes it is already active.
      - name: Yield a superseded main deployment
        id: ownership
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/supersede-production-deploy.mjs start
            exit 0
          fi
          main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "owns=true" >> "$GITHUB_OUTPUT"
            echo "This run owns main at ${GITHUB_SHA:0:7}."
          else
            echo "owns=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Superseded: main advanced to ${main_sha:0:7}; the newer commit will deploy."
          fi

  production-node-gate:
    name: Production Node and content gate
    needs: [deployment-impact, release-owner]
    if: needs.deployment-impact.outputs.deploy == 'true' && needs.release-owner.outputs.owns == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Node and deployment contract checks
        run: |
          npm run v2:worldpack
          npm run v2:syntax
          npx vitest run test/infrastructure/deploy-workflow.test.mjs --reporter=dot
          npm run lint
          npm run check:test-guards
          npm run regen:check

  production-unit:
    name: Production JavaScript unit tests (${{ matrix.shard }}/3)
    needs: [deployment-impact, release-owner]
    if: needs.deployment-impact.outputs.deploy == 'true' && needs.release-owner.outputs.owns == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run unit tests
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=dot

  production-rust-gate:
    name: Production Rust gate
    needs: [deployment-impact, release-owner]
    if: needs.deployment-impact.outputs.deploy == 'true' && needs.release-owner.outputs.owns == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      RUST_TEST_THREADS: "2"
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Restore only: main saves its Rust dependencies daily (rust-cache.yml).
      - name: Restore Cargo build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-deps-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cargo-deps-v1-

      - name: Verify Rust orchestrator tests
        run: bash v2/scripts/check-rust.sh test

  # Lint runs beside the tests, not after them. Clippy builds in its own empty
  # target directory, so it needs no Cargo cache.
  production-rust-lint:
    name: Production Rust architecture and lint
    needs: [deployment-impact, release-owner]
    if: needs.deployment-impact.outputs.deploy == 'true' && needs.release-owner.outputs.owns == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check Rust architecture
        run: |
          bash v2/scripts/check-main-size.sh
          bash v2/scripts/check-rust-lint.sh

  production-gate:
    name: V2 production deployment gate
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target != 'dev')) }}
    needs: [deployment-impact, release-owner, production-node-gate, production-unit, production-rust-gate, production-rust-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required production gates passed
        env:
          DEPLOY: ${{ needs.deployment-impact.outputs.deploy }}
          OWNER_RESULT: ${{ needs.release-owner.result }}
          OWNS_RELEASE: ${{ needs.release-owner.outputs.owns }}
          NODE_RESULT: ${{ needs.production-node-gate.result }}
          UNIT_RESULT: ${{ needs.production-unit.result }}
          RUST_RESULT: ${{ needs.production-rust-gate.result }}
          RUST_LINT_RESULT: ${{ needs.production-rust-lint.result }}
        run: |
          if [ "$DEPLOY" != true ]; then
            echo "No production inputs changed; deployment is not needed."
            exit 0
          fi
          test "$OWNER_RESULT" = success
          if [ "$OWNS_RELEASE" != true ]; then
            echo "This commit was superseded before its production gates; nothing will deploy."
            exit 0
          fi
          test "$NODE_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$RUST_RESULT" = success
          test "$RUST_LINT_RESULT" = success

  # The image builds while the gates run. Building does not touch the running
  # app; only primary-fly replaces it, after the gates and backup pass.
  primary-image:
    name: Prepare primary image
    outputs:
      image: ${{ steps.image.outputs.image }}
    needs: [deployment-impact, release-owner]
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (github.event_name == 'push' ||
       inputs.target == 'both' ||
       inputs.target == 'primary')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Promote .dev's image of this commit, or of an equivalent one.
      - name: Find the image .dev built
        id: dev
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash scripts/await-dev-image.sh
          base="$(node scripts/last-dev-rollout.mjs)"
          if [ -n "$base" ] && [ "$base" != "$GITHUB_SHA" ]; then
            git fetch --quiet --no-tags --depth=1 origin "$base" || true
            if node scripts/check-deployment-impact.mjs "$base" "$GITHUB_SHA" | grep -qx deploy=false; then
              echo "commit=$base" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo

      - name: Prepare primary image
        id: image
        run: bash scripts/prepare-fly-image.sh cosyworld fly.toml
        env:
          COSYWORLD_IMAGE_BUILDER: runner
          EQUIVALENT_COMMIT: ${{ steps.dev.outputs.commit }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Run the guards and rollback snapshot beside the checks and image build.
  # Tags and dispatches wait for all three paths; a main push skips this job.
  primary-backup:
    name: Guard and back up primary
    needs: [deployment-impact, release-owner]
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'primary')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for a .dev rollout to finish
        run: bash scripts/serialize-primary-rollout.sh production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The snapshot must follow any other production rollout of this app.
      - name: Wait for other production rollouts
        run: node scripts/supersede-production-deploy.mjs wait primary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard primary volume free space
        timeout-minutes: 2
        run: scripts/check-fly-volume-space.sh cosyworld /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create rollback backup
        run: scripts/backup-fly-v2.sh cosyworld primary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  primary-fly:
    name: Deploy primary to Fly
    needs: [deployment-impact, release-owner, production-gate, primary-image, primary-backup]
    # Tags and dispatches require the gates and backup to succeed. Main
    # pushes never reach this job; dev-deploy rolls them out.
    if: >-
      !cancelled() &&
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      needs.primary-image.result == 'success' &&
      (github.event_name == 'push' ||
       inputs.target == 'both' ||
       inputs.target == 'primary') &&
      needs.production-gate.result == 'success' &&
      needs.primary-backup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for a .dev rollout to finish
        run: bash scripts/serialize-primary-rollout.sh production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Waits for an older production rollout of this app, then skips this
      # rollout when a newer production run supersedes this one.
      - name: Yield to a newer production deploy
        id: claim
        run: node scripts/supersede-production-deploy.mjs claim primary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Setup flyctl
        if: steps.claim.outputs.superseded != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy primary Fly app
        id: deploy
        if: steps.claim.outputs.superseded != 'true'
        run: bash scripts/fly-rollout.sh --config fly.toml --image "$RELEASE_IMAGE" --strategy rolling --env "COSYWORLD_SOURCE_COMMIT=$GITHUB_SHA"
        env:
          COSYWORLD_FLY_WAIT_TIMEOUT: 5m
          RELEASE_IMAGE: ${{ needs.primary-image.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify primary readiness and persistence
        if: steps.claim.outputs.superseded != 'true'
        run: |
          for attempt in {1..13}; do
            if node v2/scripts/smoke-deployed-readiness.mjs https://cosyworld.fly.dev; then
              exit 0
            fi
            if [ "$attempt" -eq 13 ]; then
              echo "Primary readiness remained degraded after 120 seconds" >&2
              exit 1
            fi
            echo "::warning::Primary readiness attempt $attempt failed; retrying in 10 seconds"
            sleep 10
          done

      - name: Verify primary card game
        if: steps.claim.outputs.superseded != 'true'
        run: node v2/scripts/smoke-deployed-card-game.mjs https://cosyworld.fly.dev

  # The primary app is also .dev. A tag of a commit main has moved past rolled
  # .dev back to it (v1.2.107 replaced 03b2082 at 03:29 on 2026-11-01), so
  # "tag it from .dev" then named an old commit. Roll .dev forward again to
  # the newer main commit it ran before this tag, from that commit's image.
  restore-dev:
    name: Return .dev to the main commit it ran
    needs: [primary-fly]
    # `!cancelled()` replaces the implicit `success()`, which is false when
    # any job upstream of primary-fly was skipped (dev-deploy always is on a
    # tag), so v1.2.116 and v1.2.117 skipped this job. A partial rerun can
    # drop primary-fly's outputs, so the first step also reads the rollout
    # step's result from every attempt of this run.
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.primary-fly.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # A superseded tag skipped its rollout step, so .dev serves another
      # commit and there is nothing to return.
      - name: Confirm this tag rolled out to the primary app
        id: rolled
        env:
          DEPLOYED: ${{ needs.primary-fly.outputs.deployed }}
        run: |
          if [ "$DEPLOYED" = "true" ] || scripts/rolled-out-in-run.sh "Deploy primary to Fly" "Deploy primary Fly app"; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "This run did not roll out the tag; nothing to restore."
          fi

      # The newest earlier rollout, leaving out this run, is what .dev ran:
      # the last train's commit, so this restores it and deploys nothing new.
      # Only a newer commit on main is restored; an unreadable list keeps the
      # tag, and the next .dev train deploys main as before.
      - name: Find the commit .dev ran before this tag
        id: previous
        if: steps.rolled.outputs.deployed == 'true'
        run: |
          sha="$(node scripts/last-dev-rollout.mjs)"
          status=""
          if [ -n "$sha" ] && [ "$sha" != "$GITHUB_SHA" ]; then
            status="$(gh api "repos/${GH_REPO}/compare/${GITHUB_SHA}...${sha}" --jq .status || true)"
          fi
          if [ "$status" = ahead ]; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo ".dev ran ${sha:0:7}, ahead of the tag; restoring it."
          else
            echo "Nothing newer to restore (${sha:0:7} ${status:-none})."
          fi

      # The smokes compare .dev with the files and commit it should serve.
      - name: Check out the commit to restore
        if: steps.previous.outputs.sha != ''
        run: git checkout --quiet "$DEV_SHA"
        env:
          DEV_SHA: ${{ steps.previous.outputs.sha }}

      - name: Setup flyctl
        if: steps.previous.outputs.sha != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Keep the restored SHA in the job record for the next train or tag.
      - name: Roll .dev forward to ${{ steps.previous.outputs.sha }}
        if: steps.previous.outputs.sha != ''
        run: |
          built="$(timeout 60 flyctl ssh console --quiet --app cosyworld --command "cat /data/releases/${DEV_SHA}/image" | tr -dc 0-9a-f || true)"
          [[ "$built" =~ ^[0-9a-f]{40}$ ]] || built="$DEV_SHA"
          bash scripts/fly-rollout.sh --config fly.toml --image "registry.fly.io/cosyworld:deploy-${built}" --strategy rolling --env "COSYWORLD_SOURCE_COMMIT=${DEV_SHA}" --env "COSYWORLD_IMAGE_COMMIT=${built}"
        env:
          DEV_SHA: ${{ steps.previous.outputs.sha }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify .dev readiness and card game
        if: steps.previous.outputs.sha != ''
        env:
          DEV_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          for attempt in {1..13}; do
            if node v2/scripts/smoke-deployed-readiness.mjs https://cosyworld.fly.dev; then
              GITHUB_SHA="$DEV_SHA" exec node v2/scripts/smoke-deployed-card-game.mjs https://cosyworld.fly.dev
            fi
            echo "::warning::.dev readiness attempt $attempt failed; retrying in 10 seconds"
            sleep 10
          done
          echo ".dev readiness remained degraded after 120 seconds" >&2
          exit 1

  # Copy the primary build into the Lonely Forest registry with its own token.
  lonelyforest-image:
    name: Prepare Lonely Forest image
    needs: [deployment-impact, release-owner, primary-image]
    outputs:
      image: ${{ steps.image.outputs.image }}
    # Ordinary .dev trains must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      !cancelled() &&
      (needs.primary-image.result == 'success' || needs.primary-image.result == 'skipped') &&
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'lonelyforest')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo

      - name: Prepare Lonely Forest image
        id: image
        run: bash scripts/prepare-fly-image.sh cosyworld-lonelyforest fly.lonelyforest.toml
        env:
          COSYWORLD_IMAGE_BUILDER: runner
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}
          FLY_SOURCE_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SOURCE_IMAGE: ${{ needs.primary-image.outputs.image }}

  lonelyforest-backup:
    name: Guard and back up Lonely Forest
    needs: [deployment-impact, release-owner]
    # Ordinary .dev trains must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'lonelyforest')))
    runs-on: ubuntu-latest
    environment: lonelyforest-production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The snapshot must follow any other production rollout of this app.
      - name: Wait for other production rollouts
        run: node scripts/supersede-production-deploy.mjs wait lonelyforest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard Lonely Forest volume free space
        timeout-minutes: 2
        run: scripts/check-fly-volume-space.sh cosyworld-lonelyforest /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Create rollback backup
        run: scripts/backup-fly-v2.sh cosyworld-lonelyforest lonelyforest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

  lonelyforest-fly:
    name: Deploy Lonely Forest to Fly
    needs: [deployment-impact, release-owner, production-gate, lonelyforest-image, lonelyforest-backup]
    # Ordinary .dev trains must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      !cancelled() &&
      needs.production-gate.result == 'success' &&
      needs.lonelyforest-image.result == 'success' &&
      needs.lonelyforest-backup.result == 'success' &&
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'lonelyforest')))
    runs-on: ubuntu-latest
    environment: lonelyforest-production
    permissions:
      contents: read
      actions: read
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    # No job concurrency group: GitHub keeps one pending job per group. The
    # claim step serializes Lonely Forest rollouts instead.
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Waits for an older production rollout of this app, then skips this
      # rollout when a newer production run supersedes this one.
      - name: Yield to a newer production deploy
        id: claim
        run: node scripts/supersede-production-deploy.mjs claim lonelyforest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Setup flyctl
        if: steps.claim.outputs.superseded != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Lonely Forest
        id: deploy
        if: steps.claim.outputs.superseded != 'true'
        run: |
          for attempt in 1 2; do
            if bash scripts/fly-rollout.sh --config fly.lonelyforest.toml --image "$RELEASE_IMAGE" --ha=false --strategy rolling --env "COSYWORLD_SOURCE_COMMIT=$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::Lonely Forest deploy polling failed; retrying once in 15 seconds"
            sleep 15
          done
        env:
          COSYWORLD_FLY_WAIT_TIMEOUT: 5m
          RELEASE_IMAGE: ${{ needs.lonelyforest-image.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Verify Lonely Forest readiness and persistence
        if: steps.claim.outputs.superseded != 'true'
        run: |
          for attempt in {1..13}; do
            if node v2/scripts/smoke-deployed-readiness.mjs https://lonelyforest.com; then
              exit 0
            fi
            if [ "$attempt" -eq 13 ]; then
              echo "Lonely Forest readiness remained degraded after 120 seconds" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify Lonely Forest card game
        if: steps.claim.outputs.superseded != 'true'
        run: node v2/scripts/smoke-deployed-card-game.mjs https://lonelyforest.com https://www.lonelyforest.com https://cosyworld-lonelyforest.fly.dev

  deploy-outcome:
    name: Report production deployment outcome
    runs-on: ubuntu-latest
    needs:
      - dev-plan
      - dev-image
      - dev-deploy
      - deployment-impact
      - release-owner
      - production-gate
      - primary-image
      - primary-backup
      - primary-fly
      - restore-dev
      - lonelyforest-image
      - lonelyforest-backup
      - lonelyforest-fly
    # A run a newer one cancelled owns nothing; the newer run reports for it
    # (#1044). A .dev run that deploys nothing has nothing to report.
    if: ${{ !cancelled() && needs.dev-plan.outputs.deploy != 'false' }}
    permissions:
      contents: read
      issues: write
      # Reads this run's job timings for the summary line.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      # One line of where this run's time went; `npm run deploy:timings`
      # reports the same numbers across recent runs.
      - name: Record deploy timings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/deploy-timings.mjs --run "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY" || true

      # A merge to main that produces no successful deploy must be visible
      # without anyone going to look.
      - name: Open a loud tracking issue when a required production deploy did not succeed
        if: >-
          needs.dev-plan.result == 'failure' ||
          needs.dev-image.result == 'failure' ||
          needs.dev-deploy.result == 'failure' ||
          (needs.deployment-impact.outputs.deploy == 'true' &&
          (needs.release-owner.result == 'failure' ||
           needs.production-gate.result != 'success' ||
           contains(fromJSON('["failure","cancelled"]'), needs.primary-image.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.primary-backup.result) ||
           needs.primary-fly.result == 'failure' ||
           needs.restore-dev.result == 'failure' ||
           contains(fromJSON('["failure","cancelled"]'), needs.lonelyforest-image.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.lonelyforest-backup.result) ||
           needs.lonelyforest-fly.result == 'failure'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEV_RESULT: build ${{ needs.dev-image.result }}, rollout ${{ needs.dev-deploy.result }}
          TRIGGER: ${{ ((github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') || inputs.target == 'dev') && '.dev train' || format('{0} {1}', github.event_name, github.ref) }}
          OWNER_RESULT: ${{ needs.release-owner.result }}
          GATE_RESULT: ${{ needs.production-gate.result }}
          PRIMARY_IMAGE_RESULT: ${{ needs.primary-image.result }}
          PRIMARY_BACKUP_RESULT: ${{ needs.primary-backup.result }}
          PRIMARY_RESULT: ${{ needs.primary-fly.result }}
          RESTORE_DEV_RESULT: ${{ needs.restore-dev.result }}
          LONELYFOREST_IMAGE_RESULT: ${{ needs.lonelyforest-image.result }}
          LONELYFOREST_BACKUP_RESULT: ${{ needs.lonelyforest-backup.result }}
          LONELYFOREST_RESULT: ${{ needs.lonelyforest-fly.result }}
        run: |
          title="Production did not deploy ${GITHUB_SHA:0:7}"
          body=$(cat <<BODY
          Merge of ${GITHUB_SHA} did not complete a production deployment.

          - .dev train deploy: ${DEV_RESULT}
          - Release ownership check: ${OWNER_RESULT}
          - Deployment gate: ${GATE_RESULT}
          - Primary image build: ${PRIMARY_IMAGE_RESULT}
          - Primary guards and backup: ${PRIMARY_BACKUP_RESULT}
          - Primary Fly deploy: ${PRIMARY_RESULT}
          - .dev returned to main: ${RESTORE_DEV_RESULT}
          - Lonely Forest image build: ${LONELYFOREST_IMAGE_RESULT}
          - Lonely Forest guards and backup: ${LONELYFOREST_BACKUP_RESULT}
          - Lonely Forest Fly deploy: ${LONELYFOREST_RESULT}
          - Run log: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}
          - Trigger: ${TRIGGER}

          Production may still be serving the previous release. Investigate before merging further changes that require a deploy.
          BODY
          )
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq 'length')"
          if [ "${existing:-0}" -eq 0 ]; then
            gh issue create --title "$title" --body "$body"
          else
            echo "A tracking issue for ${GITHUB_SHA:0:7} already exists."
          fi

      # A .dev train deploys only the primary app (#1414), so it closes the
      # issues other trains (or the main pushes before them) opened once the
      # primary ships. Tag and dispatch runs must ship both apps, and only
      # they close issues that a release run opened, so a Lonely Forest
      # failure stays open until a release deploys it.
      - name: Close tracking issues for commits this deploy shipped
        if: >-
          (needs.dev-deploy.result == 'success' &&
           needs.dev-deploy.outputs.rolled-out == 'true') ||
          (needs.primary-fly.outputs.deployed == 'true' &&
           needs.lonelyforest-fly.outputs.deployed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEV_TRAIN: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch') || inputs.target == 'dev' }}
        run: |
          if [ "$DEV_TRAIN" = "true" ]; then
            scope="the primary app"
          else
            scope="both production apps"
          fi
          gh api --paginate "repos/${GH_REPO}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | select(.title | test("^Production did not deploy [0-9a-f]{7,40}$")) | "\(.number) \(.title | split(" ") | last) \((.body // "") | test("- Trigger: (push refs/heads/main|\\.dev train)\\r?\\n"))"' |
          while read -r number sha from_dev_train; do
            if [ "$DEV_TRAIN" = "true" ] && [ "$from_dev_train" != "true" ]; then
              echo "Leaving #${number} open: a release run opened it, so a release deploy must close it."
              continue
            fi
            status="$(gh api "repos/${GH_REPO}/compare/${sha}...${GITHUB_SHA}" --jq .status 2>/dev/null || true)"
            if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
              gh issue close "$number" --reason completed \
                --comment "Shipped: ${scope} deployed ${GITHUB_SHA:0:7}, which contains ${sha}. ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
            fi
          done

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    # A tag superseded by a newer release before its rollouts gets no release.
    # `!cancelled()` replaces the implicit `success()`, which is false when
    # any upstream job was skipped (dev-deploy always is on a tag), so
    # v1.2.116 and v1.2.117 got no release. The first step decides whether
    # this tag shipped, from the rollout outputs or, when a partial rerun
    # dropped them, from the rollout steps of every attempt of this run.
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.primary-fly.result == 'success' &&
      needs.lonelyforest-fly.result == 'success'
    needs: [production-gate, primary-fly, lonelyforest-fly]
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Confirm both apps rolled out this tag
        id: shipped
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRIMARY_DEPLOYED: ${{ needs.primary-fly.outputs.deployed }}
          LONELYFOREST_DEPLOYED: ${{ needs.lonelyforest-fly.outputs.deployed }}
        run: |
          if { [ "$PRIMARY_DEPLOYED" = "true" ] || scripts/rolled-out-in-run.sh "Deploy primary to Fly" "Deploy primary Fly app"; } &&
             { [ "$LONELYFOREST_DEPLOYED" = "true" ] || scripts/rolled-out-in-run.sh "Deploy Lonely Forest to Fly" "Deploy Lonely Forest"; }; then
            echo "shipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer release superseded this tag before its rollouts; no GitHub release."
          fi

      - name: Create release notes
        if: steps.shipped.outputs.shipped == 'true'
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
