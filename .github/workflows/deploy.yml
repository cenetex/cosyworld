name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Committed production target to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - primary
          - lonelyforest
      lonelyforest_recovery_capture:
        description: Reviewed committed capture path, only when Lonely Forest's live /meta is unavailable
        required: false
        default: ""
        type: string
      primary_recovery_capture:
        description: Reviewed committed capture path, only when the primary app's live /meta is unavailable
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # A main push deploys .dev from this one job, so it waits for one runner,
  # not five in a row. It skips the production gates, primary backup, and
  # Lonely Forest; CI still checks main, and bugs on .dev are fixed forward.
  # Tags and dispatches use the jobs below, which this job never touches.
  dev-deploy:
    name: Deploy main to .dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Lets a superseded main run cancel itself so the newer one starts.
      actions: write
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
      rolled-out: ${{ steps.rollout.outcome == 'success' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      # Main moves often. A run whose commit is no longer main's head cancels
      # itself before the rollout; the newer run deploys every change .dev
      # does not have yet. The rollout itself is never cancelled.
      - name: Yield to a newer main commit
        run: bash scripts/yield-superseded-deploy.sh check

      # Compare with the commit .dev actually runs, not the previous push, so
      # a docs-only commit after a cancelled code commit still deploys it.
      - name: Check whether production inputs changed
        id: impact
        run: |
          base="$(node scripts/last-dev-rollout.mjs)"
          if [ -n "$base" ]; then
            echo "The primary app last rolled out ${base:0:7}."
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          node scripts/check-deployment-impact.mjs "$base" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup flyctl
        if: steps.impact.outputs.deploy == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install image transfer tool
        if: steps.impact.outputs.deploy == 'true'
        run: |
          command -v skopeo >/dev/null ||
            { sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo; }

      # Reuse the release target from earlier deploys, so a UI or art change
      # recompiles only what changed.
      - name: Choose release build cache key
        id: release-cache-key
        if: steps.impact.outputs.deploy == 'true'
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore release build cache
        id: release-cache
        if: steps.impact.outputs.deploy == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/release-target
          key: release-target-v1-${{ hashFiles('Dockerfile') }}-${{ steps.release-cache-key.outputs.day }}
          restore-keys: |
            release-target-v1-${{ hashFiles('Dockerfile') }}-
            release-target-v1-

      # build.rs runs Node to generate the embedded card asset list.
      - name: Setup Node.js
        if: steps.impact.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The watcher cancels this run if main moves while the image builds.
      - name: Prepare primary image
        id: image
        if: steps.impact.outputs.deploy == 'true'
        run: |
          bash scripts/yield-superseded-deploy.sh watch &
          watcher=$!
          status=0
          bash scripts/prepare-fly-image.sh cosyworld fly.toml || status=$?
          kill "$watcher" 2>/dev/null || true
          wait "$watcher" 2>/dev/null || true
          exit "$status"
        env:
          COSYWORLD_IMAGE_BUILDER: runner
          COSYWORLD_RELEASE_TARGET_CACHE: ${{ runner.temp }}/release-target
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Yield to a newer main commit before the rollout
        if: steps.impact.outputs.deploy == 'true'
        run: bash scripts/yield-superseded-deploy.sh check

      - name: Roll out .dev
        id: rollout
        if: steps.impact.outputs.deploy == 'true'
        run: flyctl deploy --config fly.toml --image "$RELEASE_IMAGE" --strategy rolling --env "COSYWORLD_SOURCE_COMMIT=$GITHUB_SHA"
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify primary readiness and persistence
        if: steps.impact.outputs.deploy == 'true'
        run: |
          # A fresh process may take a moment to report healthy persistence
          # after a rolling deploy; retry for two minutes before failing.
          for attempt in {1..13}; do
            if node v2/scripts/smoke-deployed-readiness.mjs https://cosyworld.fly.dev; then
              exit 0
            fi
            if [ "$attempt" -eq 13 ]; then
              echo "Primary readiness remained degraded after 120 seconds" >&2
              exit 1
            fi
            echo "::warning::Primary readiness attempt $attempt failed; retrying in 10 seconds"
            sleep 10
          done

      - name: Verify primary card game
        if: steps.impact.outputs.deploy == 'true'
        run: node v2/scripts/smoke-deployed-card-game.mjs https://cosyworld.fly.dev

      # Save once per UTC day, after .dev is live. The key leaves out
      # Cargo.lock, which every version bump changes; Cargo rebuilds changed
      # dependencies itself.
      - name: Check release build cache
        id: release-cache-state
        if: >-
          !cancelled() &&
          steps.image.outcome == 'success' &&
          steps.release-cache.outputs.cache-hit != 'true'
        run: |
          if [ -d "$RUNNER_TEMP/release-target/target/release" ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save release build cache
        if: "!cancelled() && steps.release-cache-state.outputs.save == 'true'"
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/release-target
          key: ${{ steps.release-cache.outputs.cache-primary-key }}

  deployment-impact:
    name: Check production impact
    # Tags and dispatches only; dev-deploy deploys main pushes.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check whether production inputs changed
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=explicit deployment or tag release" >> "$GITHUB_OUTPUT"
          else
            node scripts/check-deployment-impact.mjs "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  release-owner:
    name: Confirm committed release still owns production
    needs: deployment-impact
    if: needs.deployment-impact.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      owns: ${{ steps.ownership.outputs.owns }}
    steps:
      - name: Yield a superseded main deployment
        id: ownership
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "owns=true" >> "$GITHUB_OUTPUT"
            echo "Explicit deployment owns its committed target."
            exit 0
          fi
          main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "owns=true" >> "$GITHUB_OUTPUT"
            echo "This run owns main at ${GITHUB_SHA:0:7}."
          else
            echo "owns=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Superseded: main advanced to ${main_sha:0:7}; the newer commit will deploy."
          fi

  production-node-gate:
    name: Production Node and content gate
    needs: [deployment-impact, release-owner]
    # A main push deploys .dev without this gate; CI still checks main. Tags
    # and manual dispatches keep it.
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Node and deployment contract checks
        run: |
          npm run v2:worldpack
          npm run v2:kernel
          npm run v2:syntax
          npx vitest run test/infrastructure/deploy-workflow.test.mjs --reporter=dot

  production-rust-gate:
    name: Production Rust gate
    needs: [deployment-impact, release-owner]
    # A main push deploys .dev without this gate; CI still checks main. Tags
    # and manual dispatches keep it.
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    env:
      CI: true
      RUST_TEST_THREADS: "2"
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # A manual main CI run, required before a tag, runs the same Rust tests
      # and lint. Reuse its result for this exact commit; run the checks here
      # only when CI did not run them, was cancelled, or failed.
      - name: Reuse CI Rust checks for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/await-ci-rust.mjs >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        if: steps.ci.outputs.reuse != 'true'
        uses: dtolnay/rust-toolchain@stable

      # build.rs runs Node to generate the embedded card asset list.
      - name: Setup Node.js
        if: steps.ci.outputs.reuse != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Restore Cargo build cache
        if: steps.ci.outputs.reuse != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-compact-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-compact-v1-

      - name: Verify Rust orchestrator tests
        if: steps.ci.outputs.reuse != 'true'
        run: bash v2/scripts/check-rust.sh test

  # Lint runs beside the tests, not after them. Clippy builds in its own empty
  # target directory, so it needs no Cargo cache and shares nothing with the
  # test build; in sequence it added about two minutes to every release.
  production-rust-lint:
    name: Production Rust architecture and lint
    needs: [deployment-impact, release-owner]
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    env:
      CI: true
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Reuse CI Rust checks for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/await-ci-rust.mjs >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        if: steps.ci.outputs.reuse != 'true'
        uses: dtolnay/rust-toolchain@stable

      # build.rs runs Node to generate the embedded card asset list.
      - name: Setup Node.js
        if: steps.ci.outputs.reuse != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check Rust architecture
        if: steps.ci.outputs.reuse != 'true'
        run: |
          bash v2/scripts/check-main-size.sh
          bash v2/scripts/check-rust-lint.sh

  production-gate:
    name: V2 production deployment gate
    # A main push deploys from dev-deploy, which needs no gate, so it skips
    # this job instead of holding a runner to report that.
    if: ${{ always() && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) }}
    needs: [deployment-impact, release-owner, production-node-gate, production-rust-gate, production-rust-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required production gates passed
        env:
          DEPLOY: ${{ needs.deployment-impact.outputs.deploy }}
          OWNER_RESULT: ${{ needs.release-owner.result }}
          OWNS_RELEASE: ${{ needs.release-owner.outputs.owns }}
          NODE_RESULT: ${{ needs.production-node-gate.result }}
          RUST_RESULT: ${{ needs.production-rust-gate.result }}
          RUST_LINT_RESULT: ${{ needs.production-rust-lint.result }}
          FULL_RELEASE: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          if [ "$DEPLOY" != true ]; then
            echo "No production inputs changed; deployment is not needed."
            exit 0
          fi
          test "$OWNER_RESULT" = success
          if [ "$OWNS_RELEASE" != true ]; then
            echo "This commit was superseded before its production gates; nothing will deploy."
            exit 0
          fi
          if [ "$FULL_RELEASE" != true ]; then
            echo "Main push: .dev deploys without the production gates; CI checks main."
            exit 0
          fi
          test "$NODE_RESULT" = success
          test "$RUST_RESULT" = success
          test "$RUST_LINT_RESULT" = success

  # The image builds while the gates run. Building does not touch the running
  # app; only primary-fly replaces it, after the gates and backup pass.
  primary-image:
    name: Prepare primary image
    outputs:
      image: ${{ steps.image.outputs.image }}
    needs: [deployment-impact, release-owner]
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (github.event_name == 'push' ||
       inputs.target == 'both' ||
       inputs.target == 'primary')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo

      # Tags and dispatches compile inside the Dockerfile from the registry
      # dependency cache, unless an image for this commit already exists.
      - name: Prepare primary image
        id: image
        run: bash scripts/prepare-fly-image.sh cosyworld fly.toml
        env:
          COSYWORLD_IMAGE_BUILDER: runner
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Run the guards and rollback snapshot beside the checks and image build.
  # Tags and dispatches wait for all three paths; a main push skips this job.
  primary-backup:
    name: Guard and back up primary
    needs: [deployment-impact, release-owner]
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'primary')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard primary volume free space
        timeout-minutes: 2
        run: scripts/check-fly-volume-space.sh cosyworld /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # An unreachable primary app fails this gate closed, which blocks the very
      # deploy that would fix it. Supply a reviewed committed capture of the
      # last known /meta to recover; the captured hash is still evaluated
      # against the candidate registry exactly like a live identity.
      - name: Guard primary worldpack bundle compatibility
        run: |
          if [ -n "$COSYWORLD_PRIMARY_RECOVERY_CAPTURE" ]; then
            node v2/scripts/check-deploy-worldpack.mjs https://cosyworld.fly.dev \
              --recovery-capture "$COSYWORLD_PRIMARY_RECOVERY_CAPTURE"
          else
            node v2/scripts/check-deploy-worldpack.mjs https://cosyworld.fly.dev
          fi
        env:
          COSYWORLD_PRIMARY_RECOVERY_CAPTURE: ${{ inputs.primary_recovery_capture }}

      - name: Create rollback backup
        run: scripts/backup-fly-v2.sh cosyworld primary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  primary-fly:
    name: Deploy primary to Fly
    needs: [deployment-impact, release-owner, production-gate, primary-image, primary-backup]
    # Tags and dispatches require the gates and backup to succeed. Main
    # pushes never reach this job; dev-deploy rolls them out.
    if: >-
      !cancelled() &&
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      needs.primary-image.result == 'success' &&
      (github.event_name == 'push' ||
       inputs.target == 'both' ||
       inputs.target == 'primary') &&
      needs.production-gate.result == 'success' &&
      needs.primary-backup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy primary Fly app
        run: flyctl deploy --config fly.toml --image "$RELEASE_IMAGE" --strategy rolling --env "COSYWORLD_SOURCE_COMMIT=$GITHUB_SHA"
        env:
          RELEASE_IMAGE: ${{ needs.primary-image.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify primary readiness and persistence
        run: |
          # A fresh process may take a moment to report healthy persistence
          # after a rolling deploy; retry for two minutes before failing.
          for attempt in {1..13}; do
            if node v2/scripts/smoke-deployed-readiness.mjs https://cosyworld.fly.dev; then
              exit 0
            fi
            if [ "$attempt" -eq 13 ]; then
              echo "Primary readiness remained degraded after 120 seconds" >&2
              exit 1
            fi
            echo "::warning::Primary readiness attempt $attempt failed; retrying in 10 seconds"
            sleep 10
          done

      - name: Verify primary card game
        run: node v2/scripts/smoke-deployed-card-game.mjs https://cosyworld.fly.dev

  # Copy the primary build into the Lonely Forest registry with separate
  # app tokens. A Lonely Forest-only release builds directly in its registry.
  lonelyforest-image:
    name: Prepare Lonely Forest image
    needs: [deployment-impact, release-owner, primary-image]
    outputs:
      image: ${{ steps.image.outputs.image }}
    # Ordinary main pushes must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      !cancelled() &&
      (needs.primary-image.result == 'success' || needs.primary-image.result == 'skipped') &&
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'lonelyforest')))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo

      - name: Prepare Lonely Forest image
        id: image
        run: bash scripts/prepare-fly-image.sh cosyworld-lonelyforest fly.lonelyforest.toml
        env:
          COSYWORLD_IMAGE_BUILDER: runner
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}
          FLY_SOURCE_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SOURCE_IMAGE: ${{ needs.primary-image.outputs.image }}

  lonelyforest-backup:
    name: Guard and back up Lonely Forest
    needs: [deployment-impact, release-owner]
    # Ordinary main pushes must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'lonelyforest')))
    runs-on: ubuntu-latest
    environment: lonelyforest-production
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard Lonely Forest volume free space
        timeout-minutes: 2
        run: scripts/check-fly-volume-space.sh cosyworld-lonelyforest /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Guard Lonely Forest worldpack bundle compatibility
        run: |
          if [ -n "$COSYWORLD_LONELYFOREST_RECOVERY_CAPTURE" ]; then
            node v2/scripts/check-deploy-worldpack.mjs https://lonelyforest.com \
              --recovery-capture "$COSYWORLD_LONELYFOREST_RECOVERY_CAPTURE"
          else
            node v2/scripts/check-deploy-worldpack.mjs https://lonelyforest.com
          fi
        env:
          COSYWORLD_LONELYFOREST_RECOVERY_CAPTURE: ${{ inputs.lonelyforest_recovery_capture }}

      - name: Create rollback backup
        run: scripts/backup-fly-v2.sh cosyworld-lonelyforest lonelyforest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

  lonelyforest-fly:
    name: Deploy Lonely Forest to Fly
    needs: [deployment-impact, release-owner, production-gate, lonelyforest-image, lonelyforest-backup]
    # Ordinary main pushes must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      !cancelled() &&
      needs.production-gate.result == 'success' &&
      needs.lonelyforest-image.result == 'success' &&
      needs.lonelyforest-backup.result == 'success' &&
      needs.deployment-impact.outputs.deploy == 'true' &&
      needs.release-owner.outputs.owns == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'lonelyforest')))
    runs-on: ubuntu-latest
    environment: lonelyforest-production
    concurrency:
      group: deploy-lonelyforest-production
      cancel-in-progress: false
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Lonely Forest
        run: |
          for attempt in 1 2; do
            if flyctl deploy --config fly.lonelyforest.toml --image "$RELEASE_IMAGE" --ha=false --strategy rolling --env "COSYWORLD_SOURCE_COMMIT=$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::Lonely Forest deploy polling failed; retrying once in 15 seconds"
            sleep 15
          done
        env:
          RELEASE_IMAGE: ${{ needs.lonelyforest-image.outputs.image }}
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Verify Lonely Forest readiness and persistence
        run: |
          for attempt in {1..13}; do
            if node v2/scripts/smoke-deployed-readiness.mjs https://lonelyforest.com; then
              exit 0
            fi
            if [ "$attempt" -eq 13 ]; then
              echo "Lonely Forest readiness remained degraded after 120 seconds" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify Lonely Forest card game
        run: node v2/scripts/smoke-deployed-card-game.mjs https://lonelyforest.com https://www.lonelyforest.com https://cosyworld-lonelyforest.fly.dev

  deploy-outcome:
    name: Report production deployment outcome
    runs-on: ubuntu-latest
    needs:
      - dev-deploy
      - deployment-impact
      - release-owner
      - production-gate
      - primary-image
      - primary-backup
      - primary-fly
      - lonelyforest-image
      - lonelyforest-backup
      - lonelyforest-fly
    # A queued run that a newer run in the deploy concurrency group replaced
    # (a version tag on the same commit, or a later main push) is cancelled
    # and owns nothing; the newer run reports for it (#1044). A main run that
    # a newer main commit superseded cancels itself the same way.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
    steps:
      # A merge to main that produces no successful deploy must be visible
      # without anyone going to look.
      - name: Open a loud tracking issue when a required production deploy did not succeed
        if: >-
          needs.dev-deploy.result == 'failure' ||
          (needs.deployment-impact.outputs.deploy == 'true' &&
          (needs.release-owner.result == 'failure' ||
           needs.production-gate.result != 'success' ||
           contains(fromJSON('["failure","cancelled"]'), needs.primary-image.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.primary-backup.result) ||
           needs.primary-fly.result == 'failure' ||
           contains(fromJSON('["failure","cancelled"]'), needs.lonelyforest-image.result) ||
           contains(fromJSON('["failure","cancelled"]'), needs.lonelyforest-backup.result) ||
           needs.lonelyforest-fly.result == 'failure'))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEV_RESULT: ${{ needs.dev-deploy.result }}
          OWNER_RESULT: ${{ needs.release-owner.result }}
          GATE_RESULT: ${{ needs.production-gate.result }}
          PRIMARY_IMAGE_RESULT: ${{ needs.primary-image.result }}
          PRIMARY_BACKUP_RESULT: ${{ needs.primary-backup.result }}
          PRIMARY_RESULT: ${{ needs.primary-fly.result }}
          LONELYFOREST_IMAGE_RESULT: ${{ needs.lonelyforest-image.result }}
          LONELYFOREST_BACKUP_RESULT: ${{ needs.lonelyforest-backup.result }}
          LONELYFOREST_RESULT: ${{ needs.lonelyforest-fly.result }}
        run: |
          title="Production did not deploy ${GITHUB_SHA:0:7}"
          body=$(cat <<BODY
          Merge of ${GITHUB_SHA} did not complete a production deployment.

          - Main push .dev deploy: ${DEV_RESULT}
          - Release ownership check: ${OWNER_RESULT}
          - Deployment gate: ${GATE_RESULT}
          - Primary image build: ${PRIMARY_IMAGE_RESULT}
          - Primary guards and backup: ${PRIMARY_BACKUP_RESULT}
          - Primary Fly deploy: ${PRIMARY_RESULT}
          - Lonely Forest image build: ${LONELYFOREST_IMAGE_RESULT}
          - Lonely Forest guards and backup: ${LONELYFOREST_BACKUP_RESULT}
          - Lonely Forest Fly deploy: ${LONELYFOREST_RESULT}
          - Run log: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}
          - Trigger: ${GITHUB_EVENT_NAME} ${GITHUB_REF}

          Production may still be serving the previous release. Investigate before merging further changes that require a deploy.
          BODY
          )
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq 'length')"
          if [ "${existing:-0}" -eq 0 ]; then
            gh issue create --title "$title" --body "$body"
          else
            echo "A tracking issue for ${GITHUB_SHA:0:7} already exists."
          fi

      # A main push deploys only the primary app (#1414), so it closes the
      # issues other main pushes opened once the primary ships. Tag and
      # dispatch runs must ship both apps, and only they close issues that a
      # release run opened, so a Lonely Forest failure stays open until a
      # release deploys it.
      - name: Close tracking issues for commits this deploy shipped
        if: >-
          (needs.dev-deploy.result == 'success' &&
           needs.dev-deploy.outputs.rolled-out == 'true') ||
          (needs.primary-fly.result == 'success' &&
          (needs.lonelyforest-fly.result == 'success' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main')))
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$MAIN_PUSH" = "true" ]; then
            scope="the primary app"
          else
            scope="both production apps"
          fi
          gh api --paginate "repos/${GH_REPO}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | select(.title | test("^Production did not deploy [0-9a-f]{7,40}$")) | "\(.number) \(.title | split(" ") | last) \((.body // "") | test("- Trigger: push refs/heads/main\\r?\\n"))"' |
          while read -r number sha from_main_push; do
            if [ "$MAIN_PUSH" = "true" ] && [ "$from_main_push" != "true" ]; then
              echo "Leaving #${number} open: a release run opened it, so a release deploy must close it."
              continue
            fi
            status="$(gh api "repos/${GH_REPO}/compare/${sha}...${GITHUB_SHA}" --jq .status 2>/dev/null || true)"
            if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
              gh issue close "$number" --reason completed \
                --comment "Shipped: ${scope} deployed ${GITHUB_SHA:0:7}, which contains ${sha}. ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
            fi
          done

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [production-gate, primary-fly, lonelyforest-fly]
    permissions:
      contents: write
    steps:
      - name: Create release notes
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
