name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Committed production target to deploy
        required: true
        default: both
        type: choice
        options:
          - both
          - primary
          - lonelyforest
      lonelyforest_recovery_capture:
        description: Reviewed committed tenant=path capture, only when that tenant's live /meta is unavailable
        required: false
        default: ""
        type: string
      lonelyforest_fresh_empty_tenant:
        description: One-time empty tenant bootstrap; fails if its volume directory contains any data
        required: false
        default: none
        type: choice
        options:
          - none
          - hoppycat
      primary_recovery_capture:
        description: Reviewed committed capture path, only when the primary app's live /meta is unavailable
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployment-impact:
    name: Check production impact
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check whether production inputs changed
        id: impact
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=explicit deployment or tag release" >> "$GITHUB_OUTPUT"
          else
            node scripts/check-deployment-impact.mjs "$BEFORE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  production-node-gate:
    name: Production Node and content gate
    needs: deployment-impact
    if: needs.deployment-impact.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Checkout pinned SRD 5.1 source
        uses: actions/checkout@v7
        with:
          repository: Tabyltop/CC-SRD
          ref: c05c0438ea6c638bb7cb25224d97c9bd0e187c49
          path: reference-library/rpg-systems/sources/cc-srd-5e

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Node and deployment contract checks
        run: |
          npm run v2:worldpack
          npm run v2:kernel
          npm run v2:syntax
          npm run v2:lonelyforest:contract
          npx vitest run test/infrastructure/deploy-workflow.test.mjs --reporter=dot

  production-rust-gate:
    name: Production Rust gate
    needs: deployment-impact
    if: needs.deployment-impact.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ runner.os }}-cargo-orchestrator-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-orchestrator-${{ hashFiles('v2/orchestrator-rust/Cargo.lock') }}-
            ${{ runner.os }}-cargo-orchestrator-

      - name: Verify Rust orchestrator tests
        run: bash v2/scripts/check-rust.sh test

      - name: Check Rust architecture
        run: |
          bash v2/scripts/check-main-size.sh
          bash v2/scripts/check-rust-lint.sh

  production-gate:
    name: V2 production deployment gate
    if: ${{ always() }}
    needs: [deployment-impact, production-node-gate, production-rust-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required production gates passed
        env:
          DEPLOY: ${{ needs.deployment-impact.outputs.deploy }}
          NODE_RESULT: ${{ needs.production-node-gate.result }}
          RUST_RESULT: ${{ needs.production-rust-gate.result }}
        run: |
          if [ "$DEPLOY" != true ]; then
            echo "No production inputs changed; deployment is not needed."
            exit 0
          fi
          test "$NODE_RESULT" = success
          test "$RUST_RESULT" = success

  primary-fly:
    name: Deploy primary to Fly
    needs: [deployment-impact, production-gate]
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      (github.event_name == 'push' ||
       inputs.target == 'both' ||
       inputs.target == 'primary')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard primary volume free space
        timeout-minutes: 2
        run: scripts/check-fly-volume-space.sh cosyworld /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Exactly one actor drives production. An older queued run yields loudly
      # when main has advanced, and two runs for the same SHA refuse to race.
      - name: Own this SHA's deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Explicit deployment owns its target directly."
            exit 0
          fi
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -n "$main_sha" ] && [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Superseded: main advanced to ${main_sha:0:7}; yielding deployment to the newer commit's run."
            exit 1
          fi
          for status in in_progress queued; do
            duplicates="$(gh api "repos/${GH_REPO}/actions/runs?status=${status}&head_sha=${GITHUB_SHA}" \
              --jq "[.workflow_runs[] | select(.name == \"Deploy\" and .id != ${GITHUB_RUN_ID})] | length")"
            if [ "${duplicates:-0}" -gt 0 ]; then
              echo "::error::Another ${status} Deploy run already owns ${GITHUB_SHA:0:7}; exactly one actor may drive production."
              exit 1
            fi
          done

      # An unreachable primary app fails this gate closed, which blocks the very
      # deploy that would fix it. Supply a reviewed committed capture of the
      # last known /meta to recover; the captured hash is still evaluated
      # against the candidate registry exactly like a live identity.
      - name: Guard primary worldpack bundle compatibility
        run: |
          if [ -n "$COSYWORLD_PRIMARY_RECOVERY_CAPTURE" ]; then
            node v2/scripts/check-deploy-worldpack.mjs https://cosyworld.fly.dev \
              --recovery-capture "$COSYWORLD_PRIMARY_RECOVERY_CAPTURE"
          else
            node v2/scripts/check-deploy-worldpack.mjs https://cosyworld.fly.dev
          fi
        env:
          COSYWORLD_PRIMARY_RECOVERY_CAPTURE: ${{ inputs.primary_recovery_capture }}

      - name: Create rollback backup
        run: scripts/backup-fly-v2.sh cosyworld primary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy primary Fly app
        run: flyctl deploy --remote-only --config fly.toml --strategy rolling
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify primary readiness and persistence
        run: |
          # A fresh process refreshes the remote ownership feed every 60 seconds.
          # Allow one full refresh interval, its bounded 15-second request, and
          # a small scheduling margin before declaring the release unhealthy.
          for attempt in {1..13}; do
            if node v2/scripts/smoke-deployed-ruby-high.mjs https://cosyworld.fly.dev; then
              exit 0
            fi
            if [ "$attempt" -eq 13 ]; then
              echo "Primary readiness remained degraded after 120 seconds" >&2
              exit 1
            fi
            echo "::warning::Primary readiness attempt $attempt failed; retrying in 10 seconds"
            sleep 10
          done

  lonelyforest-fly:
    name: Deploy Lonely Forest to Fly
    needs: [deployment-impact, production-gate]
    # Ordinary main pushes must never replace an intentional Lonely Forest
    # release. Tags are committed releases; workflow_dispatch is an explicit
    # operator action against the selected GitHub ref.
    if: >-
      needs.deployment-impact.outputs.deploy == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'both' || inputs.target == 'lonelyforest')))
    runs-on: ubuntu-latest
    environment: lonelyforest-production
    concurrency:
      group: deploy-lonelyforest-production
      cancel-in-progress: false
    steps:
      - name: Checkout committed release
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Guard Lonely Forest volume free space
        timeout-minutes: 2
        run: scripts/check-fly-volume-space.sh cosyworld-lonelyforest /data 85
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Guard every Lonely Forest tenant worldpack bundle compatibility
        run: |
          if [ "$COSYWORLD_LONELYFOREST_FRESH_EMPTY_TENANT" != "none" ]; then
            if [ -n "$COSYWORLD_LONELYFOREST_RECOVERY_CAPTURE" ]; then
              echo "::error::A recovery capture and fresh tenant bootstrap cannot be requested together"
              exit 1
            fi
            if flyctl ssh console -a cosyworld-lonelyforest -C 'test -e /data/worldpacks/hoppycat'; then
              flyctl ssh console -a cosyworld-lonelyforest -C 'test -d /data/worldpacks/hoppycat'
              fresh_tenant_entry="$(flyctl ssh console -a cosyworld-lonelyforest -C 'find /data/worldpacks/hoppycat -mindepth 1 -print -quit')"
              if [ -n "$fresh_tenant_entry" ]; then
                echo "::error::Fresh Hoppycat tenant directory is not empty: $fresh_tenant_entry"
                exit 1
              fi
            fi
            node v2/scripts/check-lonelyforest-worldpacks.mjs --fresh-empty-tenant hoppycat
          elif [ -n "$COSYWORLD_LONELYFOREST_RECOVERY_CAPTURE" ]; then
            node v2/scripts/check-lonelyforest-worldpacks.mjs --recovery-capture "$COSYWORLD_LONELYFOREST_RECOVERY_CAPTURE"
          else
            node v2/scripts/check-lonelyforest-worldpacks.mjs
          fi
        env:
          COSYWORLD_LONELYFOREST_RECOVERY_CAPTURE: ${{ inputs.lonelyforest_recovery_capture }}
          COSYWORLD_LONELYFOREST_FRESH_EMPTY_TENANT: ${{ inputs.lonelyforest_fresh_empty_tenant || 'none' }}
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Validate Lonely Forest multitenant contract
        run: npm run v2:lonelyforest:contract

      - name: Create rollback backup
        run: scripts/backup-fly-v2.sh cosyworld-lonelyforest lonelyforest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Build and deploy Lonely Forest
        run: |
          for attempt in 1 2; do
            if flyctl deploy --remote-only --config fly.lonelyforest.toml --ha=false --strategy rolling; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "::warning::Lonely Forest deploy polling failed; retrying once in 15 seconds"
            sleep 15
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LONELYFOREST_API_TOKEN }}

      - name: Verify Lonely Forest readiness and persistence
        run: npm run v2:lonelyforest:smoke -- --base-url=https://lonelyforest.com --expect-elysium --allow-remote-mutations

  deploy-outcome:
    name: Report production deployment outcome
    runs-on: ubuntu-latest
    needs: [deployment-impact, production-gate, primary-fly, lonelyforest-fly]
    if: always()
    permissions:
      issues: write
    steps:
      # A merge to main that produces no successful deploy must be visible
      # without anyone going to look.
      - name: Open a loud tracking issue when a required production deploy did not succeed
        if: >-
          needs.deployment-impact.outputs.deploy == 'true' &&
          (needs.production-gate.result != 'success' ||
           needs.primary-fly.result == 'failure' ||
           needs.lonelyforest-fly.result == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_RESULT: ${{ needs.production-gate.result }}
          PRIMARY_RESULT: ${{ needs.primary-fly.result }}
          LONELYFOREST_RESULT: ${{ needs.lonelyforest-fly.result }}
        run: |
          title="Production did not deploy ${GITHUB_SHA:0:7}"
          body=$(cat <<BODY
          Merge of ${GITHUB_SHA} did not complete a production deployment.

          - Deployment gate: ${GATE_RESULT}
          - Primary Fly deploy: ${PRIMARY_RESULT}
          - Lonely Forest Fly deploy: ${LONELYFOREST_RESULT}
          - Run log: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          Production may still be serving the previous release. Investigate before merging further changes that require a deploy.
          BODY
          )
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq 'length')"
          if [ "${existing:-0}" -eq 0 ]; then
            gh issue create --title "$title" --body "$body"
          else
            echo "A tracking issue for ${GITHUB_SHA:0:7} already exists."
          fi

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [production-gate, primary-fly, lonelyforest-fly]
    permissions:
      contents: write
    steps:
      - name: Create release notes
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
