name: Verify pond crossing candidate
on:
  push:
    branches: [verify/pond-crossings-1141]
permissions:
  contents: read
concurrency:
  group: verify-pond-crossings-1141
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Apply two-flash ritual to the verified crossing candidate
        run: |
          cp v2/scripts/review/{lamp-ritual-rules.patch,prepare-lamp-ritual.mjs,card-ship-ritual.test.mjs,fix-ritual-regressions.mjs} "$RUNNER_TEMP/"
          git checkout --detach 2442e6a4236fa7a9e0ea1a92b97076aa3afee85e
          test "$(sha256sum "$RUNNER_TEMP/lamp-ritual-rules.patch" | cut -d' ' -f1)" = 854f3c188b7c0e6661f6df9faa7a0bf734eb6288aeffd5f6ff98b8289691479e
          git apply --check "$RUNNER_TEMP/lamp-ritual-rules.patch"
          git apply "$RUNNER_TEMP/lamp-ritual-rules.patch"
          node "$RUNNER_TEMP/prepare-lamp-ritual.mjs"
          node "$RUNNER_TEMP/fix-ritual-regressions.mjs"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Format and check the changed source
        run: |
          npx prettier --write v2/card-game/{world,cards,narrative}.mjs test/card-{crossings,ship-ritual,greek-drama}.test.mjs test/fixtures/card-narrative-contexts.mjs v2/scripts/smoke-card-{pond-crossings,greek-drama}.mjs
          git diff --check
          npm run lint
          npm run v2:card:pack:check
      - name: Full JavaScript regression suite
        run: npm test
      - name: Browser ritual, crossings, and existing regression checks
        run: |
          npx playwright install --with-deps chromium
          node v2/scripts/smoke-card-pond-crossings.mjs
          node v2/scripts/smoke-card-clearing-access.mjs
          node v2/scripts/check-card-awakening.mjs
          node v2/scripts/smoke-card-greek-drama.mjs
      - name: Export tested candidate
        run: |
          git add -N test/card-ship-ritual.test.mjs
          git diff --binary > "$RUNNER_TEMP/lamp-ritual.verified.patch"
          git diff --stat
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lamp-ritual-evidence
          path: |
            output/pond-crossings-check/
            output/greek-drama-check/
            output/badger-check/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: lamp-ritual-verified-patch
          path: ${{ runner.temp }}/lamp-ritual.verified.patch
          if-no-files-found: error
          retention-days: 7
  candidate:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2442e6a4236fa7a9e0ea1a92b97076aa3afee85e
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lamp-ritual-verified-patch
          path: ${{ runner.temp }}/verified
      - name: Publish a separate candidate, never the PR or production branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/verified/lamp-ritual.verified.patch"
          git apply "$RUNNER_TEMP/verified/lamp-ritual.verified.patch"
          git add v2 test package.json package-lock.json
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git diff --cached --check
          git -c user.name='CosyWorld verification' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Summon the Greek ship with two black-cloth lamp signals'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push "https://github.com/$REPOSITORY.git" "HEAD:refs/heads/verified/lamp-ritual-$RUN_ID"
          printf 'Verified candidate: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
