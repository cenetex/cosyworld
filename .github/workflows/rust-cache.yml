name: Rust dependency cache

# Builds main's Rust dependencies for the fast check's Rust jobs and saves them
# without the crate's own artifacts, which every change rebuilds anyway.
on:
  schedule:
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths: ["v2/orchestrator-rust/Cargo.lock", "v2/orchestrator-rust/Cargo.toml"]
  workflow_dispatch:

concurrency:
  group: rust-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps:
    name: Build and save Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Choose the cache key
        id: key
        run: echo "key=${RUNNER_OS}-cargo-deps-v1-$(rustc --version | tr -dc 'a-z0-9.')-$(sha256sum v2/orchestrator-rust/Cargo.lock | cut -c1-16)-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Look for today's cache
        id: found
        uses: actions/cache/restore@v6
        with:
          lookup-only: true
          path: &paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            v2/orchestrator-rust/target
          key: ${{ steps.key.outputs.key }}
      - name: Build the test and server dependencies
        if: steps.found.outputs.cache-hit != 'true'
        working-directory: v2/orchestrator-rust
        run: |
          cargo test --no-run
          cargo build
          find target/debug -maxdepth 2 -name '*cosyworld*' -exec rm -rf {} +
          rm -rf target/debug/incremental
          du -sh target ~/.cargo/registry
      - if: steps.found.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *paths
          key: ${{ steps.key.outputs.key }}
