name: Local desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "v2/desktop/**"
      - "v2/local/**"
      - "v2/card-game/**"
      - "v2/orchestrator-rust/**"
      - "v2/core-c/**"
      - "v2/content/**"
      - "v2/worlds/**"
      - "v2/scripts/**"
      - "scripts/*version*.mjs"
      - "test/*local*.mjs"
      - "test/version-alignment.test.mjs"
      - "package*.json"
      - ".github/workflows/local-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and check the Mac app
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.runtime/desktop-target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: v2/local/requirements-macos.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the common release
        id: release
        run: |
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            .runtime/desktop-target
          key: macos-arm64-local-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock', 'v2/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            macos-arm64-local-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock', 'v2/desktop/src-tauri/Cargo.lock') }}-
            macos-arm64-local-v1-
      - name: Install Node build tools
        timeout-minutes: 8
        env:
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
        run: npm ci --no-audit --no-fund --prefer-offline --loglevel=info
      - name: Install Python build tools
        timeout-minutes: 8
        env:
          PIP_DEFAULT_TIMEOUT: "30"
          PIP_RETRIES: "2"
        run: |
          python -m venv .runtime/local-python
          .runtime/local-python/bin/python -m pip install --no-deps -r v2/local/requirements-macos.lock
          echo "$GITHUB_WORKSPACE/.runtime/local-python/bin" >> "$GITHUB_PATH"
      - name: Show dependency logs after a setup failure
        if: failure()
        run: |
          for log in "$HOME"/.npm/_logs/*debug*.log; do
            if [ -f "$log" ]; then tail -80 "$log"; fi
          done
      - name: Check local services and desktop source
        env:
          VERSION_CHECK_ALIGNMENT_ONLY: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          npm run check:version
          npm run v2:card:assets:check
          npm run local:test
          npx vitest run test/card-local-voice.test.mjs test/card-local-saves.test.mjs test/card-local-dialogue.test.mjs test/version-alignment.test.mjs
          cargo fmt --manifest-path v2/desktop/src-tauri/Cargo.toml --check
      - name: Build the app and its helper programs
        run: |
          npm run desktop:build
          app="$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app"
          codesign --verify --deep --strict "$app"
          codesign --verify --strict "$app/Contents/Resources/game/cosyworld-orchestrator"
          codesign --verify --strict "$app/Contents/Resources/voice/cosyworld-voices/cosyworld-voices"
      - name: Check desktop service shutdown
        run: cargo test --release --manifest-path v2/desktop/src-tauri/Cargo.toml
      - name: Check the packaged voice engine with Nano on CPU
        run: |
          voice="$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app/Contents/Resources/voice/cosyworld-voices/cosyworld-voices"
          refs="$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app/Contents/Resources/voices/voices.json"
          "$voice" --model nano --download-model "$RUNNER_TEMP/cosy-nano"
          "$voice" --model nano --model-dir "$RUNNER_TEMP/cosy-nano" --voices "$refs" --cache-dir "$RUNNER_TEMP/cosy-clips" --device cpu --smoke-voice "$RUNNER_TEMP/cosy-voice.wav"
          python -c 'import os,wave; f=wave.open(os.environ["RUNNER_TEMP"]+"/cosy-voice.wav"); assert f.getnframes()>f.getframerate()'
      - name: Check the packaged game and file recovery in a browser
        env:
          GGML_METAL_DEVICES: "0"
        run: |
          npx playwright install chromium
          python v2/local/prepare.py --model gemma3:1b --directory "$RUNNER_TEMP/cosy-dialogue"
          game="$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app/Contents/Resources/game/cosyworld-orchestrator"
          voice="$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app/Contents/Resources/voice/cosyworld-voices/cosyworld-voices"
          refs="$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app/Contents/Resources/voices/voices.json"
          export COSYWORLD_LOCAL_APP=1 COSYWORLD_PRIMARY_GAME=cards COSYWORLD_V2_ADDR=127.0.0.1:3110
          export COSYWORLD_AI_BASE_URL=embedded://llama COSYWORLD_AI_MODEL=gemma3:1b
          export COSYWORLD_LLAMA_MODEL="$RUNNER_TEMP/cosy-dialogue/gemma3-1b-q4.gguf"
          export COSYWORLD_LLAMA_CONTEXT=2048
          export COSYWORLD_CARD_TEXT_PROFILE=local COSYWORLD_LOCAL_DATA_DIR="$RUNNER_TEMP/local-game"
          export COSYWORLD_CHATTERBOX_TOKEN=desktop-smoke-token-with-32-characters
          export COSYWORLD_CHATTERBOX_MODEL=nano
          "$voice" --model nano --model-dir "$RUNNER_TEMP/cosy-nano" --voices "$refs" --cache-dir "$RUNNER_TEMP/cosy-clips" --device cpu --warm-model > "$RUNNER_TEMP/local-voice.log" 2>&1 &
          voice_pid=$!
          game_pid=""
          trap 'kill ${game_pid:-} "$voice_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import os, time, urllib.request
          for attempt in range(600):
              try:
                  req = urllib.request.Request("http://127.0.0.1:3111/health", headers={"Authorization": "Bearer " + os.environ["COSYWORLD_CHATTERBOX_TOKEN"]})
                  with urllib.request.urlopen(req, timeout=1):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise RuntimeError("The local voice needs another try.")
          PY
          "$game" > "$RUNNER_TEMP/local-game.log" 2>&1 &
          game_pid=$!
          node v2/scripts/smoke-card-local.mjs --real-models
          export COSYWORLD_PACKAGE_REPORT="$RUNNER_TEMP/package-check.json"
          node v2/desktop/check-package.mjs --app "$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app"
          node v2/scripts/smoke-card-local-stream.mjs
      - name: Show local service logs after a failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/local-game.log" "$RUNNER_TEMP/local-voice.log"; do
            if [ -f "$log" ]; then tail -200 "$log"; fi
          done
      - name: Package the app
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p output/mac-app
          archive="output/mac-app/CosyWorld-$APP_VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app" "$archive"
          verify_dir="$(mktemp -d "$RUNNER_TEMP/cosy-package-verify.XXXXXX")"
          ditto -x -k "$archive" "$verify_dir"
          codesign --verify --deep --strict "$verify_dir/CosyWorld.app"
          codesign --verify --strict "$verify_dir/CosyWorld.app/Contents/Resources/game/cosyworld-orchestrator"
          codesign --verify --strict "$verify_dir/CosyWorld.app/Contents/Resources/voice/cosyworld-voices/cosyworld-voices"
          cp "$CARGO_TARGET_DIR/release/bundle/macos/CosyWorld.app/Contents/Resources/game/build-info.json" output/mac-app/build-info.json
          cp "$RUNNER_TEMP/package-check.json" output/mac-app/package-check.json
          (cd output/mac-app && shasum -a 256 "${archive##*/}" > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        id: app-download
        with:
          name: CosyWorld-${{ steps.release.outputs.version }}-macos-arm64-${{ steps.release.outputs.sha }}
          path: output/mac-app/
          retention-days: 14
          if-no-files-found: error
      - name: Show the app download
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          APP_COMMIT: ${{ steps.release.outputs.sha }}
          APP_DOWNLOAD: ${{ steps.app-download.outputs.artifact-url }}
        run: |
          {
            echo "### CosyWorld $APP_VERSION for Apple silicon"
            echo "[Download the checked Mac app]($APP_DOWNLOAD) · Commit $APP_COMMIT"
            echo "The package version, rules, voice references, and every public game file match this web source."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v6
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            .runtime/desktop-target
          key: macos-arm64-local-v1-${{ hashFiles('v2/orchestrator-rust/Cargo.lock', 'v2/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
