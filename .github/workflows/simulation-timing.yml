name: Diagnostic simulation timing
on:
  pull_request:
    branches: [codex/greek-epic-complete]
jobs:
  measure:
    if: github.head_ref == 'codex/hosted-simulation-measure'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Measure Book I attempts separately
        shell: bash
        run: |
          result=0
          for attempt in 1 2; do
            echo "Book I attempt ${attempt}"
            npx vitest run test/card-greek-book-one.test.mjs -t 'replays ordered dialogue and deeds through the bundled shared rules' --retry=0 --reporter=verbose || result=1
          done
          exit "$result"
