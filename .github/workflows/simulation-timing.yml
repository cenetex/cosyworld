name: Diagnostic simulation timing
on:
  pull_request:
    branches: [codex/greek-epic-complete]
jobs:
  measure:
    if: github.head_ref == 'codex/hosted-simulation-measure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify long simulations under final limits
        run: >-
          npx vitest run test/card-game.test.mjs test/card-liveness.test.mjs
          -t 'preserves unique objects and valid state across 4000 varied turns|keeps every avatar progressing after long loose play'
          --retry=0 --reporter=verbose
