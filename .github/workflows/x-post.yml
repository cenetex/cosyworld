name: X campaign post

on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run prints what is due; post sends it
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - post
      date:
        description: Date to run for (YYYY-MM-DD); empty means today
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.X_CAMPAIGN == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null ||
            { sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg; }
      - name: Post what is due
        env:
          X_CAMPAIGN_START: ${{ vars.X_CAMPAIGN_START }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MODE: ${{ github.event_name == 'schedule' && 'post' || inputs.mode }}
          DATE: ${{ inputs.date }}
        run: |
          args=()
          [ "$MODE" = "post" ] && args+=(--post)
          [ -n "$DATE" ] && args+=(--date "$DATE")
          node scripts/x-post.mjs "${args[@]}"
