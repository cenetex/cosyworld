location @json_api_unavailable {
  internal;
  default_type application/json;
  add_header Retry-After 1 always;
  add_header X-Content-Type-Options nosniff always;
  return 503 '{"ok":false,"status":503,"command":"","verb":"","output":"The world is temporarily unavailable. Retry this request; commands must reuse the same intent_id.","error_kind":"server_unavailable","action":null,"receipt":null,"events":[]}';
}

location @json_api_request_timeout {
  internal;
  default_type application/json;
  add_header Retry-After 1 always;
  add_header X-Content-Type-Options nosniff always;
  return 408 '{"ok":false,"status":408,"command":"","verb":"","output":"The command request timed out before it could be accepted. Retry with the same intent_id.","error_kind":"invalid_request","action":null,"receipt":null,"events":[]}';
}

location @json_api_payload_too_large {
  internal;
  default_type application/json;
  add_header X-Content-Type-Options nosniff always;
  return 413 '{"ok":false,"status":413,"command":"","verb":"","output":"The command request body is too large.","error_kind":"invalid_request","action":null,"receipt":null,"events":[]}';
}
