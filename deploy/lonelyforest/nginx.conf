worker_processes auto;
pid /tmp/cosyworld-nginx/nginx.pid;
error_log /tmp/cosyworld-nginx/error.log notice;

events {
  worker_connections 2048;
}

http {
  access_log /tmp/cosyworld-nginx/access.log combined;
  client_max_body_size 25m;
  client_body_temp_path /tmp/cosyworld-nginx/client-body;
  proxy_temp_path /tmp/cosyworld-nginx/proxy;
  fastcgi_temp_path /tmp/cosyworld-nginx/fastcgi;
  uwsgi_temp_path /tmp/cosyworld-nginx/uwsgi;
  scgi_temp_path /tmp/cosyworld-nginx/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  upstream lonelyforest_root {
    server 127.0.0.1:3100;
  }

  upstream elysium {
    server 127.0.0.1:3101;
  }

  upstream bethlehem {
    server 127.0.0.1:3107;
  }

  upstream project89 {
    server 127.0.0.1:3189;
  }

  upstream lantern_keeper {
    server 127.0.0.1:3180;
  }

  # Fly's machine health check is allowed without a public Host header.
  # Every other unknown host fails closed instead of falling into a world.
  server {
    listen 0.0.0.0:3000 default_server;
    server_name _;

    location = /health {
      proxy_pass http://lonelyforest_root;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }

    location = /health/live {
      proxy_pass http://lonelyforest_root;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }

    location / {
      return 421;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name lonelyforest.com www.lonelyforest.com cosyworld-lonelyforest.fly.dev;

    location / {
      proxy_pass http://lonelyforest_root;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name 0.lonelyforest.com;

    proxy_intercept_errors on;
    error_page 502 504 = @elysium_unavailable;

    location / {
      proxy_pass http://elysium;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }

    location @elysium_unavailable {
      default_type application/json;
      add_header Retry-After 60 always;
      return 503 '{"ok":false,"error":"Elysium is not installed in this release"}';
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name 7.lonelyforest.com;

    location / {
      proxy_pass http://bethlehem;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name 89.lonelyforest.com;

    location / {
      proxy_pass http://project89;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name lantern.lonelyforest.com;

    location / {
      proxy_pass http://lantern_keeper;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }
}
