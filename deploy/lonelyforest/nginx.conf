worker_processes auto;
pid /tmp/cosyworld-nginx/nginx.pid;
error_log /tmp/cosyworld-nginx/error.log notice;

events {
  worker_connections 2048;
}

http {



  log_format cosyworld_safe 'process=nginx event=http_access tenant_host="$host" method="$request_method" status=$status bytes=$body_bytes_sent latency_secs=$request_time request_id="$upstream_http_x_request_id" upstream="$upstream_addr" upstream_status="$upstream_status"';
  access_log /tmp/cosyworld-nginx/access.log cosyworld_safe;
  client_max_body_size 25m;
  client_body_temp_path /tmp/cosyworld-nginx/client-body;
  proxy_temp_path /tmp/cosyworld-nginx/proxy;
  fastcgi_temp_path /tmp/cosyworld-nginx/fastcgi;
  uwsgi_temp_path /tmp/cosyworld-nginx/uwsgi;
  scgi_temp_path /tmp/cosyworld-nginx/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  upstream lonelyforest_root {
    server 127.0.0.1:3100;
  }

  upstream elysium {
    server 127.0.0.1:3101;
  }

  upstream bethlehem {
    server 127.0.0.1:3107;
  }

  upstream project89 {
    server 127.0.0.1:3189;
  }

  upstream lantern_keeper {
    server 127.0.0.1:3180;
  }

  upstream hoppycat {
    server 127.0.0.1:3177;
  }



  server {
    listen 0.0.0.0:3000 default_server;
    server_name _;

    location = /health {
      proxy_pass http://lonelyforest_root;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    location = /health/live {
      proxy_pass http://lonelyforest_root;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    location ~ ^/(commands|state)$ {
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      return 421 '{"ok":false,"status":421,"command":"","verb":"","output":"The requested world host is not recognized.","error_kind":"invalid_request","action":null,"receipt":null,"events":[]}';
    }

    include /app/deploy/lonelyforest/json-api-unavailable.conf;

    location / {
      return 421;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name lonelyforest.com www.lonelyforest.com cosyworld-lonelyforest.fly.dev;

    location ~ ^/(commands|state|health(?:/live)?)$ {
      proxy_pass http://lonelyforest_root;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    include /app/deploy/lonelyforest/json-api-unavailable.conf;

    location / {
      proxy_pass http://lonelyforest_root;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name 0.lonelyforest.com;

    proxy_intercept_errors on;
    error_page 502 504 = @elysium_unavailable;

    location ~ ^/(commands|state|health(?:/live)?)$ {
      proxy_pass http://elysium;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    include /app/deploy/lonelyforest/json-api-unavailable.conf;

    location / {
      proxy_pass http://elysium;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }

    location @elysium_unavailable {
      default_type application/json;
      add_header Retry-After 60 always;
      return 503 '{"ok":false,"error":"Elysium is not installed in this release"}';
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name 7.lonelyforest.com;

    location ~ ^/(commands|state|health(?:/live)?)$ {
      proxy_pass http://bethlehem;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    include /app/deploy/lonelyforest/json-api-unavailable.conf;

    location / {
      proxy_pass http://bethlehem;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name 89.lonelyforest.com;

    location ~ ^/(commands|state|health(?:/live)?)$ {
      proxy_pass http://project89;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    include /app/deploy/lonelyforest/json-api-unavailable.conf;

    location / {
      proxy_pass http://project89;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name lantern.lonelyforest.com;

    location ~ ^/(commands|state|health(?:/live)?)$ {
      proxy_pass http://lantern_keeper;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    include /app/deploy/lonelyforest/json-api-unavailable.conf;

    location / {
      proxy_pass http://lantern_keeper;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }

  server {
    listen 0.0.0.0:3000;
    server_name hoppycat.lonelyforest.com;

    location ~ ^/(commands|state|health(?:/live)?)$ {
      proxy_pass http://hoppycat;
      include /app/deploy/lonelyforest/proxy-json-api.conf;
    }

    include /app/deploy/lonelyforest/json-api-unavailable.conf;

    location / {
      proxy_pass http://hoppycat;
      include /app/deploy/lonelyforest/proxy-headers.conf;
    }
  }
}
