app = "cosyworld"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  COSYWORLD_DEPLOY_PROFILE = "production"
  COSYWORLD_V2_ADDR = "0.0.0.0:3000"
  COSYWORLD_V2_SNAPSHOT_PATH = "/data/cosyworld-v2-snapshot.json"
  COSYWORLD_V2_EVENT_DB_PATH = "/data/cosyworld-v2-events.sqlite"
  COSYWORLD_GENERATED_ASSET_DIR = "/data/generated"
  COSYWORLD_WEBAUTHN_RP_ID = "cosyworld.fly.dev"
  COSYWORLD_WEBAUTHN_ORIGIN = "https://cosyworld.fly.dev"
  COSYWORLD_RUBY_HIGH_WALLET_CARDS_URL = "https://ruby-high.ai/api/apps/ruby-high/nft/internal/cosyworld/wallet-cards"
  COSYWORLD_HOSTED_PARTY_MAX_GUESTS = "4"
  COSYWORLD_HOSTED_PARTY_MAX_ACTIVE_PER_GUEST = "4"
  COSYWORLD_HOSTED_ACCESS_TTL_SECS = "7200"
  COSYWORLD_HOSTED_ACCESS_GRACE_SECS = "60"
  COSYWORLD_STORY_METRICS_RETENTION_DAYS = "400"
  COSYWORLD_REPLICATE_AVATAR_MODEL = "black-forest-labs/flux-dev-lora"
  COSYWORLD_REPLICATE_AVATAR_LORA = "immanencer/mirquo"
  COSYWORLD_REPLICATE_AVATAR_LORA_INPUT = "lora_weights"
  COSYWORLD_REPLICATE_AVATAR_LORA_SCALE_INPUT = "lora_scale"
  COSYWORLD_REPLICATE_AVATAR_PROMPT_PREFIX = "MRQ, cozy storybook trading-card portrait"
  COSYWORLD_AI_VISION_MODEL = "openai/gpt-5-image-mini"
  COSYWORLD_AI_VISION_REASONING_EFFORT = "low"
  COSYWORLD_CARD_POLICY_MODE = "shadow"
  COSYWORLD_CARD_POLICY_MODEL_PATH = "/app/models/card-policy/incumbent.cwrank"
  COSYWORLD_CARD_POLICY_TOP_K = "3"
  # The registry below pins one voice model, so every retry is a resample of it
  # and two samples were not enough to clear the recent-duplicate gate: eight of
  # nine generations were rejected in the 2026-08-03 production window. Four
  # samples stay well inside the 2000 microdollar spend ceiling.
  COSYWORLD_AI_VOICE_MAX_ATTEMPTS = "4"
  COSYWORLD_AI_REGISTRY_JSON = '{"schema_version":1,"snapshot_version":"cosyworld-prod-2026-07-28b","declared":[{"requested_model_id":"openai/gpt-5.6-luna","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-5.6-luna"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["voice","intent_json","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}}],"discovered":[]}'
  RUST_LOG = "cosyworld_orchestrator=info,tower_http=warn"

# Required production secrets:
# fly secrets set COSYWORLD_RUBY_HIGH_WALLET_CARDS_BEARER=...
# fly secrets set COSYWORLD_MODERATION_TOKEN=...

# Required before enabling production Box burns:
# fly secrets set COSYWORLD_BOX_BURN_SOLANA_RPC_URL=...
# fly secrets set COSYWORLD_BOX_CORE_COLLECTION_ADDRESS=...

[[mounts]]
  source = "cosyworld_data"
  destination = "/data"
  # Extend before the 85% deploy guard can become the only warning. The 5 GB
  # ceiling bounds spend while leaving several recovery windows after the
  # 2026-07-28 full-disk outage.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory = "2gb"
  processes = ["app"]

# Deploy strategy stays `rolling`: bluegreen/canary would boot a second
# machine beside this one, and the /data volume is single-writer — two
# machines on one SQLite volume corrupts the journal. The deploy workflow
# therefore guards volume free space before swapping (issue #546).
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
