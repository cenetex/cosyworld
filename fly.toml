app = "cosyworld"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  COSYWORLD_DEPLOY_PROFILE = "production"
  COSYWORLD_LOG_FORMAT = "json"
  COSYWORLD_LOG_TENANT = "primary"
  COSYWORLD_LOG_WORLDPACK = "cosyworld.official"
  COSYWORLD_PROCESS_ID = "public-1"
  COSYWORLD_V2_ADDR = "0.0.0.0:3000"
  COSYWORLD_V2_SNAPSHOT_PATH = "/data/cosyworld-v2-snapshot.json"
  COSYWORLD_V2_EVENT_DB_PATH = "/data/cosyworld-v2-events.sqlite"
  # Finish HTTP drain before Fly escalates the initial deploy signal.
  COSYWORLD_SHUTDOWN_DRAIN_MS = "3000"
  COSYWORLD_GENERATED_ASSET_DIR = "/data/generated"
  COSYWORLD_WEBAUTHN_RP_ID = "cosyworld.fly.dev"
  COSYWORLD_WEBAUTHN_ORIGIN = "https://cosyworld.fly.dev"
  # .dev is for existing passkey holders: no sign-ups, no signed-out play.
  COSYWORLD_PASSKEYS = "members"
  COSYWORLD_CARD_TEXT_MODEL = "openai/gpt-6-luna"
  COSYWORLD_CARD_TEXT_REASONING_EFFORT = "none"
  # Each authored card-world character keeps one exact OpenRouter model.
  COSYWORLD_CARD_CHARACTER_MODELS_JSON = '{"vale":"openai/gpt-6-luna","moth":"openai/gpt-6-luna","keeper":"anthropic/claude-haiku-5.5","badger":"mistralai/mistral-small-3.2-24b-instruct"}'
  COSYWORLD_AI_CAPABILITY_MODELS_JSON = '{"voice":"openai/gpt-6-luna","intent_json":"openai/gpt-5.6-sol","world_content":"openai/gpt-5.6-sol"}'
  COSYWORLD_AI_REGISTRY_JSON = '{"schema_version":1,"snapshot_version":"cosyworld-prod-2026-10-31-character-models-v2","declared":[{"requested_model_id":"openai/gpt-5.4-nano","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-5.4-nano"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":false,"reasoning":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["voice"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}},{"requested_model_id":"openai/gpt-5.6-sol","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-5.6-sol"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["intent_json","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}},{"requested_model_id":"google/gemini-3.5-flash","provider":"openrouter","concrete_model":{"model_id":"google/gemini-3.5-flash"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":true},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["intent_json","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}},{"requested_model_id":"openai/gpt-6-luna","provider":"openrouter","concrete_model":{"model_id":"openai/gpt-6-luna"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"tools":true,"seed":true,"stop":false,"reasoning":true,"temperature":false},"data_policy":{"retention":"none","training":"prohibited"},"capabilities":["voice","world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":2048}},{"requested_model_id":"anthropic/claude-haiku-5.5","provider":"openrouter","concrete_model":{"model_id":"anthropic/claude-haiku-5.5"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"stop":true,"reasoning":true,"temperature":false},"data_policy":{"retention":"unknown","training":"unknown"},"capabilities":["world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":1200}},{"requested_model_id":"mistralai/mistral-small-3.2-24b-instruct","provider":"openrouter","concrete_model":{"model_id":"mistralai/mistral-small-3.2-24b-instruct"},"input_modalities":["text"],"output_modalities":["text"],"supported_parameters":{"structured_output":true,"json_mode":true,"stop":true,"reasoning":false},"data_policy":{"retention":"unknown","training":"unknown"},"capabilities":["world_content"],"prompt_adapter":{"id":"openai-chat","version":"1"},"sampling":{"hard_output_cap":1200}}],"discovered":[]}'
  RUST_LOG = "cosyworld_orchestrator=info,tower_http=warn"

# Required production secrets:
# fly secrets set COSYWORLD_MODERATION_TOKEN=...

[[mounts]]
  source = "cosyworld_data"
  destination = "/data"
  # Extend before the 85% deploy guard can become the only warning. The 5 GB
  # ceiling bounds spend while leaving several recovery windows after the
  # 2026-07-28 full-disk outage.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory = "2gb"
  processes = ["app"]

# Deploy strategy stays `rolling`: bluegreen/canary would boot a second
# machine beside this one, and the /data volume is single-writer — two
# machines on one SQLite volume corrupts the journal. The deploy workflow
# therefore guards volume free space before swapping (issue #546).
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"
