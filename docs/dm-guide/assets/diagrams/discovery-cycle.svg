<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">The shared discovery progression</title>
  <desc id="desc">A fixed hidden truth progresses through latent, signed, lead, revealed, accessible, and secured states. Revealing never automatically opens, takes, or travels through it.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#41645c"/>
    </marker>
  </defs>
  <rect width="1200" height="410" rx="28" fill="#f4efe3"/>
  <g font-family="Inter, Arial, sans-serif" fill="#211c15" text-anchor="middle">
    <text x="600" y="52" font-size="32" font-weight="700">DISCOVERY CHANGES KNOWLEDGE, NOT WHAT EXISTS</text>
    <g font-size="22">
      <g transform="translate(30 110)">
        <rect width="160" height="115" rx="16" fill="#e8e1d4" stroke="#73511e" stroke-width="4"/>
        <text x="80" y="45" font-weight="700">LATENT</text>
        <text x="80" y="78">truth is fixed</text>
      </g>
      <g transform="translate(225 110)">
        <rect width="160" height="115" rx="16" fill="#e6d8c7" stroke="#795533" stroke-width="4"/>
        <text x="80" y="45" font-weight="700">SIGNED</text>
        <text x="80" y="78">a tell appears</text>
      </g>
      <g transform="translate(420 110)">
        <rect width="160" height="115" rx="16" fill="#dec28d" stroke="#73511e" stroke-width="4"/>
        <text x="80" y="45" font-weight="700">LEAD</text>
        <text x="80" y="78">a path to pursue</text>
      </g>
      <g transform="translate(615 110)">
        <rect width="160" height="115" rx="16" fill="#dbe7db" stroke="#41645c" stroke-width="4"/>
        <text x="80" y="45" font-weight="700">REVEALED</text>
        <text x="80" y="78">shared truth</text>
      </g>
      <g transform="translate(810 110)">
        <rect width="160" height="115" rx="16" fill="#d8dfeb" stroke="#5c5164" stroke-width="4"/>
        <text x="80" y="45" font-weight="700">ACCESSIBLE</text>
        <text x="80" y="78">gate permits use</text>
      </g>
      <g transform="translate(1005 110)">
        <rect width="160" height="115" rx="16" fill="#dbe7db" stroke="#41645c" stroke-width="4"/>
        <text x="80" y="45" font-weight="700">SECURED</text>
        <text x="80" y="78">return or custody</text>
      </g>
    </g>
    <g fill="none" stroke="#41645c" stroke-width="5" marker-end="url(#arrow)">
      <path d="M190 168 H215"/>
      <path d="M385 168 H410"/>
      <path d="M580 168 H605"/>
      <path d="M775 168 H800"/>
      <path d="M970 168 H995"/>
    </g>
    <rect x="190" y="285" width="820" height="75" rx="16" fill="#fffaf0" stroke="#795533" stroke-width="3"/>
    <text x="600" y="316" font-size="23" font-weight="700">REVEAL IS NOT ACCESS</text>
    <text x="600" y="345" font-size="21">Find, open, take, equip, and travel remain separate actions.</text>
  </g>
</svg>
