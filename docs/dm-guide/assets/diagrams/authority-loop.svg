<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Authority and narration in CosyWorld</title>
  <desc id="desc">Authored world possibilities become legal actions. A player commits one action. The engine resolves it, the Journal records it, and the referee describes only the committed truth.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#41645c"/>
    </marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#f4efe3"/>
  <g font-family="Inter, Arial, sans-serif" fill="#211c15" text-anchor="middle">
    <text x="600" y="55" font-size="32" font-weight="700">TRUTH MOVES FORWARD; NARRATION FOLLOWS</text>
    <g font-size="24">
      <rect x="45" y="120" width="190" height="120" rx="18" fill="#e6d8c7" stroke="#795533" stroke-width="4"/>
      <text x="140" y="165" font-weight="700">WORLDPACK</text>
      <text x="140" y="201">possible truth</text>
      <rect x="280" y="120" width="190" height="120" rx="18" fill="#dbe7db" stroke="#41645c" stroke-width="4"/>
      <text x="375" y="165" font-weight="700">SERVER</text>
      <text x="375" y="201">legal actions</text>
      <rect x="515" y="120" width="170" height="120" rx="18" fill="#dec28d" stroke="#73511e" stroke-width="4"/>
      <text x="600" y="165" font-weight="700">PLAYER</text>
      <text x="600" y="201">commits</text>
      <rect x="730" y="120" width="190" height="120" rx="18" fill="#d8dfeb" stroke="#5c5164" stroke-width="4"/>
      <text x="825" y="165" font-weight="700">ENGINE</text>
      <text x="825" y="201">resolves truth</text>
      <rect x="965" y="120" width="190" height="120" rx="18" fill="#e6d8c7" stroke="#795533" stroke-width="4"/>
      <text x="1060" y="165" font-weight="700">JOURNAL</text>
      <text x="1060" y="201">records change</text>
    </g>
    <g fill="none" stroke="#41645c" stroke-width="6" marker-end="url(#arrow)">
      <path d="M235 180 H270"/>
      <path d="M470 180 H505"/>
      <path d="M685 180 H720"/>
      <path d="M920 180 H955"/>
      <path d="M1060 250 C1060 360 710 360 665 305"/>
    </g>
    <rect x="420" y="290" width="360" height="95" rx="18" fill="#fffaf0" stroke="#41645c" stroke-width="4"/>
    <text x="600" y="328" font-size="25" font-weight="700">REFEREE VOICE</text>
    <text x="600" y="360" font-size="22">describes certified facts and outcomes</text>
  </g>
</svg>
