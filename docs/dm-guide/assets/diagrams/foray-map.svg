<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">An anchored frontier foray</title>
  <desc id="desc">A foray begins at a hearth anchor, follows one active lead through provisional steps, and reaches a cairn that makes the traversed return durable and permits a later branch. A lost lead loops back toward the last durable anchor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#41645c"/>
    </marker>
    <marker id="retreat" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#795533"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f4efe3"/>
  <g font-family="Inter, Arial, sans-serif" fill="#211c15">
    <text x="600" y="54" text-anchor="middle" font-size="32" font-weight="700">ONE LEAD FORWARD; A RECOVERABLE WAY BACK</text>
    <g fill="none" stroke="#41645c" stroke-width="8" marker-end="url(#arrow)">
      <path d="M190 300 C290 250 350 210 440 240"/>
      <path d="M500 245 C610 240 665 310 760 300"/>
      <path d="M825 288 C915 245 985 210 1070 230"/>
      <path d="M810 345 C870 420 950 445 1040 430" stroke-dasharray="16 12"/>
    </g>
    <path d="M770 355 C650 520 330 535 170 360" fill="none" stroke="#795533" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#retreat)"/>
    <g text-anchor="middle">
      <g>
        <circle cx="140" cy="330" r="72" fill="#dec28d" stroke="#73511e" stroke-width="5"/>
        <path d="M105 350 H175 V305 L140 278 L105 305 Z" fill="none" stroke="#211c15" stroke-width="7"/>
        <text x="140" y="435" font-size="25" font-weight="700">HEARTH ANCHOR</text>
      </g>
      <g>
        <circle cx="470" cy="245" r="42" fill="#fffaf0" stroke="#41645c" stroke-width="5"/>
        <text x="470" y="252" font-size="30" font-weight="700">1</text>
        <text x="470" y="320" font-size="22">provisional step</text>
      </g>
      <g>
        <circle cx="790" cy="315" r="42" fill="#fffaf0" stroke="#41645c" stroke-width="5"/>
        <text x="790" y="322" font-size="30" font-weight="700">2</text>
        <text x="790" y="390" font-size="22">temporary mark</text>
      </g>
      <g>
        <circle cx="1080" cy="230" r="68" fill="#dbe7db" stroke="#41645c" stroke-width="5"/>
        <path d="M1042 255 H1118 L1100 235 H1060 Z M1055 232 H1105 L1092 214 H1068 Z M1068 211 H1092 L1080 193 Z" fill="#73511e"/>
        <text x="1080" y="328" font-size="25" font-weight="700">DURABLE CAIRN</text>
      </g>
      <g>
        <circle cx="1065" cy="440" r="48" fill="#e6d8c7" stroke="#795533" stroke-width="5" stroke-dasharray="10 8"/>
        <text x="1065" y="448" font-size="27" font-weight="700">?</text>
        <text x="1065" y="520" font-size="22">later branch</text>
      </g>
    </g>
    <text x="485" y="550" font-size="22" fill="#795533">retreat follows the recorded return chain</text>
  </g>
</svg>
